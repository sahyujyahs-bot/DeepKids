<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFF6EC">
<meta name="description" content="DeepKids Gurukul, THE homeschooling app: a planner and lesson guide for Indian families with children aged 6 to 10. NCERT, Cambridge and NIOS.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DeepKids Gurukul">
<title>DeepKids Gurukul</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;500;600;700&display=swap">
<style>
/* DeepKids: the one stylesheet for the app. Design tokens are in :root (see app/content/DESIGN.md). */
:root {
  /* the type scale: every text size in the app is one of these (app/build/check_type_scale.py checks it) */
  --fs-1: 11px;
  --fs-2: 12px;
  --fs-3: 14px;
  --fs-4: 16px;
  --fs-5: 18px;
  --fs-6: 22px;
  --fs-7: 28px;
  --fs-8: 34px;
  --tangD: #d9661a;
  --forestD: #3f8559;
  --skyA: #cfefe0;
  --skyB: #eaf7d9;
  --hill1: #b6d693;
  --hill2: #8cc57a;
  --onbright: #2b2340;
  color-scheme: light;
  --bg: #fcfcf8;
  --surface: #ffffff;
  --sunk: #f1f2f6;
  --ink: #1f2440;
  --muted: #646985;
  --line: #dce0ea;
  --tang: #d7372b;
  --sun: #e8a317;
  --aqua: #0f6e6b;
  --forest: #3c8a3f;
  --peri: #5b4bb7;
  --gum: #d7372b;
  --sky: #2f6fb5;
  --pist: #3c8a3f;
  --soil: #b9893b;
  --good: #0f6e6b;
  --bad: #c2271d;
  --rule: #dce0ea;
  --margin: #d7372b;
  --display: "Mukta", system-ui, sans-serif;
  --poster: "Rozha One", Georgia, serif;
  --body: "Mukta", system-ui, sans-serif;
  --hand: "Mukta", system-ui, sans-serif;
  --r: 8px;
  --r-lg: 12px;
  --r-xl: 14px;
  --lift: none;
  --night: #1e1436;
  /* the calm look (approved redesign, Nov 2026): soft white cards on paper, round pills, one red action */
  --r-card: 20px;
  --r-btn: 14px;
  --shadow: 0 10px 24px -18px rgba(30, 30, 60, 0.45);
  --track: #efece2;
  --sunbg: #fdf2d6;
  --sunink: #8a5a06;
  --aquabg: #e2f1ef;
}
* {
  box-sizing: border-box;
}
html,
body {
  background: var(--bg);
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0);
  z-index: 30;
  background: var(--bg);
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
h1,
h2,
h3,
h4 {
  font-family: var(--display);
  font-weight: 600;
  line-height: 1.12;
  margin: 0;
  text-wrap: balance;
}
p {
  margin: 0;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0));
  padding-right: max(16px, env(safe-area-inset-right, 0));
}
.muted {
  color: var(--muted);
}
.sm {
  font-size: var(--fs-3);
}
.xs {
  font-size: var(--fs-2);
}
.row {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.col {
  display: grid;
  gap: 12px;
}
.ico {
  width: 22px;
  height: 22px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.num {
  font-variant-numeric: tabular-nums;
}
.r-you {
  --c: var(--peri);
}
.r-both {
  --c: var(--sun);
}
.r-kid {
  --c: var(--sky);
}
.r-out {
  --c: var(--gum);
}
.r-free {
  --c: var(--line);
}
.tint {
  background: color-mix(in srgb, var(--c) 22%, var(--surface));
}
.btn:active {
  box-shadow: 0 1px 0 var(--tangD);
}
.btn.green {
  background: var(--forest);
  box-shadow: 0 4px 0 var(--forestD);
}
.btn.green:active {
  box-shadow: 0 1px 0 var(--forestD);
}
.btn.soft {
  box-shadow:
    0 4px 0 var(--line),
    inset 0 0 0 2px var(--line);
}
.btn.soft:active {
  box-shadow:
    0 1px 0 var(--line),
    inset 0 0 0 2px var(--line);
}
.btn.line {
  background: 0 0;
  color: var(--ink);
  box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--ink) 18%, transparent);
}
.btn.sm {
  min-height: 40px;
  padding: 5px 16px;
  font-size: var(--fs-4);
  border-radius: 14px;
}
.btn.xs {
  min-height: 34px;
  padding: 4px 12px;
  font-size: var(--fs-3);
  border-radius: 12px;
  box-shadow: 0 3px 0 var(--tangD);
}
.btn.xs.soft {
  box-shadow:
    0 3px 0 var(--line),
    inset 0 0 0 2px var(--line);
}
.btn.wide {
  flex: 1;
}
.btn:disabled {
  opacity: 0.4;
  cursor: default;
}
.iconbtn {
  width: 44px;
  height: 44px;
  border-radius: 15px;
  border: 0;
  background: var(--surface);
  display: grid;
  place-items: center;
  flex: none;
  color: var(--ink);
  box-shadow: var(--lift);
}
.dotc {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--c, var(--muted));
  flex: none;
}
.ck,
.ckb {
  width: 46px;
  height: 46px;
  flex: none;
  border-radius: 15px;
  border: 0;
  background: var(--surface);
  box-shadow:
    0 3px 0 var(--line),
    inset 0 0 0 2px var(--line);
  display: grid;
  place-items: center;
  color: color-mix(in srgb, var(--ink) 18%, transparent);
}
.ck .ico,
.ckb .ico {
  width: 24px;
  height: 24px;
  stroke-width: 3;
}
.done .ck,
.done .ckb,
.ck.on {
  background: var(--good);
  color: #fff;
  box-shadow: 0 3px 0#2d8752;
  animation: pop 0.3s;
}
@keyframes pop {
  50% {
    transform: scale(1.15);
  }
}
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0);
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
}
.top .wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-block: 10px;
}
.hello .bl {
  width: 46px;
  height: 46px;
  flex: none;
}
.hello b {
  font: 600 var(--fs-5) var(--display);
  display: block;
  line-height: 1.1;
}
.hello span {
  display: block;
  font-size: var(--fs-3);
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
nav.nav {
  position: fixed;
  z-index: 25;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(12px + env(safe-area-inset-bottom, 0));
  display: flex;
  gap: 4px;
  padding: 7px;
  border-radius: 26px;
  background: var(--surface);
  box-shadow: 0 14px 34px -12px rgba(43, 35, 64, 0.45);
  width: min(440px, calc(100% - 32px));
}
nav.nav button {
  flex: 1;
  border: 0;
  background: 0 0;
  color: var(--muted);
  border-radius: 20px;
  height: 54px;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 1px;
  font: 600 var(--fs-2) var(--display);
}
nav.nav button .ico {
  width: 23px;
  height: 23px;
}
nav.nav button[aria-current="page"] {
  background: var(--sun);
  color: #2b2340;
}
/* room at the end for the bottom bar and IAm's button above it, so the last row can scroll clear of both */
main {
  padding-bottom: calc(150px + env(safe-area-inset-bottom, 0));
}
.plain {
  border: 0;
  background: 0 0;
  padding: 0;
  text-align: left;
  color: inherit;
  cursor: pointer;
}
.track {
  position: relative;
  height: 14px;
  border-radius: 9px;
  background: var(--sunk);
}
.track span {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: 9px;
  background: var(--forest);
  transition: width 0.5s;
}
.track .rider {
  position: absolute;
  top: 50%;
  width: 30px;
  height: 30px;
  transform: translate(-50%, -56%);
  transition: left 0.5s;
}
.bloom {
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: grow 0.7s cubic-bezier(0.3, 1.5, 0.5, 1) both;
}
@keyframes grow {
  0% {
    transform: scale(0.2);
  }
}
.bob {
  animation: bob 1.6s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: 50% 100%;
}
@keyframes bob {
  50% {
    transform: translateY(-4px);
  }
}
.sway {
  animation: sway 3s ease-in-out infinite;
  transform-box: fill-box;
  transform-origin: 50% 100%;
}
@keyframes sway {
  50% {
    transform: rotate(3deg);
  }
}
.focus {
  margin-top: 16px;
  border-radius: var(--r-xl);
  padding: 20px;
  display: grid;
  gap: 12px;
  position: relative;
  background: color-mix(in srgb, var(--c) 26%, var(--surface));
  box-shadow: var(--lift);
}
.focus .mascot {
  position: absolute;
  right: 14px;
  top: -22px;
  width: 78px;
  height: 78px;
}
.focus .eyebrow {
  color: color-mix(in srgb, var(--c) 45%, var(--ink));
}
.focus h2 {
  font-size: clamp(23px, 5.6vw, 29px);
  padding-right: 70px;
}
.focus .who {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-3);
  font-weight: 700;
  color: var(--muted);
}
.donecard {
  margin-top: 16px;
  border-radius: var(--r-xl);
  padding: 20px;
  background: var(--surface);
  box-shadow: var(--lift);
  display: grid;
  gap: 12px;
  position: relative;
  overflow: hidden;
}
.donecard h2 {
  font-size: var(--fs-7);
  padding-right: 80px;
}
.donecard .mascot {
  position: absolute;
  right: 12px;
  top: 12px;
  width: 78px;
  height: 78px;
}
.offer {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 10px 12px;
  border-radius: 18px;
  background: color-mix(in srgb, var(--c) 18%, var(--surface));
}
.offer .bl {
  width: 40px;
  height: 40px;
}
.sech {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.sech h3 {
  font-size: var(--fs-6);
}
.tr {
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 10px;
  align-items: center;
}
.tr .t {
  font: 600 var(--fs-3) var(--display);
  color: var(--muted);
  text-align: right;
  line-height: 1.1;
}
.tr .t small {
  display: block;
  font-size: var(--fs-1);
}
.r-both .tcard .ic,
.tcard.r-both .ic {
  color: #2b2340;
}
.tcard .m {
  min-width: 0;
  display: grid;
}
.tcard .m b {
  font: 600 var(--fs-4) var(--display);
  overflow: hidden;
  text-overflow: ellipsis;
}
.tcard .m span {
  font-size: var(--fs-2);
  color: var(--muted);
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tr.done .tcard {
  background: var(--surface);
  box-shadow: inset 0 0 0 2px var(--line);
}
.tr.done .tcard .m b {
  color: var(--muted);
  text-decoration: line-through;
}
.tr.now .tcard {
  box-shadow:
    0 0 0 3px var(--c),
    var(--lift);
}
.tr.brk .t {
  opacity: 0.7;
}
.tr.rest .brkline {
  color: var(--ink);
  border-color: var(--c);
  background: color-mix(in srgb, var(--c) 14%, var(--surface));
}
.tr.rest .brkline::before {
  content: "🌿 ";
}
.brkline {
  font-size: var(--fs-3);
  color: var(--muted);
  font-weight: 700;
  padding: 4px 14px;
  border-radius: 999px;
  border: 2px dashed var(--line);
  justify-self: start;
}
.hs {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding: 10px 4px 14px;
  margin: 0-4px;
  scrollbar-width: none;
}
.hs > * {
  scroll-snap-align: center;
  flex: 0 0 74%;
  max-width: 300px;
}
.joke {
  border: 0;
  border-radius: 26px;
  padding: 18px;
  text-align: left;
  display: grid;
  gap: 10px;
  align-content: start;
  min-height: 170px;
  color: #2b2340;
  box-shadow: var(--lift);
}
.joke:nth-child(4n + 1) {
  background: var(--aqua);
  color: #fff;
  transform: rotate(-2.5deg);
}
.joke:nth-child(4n + 2) {
  background: var(--gum);
  color: #fff;
  transform: rotate(2deg);
}
.joke:nth-child(4n + 3) {
  background: var(--sun);
  transform: rotate(-1.5deg);
}
.joke:nth-child(4n) {
  background: var(--pist);
  color: #fff;
  transform: rotate(2.5deg);
}
.joke .q {
  font: 600 var(--fs-5) / 1.25 var(--display);
}
.joke .tap {
  font-size: var(--fs-3);
  font-weight: 800;
  opacity: 0.75;
}
.joke .eyebrow {
  opacity: 0.85;
}
.joke .a {
  font-size: var(--fs-4);
  padding: 10px 14px;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.9);
  animation: pop 0.3s;
  color: #2b2340;
}
.expi {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px;
  border-radius: 20px;
  background: var(--surface);
  box-shadow: var(--lift);
}
.daybadge {
  font: 700 var(--fs-5) var(--display);
  width: 52px;
  height: 52px;
  border-radius: 16px;
  background: var(--pist);
  color: #2b2340;
  display: grid;
  place-items: center;
  line-height: 1;
  text-align: center;
}
.daybadge small {
  display: block;
  font: 700 var(--fs-1) var(--body);
  letter-spacing: 0.06em;
}
textarea.inp {
  height: auto;
  min-height: 100px;
  padding: 12px 14px;
  line-height: 1.5;
  resize: vertical;
}
dialog.sheet {
  border: 0;
  padding: 0;
  margin: 0;
  width: 100%;
  max-width: 100%;
  height: 100%;
  max-height: 100%;
  background: var(--bg);
  color: var(--ink);
  overscroll-behavior: contain;
}
dialog.sheet.colored {
  background: color-mix(in srgb, var(--c) 40%, var(--bg));
}
dialog.sheet[open] {
  animation: up 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1);
}
@keyframes up {
  0% {
    transform: translateY(30px);
    opacity: 0;
  }
}
dialog.sheet::backdrop {
  background: rgba(30, 20, 50, 0.45);
}
.shead {
  position: sticky;
  top: 0;
  z-index: 3;
  background: inherit;
}
.shead .wrap {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-top: calc(10px + env(safe-area-inset-top, 0));
  padding-bottom: 10px;
}
.shead h3 {
  font-size: var(--fs-5);
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sbody {
  padding-bottom: calc(40px + env(safe-area-inset-bottom, 0));
}
.sbody > .wrap {
  display: grid;
  gap: 16px;
}
.ptrack {
  position: relative;
  height: 18px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.75);
  margin: 14px 18px 6px;
}
.ptrack span {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: 12px;
  background: var(--c);
  transition: width 0.4s;
}
.ptrack .rider {
  position: absolute;
  top: 50%;
  width: 40px;
  height: 40px;
  transform: translate(-50%, -58%);
  transition: left 0.4s;
}
.stage {
  background: var(--surface);
  border-radius: var(--r-xl);
  box-shadow: var(--lift);
  padding: 22px;
  display: grid;
  gap: 16px;
}
.stage .kind .k {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--c);
  color: #fff;
  display: grid;
  place-items: center;
}
.stage h2 {
  font-size: clamp(23px, 5.8vw, 30px);
}
.stage .body {
  font-size: var(--fs-4);
}
.stage .body > * + * {
  margin-top: 12px;
}
.stage ul {
  margin: 0;
  padding-left: 20px;
  display: grid;
  gap: 8px;
}
.ask {
  border-radius: 18px;
  padding: 14px 16px;
  background: color-mix(in srgb, var(--peri) 22%, var(--surface));
}
.ask .eyebrow {
  display: block;
  margin-bottom: 4px;
  color: color-mix(in srgb, var(--peri) 50%, var(--ink));
}
.timer {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  border-radius: 20px;
  background: var(--sunk);
}
.timer svg {
  width: 56px;
  height: 56px;
}
.tasks-inline {
  display: grid;
  gap: 8px;
}
.tline {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 12px;
  align-items: center;
  padding: 10px;
  border-radius: 18px;
  background: var(--sunk);
  border: 0;
  text-align: left;
  width: 100%;
  font-weight: 700;
}
.tline.done {
  background: color-mix(in srgb, var(--good) 16%, var(--surface));
}
.finish {
  text-align: center;
  justify-items: center;
  padding-block: 28px;
}
.finish .stars {
  display: flex;
  gap: 6px;
}
.finish h2 {
  font-size: var(--fs-8);
}
.chero .mascot {
  position: absolute;
  right: -8px;
  bottom: -14px;
  width: 130px;
  height: 130px;
}
.chero h1 {
  font-size: clamp(25px, 6.4vw, 33px);
  max-width: 72%;
}
.chero p {
  font-size: var(--fs-3);
  font-weight: 700;
  max-width: 68%;
  opacity: 0.85;
}
.seg button {
  flex: 0 0 auto;
  height: 40px;
  padding: 0 16px;
  white-space: nowrap;
  color: var(--muted);
  box-shadow: inset 0 0 0 2px var(--line);
}
.card {
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--lift);
  padding: 18px;
  display: grid;
  gap: 12px;
}
.idea {
  display: grid;
  grid-template-columns: 38px 1fr;
  gap: 12px;
  align-items: start;
}
.idea .k {
  font: 700 var(--fs-5) var(--display);
  width: 38px;
  height: 38px;
  border-radius: 13px;
  background: var(--c);
  color: #2b2340;
  display: grid;
  place-items: center;
}
/* quiz answers: long answers wrap inside the button, dark text on white so it reads on the coloured card */
.qwhy {
  margin-top: 8px;
}
.btn.qopt {
  height: auto;
  min-height: 44px;
  padding: 10px 16px;
  line-height: 1.3;
  white-space: normal;
  text-align: center;
}
.btn.qopt.soft {
  background: #fff !important;
}
.qcard .eyebrow {
  color: rgba(255, 255, 255, 0.85);
}
.qcard h2 {
  font-size: clamp(23px, 5.8vw, 30px);
}
.qcard p {
  color: rgba(255, 255, 255, 0.95);
  font-weight: 600;
}
.voice {
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 10px;
  align-items: start;
}
.voice .bl {
  width: 44px;
  height: 44px;
}
.voice .say {
  padding: 12px 14px;
  border-radius: 6px 20px 20px 20px;
  background: var(--surface);
  box-shadow: var(--lift);
}
.voice .say b {
  display: block;
  font: 600 var(--fs-3) var(--display);

}
.skyt {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px;
  justify-items: start;
  text-align: left;
  padding: 12px 14px 14px;
  border: 0;
  border-radius: 22px;
  font: inherit;
  color: #fff;
  cursor: pointer;
  background:
    radial-gradient(circle at 20% 30%, #fff8 0.6px, transparent 1.2px) 0 0 / 23px 29px,
    radial-gradient(circle at 70% 60%, #fff6 0.6px, transparent 1.2px) 0 0 / 31px 37px,
    radial-gradient(120% 100% at 70% 0%, var(--c), color-mix(in srgb, var(--c) 35%, #120a2a));
}
/* the light tiles: ink stars on a sunlit sky */
.skyt[data-s="eng"],
.skyt[data-s="hin"] {
  color: var(--ink);
  background:
    radial-gradient(circle at 20% 30%, #1f244033 0.7px, transparent 1.3px) 0 0 / 23px 29px,
    radial-gradient(circle at 70% 60%, #1f244026 0.7px, transparent 1.3px) 0 0 / 31px 37px,
    radial-gradient(120% 100% at 70% 0%, color-mix(in srgb, var(--c) 70%, #fff), var(--c));
}
.skyt:is([data-s="eng"], [data-s="hin"]) :is(.on, .off, .half) {
  fill: var(--ink);
}
.skyt:is([data-s="eng"], [data-s="hin"]) .glow {
  fill: #fff;
  opacity: 0.7;
}
.skyt:is([data-s="eng"], [data-s="hin"]) .ln line {
  stroke: var(--ink);
  stroke-opacity: 0.5;
}
.skyt:nth-child(odd) {

}
.skyt .ln line {

  stroke-width: 1;
}
.skyt .glow {
  fill: color-mix(in srgb, var(--c) 30%, #fff);
  opacity: 0.3;
}
.skyt .on {
  fill: #fff;
}
.skyt .half {
  fill: #fff;
  opacity: 0.6;
}
.skyt .off {
  fill: #fff;
  opacity: 0.3;

.ring {

}

  animation-delay: 0.1s;
}

  animation-delay: 0.15s;

}
.fxvid iframe {

.fxact {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0) + 22px);
  z-index: 3;
  display: flex;
  gap: 8px;

}
.fxact button {

}
.fxfab {
  position: fixed;
  right: 12px;
  bottom: calc(env(safe-area-inset-bottom, 0) + 80px);
  z-index: 50;
  border: 0;
  padding: 0;
  background: 0 0;
  display: grid;
  justify-items: center;
  gap: 2px;
  touch-action: none;
  cursor: grab;
}
/* dragged, he lifts and leans the way he is carried, then lands with a squash and a settle */
.fxfab .iam {
  width: 76px;
  pointer-events: none;
  transition: transform 0.2s cubic-bezier(0.3, 1.6, 0.5, 1);
}
.fxfab.lift {
  cursor: grabbing;
}
.fxfab.lift .iam {
  transform: translateY(-6px) scale(1.12) rotate(var(--tilt, 0deg));
}
.fxfab.land .iam {
  animation: iamland 0.65s ease-out;
}
/* the lean swings back past straight, then settles, as the squash bounces out */
@keyframes iamland {
  0% {
    transform: translateY(-6px) scale(1.12) rotate(var(--tilt, 0deg));
  }
  30% {
    transform: scale(1.1, 0.88) rotate(calc(var(--tilt, 0deg) * -0.6));
  }
  55% {
    transform: translateY(-3px) scale(0.96, 1.05) rotate(calc(var(--tilt, 0deg) * 0.3));
  }
  80% {
    transform: scale(1.02, 0.98) rotate(calc(var(--tilt, 0deg) * -0.1));
  }
}
/* not during setup, where he would cover the Continue button */
body:has(.ob) .fxfab {
  display: none;
}
body.ai-locked .fxfab .iam::after {
  content: "🔒";
  position: absolute;
  right: -4px;
  bottom: -2px;
  font-size: var(--fs-5);
}
.iamtag {
  background: var(--ink);
  color: #fff;
  font: 700 var(--fs-2) var(--body);
  border-radius: 999px;
  padding: 1px 10px;
}
/* I am (17-iam.js): the Guru seated on a stone step, with eyelids and a mouth laid over his face. He breathes and blinks;
   .iamthink (waiting for an answer) closes his eyes, leaving the third eye open; .iamtalk (answering) moves his mouth. */
.iam {
  position: relative;
  display: inline-block;
  flex: none;
  width: 64px;
  aspect-ratio: 343 / 404;
}
.iamfig {
  position: absolute;
  inset: 0 auto auto 0;
  width: 100%;
  aspect-ratio: 343 / 404;
  transform-origin: 50% 100%;
  animation: iambreathe 4.5s ease-in-out infinite;
}
.iamfig img {
  position: absolute;
  display: block;
}
.iamfig .iambody {
  inset: 0;
  width: 100%;
}
.iamfig .iambody,
.iamfig .iampose {
  transition: opacity 0.18s;
}
.iamfig .iampose {
  inset: 0;
  width: 100%;
  opacity: 0;
}
.iam[data-pose="read"] .iampose[data-p="read"],
.iam[data-pose="page"] .iampose[data-p="page"],
.iam[data-pose="shift"] .iampose[data-p="shift"],
.iam[data-pose="glance"] .iampose[data-p="glance"],
.iam[data-pose="reach"] .iampose[data-p="reach"],
.iam[data-pose="lift"] .iampose[data-p="lift"] {
  opacity: 1;
}
.iam[data-pose]:not([data-pose="look"]) .iambody {
  opacity: 0;
}
/* eyelids and mouth belong to the looking face */
.iam[data-pose]:not([data-pose="look"]) :is(.iamblink, .iammouth) {
  visibility: hidden;
}
.iamfig .iamblink {
  left: 40.46%;
  top: 12.24%;
  width: 18.68%;
  opacity: 0;
  animation: iamblink 6s steps(1) infinite;
}
.iamfig .iammouth {
  left: 43.08%;
  top: 21.66%;
  width: 14.01%;
  opacity: 0;
}
@keyframes iambreathe {
  50% {
    transform: scale(1.012, 1.018);
  }
}
@keyframes iamblink {
  0%,
  95% {
    opacity: 0;
  }
  96% {
    opacity: 1;
  }
}
.iamthink .iamblink {
  animation: none;
  opacity: 1;
}
.iamtalk .iammouth {
  animation: iamspeak 0.36s steps(1) infinite;
}
@keyframes iamspeak {
  50% {
    opacity: 1;
  }
}
.iam.hero {
  width: 150px;
  justify-self: center;
  margin: 8px 0 4px;
}
/* small sizes show only his face, in a round frame */
.iam.big,
.iam.mini {
  width: 48px;
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--sun);
}
.iamframe {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  overflow: hidden;
}
.iam.big .iamfig,
.iam.mini .iamfig {
  width: 230%;
  left: -64%;
  top: -5%;
  animation: none;
}
.iam.mini {
  width: 26px;
  margin-right: 6px;
  vertical-align: middle;
}
@media (prefers-reduced-motion: reduce) {
  .iamfig,
  .iamfig img {
    animation: none !important;
  }
}

/* gentle motion: the item for now gives a small wiggle every few seconds; the first-week guide breathes, a finished card pops */
@media (prefers-reduced-motion: no-preference) {
  .tr.focus .tcard {
    animation: jiggle 6s ease-in-out 1s infinite;
  }
  .wk1 {
    animation: breathe 4s ease-in-out infinite;
  }
  .fxc.isdone .fxin {
    animation: donepop 0.5s ease-out;
  }
}
@keyframes jiggle {
  0%,
  88%,
  100% {
    transform: none;
  }
  90% {
    transform: rotate(-1.2deg);
  }
  93% {
    transform: rotate(1.2deg);
  }
  96% {
    transform: rotate(-0.6deg);
  }
}
@keyframes donepop {
  0% {
    transform: scale(1);
  }
  40% {
    transform: scale(1.03);
  }
  100% {
    transform: scale(1);
  }
}

  pointer-events: none;
  filter: drop-shadow(0 3px 4px #0005);

}
@keyframes gdrag {
  0% {
    transform: translate(0, 10px) scale(1);
    opacity: 0;
  }
  12% {
    transform: translate(0, 0) scale(1);
    opacity: 1;
  }
  22% {
    transform: translate(0, 0) scale(0.85);
  }
  62% {
    transform: translate(0, -76px) scale(0.85);
  }
  72% {
    transform: translate(0, -76px) scale(1);
    opacity: 1;
  }
  90%,
  100% {
    transform: translate(0, -76px) scale(1);
    opacity: 0;
  }
}
