han tap water? (Not always, and the bottles make plastic waste.) How could a family decide?"],"oneness":"The water in your body was once a cloud, a river, maybe a dinosaur's drink. Are you a small walking river?","jokes":["What did the ocean say to the beach? Nothing, it just waved!","How do you save water? In a piggy bucket!","Why did the cloud go to school? To learn how to rain on parade!"],"words":["WATER","RIVER","CLOUD","OCEAN","RAINY"],"quiz":[["Most of Earth's water is salty.",true,"About 97 of every 100 drops are in the seas."],["Groundwater is water stored under the ground.",true,"Wells and borewells reach it."],["Muddy water that looks clear after filtering is always safe to drink.",false,"Germs can still be there; boil it."],["Stepwells were built to store water for dry months.",true,"Many are hundreds of years old."]],"odd":[[["River","Lake","Well","Desert"],"Desert","The others hold water."]],"ws":[["Water cycle","Draw the sun, sea, cloud, rain, river and arrows. Label evaporation and rain."],["Water in my day","Count how many mugs you use for brushing, bathing and drinking."],["Save-water ideas","Write 3 ways your family could use less water."],["Think","Who owns the rain? Write what you think and why."]],"sheet":["Home Water Audit",["Activity","Mugs or buckets used","Could we use less? How?"],8],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: bottle filter, sun vs shade",1,2],["Activities: home water audit, local water history",1.5,3],["Game: Drop Detective",0.5,1],["Project: Rain Catcher",2.5,21]],"cur":[["The Incredible Journey (water-cycle dice game with stations)","Project WET","https://serc.carleton.edu/sp/mnstep/activities/27279.html","Set up 9 stations around the house (cloud, river, groundwater, plant, animal…); roll to travel as a water drop and thread a bead at each stop."],["The Diminishing Apple (how little of Earth's water we can use)","NSTA, Science and Children","https://www.nsta.org/science-and-children/science-and-children-february-2002/diminishing-apple","Cut an apple to show salty seas, ice and the tiny sliver of usable fresh water."]],"deep":[{"q":"Who owns the rain?","why":"Water falls freely from the sky, but rivers, wells and pipes are shared by many people, farms, factories, animals and other states. Deciding who gets how much is one of the biggest questions of our time.","views":[["The law in India","Water in rivers and under the ground is treated as a shared public resource that governments manage for everyone."],["Farmers upstream and downstream","Rivers like the Kaveri are shared by states that have argued about them for over a hundred years."],["Traditional communities","Johads, kunds and stepwells were built and cared for by whole villages; water belonged to the community that kept it."]],"tryit":"Find where your home's water comes from (tap, tanker, well, river). Who else uses that same source?"},{"q":"If Earth is covered in water, why do people run short?","why":"About 97 of every 100 drops on Earth are salty sea water. Of the fresh 3, most is frozen in ice or deep underground. Only a tiny part is in rivers, lakes and reachable groundwater.","views":[["Hydrologists","India pumps more groundwater than any other country; in many places it is being used faster than rain refills it."],["Engineers","Desalination (removing salt from sea water) can help but uses a lot of energy."],["Water harvesters","Catching rain where it falls, on roofs and in ponds, can refill the ground."]],"tryit":"Do the apple model: cut an apple into 4 (three quarters are the sea), and keep cutting the last piece to see how small the usable fresh water is."},{"q":"Is water ever really 'new'?","why":"The water on Earth has been recycling for billions of years: evaporating, raining, flowing, frozen, drunk and breathed out.","views":[["Science","The same water molecules may have passed through clouds, oceans, plants and animals, including dinosaurs, many times."],["Many Indian traditions","Rivers are honoured as mothers (Ganga Maa) because they carry life from the mountains to us."],["Oneness","If the water in you was once a cloud and will be a river again, where do you end and the water cycle begin?"]],"tryit":"Breathe on a cold mirror. Where did that water come from, and where will it go next?"}],"wsd":[["A. Where water comes from",[{"t":"draw","p":"Draw the water cycle: sun, sea, evaporation, clouds, rain, river, groundwater. Use arrows."},{"t":"sort","p":"Sort these water sources.","items":["River","Well","Rain tank","Glacier","Lake","Borewell"],"cats":["Above ground","Under ground","Frozen"]}]],["B. Numbers",[{"t":"mcq","p":"Out of every 100 drops of water on Earth, about how many are salty?","opts":["3","50","97","100"],"a":2},{"t":"fill","p":"Most of Earth's fresh water is ____ in ice and glaciers.","a":["frozen"]}]],["C. My water audit",[{"t":"table","p":"Count mugs or buckets used in one day.","cols":["Activity","Mugs or buckets","How to save"],"rows":6,"prefill":["Brushing","Bathing","Washing hands","Cooking","Cleaning","Plants"]}]],["D. Experiment",[{"t":"write","p":"Your bottle filter made muddy water look clear. Is it safe to drink now? Why or why not? What else would you do?","lines":3}]],["E. Think it through",[{"t":"write","p":"Who owns the rain that falls on your roof? Who owns a river? Write what you think and why.","lines":4}]]],"guide":"Water connects everything: our bodies, cities, festivals, farms. Your child will see that clear water is not always clean water. Do the home audit honestly, including your own use. Pitfall: the bottle filter makes water look clean. Never let anyone drink it.","prep":[["read",1,"Read Chapter 7 yourself first and mark 2–3 places to stop and ask a question (15 min)","Your NCERT book, or the free PDF: ncert.nic.in/textbook.php → Class 3 → Our Wondrous World (also on the ePathshala app)"],["learn",1,"Read the three big questions and their views. Decide which one you'll open with and what you think (10 min)","In this app: open the chapter → Think"],["ws",0,"Print the worksheet or keep the app open on a tablet; set out pencils and crayons","In this app (Worksheet), or print it from the worksheet PDF"],["exp",0,"A cut plastic bottle, gravel, sand, charcoal pieces, cotton, muddy water; two equal plates","Garden or construction sand; charcoal from a kirana shop"],["act",0,"Put a notebook in the bathroom and kitchen for the one-day water audit","Home"],["act",1,"Find a stepwell, lake or tank nearby, or a short video about one","Local; search 'stepwell India for kids'"],["game",1,"Make 50 water-drop tokens per player and activity cards for Drop Detective","Paper, buttons or beans"],["proj",0,"A straight-sided bottle or jar, a ruler and tape for the rain gauge","Home"]]}}},{"k":"ncert|sci|3|8","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"8","title":"Food We Eat","dk":["C11"],"c":{"covers":"Where food comes from, foods of different regions, cooking, sharing meals, eating well.","game":["Thali Builder","Food cards carry energy, body-building and protective icons. Race to build a balanced thali from your hand; then a twist card asks for a Kerala, Punjabi or Bengali thali using only local foods. Opponent can challenge a card's region."],"exp":["Starch test: a drop of iodine (Betadine) on potato, rice, bread and cucumber. Which turn blue-black? (Adult; don't eat after.)","Sprouting chana: weigh 50 g, soak and sprout for 2 days, weigh again. Why heavier?"],"act":["Food-origin trail: pick 5 foods at dinner and trace each back to a farm, a tree or an animal.","Cook a grandparent's recipe together and write it down."],"proj":["Our Family Cookbook","Collect 5 recipes from relatives with where each comes from, photos, and one dish the child cooks.","A handmade or printed recipe booklet"],"read":["Gregory, the Terrible Eater, Mitchell Sharmat","Eating the Alphabet, Lois Ehlert"],"links":["Santoor Ch 7: The Big Laddoo","Veena Ch 6: बीरबल की खिचड़ी","Veena Ch 14: किसान की होशियारी","Maths Mela Ch 10: Fun at Class Party!"],"x":{"learn":["Food comes from plants (grains, pulses, vegetables, fruits, spices) and animals (milk, eggs, fish, meat).","Each region eats what grows nearby: coconut and rice in Kerala, wheat in Punjab, fish in Bengal, millets in dry lands.","Millets (ragi, bajra, jowar) grow with little water and are very nutritious; 2023 was the International Year of Millets.","Cooking changes food: taste, softness, colour, and sometimes how easily the body can use it.","A balanced plate has energy foods, body-building foods and protective foods."],"think":["Is rice better than millet? Better for whom: your body, the farmer, the river?","Why do people in different places eat such different foods?","Two sides: some say vegetarian food is healthiest; others say eggs or fish help growth. Many nutrition scientists say both can be healthy when balanced. What would you need to know to decide?"],"oneness":"Sunlight grew the mango, and now the mango becomes you. Where does the food stop and you begin?","jokes":["Why did the tomato blush? It saw the salad dressing!","What does a nervous laddoo say? I'm falling to pieces!","Why did the roti go to school? To be well-rounded!"],"words":["GRAIN","MANGO","BREAD","CURRY","SPICE"],"quiz":[["Ragi and bajra are millets.",true,"So are jowar and foxtail millet."],["All food comes from plants.",false,"Milk and eggs come from animals."],["Potatoes contain starch.",true,"Iodine turns them blue-black."],["People everywhere eat the same food.",false,"Food depends on what grows nearby and on culture."]],"odd":[[["Ragi","Bajra","Jowar","Moong"],"Moong","Moong is a pulse; the others are millets."]],"ws":[["Plant or animal?","Sort 12 foods from your kitchen into plant and animal."],["My thali","Draw your lunch. Colour energy foods yellow, body-building red, protective green."],["Food trail","Pick 3 foods at dinner and draw where each came from."],["Two sides","Write one reason someone eats vegetarian and one reason someone eats eggs or fish."]],"sheet":["Starch Test",["Food","My guess","Colour after iodine","Starch? (yes/no)"],6],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: starch test, sprouting chana",1,3],["Activities: food-origin trail, grandparent's recipe",2,3],["Game: Thali Builder",0.5,1],["Project: Our Family Cookbook",4,14]],"cur":[["Eat a Rainbow lesson and chart","Kids' Food Basket Learning Lab","https://kidsfoodbasket.org/learning-lab/eat-a-rainbow","Fill a week's colour chart with Indian foods (ragi, palak, gajar, baingan, banana); invent a rainbow thali."]],"deep":[{"q":"Rice or millet: which is better?","why":"Millets like ragi, bajra and jowar were India's main grains for thousands of years. Rice and wheat took over after the 1960s Green Revolution, which helped feed India but used much more water.","views":[["Nutritionists","Ragi is rich in calcium; bajra in iron. Millets also have more fibre than polished rice."],["Farmers and water experts","Rice needs a lot of water; millets grow in dry land with little rain. That's why the UN declared 2023 the International Year of Millets."],["Cooks and families","Taste, habit and what's in the shop matter too. 'Better' depends on whether you mean for your body, the farmer or the river."]],"tryit":"Taste a ragi roti or ragi porridge and a rice dish. Compare taste, how full you feel, and look up how much water each crop needs."},{"q":"Why do people in different places eat such different food?","why":"Food follows land and climate: coconuts and rice in wet Kerala, wheat in Punjab, fish in Bengal and Goa, millets in dry Rajasthan. Trade, religion and history add more layers.","views":[["Geographers","What grows nearby shapes what people cook."],["Historians","Chillies, potatoes and tomatoes came to India from the Americas only about 400–500 years ago; Indian food has always mixed and changed."],["Today","Supermarkets bring food from everywhere. Is that good for farmers near you?"]],"tryit":"Pick one dish your family cooks. List each ingredient and where it grows. How many came from far away?"},{"q":"Vegetarian, eggs, fish or meat: what's healthiest?","why":"Families eat differently for reasons of health, belief, culture, cost and care for animals.","views":[["Many nutrition scientists","Both vegetarian and non-vegetarian diets can be healthy when balanced; pulses, milk, nuts and grains together give good protein."],["Ethical vegetarians (and Jain and many Hindu traditions)","Avoiding harm to animals (ahimsa) is the main reason."],["Coastal and hill communities","Fish, eggs or meat are local, affordable and traditional."]],"tryit":"Without judging, ask three people why they eat what they eat. Sort the reasons: health, belief, taste, cost, habit."}],"wsd":[["A. Where food comes from",[{"t":"sort","p":"Sort these foods.","items":["Milk","Rice","Egg","Spinach","Honey","Dal","Fish","Banana"],"cats":["From plants","From animals"]},{"t":"mcq","p":"Which of these is a millet?","opts":["Moong","Ragi","Rajma","Wheat"],"a":1}]],["B. My plate",[{"t":"draw","p":"Draw today's lunch. Colour energy foods yellow, body-building foods red, protective foods green."},{"t":"table","p":"Is your plate balanced?","cols":["Food group","What I ate","Enough? (yes/no)"],"rows":3,"prefill":["Energy","Body-building","Protective"]}]],["C. Food trail",[{"t":"table","p":"Trace three foods back to where they grew.","cols":["Food","Plant or animal","Where it grows","How it reached me"],"rows":3}]],["D. Experiment",[{"t":"table","p":"Starch test (adult adds iodine).","cols":["Food","My guess","Colour","Starch?"],"rows":4,"prefill":["Potato","Rice","Cucumber","Bread"]}]],["E. Think it through",[{"t":"write","p":"Rice needs much more water than millets. If your area has little rain, which would you grow? Give two reasons.","lines":3}]]],"guide":"Food is biology, geography and family history on one plate. Trace food back to farms and grandmothers' kitchens. Use your own regional dishes as the main examples, not textbook ones. Pitfall: iodine stains and isn't food. Use old cut pieces and throw them away after.","prep":[["read",1,"Read Chapter 8 yourself first and mark 2–3 places to stop and ask a question (15 min)","Your NCERT book, or the free PDF: ncert.nic.in/textbook.php → Class 3 → Our Wondrous World (also on the ePathshala app)"],["learn",1,"Read the three big questions and their views. Decide which one you'll open with and what you think (10 min)","In this app: open the chapter → Think"],["ws",0,"Print the worksheet or keep the app open on a tablet; set out pencils and crayons","In this app (Worksheet), or print it from the worksheet PDF"],["exp",0,"Betadine (iodine), a dropper; cut potato, rice, bread, cucumber on an old plate (not to be eaten after)","Chemist; kitchen"],["exp",2,"Weigh 50 g of chana and soak it 2 days before the lesson so the sprouts are ready","Kitchen; a kitchen scale"],["act",1,"Ask a grandparent for one recipe and buy its ingredients","Family; market"],["game",1,"Make food cards with energy, body-building and protective icons for Thali Builder","Paper"],["proj",3,"Message 5 relatives asking for a family recipe and a photo","Family"]]}}},{"k":"ncert|sci|3|9","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"9","title":"Staying Healthy and Happy","dk":["C10","C7"],"c":{"covers":"Keeping clean, eating, sleeping and playing well, feelings, staying happy.","game":["Germ Busters","A race track of daily-life squares. Habit squares (washed hands, played outside, slept on time) push you ahead; Germ squares send you back unless you hold a Shield card, which you earn by acting out a healthy habit. First to Bedtime wins."],"exp":["Glitter germs: glitter on hands, shake hands, then wash with water only vs soap. What's left?","Heartbeat: count your pulse for 15 seconds, do 30 jumps, count again."],"act":["Feelings charades: act out happy, worried, angry, proud; others guess and share when they felt it.","A one-week sleep and play diary."],"proj":["7-Day Healthy Me Challenge","Track water, sleep, outdoor play, fruit and one kind act each day.","A completed challenge chart and a reflection drawing"],"read":["Germs Are Not for Sharing, Elizabeth Verdick","The Busy Body Book, Lizzy Rockwell","The Color Monster, Anna Llenas"],"links":["Veena Ch 10: रस्साकशी"],"x":{"learn":["Clean hands stop germs spreading: soap and 20 seconds of scrubbing remove far more than water alone.","Children aged 6–12 need about 9–12 hours of sleep. Growing and remembering happen while you sleep.","Playing and moving make the heart and lungs stronger and help feelings settle.","Feelings are signals. Naming them and talking about them helps.","Most microbes are harmless or helpful; only some make us sick."],"think":["Is happiness something you feel, or something you do?","Are all germs bad?","Scientists disagree: some think playing in mud and around animals helps the body learn to fight illness (the 'hygiene hypothesis'); others say the idea is too simple. What would be a good balance?"],"oneness":"When you feel scared, your heart races. When you are tired, you feel grumpy. Are mind and body two things, or one?","jokes":["Why did the germ cross the road? Someone sneezed it!","What do you call a sleeping bull? A bulldozer!","Why was the soap so calm? It never lost its lather!"],"words":["SLEEP","SMILE","HEART","HAPPY","SOAPY"],"quiz":[["Washing with soap removes more germs than water alone.",true,"Soap breaks up oil and dirt that hold germs."],["Children your age need about 9–12 hours of sleep.",true,"Sleep helps growth and memory."],["All germs make us sick.",false,"Most microbes are harmless or helpful."],["Exercise makes your heart beat faster.",true,"It pumps more blood to your muscles."]],"odd":[[["Soap","Toothbrush","Towel","Candy"],"Candy","The others keep us clean."]],"ws":[["My habit week","Tick each day: brushed twice, washed hands, slept on time, played outside, ate a fruit."],["Feelings wheel","Colour a wheel of 6 feelings. Write when you last felt each."],["Heartbeat","Pulse in 15 seconds before and after 30 jumps."],["Think","Are mind and body one or two? Draw how you see it."]],"sheet":["Glitter Germ Test",["How I washed","Glitter left (a lot / some / none)","What I learned"],3],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: glitter germs, heartbeat",0.75,1],["Activities: feelings charades, sleep and play diary",1,7],["Game: Germ Busters",0.5,1],["Project: 7-Day Healthy Me Challenge",1.5,7]],"cur":[["Pepper and soap demonstration","Widely used classroom demo (see Osmo's write-up)","https://www.playosmo.com/kids-learning/pepper-and-soap-experiment/","Pepper on water flees a soapy finger. Be honest: this shows soap changing the water's surface tension; it is a picture of handwashing, not proof of killing germs."]],"deep":[{"q":"Are germs our enemies?","why":"Germs (microbes) are everywhere: in soil, food, air and inside us. Only a small number cause disease. Our gut alone has trillions of helpful microbes.","views":[["Doctors","Handwashing with soap is one of the cheapest ways to prevent illness; soap lifts away the oils that hold germs."],["Microbiologists","Many microbes are our helpers: they make curd, digest food and train our body's defences."],["The 'hygiene hypothesis'","Some scientists think children who play outdoors and around animals develop fewer allergies; others say it's more about the right microbes than about dirt."]],"tryit":"Make curd at home. Which tiny living things made it? Are they 'germs'?"},{"q":"Is happiness something you feel or something you do?","why":"Feelings come and go like weather. People have long asked whether we can grow lasting contentment.","views":[["Psychologists","Sleep, movement, time outdoors, friends and helping others reliably make people feel better."],["Yoga and Buddhist traditions","Watching your breath and thoughts calmly builds a steady happiness that doesn't depend on getting things."],["Philosophers","Some say a good life includes sadness too, and that feeling every feeling is healthy."]],"tryit":"For a week, write one thing that made you happy each day. Was it something you got, or something you did?"},{"q":"Are mind and body two things or one?","why":"When you're scared your heart races; when you're tired you feel grumpy; when you laugh your body relaxes.","views":[["Modern science","The brain is part of the body, and hormones and nerves connect feelings and health both ways."],["Descartes (a French thinker, 1600s)","Mind and body are two different kinds of things."],["Vedanta","Body and mind are both layers (koshas) around a deeper Self; the true 'I' is the awareness that knows them both."]],"tryit":"Sit quietly for one minute and count your breaths. Then think of something scary. Did your breathing change? Who noticed the change?"}],"wsd":[["A. Healthy habits",[{"t":"table","p":"Tick each day this week.","cols":["Habit","Mon","Tue","Wed","Thu","Fri","Sat","Sun"],"rows":5,"prefill":["Brushed twice","Washed hands before eating","Slept 9+ hours","Played outside","Ate a fruit"]}]],["B. Germs",[{"t":"mcq","p":"Why does soap clean better than water alone?","opts":["It smells nice","It lifts away oil and dirt that hold germs","It is colourful","It is cold"],"a":1},{"t":"sort","p":"Sort these microbes.","items":["Curd bacteria","Cold virus","Gut bacteria","Yeast in idli batter","Malaria parasite"],"cats":["Helpful","Harmful"]}]],["C. My body",[{"t":"table","p":"Heartbeat experiment.","cols":["When","Beats in 15 seconds","× 4 = beats per minute"],"rows":2,"prefill":["Sitting","After 30 jumps"]}]],["D. Feelings",[{"t":"draw","p":"Draw a feelings wheel with six feelings. In each, write one thing that brings that feeling."}]],["E. Think it through",[{"t":"write","p":"Are mind and body two things or one? Give one example from your own day.","lines":3}]]],"guide":"Health here means body and mind together: germs, sleep, play and feelings. The feelings charades matter as much as the hand washing. Share a time you felt worried too. Pitfall: don't make the healthy-habit chart a punishment chart. Celebrate tries, not perfect weeks.","prep":[["read",1,"Read Chapter 9 yourself first and mark 2–3 places to stop and ask a question (15 min)","Your NCERT book, or the free PDF: ncert.nic.in/textbook.php → Class 3 → Our Wondrous World (also on the ePathshala app)"],["learn",1,"Read the three big questions and their views. Decide which one you'll open with and what you think (10 min)","In this app: open the chapter → Think"],["ws",0,"Print the worksheet or keep the app open on a tablet; set out pencils and crayons","In this app (Worksheet), or print it from the worksheet PDF"],["exp",0,"Glitter (or haldi powder), soap; a watch with a seconds hand","Stationery shop; home"],["act",0,"Write feelings on slips (happy, worried, angry, proud, shy, excited) for charades; print a 7-day sleep and play diary","Paper"],["game",1,"Draw the Germ Busters race track with habit and germ squares","Chart paper, a dice"],["proj",0,"Make a 7-day chart: water, sleep, outdoor play, fruit, one kind act","Paper"]]}}},{"k":"ncert|sci|3|10","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"10","title":"This World of Things","dk":["A4"],"c":{"covers":"Objects around us and what they are made of, natural vs human-made materials, properties like hard, soft, waterproof, magnetic.","game":["Material Top Trumps","Make 20 cards of household objects and score each for hardness, bendiness, waterproofness and floating. Each turn, pick a property from your top card; the higher score wins both cards. Test any disputed score for real before deciding."],"exp":["Raincoat test: drip water on paper, plastic, cotton, wool and foil. Which keep a tissue underneath dry?","Magnet hunt: which things in the house does a magnet pick up? Are all metals magnetic?"],"act":["'Made of what?' house hunt: find 5 things each of wood, metal, plastic, glass, cloth and clay.","Old vs new: compare a clay pot and a plastic bottle for keeping water cool."],"proj":["Material Museum","Collect, test and label 20 materials with their properties and uses.","A museum display the child guides visitors through"],"read":["The Way Things Work Now, David Macaulay (for parent and child together)"],"links":["Santoor Ch 5: Talking Toys","Veena Ch 11: एक जादुई पिटारा","Maths Mela Ch 2: Toy Joy"],"x":{"learn":["Every object is made of one or more materials: wood, metal, glass, clay, plastic, cloth, paper, rubber.","Materials have properties: hard or soft, rough or smooth, see-through or not, waterproof or not, magnetic or not.","We choose materials for the job: glass for windows, rubber for tyres, steel for utensils.","Natural materials (wood, cotton, clay) come straight from nature; human-made ones (plastic, glass, steel) are made by changing natural ones.","Not all metals are magnetic: iron and steel stick to a magnet, aluminium, copper and gold don't."],"think":["A wooden chair: natural or human-made? Where is the line?","Why isn't a raincoat made of paper? What would you make it from if plastic didn't exist?","Two sides: plastic is often called bad, yet it also keeps medicines and hospital tools clean. When is plastic the right choice, and when not?"],"oneness":"Your steel tumbler was once rock in the earth; your cotton shirt was a plant. Is anything really 'just a thing'?","jokes":["What did the glass say to the plate? I can see right through you!","Why don't scientists trust atoms? They make up everything!","Why was the broom late? It over-swept!"],"words":["GLASS","STEEL","METAL","PAPER","CLOTH"],"quiz":[["All metals stick to a magnet.",false,"Aluminium, copper and gold don't."],["Glass is transparent.",true,"You can see through it."],["A clay pot can keep water cool.",true,"Water seeps out and evaporates, taking heat with it."],["Wood comes from trees.",true,"It's the hard inside of trunks and branches."]],"odd":[[["Spoon","Key","Coin","Eraser"],"Eraser","The others are made of metal."]],"ws":[["Material table","List 8 objects at home: material, one property, why that material."],["Natural, human-made, or both?","Sort: cotton shirt, steel plate, wooden table, plastic bucket, clay pot, paper."],["Design for a job","Design an umbrella for a hailstorm. Which materials and why?"],["Two sides","Write one good use of plastic and one place we should stop using it."]],"sheet":["Raincoat Test",["Material","My guess (dry/wet)","Tissue underneath after 1 minute","Good for a raincoat?"],6],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: raincoat test, magnet hunt",1,1],["Activities: material house hunt, clay vs plastic",1,2],["Game: Material Top Trumps",0.75,1],["Project: Material Museum",3,10]],"cur":[["ExpeRimental home science films (e.g. hidden colours in felt pens)","The Royal Institution","https://www.rigb.org","Separate the colours in one black pen with a strip of paper and water: one 'thing' made of many."]],"deep":[{"q":"Is anything really 'natural' or 'human-made'?","why":"A wooden chair is a tree shaped by people. Steel is iron ore from rock, changed by fire. Plastic is made from oil, which came from ancient living things.","views":[["Chemists","Everything is made of the same elements; humans only rearrange them."],["Environmentalists","The difference matters: natural materials usually rot back into the earth; many human-made ones like plastic last for centuries."],["Panchamahabhuta","Indian thought says all things are made of five elements: earth, water, fire, air and space."]],"tryit":"Take five objects. Trace each back to the earth: what was it before a person shaped it?"},{"q":"Is plastic good or bad?","why":"Plastic is cheap, light, waterproof and long-lasting. Those same qualities make it a problem when thrown away.","views":[["Doctors","Sterile plastic syringes, drips and gloves save lives every day."],["Ocean scientists","Millions of tonnes of plastic reach the sea every year, harming turtles, birds and fish, and breaking into tiny microplastics."],["Designers","The question is not plastic or no plastic, but which uses are worth it and how we design things to be reused or recycled."]],"tryit":"Find ten plastic things at home. Mark each: needed, useful but replaceable, or not needed."},{"q":"Why is each thing made of the material it is?","why":"Engineers choose materials for their properties: glass windows let light through, rubber tyres grip and bend, clay pots cool water by letting it seep and evaporate.","views":[["Engineers","Choosing the wrong material makes things break, leak or burn."],["Traditional craftspeople","Many old choices are clever science: matkas, bamboo houses and lime plaster suit Indian heat."],["Inventors","New materials (like bioplastics from plants) keep changing what's possible."]],"tryit":"Pretend plastic was never invented. Redesign a water bottle, a raincoat and a toothbrush using other materials."}],"wsd":[["A. Properties",[{"t":"table","p":"Test eight objects.","cols":["Object","Material","Hard or soft","Sinks or floats","Magnet sticks?"],"rows":8}]],["B. Sort",[{"t":"sort","p":"Sort these.","items":["Cotton","Steel","Wood","Plastic","Clay","Glass","Wool","Paper"],"cats":["Natural","Human-made","Both (natural, changed by people)"]},{"t":"mcq","p":"Which of these sticks to a magnet?","opts":["Aluminium foil","A steel spoon","A copper coin","A gold ring"],"a":1}]],["C. Experiment",[{"t":"table","p":"Raincoat test: drip water on each material over a tissue.","cols":["Material","My guess","Tissue dry or wet?","Good for a raincoat?"],"rows":5,"prefill":["Paper","Plastic bag","Cotton cloth","Foil","Wool"]}]],["D. Design",[{"t":"draw","p":"Design an umbrella for a hailstorm. Label each material and why you chose it."}]],["E. Think it through",[{"t":"write","p":"Write one place plastic is the best choice and one place we should stop using it. Explain both.","lines":4}]]],"guide":"Everything is made of something, and each material was chosen for a reason. Your child becomes a materials tester. Let them predict before every test, and write predictions down. Wrong predictions are the best ones. Pitfall: not every metal is magnetic (steel spoons yes, aluminium foil no). Let them find this out.","prep":[["read",1,"Read Chapter 10 yourself first and mark 2–3 places to stop and ask a question (15 min)","Your NCERT book, or the free PDF: ncert.nic.in/textbook.php → Class 3 → Our Wondrous World (also on the ePathshala app)"],["learn",1,"Read the three big questions and their views. Decide which one you'll open with and what you think (10 min)","In this app: open the chapter → Think"],["ws",0,"Print the worksheet or keep the app open on a tablet; set out pencils and crayons","In this app (Worksheet), or print it from the worksheet PDF"],["exp",0,"Paper, plastic, cotton, wool and foil squares, tissues, a dropper; a fridge or toy magnet","Home"],["act",0,"A clay matka (or clay cup) and a plastic bottle, both filled with water at the same time","Potter or market"],["game",1,"Make 20 household-object cards scored for hardness, bendiness, waterproofness and floating","Paper"],["proj",0,"Small boxes or zip bags and labels for the Material Museum","Home"]]}}},{"k":"ncert|sci|3|11","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"11","title":"Making Things","dk":["A4"],"c":{"covers":"How things are made by hand and by machine, artisans and their tools, turning old things into new.","game":["Inventor's Workshop","Draw a challenge card ('A bridge that holds 10 coins using only 2 sheets of paper', 'A boat that carries 5 marbles from foil') and a 10-minute timer. Build, test, and score: did it work, how many coins or marbles, how few materials. Swap roles as judge."],"exp":["Paper strength: flat paper vs folded zig-zag vs rolled tube. How many coins can each hold as a bridge?","Clay drying: make two small pots, dry one in sun and one in shade. Which cracks?"],"act":["Meet an artisan (potter, carpenter, tailor) or watch one at work; list their tools.","Make a toy from trash using an Arvind Gupta design."],"proj":["Design, Build, Improve","Build a working toy (a balloon car or a spinning top), test it, improve it 3 times and record what changed.","A working toy and an improvement log"],"read":["Rosie Revere, Engineer, Andrea Beaty","The Most Magnificent Thing, Ashley Spires","Iggy Peck, Architect, Andrea Beaty"],"links":["Santoor Ch 6: Paper Boats","Maths Mela Ch 5: Fun with Shapes"],"x":{"learn":["Artisans make things with skill: potters, weavers, carpenters, bamboo workers, blacksmiths.","Making follows steps: choose material, shape it, join or fire it, finish it.","Handmade vs factory-made: handmade items carry skill and variety; factories make many identical items cheaply.","Designers test and improve: first tries usually fail, and that's how good things are made.","Old things can be remade: cloth into quilts, bottles into planters, scraps into toys."],"think":["Who really makes a clay pot: the potter, the clay, the wheel or the fire?","Is handmade always better than factory-made?","Two sides: some say machines take artisans' jobs; others say machines make things cheaper for everyone. Can both be true?"],"oneness":"A pot is earth shaped by hands, mixed with water, dried by air, hardened by fire, holding empty space. Earth, water, air, fire and space all made it together.","jokes":["Why did the potter go to the party? For a wheel-y good time!","What did the hammer say to the nail? Get to the point!","Why did the paper go to the doctor? It felt torn!"],"words":["CRAFT","TOOLS","BUILD","WEAVE","MODEL"],"quiz":[["A potter shapes clay on a wheel.",true,"The wheel spins so the clay can be shaped evenly."],["Bamboo can be used to build houses.",true,"It is strong, light and grows fast."],["Everything in shops is made by machines.",false,"Many things are still handmade."],["First designs usually work perfectly.",false,"Designers test and improve again and again."]],"odd":[[["Potter","Weaver","Carpenter","Driver"],"Driver","The others make things with their hands."]],"ws":[["Steps in order","Number the steps of making a clay pot: fire it, dig clay, shape on wheel, dry in sun, knead with water."],["Meet a maker","Interview an artisan: what they make, tools, how long it takes, hardest part."],["Design, build, test","Sketch your toy. What happened at test 1, 2 and 3? What did you change?"],["Think","Who made the pot? List everything that helped."]],"sheet":["Paper Bridge Test",["Shape of paper","My guess (coins)","Coins it held","Why?"],4],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: paper strength, clay drying",1,3],["Activities: meet an artisan, toy from trash",2,3],["Game: Inventor's Workshop",0.75,1],["Project: Design, Build, Improve",4,10]],"cur":[["Cardboard Automata and Scribbling Machines","Exploratorium Tinkering Studio","https://tinkering.exploratorium.edu","Build a moving cardboard toy using cams and levers, or a wobbly drawing robot; improve it three times."],["Toys from Trash","Arvind Gupta","https://www.arvindguptatoys.com","Pick a toy, build it, then redesign it."]],"deep":[{"q":"Who really makes a clay pot?","why":"The potter shapes it, but the clay came from a riverbank, water softened it, the wheel spun it, the Sun dried it and fire hardened it.","views":[["Craftspeople","Skill passed down for generations is the real maker; a beginner with the same clay makes a lopsided pot."],["Scientists","Fire changes the clay itself: above about 600°C, it becomes ceramic and can never turn back into soft clay."],["Panchamahabhuta","Earth, water, air, fire and space (the hollow inside that makes it a pot) all work together."]],"tryit":"Shape a pot from dough or clay. List everything and everyone who helped make it."},{"q":"Is handmade better than factory-made?","why":"A handloom saree or a carved toy carries the maker's skill and is one of a kind. A factory makes thousands of identical things cheaply.","views":[["Artisans","Handmade work keeps traditions and livelihoods alive; India has millions of handloom weavers."],["Economists","Factories make things affordable for many more people."],["Designers","Some of the best things combine both: machines for the boring parts, hands for the skilled parts."]],"tryit":"Compare a handmade and a factory-made version of the same thing (a basket, a toy, cloth). Look closely and list differences."},{"q":"Why do good designs need failures?","why":"Almost nothing works perfectly the first time. Engineers build, test, fail, change and test again. This is called iteration.","views":[["Inventors","Thomas Edison's team tested thousands of materials for a bulb filament; each failure taught them something."],["Indian frugal engineers","Jugaad, the knack of fixing things with what's at hand, is a kind of fast trial and error."],["Scientists","A failed test is still data. The only real failure is not learning from it."]],"tryit":"Build a paper bridge that holds coins. Record each try: what broke, what you changed."}],"wsd":[["A. Makers and tools",[{"t":"match","p":"Match the maker to the tool.","pairs":[["Potter","Wheel"],["Weaver","Loom"],["Carpenter","Saw and plane"],["Blacksmith","Anvil and hammer"],["Tailor","Needle and scissors"]]}]],["B. Steps",[{"t":"table","p":"Put the steps of making a pot in order (1–5).","cols":["Step","Order"],"rows":5,"prefill":["Fire it in a kiln","Dig clay","Shape it on a wheel","Dry it in the sun","Knead it with water"]}]],["C. Design, build, test",[{"t":"draw","p":"Sketch your toy or bridge design. Label materials."},{"t":"table","p":"Record your tests.","cols":["Try","What happened","What I changed"],"rows":3}]],["D. Meet a maker",[{"t":"write","p":"Interview an artisan: what they make, how they learned, the hardest part, and how long one piece takes.","lines":4}]],["E. Think it through",[{"t":"write","p":"Is handmade better than factory-made? Give one reason for each side, then your answer.","lines":4}]]],"guide":"Making things is thinking with hands. The chapter honours craftspeople and the design loop: try, fail, change, try again. If you can, visit an artisan; ask before photographing their work. Pitfall: don't fix their toy for them. Ask what they'd change and let them change it.","prep":[["read",1,"Read Chapter 11 yourself first and mark 2–3 places to stop and ask a question (15 min)","Your NCERT book, or the free PDF: ncert.nic.in/textbook.php → Class 3 → Our Wondrous World (also on the ePathshala app)"],["learn",1,"Read the three big questions and their views. Decide which one you'll open with and what you think (10 min)","In this app: open the chapter → Think"],["ws",0,"Print the worksheet or keep the app open on a tablet; set out pencils and crayons","In this app (Worksheet), or print it from the worksheet PDF"],["exp",0,"A4 sheets, coins, two books for the bridge; air-drying clay or atta dough","Home; stationery shop"],["act",2,"Find a potter, carpenter or tailor nearby and ask if you can watch for 20 minutes","Your neighbourhood"],["act",0,"Pick one toy from the Arvind Gupta toys site and gather its materials","arvindguptatoys.com"],["game",1,"Write challenge cards for Inventor's Workshop and set out paper, foil, tape and marbles","Home"],["proj",0,"Balloons, straws, bottle caps, a cardboard sheet and tape for a balloon car","Stationery shop"]]}}},{"k":"ncert|sci|3|12","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"12","title":"Taking Charge of Waste","dk":["B10"],"c":{"covers":"Kinds of waste, sorting at home, composting, reducing, reusing and recycling, where waste goes.","game":["Bin Blitz","60 seconds on the clock. Flip picture cards and slap each onto the right bin: wet, dry, hazardous, e-waste. Trick cards (a tetra pack, a battery, a used tea bag) are worth double. Beat your last score."],"exp":["Bury test: bury a banana peel, a paper, a cotton rag and a plastic bag in a pot of soil. Dig up after 3 weeks.","Start a compost pot with kitchen peels and dry leaves; check its warmth and smell weekly."],"act":["Weigh one day's home waste and sort it.","Visit or talk to a kabadiwala: what can they sell, what can't they?"],"proj":["Zero-Waste Week","Weigh waste for a normal week, then a week of family changes; compare.","Compost, a before-and-after chart and a family pledge"],"read":["One Plastic Bag, Miranda Paul","Why Should I Recycle?, Jen Green","The Adventures of a Plastic Bottle, Alison Inches"],"links":[],"x":{"learn":["Waste can be wet (peels, leftover food), dry (paper, plastic, metal), hazardous (batteries, medicines) or e-waste (old phones).","Sorting at home makes recycling and composting possible.","Biodegradable things rot back into soil; plastic can last hundreds of years.","Reduce first, then reuse, then recycle. Composting turns wet waste into food for plants.","Kabadiwalas and waste-pickers recycle a large share of what India throws away."],"think":["When we 'throw away' something, where is 'away'?","Is a banana peel waste for a worm?","Two sides: some say recycling solves the problem; many experts say reducing what we use matters much more. Which is easier at your home?"],"oneness":"In a forest every 'waste' becomes someone's food. What would your home look like if it worked like a forest?","jokes":["What did the recycling bin say to the dustbin? You're such a waste!","Why was the bottle so happy? It got a second life!","Why did the banana peel go to the compost party? To break down on the dance floor!"],"words":["WASTE","TRASH","REUSE","CLEAN","EARTH"],"quiz":[["Banana peels are biodegradable.",true,"Microbes and worms turn them into soil."],["Plastic bags break down in a few days.",false,"They can last for hundreds of years."],["Sorting waste at home helps recycling.",true,"Clean dry waste can be recycled; wet waste can be composted."],["Old batteries go in the wet-waste bin.",false,"They are hazardous waste."]],"odd":[[["Peel","Tea leaves","Eggshell","Battery"],"Battery","The others can go into compost."]],"ws":[["Which bin?","Sort 12 things into wet, dry, hazardous and e-waste."],["One day of waste","List everything your family threw away today. Which could have been avoided?"],["Second life","Draw 3 new uses for an old bottle."],["Think","Where is 'away'? Draw where your rubbish really goes."]],"sheet":["Bury Test (3 weeks)",["Item","Day 0","Week 1","Week 2","Week 3"],5],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: bury test, compost pot",1,21],["Activities: weigh a day's waste, talk to a kabadiwala",1.5,2],["Game: Bin Blitz",0.5,1],["Project: Zero-Waste Week",2,14]],"cur":[["Soda-bottle compost bioreactor","Cornell Waste Management Institute","https://www.compost.css.cornell.edu/bioreactors.html","Build two bottle composters; test which kitchen scraps rot fastest and measure the warmth."]],"deep":[{"q":"When we throw something 'away', where is 'away'?","why":"'Away' is always somewhere: a landfill on a city's edge, a burning heap, a river, the sea, or a recycling yard. Delhi's Ghazipur landfill grew taller than a 20-storey building.","views":[["City planners","Landfills are running out of space; sorting at home is the cheapest fix."],["Waste-pickers and kabadiwalas","They recover and recycle a large share of India's plastic and paper, often unrecognised."],["Nature","In a forest there is no 'away': every leaf, dropping and dead body becomes food for something else."]],"tryit":"Follow one item (a bottle or a wrapper) after you bin it. Ask whoever collects your waste where it goes."},{"q":"Is recycling enough?","why":"Recycling sounds like the answer, but only a small share of all plastic ever made has been recycled. Many items can't be recycled at all.","views":[["Recyclers","Clean, sorted waste can become new products and saves raw materials."],["Zero-waste movement","Refuse and reduce first: the best waste is the one never made."],["Companies and governments","Some say individuals can't fix it alone; makers must design products to be reused or taken back."]],"tryit":"For one week, before you buy anything, ask: do I need it, can I reuse something instead?"},{"q":"Is a banana peel waste?","why":"To us it is rubbish; to a worm, a fungus or a compost heap it is food. Whether something is waste depends on who is looking.","views":[["Composters","Kitchen peels become rich soil in a few weeks."],["Circular economy thinkers","Design everything so one process's 'waste' is another's input, like a forest."],["Oneness","If nothing in nature is wasted, perhaps 'waste' is only a human idea of separation."]],"tryit":"Start a small compost pot. Each week, write who is 'eating' the peels."}],"wsd":[["A. Which bin?",[{"t":"sort","p":"Sort these.","items":["Banana peel","Newspaper","Battery","Plastic bottle","Old phone","Tea leaves","Broken glass","Medicine strip"],"cats":["Wet","Dry","Hazardous","E-waste"]}]],["B. Facts",[{"t":"mcq","p":"A plastic bag in the ground can last:","opts":["A few days","A few weeks","Hundreds of years","Forever, exactly"],"a":2},{"t":"fill","p":"The best order is: Refuse, ____, Reuse, Recycle.","a":["Reduce"]}]],["C. My waste audit",[{"t":"table","p":"Weigh or count one day's waste at home.","cols":["Type","Items or weight","Could we avoid it? How?"],"rows":4,"prefill":["Wet","Dry","Hazardous","E-waste"]}]],["D. Experiment",[{"t":"table","p":"Bury test: bury and dig up after 3 weeks.","cols":["Item","Week 1","Week 2","Week 3"],"rows":4,"prefill":["Banana peel","Paper","Cotton rag","Plastic bag"]}]],["E. Think it through",[{"t":"write","p":"When we throw something away, where is 'away'? Draw or write where your rubbish really goes.","lines":4}]]],"guide":"Waste is just a material in the wrong place. Your child will see what rots, what doesn't, and who in our cities sorts it. Start the bury test on day one; it needs three weeks. Pitfall: wear gloves for sorting, and keep sharp or hazardous waste (batteries, glass) for an adult.","prep":[["read",1,"Read Chapter 12 yourself first and mark 2–3 places to stop and ask a question (15 min)","Your NCERT book, or the free PDF: ncert.nic.in/textbook.php → Class 3 → Our Wondrous World (also on the ePathshala app)"],["learn",1,"Read the three big questions and their views. Decide which one you'll open with and what you think (10 min)","In this app: open the chapter → Think"],["ws",0,"Print the worksheet or keep the app open on a tablet; set out pencils and crayons","In this app (Worksheet), or print it from the worksheet PDF"],["exp",0,"A pot of soil, a banana peel, paper, a cotton rag and a plastic bag; mark the date on the pot","Home"],["exp",0,"A second pot or bucket with holes for compost; dry leaves","Home; garden"],["act",0,"Gloves, a kitchen scale and 4 bags marked wet, dry, hazardous and e-waste","Home"],["act",1,"Ask your local kabadiwala if your child can ask them 5 questions","Your neighbourhood"],["game",1,"Make 30 waste picture cards and 4 bin labels for Bin Blitz","Paper; old magazines"],["proj",0,"Agree as a family on the Zero-Waste Week rules","Family"]]}}},{"k":"ncert|sci|4|1","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"1","title":"Living Together","dk":["B2"],"c":{"covers":"Families and communities, people who help us, animals that live in groups (ants, bees, elephants), why living together helps.","game":["Herd or Alone?","You are animals on a grassland. Each round flip a Danger card (a leopard, a drought, a flood). Choose secretly: stay with the herd (safe from predators, but food is shared) or go alone (all the food, but danger hits hard). Score food and lives. After 8 rounds, talk about why elephants, ants and humans live in groups."],"exp":["Ant teamwork: put a sugar grain and a biscuit crumb near ants. Time how long until the first ant arrives and how many join to carry the crumb."],"act":["Map the helpers in your community and what each does for you.","Watch a flock of pigeons or crows for 10 minutes: who leads, who keeps watch?"],"proj":["Community Helpers Story","Interview 3 helpers (vegetable seller, guard, postman) and make a photo-story.","A booklet or short video"],"read":["Gajapati Kulapati, Ashok Rajagopalan","Swimmy, Leo Lionni"],"links":["Santoor Ch 1: Together We Can","Maths Mela Ch 9: Equal Groups"]}},{"k":"ncert|sci|4|2","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"2","title":"Exploring Our Neighbourhood","dk":["B2"],"c":{"covers":"Maps, directions and landmarks, places and services in the neighbourhood.","game":["Treasure Map Hunt","The parent hides a treasure and draws a map with a key, a north arrow and steps ('10 steps north, turn east at the tulsi pot'). The child finds it, then draws a map for the parent. Next level: maps drawn to scale."],"exp":["Make a compass: rub a needle on a magnet 30 times one way, float it on a leaf in a bowl of water. Which way does it point? Check against the sunrise."],"act":["Neighbourhood walk: mark shops, parks, water taps, a clinic. Draw symbols for each.","Traffic survey: count vehicles vs trees on your street for 10 minutes."],"proj":["My Neighbourhood Atlas","A hand-drawn map with key, scale and north arrow, plus photos and notes on 10 places.","A folded atlas"],"read":["Me on the Map, Joan Sweeney","Mapping Penny's World, Loreen Leedy"],"links":["Maths Mela Ch 2: Hide and Seek","Maths Mela Ch 13: The Transport Museum"]}},{"k":"ncert|sci|4|3","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"3","title":"Nature Trail","dk":["A5","B4"],"c":{"covers":"The variety of plants and animals around us, food chains, how living things depend on one another.","game":["Food Chain Dominoes","Each domino has an eater on one half and something eaten on the other, from Indian ecosystems (grass–deer–tiger, plankton–fish–kingfisher, leaf–caterpillar–myna). Match ends to build the longest chain; a 'Decomposer' tile can join any dead end."],"exp":["Camouflage hunt: scatter 20 green and 20 red paper 'insects' on grass. A partner 'bird' has 30 seconds to pick as many as possible. Which colour survives? Repeat on red soil."],"act":["Nature-trail bingo walk.","Sketch 10 living things in a field journal with where you found them."],"proj":["Biodiversity Count","Mark a 1 m × 1 m square with string in a park or garden; visit weekly for 4 weeks and record every plant and animal.","A mini field guide to your square"],"read":["What Do You Do With a Tail Like This?, Steve Jenkins & Robin Page","The Book of Indian Birds, Salim Ali (reference)"],"links":["Santoor Ch 5: The Old Stag","Veena Ch 2: Bagiche ka Ghongha","Veena Ch 3: Neem","Maths Mela Ch 10: Elephants, Tigers, and Leopards"]}},{"k":"ncert|sci|4|4","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"4","title":"Growing Up with Nature","dk":["A5","B9"],"c":{"covers":"How plants and animals grow and change: life cycles, what they need to grow, caring for living things.","game":["Life Cycle Rummy","Cards show stages of life cycles (egg–caterpillar–pupa–butterfly, seed–seedling–plant–flower, egg–tadpole–froglet–frog, baby–child–adult–elder). Draw and discard like rummy; lay down a full set in the right order and explain one stage."],"exp":["Bean in a jar: wedge a soaked rajma bean between wet tissue and the glass. Draw the root and shoot every 2 days.","Measure your own height, hand and foot and compare with your baby measurements."],"act":["Family photo timeline from baby to now.","Look for eggs, caterpillars or tadpoles on a nature walk (look, don't take)."],"proj":["Grow and Track","Grow a marigold or balsam from seed to flower over about 6 weeks, measuring weekly.","A flowering plant and a growth chart"],"read":["A Butterfly Is Patient, Dianna Hutts Aston","The Cherry Tree, Ruskin Bond"],"links":["Veena Ch 1: Chidiya ka Geet","Santoor Ch 10: The Swing"]}},{"k":"ncert|sci|4|5","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"5","title":"Food for Health","dk":["C11"],"c":{"covers":"What different foods do for the body, a balanced diet, how food is kept from spoiling.","game":["Nutrient Ninjas","Food cards show nutrient icons and a price. Challenge cards ask things like 'A tiffin with protein and iron under ₹50' or 'A breakfast for a cricketer'. Build the best answer from your hand; the opponent scores it with the nutrient key."],"exp":["Spoil or keep? Lemon slices: one plain, one in salt, one in sugar, one in the fridge. Watch for a week (don't eat).","Iodine starch test on different breakfast foods (adult)."],"act":["Read 5 food labels: what's in packaged snacks?","Plan a week of tiffins together."],"proj":["Preserve Lab","Make a small batch of nimbu achar with an elder and compare it with an unsalted control over 3 weeks.","A jar of pickle and an observation log"],"read":["Good Enough to Eat, Lizzy Rockwell"],"links":["Veena Ch 4: Hamara Aahar","Veena Ch 9: Mithaiyon ka Sammelan","Maths Mela Ch 8: Weigh it, Pour it"]}},{"k":"ncert|sci|4|6","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"6","title":"Happy and Healthy Living","dk":["C10"],"c":{"covers":"Exercise, hygiene and sleep, staying safe, preventing illness, feeling well in body and mind.","game":["Body Defence Tower","Stack defence cards (skin, mucus, fever, white blood cells, vaccine) to build your tower. Each turn the opponent plays germ attack cards; a germ gets through if your tower lacks the right defence. Last tower standing wins."],"exp":["Bread and hands: touch slices with unwashed, water-washed and soap-washed hands; seal each in a bag for a week (never open).","Breathing rate before and after skipping for a minute."],"act":["Learn a 5-pose yoga sequence.","First-aid role play: a cut, a burn, a nosebleed."],"proj":["Family Fitness League","A 3-week plan with daily points for movement, sleep and water.","A league table and handmade medals"],"read":["The Busy Body Book, Lizzy Rockwell","Germs Are Not for Sharing, Elizabeth Verdick"],"links":["Santoor Ch 7: Fit Body, Fit Mind, Fit Nation","Santoor Ch 3: Be Smart, Be Safe","Santoor Ch 8: The Lagori Champions","Veena Ch 12: Shatranj mein Maat"]}},{"k":"ncert|sci|4|7","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"7","title":"How Things Work","dk":["B6"],"c":{"covers":"How everyday tools and machines work: levers, wheels, pulleys and ramps, pushes and pulls.","game":["Machine Hunt Showdown","5 minutes on the clock. Race through the house finding levers, wheels and axles, pulleys, ramps, wedges and screws (scissors, a tap, a door handle, a knife). Show each find to score; the opponent can challenge whether it really is that machine."],"exp":["Ruler lever: balance a ruler on a pencil and lift a pile of coins with fewer coins by moving the pencil. Where must the pencil go?","Ramp race: roll a toy car down a board at three heights and measure how far it travels."],"act":["Take apart an old pen or torch (adult checks it's safe) and name the parts.","Make a pulley with a cotton reel, string and a small bucket."],"proj":["Chain-Reaction Machine","Build a 5-step chain (dominoes, a ramp, a ball, a cup, a bell) that rings a bell at the end.","A working machine and a video of it"],"read":["The Way Things Work Now, David Macaulay"],"links":["Santoor Ch 2: The Tinkling Bells","Maths Mela Ch 12: Ticking Clocks and Turning Calendar"]}},{"k":"ncert|sci|4|8","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"8","title":"How Things Are Made","dk":["A4"],"c":{"covers":"How things are made from raw materials: cloth, paper, pottery, food; artisans and factories.","game":["Factory Line","Shuffled step cards for making things (cotton boll to shirt, sugarcane to jaggery, wood to paper, clay to pot). Race to put a set in order; the opponent checks with the answer card. Fastest correct line wins."],"exp":["Make paper: soak torn newspaper, blend into pulp (adult), spread on a mesh frame, press and dry.","Butter in a jar: shake cream in a closed jar for 10 minutes. What separates?"],"act":["Visit a bakery, potter or tailor and list the steps you see.","Check 10 things at home: where were they made?"],"proj":["From Raw to Ready","Make one thing from its raw material (handmade paper cards, or cream to butter to ghee) and record each step.","A finished product and a process poster"],"read":["Charlie Needs a Cloak, Tomie dePaola"],"links":["Santoor Ch 12: Maheshwar (known for its handloom weaving)","Maths Mela Ch 4: Thousands Around Us"]}},{"k":"ncert|sci|4|9","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"9","title":"Different Lands, Different Lives","dk":["B8","B2"],"c":{"covers":"Different landforms (plains, deserts, coasts, mountains) and how they shape people's homes, food, clothes and work.","game":["Landform Survivor","Draw a land card (Thar desert, Ladakh, Kerala coast, Gangetic plains). Build a home, food, clothing and transport set from your cards that fits that land. The opponent throws an event at you (sandstorm, snowfall, monsoon flood); survive it with the right card to score."],"exp":["Insulation test: put an ice cube in boxes lined with mud, paper, cloth and thermocol. Which melts last? Which wall would you want in the desert?","Sand vs water: two cups under a lamp or in the sun. Which heats faster, and which cools faster at night?"],"act":["Make clay models of a mountain, plain, desert and coast.","Taste one dish from each landform region."],"proj":["Postcards from India","Research and draw 4 postcards (one per landform) and build a model of one traditional house.","A postcard set and a house model"],"read":["A Gift for Amma: Market Day in India, Meera Sriram","The Blue Umbrella, Ruskin Bond"],"links":["Santoor Ch 11: A Journey to the Magical Mountains","Veena Ch 6: Jaipur se Patra","Veena Ch 8: Onam ke Rang"]}},{"k":"ncert|sci|4|10","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"10","title":"Our Sky","dk":["B5","B1"],"c":{"covers":"The Sun, Moon and stars, shadows, day and night, how the sky changes.","game":["Constellation Connect","Dot cards of constellations (Saptarishi, Kalpurush/Orion, Vrishchik/Scorpius). Race to join the dots and name it, then read its story card (the seven rishis, Dhruv). Bonus point if you find it in tonight's sky."],"exp":["Shadow stick: mark a stick's shadow every hour from 9 to 4. When is it shortest?","Torch and ball: show day and night, then the Moon's phases with a lamp and a ball on a pencil."],"act":["Night-sky watch with a printed star map.","A one-month moon diary."],"proj":["Sky Journal and Sundial","Build a sundial and keep a 30-day moon and sky journal.","A working sundial and a sky journal"],"read":["Moon! Earth's Best Friend, Stacy McAnulty","Sun! One in a Billion, Stacy McAnulty","There's No Place Like Space, Tish Rabe"],"links":["Veena Ch 5: Aasman Gira","Veena Ch 13: Hamara Aditya (India's solar mission)"]}},{"k":"ncert|sci|5|1","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"1","title":"Water – The Essence of Life","dk":["B8","C12"],"c":{"covers":"Water in living things and daily life, what water dissolves, its forms, the water cycle, scarcity and conservation.","game":["Lake of Two Villages","You share one lake of 30 water tokens. Each round, both secretly choose to take 2 (careful) or 5 (greedy) tokens for your fields; then a rain card refills 0–6. If the lake ever empties, both villages lose. Most harvest when the season ends, without emptying the lake, wins. Talk about why sharing rules matter."],"exp":["What dissolves? Salt, sugar, sand, oil, haldi, chalk in water. Stir, wait, observe.","Hidden water: weigh a cucumber slice, dry it in the sun for 2 days, weigh again."],"act":["Trace your home's water from its source to your tap.","Compare how much water different crops need (rice vs millets)."],"proj":["Water Heroes Model","Research a traditional system (stepwell, johad, kund, eri) and build a working rain-harvesting model.","A model and a 3-minute talk"],"read":["The Water Princess, Susan Verde","A River, Marc Martin"],"links":["Santoor Ch 3: The Rainbow","Veena Ch 12: Ganga ki Kahani","Maths Mela Ch 8: Weight and Capacity"]}},{"k":"ncert|sci|5|2","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"2","title":"Journey of a River","dk":["B8"],"c":{"covers":"A river's journey from its source to the sea: source, tributary, delta, mouth; fast narrow upper course and slow wide lower course; life along rivers.","game":["River Run","A board from glacier to sea. Roll to move; tributary squares speed you up, dam squares make you wait, pollution squares push you back, the delta is the finish. Each square carries a real fact about the Ganga, Brahmaputra, Narmada or Kaveri."],"exp":["Stream table: a tray of damp sand on a slope; trickle water from a bottle at the top. Watch channels, bends and a delta form. Try steep vs gentle slopes."],"act":["Trace a river on a map from source to mouth and mark the cities on it.","Collect river stories, such as the legend of the Kaveri."],"proj":["River Model","Build a sand or clay river with labelled source, tributaries and delta, and a one-page profile of a river near you.","A 3D river model"],"read":["Angry River, Ruskin Bond","A River, Marc Martin"],"links":["Veena Ch 12: Ganga ki Kahani","Maths Mela Ch 14: Maps and Locations"]}},{"k":"ncert|sci|5|3","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"3","title":"The Mystery of Food","dk":["C11"],"c":{"covers":"How food changes: cooking, spoiling, fermenting and digesting (align with the book's focus).","game":["Food Detective","Mystery cards give clues (smells sour, bubbles appeared, fuzzy spots, turned sweet when chewed). Use the fewest clues to name what happened: fermentation, spoilage, cooking or digestion. Fewer clues used, more points."],"exp":["Chew plain roti for 2 minutes: when does it turn sweet?","Idli batter: keep one bowl warm and one in the fridge overnight. Which rises?","Milk to curd at room temperature vs in the fridge."],"act":["Ask grandparents how food was preserved without a fridge (sun-drying, pickling).","Watch a fruit go brown after cutting; does lemon juice stop it?"],"proj":["Fermentation Lab","Over one week make curd, idli batter and kanji; photograph and log changes daily.","Foods to eat and a lab notebook"],"read":["Bread, Bread, Bread, Ann Morris"],"links":["Maths Mela Ch 6: The Dairy Farm","Maths Mela Ch 9: Coconut Farm"]}},{"k":"ncert|sci|5|4","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"4","title":"Our School – A Happy Place","dk":["B2"],"c":{"covers":"What makes a learning place happy: people, rules, cleanliness, inclusion. For homeschoolers: your own learning community.","game":["Dream School Draft","Draft feature cards (library, garden, ramps and lifts, sign-language teacher, sports ground, kitchen) within a budget. Each pick must be justified: who does it help? The opponent can veto once."],"exp":["Light and sound check: measure how bright and how noisy your learning corner is at different times (use a phone light/sound meter or rate 1–5)."],"act":["Interview a friend who goes to school: what makes it happy or hard?","Agree a set of rules for your homeschool group or siblings."],"proj":["Learning-Space Makeover","Redesign the home learning corner and write a charter for your learning group.","A rearranged corner and a signed charter"],"read":["Chuskit Goes to School, Sujatha Padmanabhan","The Day You Begin, Jacqueline Woodson"],"links":["Veena Ch 7: Mera Bachpan"]}},{"k":"ncert|sci|5|5","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"5","title":"Our Vibrant Country","dk":["B2"],"c":{"covers":"India's diversity of languages, foods, dances, festivals and crafts, and what unites us.","game":["India Quartets","Each state has 4 cards: language, dance, food, monument. Ask your opponent for a card ('Do you have Assam's dance?'). Collect all four of a state to lay down a quartet. Most quartets wins."],"exp":["Language sounds: record 'hello' and 'thank you' in 10 Indian languages. Which share words?"],"act":["Fill a blank India map with states and one fact each.","Cook one dish from a state you've never visited."],"proj":["State Exchange","Video-call or write to a child in another state; make a fact book about each other's state.","A two-state fact book"],"read":["A Gift for Amma: Market Day in India, Meera Sriram","Amma, Take Me to… series, Bhakti Mathur"],"links":["Veena Ch 11: Hamare ye Kalamandir","Veena Ch 8: Kaziranga Rashtriya Udyan ki Yatra"]}},{"k":"ncert|sci|5|6","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"6","title":"Some Unique Places","dk":["B8"],"c":{"covers":"Unusual landscapes, rare wildlife and traditions in India (e.g. deserts, mangroves, floating lakes, cold deserts).","game":["Where in India?","A travel guessing game: the opponent reads clues one at a time (floating islands of grass; a white salt desert; mangroves with tigers; bridges grown from tree roots). Guess with fewer clues to score more. Then swap."],"exp":["Salt from the sea: dissolve salt in water in a shallow plate and leave it in the sun. What's left after 3 days? (This is how salt pans work.)","Floating island: does a grass mat on a sponge float? What keeps Loktak's phumdis afloat?"],"act":["Plan a trip to one unique place: route, budget, packing list.","Find the animals found only in that place."],"proj":["Unique-Place Diorama","A shoebox diorama of one place plus a one-minute guide video.","A diorama and a video"],"read":["StoryWeaver (Pratham Books): search 'Sundarbans' or 'Ladakh'"],"links":["Veena Ch 8: Kaziranga Rashtriya Udyan ki Yatra","Maths Mela Ch 5: Far and Near","Maths Mela Ch 14: Maps and Locations"]}},{"k":"ncert|sci|5|7","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"7","title":"Energy – How Things Work","dk":["C12","B6"],"c":{"covers":"Forms of energy, where it comes from (food, fuel, sun, electricity), how devices use it, saving energy.","game":["Energy Chains","Cards show energy steps (Sun, grass, cow, milk, my muscles, bicycle, dynamo, bulb). Build valid chains where each card's energy turns into the next. Longest chain wins; the opponent can challenge any link."],"exp":["Pizza-box solar oven: foil, black paper and cling film. Can it melt chocolate? Measure with a thermometer if you have one.","Rubber-band car: wind more turns, travel further?"],"act":["Home energy audit: lights and fans left on, the meter reading each day for a week.","Find 5 ways energy changes form in the kitchen."],"proj":["Solar Cooker Challenge","Build a solar cooker, test it over 3 days, and cook something simple.","A working cooker and a temperature log"],"read":["The Boy Who Harnessed the Wind (picture-book edition), William Kamkwamba & Bryan Mealer","Energy Island, Allan Drummond"],"links":["Maths Mela Ch 12: Racing Seconds"]}},{"k":"ncert|sci|5|8","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"8","title":"Clothes – How Things are Made","dk":["A4"],"c":{"covers":"Fibres (cotton, silk, wool, jute, synthetic), spinning, weaving and dyeing, khadi, how clothes are made.","game":["Fibre Detective","Mystery fabric scraps in envelopes with clue cards (soaks water fast, comes from a caterpillar, shines, keeps sheep warm). Feel, test with a drop of water,
