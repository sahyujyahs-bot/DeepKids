nvironmental Study (A-102)","n":"Theme","title":"Basic needs and diet","dk":[]},{"k":"nios|sci|4|9","board":"nios","subj":"sci","level":4,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Transport","dk":[]},{"k":"nios|sci|4|10","board":"nios","subj":"sci","level":4,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Communication","dk":[]},{"k":"nios|sci|4|11","board":"nios","subj":"sci","level":4,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Rights: education, information, consumer rights","dk":[]},{"k":"nios|sci|5|1","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Human existence and the body","dk":[]},{"k":"nios|sci|5|2","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Hygiene and health","dk":[]},{"k":"nios|sci|5|3","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Family and kinship","dk":[]},{"k":"nios|sci|5|4","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Respect for women and elders","dk":[]},{"k":"nios|sci|5|5","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Festivals","dk":[]},{"k":"nios|sci|5|6","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Planets and the sky","dk":[]},{"k":"nios|sci|5|7","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Weather","dk":[]},{"k":"nios|sci|5|8","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Basic needs and diet","dk":[]},{"k":"nios|sci|5|9","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Transport","dk":[]},{"k":"nios|sci|5|10","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Communication","dk":[]},{"k":"nios|sci|5|11","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Rights: education, information, consumer rights","dk":[]}],"topics":[{"id":"A1","q":"A. What is life?","name":"Living & non-living: is the distinction real?","sub":["The usual 'signs of life': moves, breathes, eats, grows, responds, makes babies, gets rid of waste","Tricky cases that break the list: fire (eats, breathes oxygen, grows, spreads), a 100-year-old dormant seed, growing crystals, a plucked flower, a dead leaf, a virus","J.C. Bose: plants respond to touch, injury and poison; he claimed metals also 'tire' and 'recover'","Everything is made of elements forged in stars","Is a handful of soil living or non-living?"],"summary":"We start by sorting things at home into 'alive' and 'not alive' and writing down why. Then we test those reasons on tricky cases. Fire eats, breathes and grows; is it alive? A seed can sit still for 100 years and then sprout; was it alive all that time? Crystals grow. Then we meet J.C. Bose, who built machines sensitive enough to show plants reacting, and who argued that even metals show tiredness and recovery. We end with the honest truth: scientists still do not have one agreed definition of life. NASA's working definition is 'a self-sustaining chemical system capable of evolution', and even that is argued over.","oneness":"If the same atoms move from stars to rocks to plants to me, at what moment does something become 'alive'? Is aliveness a line, or a gradient?","weeks":2,"full":true,"res":[{"type":"Book","title":"A Seed Is Sleepy, Dianna Hutts Aston","url":""},{"type":"Visit","title":"Acharya J.C. Bose Indian Botanic Garden, Howrah","url":""},{"type":"Watch","title":"The Private Life of Plants (BBC, David Attenborough)","url":""},{"type":"Lesson","title":"The King's Doubt: full game (cards + parent guide)","url":""}]},{"id":"A2","q":"A. What is life?","name":"How did life begin?","sub":["Earth began hot, with no life","The oldest evidence of life is about 3.5 billion years old (stromatolites: layered rocks built by microbes)","First life was tiny single cells in water","Ideas: Darwin's 'warm little pond', deep-sea hot vents, life arriving from space (panspermia), the 'RNA world'","Miller–Urey experiment (1952): gases + electric sparks made amino acids","Nobody has made life from scratch yet"],"summary":"We tell Earth's story on a long rope or saree: Earth forms, it is too hot for life, then early on the first tiny cells appear in water, and humans arrive only in the last few millimetres. We look at photos of stromatolites, rocks built layer by layer by microbes over billions of years, some still growing in Australia today. Then we lay out the main ideas scientists have about how life started, and the one honest answer: nobody knows yet. Scientists have made some building blocks of life in a lab, but never life itself.","oneness":"If life came from non-living chemicals, was it ever really separate from them?","weeks":1,"full":false,"res":[{"type":"Book","title":"The Story of Life: Evolution, Catherine Barr & Steve Williams","url":""},{"type":"Website","title":"NASA Space Place: life in the universe","url":"https://spaceplace.nasa.gov"}]},{"id":"A3","q":"A. What is life?","name":"What's common between living and non-living?","sub":["Everything is made of atoms; about 90 kinds occur naturally (elements)","The body is mostly oxygen, carbon, hydrogen, nitrogen","The same carbon is in pencil lead, diamond, bread and you","Atoms are recycled: the water you drink has passed through clouds, rivers, plants and animals","Stars made most elements: 'we are star stuff'"],"summary":"We ask what a rock, a tree and a child have in common, and find that underneath they are built from the same tiny pieces: atoms. Your body is mostly oxygen, carbon, hydrogen and nitrogen, the same elements found in air, water and coal. Carbon in a pencil and carbon in a diamond are the same atom arranged differently. Atoms never wear out; they keep moving between rocks, air, plants and people. Most of them were made inside stars long before Earth existed. So the difference between living and non-living is not in what they are made of, but in how those pieces are arranged and behave.","oneness":"If my atoms were once a star and will one day be soil, which part of the journey is 'me'?","weeks":1,"full":false,"res":[{"type":"Book","title":"Older Than the Stars, Karen C. Fox","url":""},{"type":"Website","title":"PhET: Build an Atom (simulation)","url":"https://phet.colorado.edu"}]},{"id":"A4","q":"A. What is life?","name":"Materials around me & their properties","sub":["Properties: hard/soft, rough/smooth, heavy/light, bendy/stiff, strong/brittle, see-through/opaque, magnetic/not","Float or sink: not about heavy vs light but about how tightly packed (Archimedes)","Microscope views: salt crystals, sugar, cloth threads, hair, soil","Soil & rocks: sand, clay, loam; soil layers; soil is full of life (a teaspoon holds billions of microbes)","Surprising 'materials': is water a material? Tears? Shadow? Sound? Fire?"],"summary":"Children become material detectives: touching, bending, dropping and floating everyday things and describing them with exact words. Float-or-sink predictions surprise them: a heavy steel plate floats when shaped like a bowl, while a tiny pebble sinks. We look closer with a magnifier or phone microscope: salt is little cubes, cloth is woven threads. We dig into soil, see its layers settle in a jar, and learn that one spoonful of good soil contains more living microbes than there are people on Earth, so is soil living? Finally the big puzzle: water and tears are matter, but a shadow is only missing light, sound is a shaking that travels through matter, and fire is hot glowing gas. What counts as 'stuff'?","oneness":"Is soil a thing, or a crowd of living beings? Where does the material end and the living begin?","weeks":2,"full":false,"res":[{"type":"Make","title":"Arvind Gupta Toys: science from everyday junk","url":"https://www.arvindguptatoys.com"},{"type":"Website","title":"PhET: Density (float or sink)","url":"https://phet.colorado.edu"}]},{"id":"A5","q":"A. What is life?","name":"Kinds of living things","sub":["Plants: root, stem, leaf, flower, fruit, seed; what plants need (water, light, air, soil nutrients); grow-a-seed","Fungi: mushrooms, mould, yeast; neither plant nor animal, closer to animals than to plants","Animals: mammals, birds, reptiles, amphibians, fish, insects and other invertebrates","Microbes (links to B3)","Humans are animals: mammals and primates","Groups are made by humans, and they keep changing"],"summary":"We meet the big families of life. Plants: we find the parts on a real plant and discover which parts we eat (carrot is a root, potato is a stem, spinach a leaf, cauliflower a flower, rice a seed), then start growing seeds in light and dark to see what plants need. Fungi surprise everyone: mushrooms are not plants, and DNA shows fungi are closer relatives of animals. We sort animals by features (fur, feathers, scales, backbone or not) and place humans honestly among them: we are mammals, we are animals. Finally we see that these groups are human-made boxes: scientists used to call fungi plants, and today most scientists say birds are living dinosaurs.","oneness":"Who drew these boxes, and does nature know about them? If a mushroom is more like me than a plant, what does 'like me' mean?","weeks":3,"full":false,"res":[{"type":"Book","title":"A Seed Is Sleepy, Dianna Hutts Aston","url":""},{"type":"Read","title":"StoryWeaver (Pratham Books): free picture books on plants and animals","url":"https://storyweaver.org.in"},{"type":"Visit","title":"Any botanical garden, e.g. Lalbagh, Bengaluru","url":""}]},{"id":"B1","q":"B. What is this world?","name":"Big Bang & the universe","sub":["About 13.8 billion years ago the universe was tiny, hot and dense, and began expanding","First atoms: hydrogen and helium","Mass and gravity: gravity pulls matter into clumps → stars, planets, galaxies, clusters","Stars make heavier elements and scatter them when they explode","Black holes; dark matter and dark energy (about 95% of the universe is something we cannot see)","Our planet: about 71% water, 29% land"],"summary":"We tell the biggest story there is. Long ago everything was squeezed into an unimaginably small, hot speck, which grew and is still growing, like dots on a balloon moving apart as it inflates. As it cooled, the first atoms appeared. Mass pulls on mass; that pull is gravity, and gravity gathered gas into stars and stars into galaxies. Stars cook new elements and scatter them when they explode; our Earth, and we, are made from that dust. Then the mysteries: black holes so strong that light cannot escape, and the shocking fact that most of the universe is 'dark' stuff no one has ever seen. We also learn how ideas about gravity changed: Newton said it is a pulling force, and it worked for 200 years; Einstein showed mass bends space and time itself; and today some scientists think even Einstein's idea needs fixing.","oneness":"If everything came from one tiny point, is the universe one thing that became many?","weeks":2,"full":false,"res":[{"type":"Website","title":"NASA Space Place","url":"https://spaceplace.nasa.gov"},{"type":"Book","title":"Me and My Place in Space, Joan Sweeney","url":""},{"type":"Visit","title":"Nehru Planetarium (Delhi / Mumbai)","url":""}]},{"id":"B2","q":"B. What is this world?","name":"My world: how humans live, and why","sub":["My world: home, food, transport, money, work, school, festivals","The chain of people behind my breakfast","Humans are social animals: families, groups, rules, sharing, trade","Why we live like this: biology (we bond, cooperate, compete), environment, history, culture","Different people live in different worlds: village, city, forest, another country","Money: from barter to coins to digital"],"summary":"We begin with the child's own world: list everything used in one day and trace where it came from. A single breakfast needs farmers, drivers, shopkeepers and cooks; no human lives alone. We ask why humans live in families and groups: like elephants, wolves and ants, we survive by cooperating, and our bodies are wired to bond (a hug really changes brain chemicals). We see that a child in a forest village, a fishing town or a city in another country lives in a different 'world' with different food, work and rules. We play a barter market to see why money was invented. And we ask the old question honestly: are humans naturally selfish or naturally kind? Thinkers disagree.","oneness":"If my breakfast needs a hundred people, where do 'I' end and 'we' begin?","weeks":1,"full":false,"res":[{"type":"Read","title":"StoryWeaver: stories of children across India","url":"https://storyweaver.org.in"}]},{"id":"B3","q":"B. What is this world?","name":"The world of microorganisms","sub":["Too small to see: bacteria, yeast and other fungi, amoebas, algae; viruses (alive or not?)","Everywhere: soil, air, water, skin, gut","Helpers: curd, idli/dosa batter, bread, compost; ocean plankton make about half of Earth's oxygen","Some make us sick (links to C10)","Leeuwenhoek first saw them in the 1670s with a home-made lens"],"summary":"There is a whole hidden world all around and inside us. We hear how a Dutch cloth-seller, Leeuwenhoek, ground tiny lenses and was the first person to see 'little animals' swimming in a drop of water. Microbes turn milk into curd, make idli batter rise, rot leaves into soil and, through tiny ocean plankton, make about half the oxygen we breathe. Only a few make us sick. We make curd at home and watch yeast blow up a balloon. And we ask whether viruses are alive: they cannot do anything outside a living cell, so scientists still disagree.","oneness":"If tiny beings make my curd, my soil and my oxygen, how separate is my life from theirs?","weeks":1,"full":false,"res":[{"type":"Watch","title":"Microcosmos (1996 film)","url":""},{"type":"Make","title":"Arvind Gupta Toys: simple magnifiers","url":"https://www.arvindguptatoys.com"}]},{"id":"B4","q":"B. What is this world?","name":"Other beings' worlds: how a bird sees the world","sub":["Every creature lives in its own world of senses (umwelt, Jakob von Uexküll, 1909)","Birds see ultraviolet and have 4 kinds of colour cones (we have 3)","Many birds sense Earth's magnetic field to migrate; Amur falcons fly from East Asia through Nagaland to Africa","Bird societies: flocks, nests, parents, songs with local 'dialects', crows remember faces and use tools","Seeing time: many birds and insects see fast movements we miss","(Series can continue: an ant's world, a dog's world, a fish's world…)"],"summary":"Our world of cars, money and roads is only one world. A crow on the same street lives in a different one. Birds see colours we cannot even imagine, including ultraviolet patterns on flowers and feathers. Many feel the Earth's magnetism and use it like a compass to fly thousands of kilometres; the Amur falcon crosses the Arabian Sea on its way from Asia to Africa. Birds have families, neighbours, quarrels and songs, and crows can remember a human face for years. We try to imagine life in a bird's world, and meet a famous question: can we ever truly know what it is like to be another creature?","oneness":"If each being lives in its own world, is there one 'real' world, or many?","weeks":1,"full":false,"res":[{"type":"Watch","title":"Planet Earth: Birds of Paradise episode (BBC)","url":""},{"type":"Visit","title":"Salim Ali Bird Sanctuary, Thattekad (Kerala) or a local lake","url":""}]},{"id":"B5","q":"B. What is this world?","name":"Cycles in the sky & weather","sub":["Day and night: Earth spins","A year: Earth goes around the Sun; seasons come from Earth's tilt, not its distance from the Sun","Moon phases: we see different amounts of the Moon's sunlit half; the Moon makes no light of its own","India's six ritus and the monsoon","Clouds and rain: water evaporates, cools and condenses","Planets you can see (Venus, Jupiter, Mars, Saturn) and stars as distant suns"],"summary":"With a torch and a ball we discover why day and night happen: the Earth spins, so our side faces the Sun and then turns away. Seasons come from Earth's tilt; most people wrongly think it is about being closer to the Sun. The Moon makes no light of its own; its shape changes because we see different amounts of its sunlit half, and the child keeps a moon diary for a month. We learn India's six ritus, why the monsoon comes, and make a cloud in a jar. We hear how ideas changed: people once believed the Sun went around the Earth; Aryabhata proposed in 499 CE that the Earth spins; Copernicus and Galileo argued the Earth goes around the Sun, and Galileo was put on trial for it.","oneness":"Sun, Moon, seasons and my sleep all move in cycles. Am I part of the sky's rhythm?","weeks":2,"full":false,"res":[{"type":"Website","title":"NASA Space Place: Moon phases","url":"https://spaceplace.nasa.gov"},{"type":"Make","title":"Shadow-stick sundial","url":""}]},{"id":"B6","q":"B. What is this world?","name":"Forces, vibrations & sound","sub":["Push and pull; gravity pulls everything down","The floor pushes back up (normal force); friction; air resistance; water pushes up (buoyancy); magnets","Contact forces are, at heart, electric pushes between electrons; your hand never truly 'touches' the table","Gravity is the exception, a different force","Sound is vibration travelling through air, water and solids; no sound in space","Loud/soft and high/low (pitch); echoes"],"summary":"Children push, pull, drop and float things to feel forces. The surprise: when you sit on a chair, the chair pushes back up, and when you 'touch' anything, its electrons and yours push each other away; atoms never really touch. Air pushes against a falling sheet of paper; water pushes up on a boat. We retell the history of falling: Aristotle said heavy things fall faster, and people believed him for nearly 2000 years until Galileo tested it; Newton explained gravity as a pull; Einstein explained it as bent space. Sound is also a push travelling along: we feel our throat buzz when humming Om, watch rice jump on a drum, and build a cup telephone.","oneness":"If nothing ever truly touches, how are we all still connected?","weeks":2,"full":false,"res":[{"type":"Book","title":"The Way Things Work Now, David Macaulay","url":""},{"type":"Website","title":"PhET: Forces and Motion Basics","url":"https://phet.colorado.edu"},{"type":"Make","title":"Arvind Gupta Toys: sound and force toys","url":"https://www.arvindguptatoys.com"}]},{"id":"B7","q":"B. What is this world?","name":"Light, colour & shadows","sub":["Light sources: Sun, fire, bulbs, fireflies (living light)","We see when light bounces off things into our eyes","Light travels in straight lines → shadows; shadow size changes with distance","Reflection: mirrors, still water","White light holds all colours (rainbow, prism); objects show the colours they bounce back","Mixing paint vs mixing light: paints get darker; red, green and blue light make white","Darkness is the absence of light; light and shade in painting"],"summary":"Darkness is not a thing; it is what is left when light is missing. We make shadow puppets and discover shadows grow as hands move closer to the torch. We bounce torchlight off mirrors to hit a target, make rainbows with a glass of water, and learn that white light is all colours mixed, as Newton showed with a prism. A red apple looks red because it bounces red light and swallows the rest. Then the painting surprise: mixing paints makes colours darker, while mixing coloured light makes white. We paint a ball with one light source to see light, shade and shadow. And the deep puzzle: is light a wave or a particle? Scientists argued for centuries and now say it behaves as both, which still puzzles them.","oneness":"Is colour in the apple, in the light, or in my mind?","weeks":2,"full":false,"res":[{"type":"Website","title":"PhET: Color Vision","url":"https://phet.colorado.edu"},{"type":"Visit","title":"Shadow puppet show (Tholu Bommalata / Togalu Gombeyaata)","url":""}]},{"id":"B8","q":"B. What is this world?","name":"Nature's events","sub":["Rain and the water cycle","Floods, droughts and dry spells","Wind, storms and cyclones (countries around the Indian Ocean take turns naming them)","Thunder and lightning (light arrives before sound)","Earthquakes and tsunamis (2004 Indian Ocean tsunami)","Snow in the Himalayas","Why the monsoon happens: land heats faster than sea"],"summary":"Nature is always moving water, air and land around. We follow a raindrop through the water cycle, then see what happens when there is too much (flood) or too little (drought). The monsoon happens because land heats faster than the sea, so moist sea air rushes in. We count the seconds between lightning and thunder to tell how far away a storm is. We learn how earthquakes shake the ground and how in 2004 some Andaman island communities reportedly escaped the tsunami using traditional knowledge of the sea. And we ask whether 'natural disasters' are fully natural: building on riverbeds or cutting forests can make floods far worse.","oneness":"Rain, rivers and my body's water are the same water. Is a flood something happening to us or with us?","weeks":1,"full":false,"res":[{"type":"Website","title":"India Meteorological Department: today's weather","url":"https://mausam.imd.gov.in"},{"type":"Visit","title":"A stepwell (e.g. Chand Baori, Rajasthan) or a local lake","url":""}]},{"id":"B9","q":"B. What is this world?","name":"Human impact on the environment","sub":["Humans change land (forests → farms and cities), air (smoke), water (plastic, sewage) and climate (burning coal and petrol adds carbon dioxide)","Other animals change environments too (elephants, termites, earthworms, beavers), but humans at a huge scale","Good changes: Jadav Payeng planted a whole forest on a river island; the Chipko movement","Are humans part of nature or outside it?"],"summary":"Every living thing changes its surroundings: earthworms make soil, elephants clear paths, termites build towers. Humans do the same, but at a scale that now changes the whole planet's air, water and weather. We walk the neighbourhood spotting human-made changes, catch dust from the air on a sticky card, and feel how a road is hotter than a tree's shade. We meet people who changed things for the better: Jadav Payeng, the 'Forest Man of India', planted a forest bigger than many towns, and the women of the Chipko movement hugged trees to save them. We discuss honestly that people disagree about how fast to change things and which solutions are best.","oneness":"If I am part of nature, is damaging nature damaging myself?","weeks":1,"full":false,"res":[{"type":"Read","title":"StoryWeaver: Jadav and the Tree-Place","url":"https://storyweaver.org.in"},{"type":"Watch","title":"The Elephant Whisperers (2022)","url":""},{"type":"Watch","title":"Our Planet (2019)","url":""}]},{"id":"B10","q":"B. What is this world?","name":"Waste: reduce & manage","sub":["Nature has no waste: a fallen leaf becomes soil","Kinds of waste: wet, dry, hazardous, e-waste","Where waste goes: landfills, burning, recycling, oceans","Plastic can last hundreds of years","Refuse, reduce, reuse, repair, recycle; composting","India's kabadiwala recycling system"],"summary":"In a forest nothing is wasted: leaves, dead animals and dung all become food for something else. Only humans make things nature cannot easily take back, like plastic that lasts for centuries. We find out what our own family throws away in a week, sort it into wet, dry and hazardous, and bury a banana peel, a paper and a plastic bag to dig up after 3 weeks. We meet India's kabadiwalas, who quietly recycle huge amounts, and old habits like turning sarees into quilts. We also learn an uncomfortable fact: only a small part of all plastic ever made has been recycled, and experts argue about whether recycling is the real answer.","oneness":"If nature has no waste, is waste a human idea? Can we live like a forest?","weeks":1,"full":false,"res":[{"type":"Make","title":"Arvind Gupta Toys: toys from trash","url":"https://www.arvindguptatoys.com"}]},{"id":"C1","q":"C. Who am I?","name":"Other life inside me","sub":["Trillions of microbes live in and on us: roughly as many bacterial cells as human cells","Gut, skin and mouth each have their own communities","They help digest food, make some vitamins and train our defences","Mitochondria, the energy-makers in our cells, were once free-living bacteria","About 8% of our DNA is left over from ancient viruses"],"summary":"You are not just you: you are a walking city. About as many bacterial cells live in and on your body as your own cells (scientists used to say 10 times more, until a 2016 study corrected it). Your gut microbes help digest food and make vitamins; skin microbes guard against germs. Deeper still, the tiny power stations inside every cell, mitochondria, were once separate bacteria that moved in and never left. Lynn Margulis proposed this and was ridiculed for years before scientists accepted it. Even our DNA carries leftover pieces of ancient viruses. So which part is 'me'?","oneness":"If half the cells in my body are not 'mine', and my energy comes from ancient bacteria, what is 'I'?","weeks":1,"full":false,"res":[{"type":"Website","title":"Khan Academy: cells and microbes (older kids, parent prep)","url":"https://www.khanacademy.org"}]},{"id":"C2","q":"C. Who am I?","name":"My genes","sub":["Every cell carries instructions (DNA), like a recipe book","Half from each biological parent; why siblings differ","All life uses the same DNA 'letters'; we share many genes with bananas, flies and mice","Genes are not destiny: food, care and surroundings switch genes on and off","History: Mendel's peas; Rosalind Franklin's photo; Har Gobind Khorana and the genetic code"],"summary":"Inside almost every cell is a long coded message called DNA, a recipe book for building and running a body. We extract real DNA from strawberries and see the white strands. Half our recipes come from each biological parent, mixed in a new way, which is why siblings look alike but different. All living things use the same four DNA letters, so we share many genes even with bananas. We meet Mendel, a monk whose pea experiments were ignored for 34 years; Rosalind Franklin, whose photo revealed DNA's shape but who got little credit; and Har Gobind Khorana, born in Punjab, who won a Nobel Prize for cracking how DNA's code works. And we learn that genes are not destiny: what we eat, how we live and how we are cared for changes which genes are used.","oneness":"If a banana and I share the same code, are we written in the same language by the same author?","weeks":1,"full":false,"res":[{"type":"Make","title":"Strawberry DNA extraction (lesson card)","url":""}]},{"id":"C3","q":"C. Who am I?","name":"Where humans came from","sub":["Life changed over billions of years (evolution): fish → amphibians → reptiles → mammals → primates → humans, a branching tree, not a ladder","Darwin and Wallace: natural selection","Other humans: Homo erectus, Neanderthals, Denisovans; Homo sapiens appear about 300,000 years ago in Africa","Many of us carry a little Neanderthal DNA","People reached India tens of thousands of years ago; Bhimbetka rock shelters"],"summary":"We follow our family line back through time: fish that crawled onto land, early mammals scurrying under dinosaurs, tree-climbing primates, and many kinds of humans, several of them alive at the same time. Darwin and Wallace explained how living things slowly change: those best suited to their surroundings survive and pass on their traits. We see that evolution is a branching bush, not a ladder, and that new fossils keep pushing dates back. We visit (in pictures or in person) Bhimbetka's rock paintings, among the oldest human art in India. Then we compare this with the Dashavatara: Matsya (fish), Kurma (tortoise), Varaha (boar), Narasimha (half-lion, half-human), Vamana (small human), then full humans. Many people see in this order a story that parallels evolution.","oneness":"If all life is one family tree, is there anyone who is not my relative?","weeks":1,"full":false,"res":[{"type":"Book","title":"The Story of Life: Evolution, Catherine Barr & Steve Williams","url":""},{"type":"Visit","title":"Bhimbetka rock shelters (Madhya Pradesh)","url":""}]},{"id":"C4","q":"C. Who am I?","name":"What's common between me and other life?","sub":["Me & a dog: mammals, backbone, the same organs, hair, milk, feelings","Me & a bird: backbone, lungs, a 4-chambered heart","Me & a fish: backbone; early embryos look alike","Me & a tree: cells, DNA, using energy, water","Me & a mushroom: closer relatives than plants","Me & bacteria: the same DNA code and energy molecule","Differences too"],"summary":"We play detective comparing ourselves with other beings, one at a time. A dog shares our skeleton plan, organs, fur-like hair, milk-feeding and clearly feels joy and fear. A bird has a 4-chambered heart like ours. A tree breathes at the level of its cells, carries DNA and is made of cells like us. Even bacteria run on the same genetic code and energy molecule. The deeper we look, the longer the 'same' list grows. We also hear the 2012 Cambridge Declaration on Consciousness, in which scientists stated that many animals, including birds and octopuses, are conscious, and the 2024 New York Declaration, which says even insects might be.","oneness":"'Tat tvam asi': you are that. When does 'same' become 'one'?","weeks":1,"full":false,"res":[{"type":"Watch","title":"My Octopus Teacher (2020)","url":""}]},{"id":"C5","q":"C. Who am I?","name":"Our closest cousins","sub":["Great apes: chimpanzees and bonobos (closest; about 98–99% similar DNA), gorillas, orangutans","Monkeys and other primates","India's only ape: the hoolock gibbon (Northeast)","Shared: tools, emotions, play, laughter, culture","Jane Goodall: chimps use tools"],"summary":"Chimpanzees and bonobos are our closest living relatives; we shared an ancestor several million years ago. When Jane Goodall saw a chimp stripping a twig to fish for termites, scientists had believed tool-making was what made humans unique. Her mentor Louis Leakey said we must now 'redefine tool, redefine man, or accept chimpanzees as humans.' Chimps laugh, mourn, make up after fights and have local traditions. India has its own ape, the hoolock gibbon, singing in northeastern forests. We tape our thumbs to see why our hands matter, and ask: what, if anything, makes humans special?","oneness":"Every 'only humans can…' claim has been challenged. Is the line between us and them real?","weeks":1,"full":false,"res":[{"type":"Watch","title":"Jane Goodall documentaries (e.g. Jane, 2017)","url":""}]},{"id":"C6","q":"C. Who am I?","name":"My family history","sub":["Family tree (3 generations); 'family' = the people who raise and love me (inclusive of adopted, single-parent and other families)","Traits that run in families: face, height, hair, handedness","Fingerprints: unique, even for identical twins","Stories, languages, places, recipes","How long people lived then vs now","Blood groups and family illnesses: parent-led and kept light"],"summary":"Every child is the newest page in a very long story. We build a family tree, interview a grandparent or elder, collect photos and stories, and look at what is shared: a nose, a laugh, a love of cooking. We take fingerprints and discover that no two people, not even identical twins, have the same ones. We learn that in 1947 people in India lived on average only about 32 years and now about 70, and ask why. For families that wish to, parents can add blood groups and health stories. Families made by adoption or in other ways trace both their 'raised-by' and 'born-from' stories in whatever way feels right.","oneness":"My family tree joins every other family tree if I go back far enough. Where does my family end?","weeks":2,"full":false,"res":[]},{"id":"C7","q":"C. Who am I?","name":"My body parts","sub":["Skin (the largest organ), bones (about 300 at birth, 206 in adults), muscles, heart, lungs, stomach and intestines, brain","How they work together","Why they evolved: forward eyes, gripping thumbs, sweating for long-distance running, goosebumps from furry ancestors, tailbone","The appendix: once called useless, now possibly a store of helpful microbes"],"summary":"We trace the child's body on a big sheet of paper and place cut-out organs inside. We listen to the heart with a home-made stethoscope before and after jumping, blow up a balloon to feel lung power, and build a moving finger from straws and string. Then we ask 'why do I have this?' Goosebumps are left over from furry ancestors whose hair stood up; sweating lets humans run for hours; babies are born with about 300 bones that fuse to 206. We learn that science changes its mind: the appendix was called useless for a century and now may be a safe house for helpful gut microbes. Finally we meet another way of seeing the body: Sushruta, an early surgeon who described nose reconstruction, and the yoga and Ayurveda traditions that describe the body differently.","oneness":"My heart beats without my asking. Is it 'my' heart, or is it doing its own thing?","weeks":2,"full":false,"res":[{"type":"Visit","title":"Science centres: Nehru Science Centre Mumbai, Visvesvaraya Museum Bengaluru, National Science Centre Delhi","url":""}]},{"id":"C8","q":"C. Who am I?","name":"My body's sensors","sub":["Beyond the 'five senses': touch, pressure, vibration, temperature, pain, itch, balance, body position (eyes closed), hunger, thirst, full tummy, heartbeat, the urge to breathe","Conscious vs automatic sensing","Senses mix: flavour = taste + smell","Other beings: birds (UV, magnetic field), bees (UV), snakes (heat), sharks (electric fields), bats (echoes), dogs (smell)","Plants sense light, gravity and touch"],"summary":"Aristotle listed five senses over 2000 years ago, and people repeated the list ever since. But your body is covered in sensors: you know where your hand is with your eyes closed, you feel hot and cold, you stay balanced on one foot, you feel hungry, thirsty or that you need the toilet, and a hidden sensor makes you breathe faster when you run. Scientists today count anywhere from about 20 to over 30 senses and still disagree on how to count. We pinch our noses and find apple and potato taste almost the same, because most flavour is smell. Then we meet the superpowers of others: snakes 'see' heat, sharks feel electricity, bats hear their way in the dark, birds feel Earth's magnetism. Even plants sense: roots know which way is down and the touch-me-not folds when touched.","oneness":"If a plant senses touch and I sense touch, is sensing the beginning of awareness everywhere?","weeks":1,"full":false,"res":[{"type":"Book","title":"What If You Had Animal Eyes?, Sandra Markle","url":""}]},{"id":"C9","q":"C. Who am I?","name":"How do I think?","sub":["The brain: about 86 billion neurons sending signals","Thinking = patterns of signals; learning changes connections","Memory: short-term and long-term; sleep helps memory; memories change each time we recall them","Emotions affect thinking","Other thinkers: crows, octopuses; even brainless slime moulds solve mazes","The hard question: how does the brain make experience?"],"summary":"Your brain has about 86 billion nerve cells passing tiny electric and chemical signals; every time you learn something new, the connections change. We play memory games and discover tricks that help (stories, pictures, a 'memory palace' walk through the house) and learn that sleep is when the brain files memories. Surprisingly, a memory changes a little each time you remember it. Thinking isn't only human: crows plan, octopuses solve puzzles, and a slime mould with no brain at all can find the shortest path through a maze. Then the biggest mystery: nobody knows how signals in the brain become the feeling of being you. Some scientists say the mind is what the brain does; Vedanta says consciousness comes first and the brain is something that appears within it.","oneness":"Who is watching my thoughts? Is the watcher a thought too?","weeks":1,"full":false,"res":[]},{"id":"C10","q":"C. Who am I?","name":"Getting sick, getting hurt & getting well","sub":["Why we get sick: germs (bacteria, viruses), not enough food or sleep, allergies","The body's defences: skin, mucus, fever, white blood cells, antibodies, immune memory (how vaccines work)","Hygiene habits: handwashing (20 seconds), teeth, bathing, clean water and food, covering coughs","Getting hurt: cuts, burns, falls, electric shock; electricity safety at home","Healing: scabs, rest","Are 'I' and 'my body' different?"],"summary":"We learn that the body is a fortress: skin is the wall, mucus is a sticky trap, fever is the body turning up the heat on germs, and white blood cells are guards who remember invaders so they can fight faster next time (which is how vaccines work). Glitter 'germs' show why handwashing matters, and bread touched by washed vs unwashed hands grows very different mould. We tell the story of Dr Semmelweis, who told doctors to wash their hands in the 1840s and was mocked; years later germ theory proved him right. We learn home safety, especially electricity: water and electricity never mix, never touch sockets or bare wires, and never touch someone being shocked; switch off first. Finally the question: we say 'help my body heal'. Who is helping whom? Am I my body, or something more?","oneness":"When I say 'my body', who is the 'I' that owns it?","weeks":2,"full":false,"res":[{"type":"Book","title":"Germs Make Me Sick!, Melvin Berger","url":""}]},{"id":"C11","q":"C. Who am I?","name":"What is food?","sub":["Food = building material + energy + helpers (vitamins, minerals) + water","Digestion breaks food down: proteins → amino acids, carbohydrates → sugars, fats → fatty acids","All life uses the same ~20 amino acids, DNA code and energy molecule (ATP)","So why so many foods? Different bodies have different tools (teeth, enzymes, gut microbes)","Plants make their own food from light; food chains","Food for different beings: cows (helped by microbes), spiders, plants, fungi"],"summary":"We chew a piece of plain roti for two minutes and it starts tasting sweet: saliva is already breaking starch into sugar. Digestion is a giant breaking-down factory: proteins become amino acids, carbohydrates become sugars, fats become fatty acids, and the body rebuilds them into itself. Amazingly, every living thing builds itself from the same 20 or so amino acids. So why does a cow eat grass, a spider eat flies and a plant eat sunlight? Because each has different tools: a cow's stomach is full of microbes that break down grass, which we cannot do. We also learn that nutrition science keeps changing its mind: fat was the villain, then sugar, and eggs went from bad to fine.","oneness":"'Annam Brahma': food is the Absolute. When I eat a mango, does the mango become me, or do I become a little more mango?","weeks":1,"full":false,"res":[{"type":"Read","title":"StoryWeaver: food stories","url":"https://storyweaver.org.in"}]},{"id":"C12","q":"C. Who am I?","name":"Energy beyond food","sub":["Sunlight: plants make sugar from light (photosynthesis); we make vitamin D in sunlight; warmth","Air: oxygen helps cells release energy from food; we breathe out carbon dioxide","Water: most of the body is water; every cell works in it","Life without sunlight: deep-sea vents where bacteria make food from chemicals (chemosynthesis); tubeworms","Microbes that 'breathe' nitrate or sulphate instead of oxygen; life in boiling springs, ice and deep rock","Tardigrades survive extremes"],"summary":"Food is only one kind of fuel. Plants catch sunlight and turn it into sugar; that sugar feeds almost everything else, including us. Our cells use oxygen to release energy from food, like a slow fire, and we breathe out carbon dioxide. A plant left in a dark box turns pale, and a candle under a jar goes out when its oxygen runs low. Then we dive to the deep ocean floor, where no sunlight has ever reached, and find whole communities living on chemicals from hot volcanic vents. Some microbes breathe sulphate instead of oxygen, some live in boiling water or deep inside rocks, and tiny tardigrades can survive drying out and even the vacuum of space. Life is far stranger and more flexible than the textbook picture.","oneness":"If all my energy started as sunlight, am I a little bit of the Sun, walking around?","weeks":1,"full":false,"res":[{"type":"Watch","title":"Blue Planet II: The Deep (BBC)","url":""}]}],"notes":{"ncert":{"sci|1":"No separate EVS book in Classes 1–2 (NCF 2023): EVS ideas sit inside the language and maths books.","sci|2":"No separate EVS book in Classes 1–2 (NCF 2023): EVS ideas sit inside the language and maths books."},"nios":{"math":"NIOS Level A/B Mathematics: lesson list to be added from NIOS study material.","eng":"NIOS Level A/B Language: English: lesson list to be added from NIOS study material.","hin":"NIOS Level A/B Language: Hindi: lesson list to be added from NIOS study material."},"cambridge":{"hin":"Cambridge Primary has no Hindi course. Pair with NCERT Hindi or DeepKids language plans."}}};

const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};

const dayNo=Math.floor(parse(today)/864e5);
const fmt=s=>parse(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const monday=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DEF_HPD={math:1,eng:0.75,hin:0.5,sci:0.75};
const fresh=()=>({setup:false,child:"",age:6,board:"ncert",plus:true,subjects:["math","eng","hin","sci"],levels:{math:1,eng:1,hin:1,sci:1},start:monday(),days:DEF_DAYS,hpd:DEF_HPD,progress:{},log:[],exps:[],skips:{},hrs:{},games:{}});
let S=fresh(),store=null,saving=Promise.resolve(),saveTimer=null,syncMode="device",tab="today",ob=null,view={};

/* ---------- persistence: one private document per viewer; browser storage as fallback ---------- */
async function boot(){
  try{const ls=localStorage.getItem("dk-state-v2");if(ls)S={...fresh(),...JSON.parse(ls)}}catch(e){}
  render();
  try{
    const [db,user]=await Promise.all([window.claude?.use?.("db"),window.claude?.use?.("user")]);
    const id=db&&user?await user.id():null;
    if(db&&id){store=db.doc("data/users/"+id+"/planner");const snap=await store.get();
      if(snap.exists&&snap.data().setup!==undefined){S={...fresh(),...snap.data()}}else if(S.setup){await store.set(JSON.parse(JSON.stringify(S)))}
      syncMode="account";render()}
  }catch(e){store=null}
}
function save(){
  try{localStorage.setItem("dk-state-v2",JSON.stringify(S))}catch(e){}
  if(!store)return;clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{const body=JSON.parse(JSON.stringify(S));saving=saving.then(()=>store.set(body)).catch(()=>{syncMode="device"})},700);
}
const commit=()=>{save();render()};

/* ---------- collating the syllabus, at any level ---------- */
const boardsOn=()=>S.board==="combined"?["ncert","cambridge","nios"]:S.board==="none"?[]:[S.board];
function dkUnits(subj,lvl){
  if(!S.plus||subj!=="sci"||lvl!==1)return [];
  return DATA.topics.map(t=>({k:"dk|"+t.id,board:"dk",subj:"sci",level:1,book:"DeepKids Plus · Science Level 1",n:t.id,title:t.name,dk:[],topic:t}));
}
function collateAt(subj,lvl){return {board:DATA.items.filter(i=>i.subj===subj&&i.level===lvl&&boardsOn().includes(i.board)),dk:dkUnits(subj,lvl)}}
const collate=subj=>collateAt(subj,S.levels[subj]);
function notesFor(subj,lvl){
  const n=[];boardsOn().forEach(b=>{const x=b==="ncert"?DATA.notes.ncert[subj+"|"+lvl]:DATA.notes[b]?.[subj];if(x)n.push(BOARDS[b]+": "+x)});
  if(S.plus&&subj==="sci"&&lvl!==1)n.push("DeepKids Plus Science for Level "+lvl+" is being written. Level 1 is ready.");
  if(S.plus&&subj!=="sci")n.push("DeepKids Plus "+SUBJ[subj]+" is being written.");
  return n;
}
/* the calendar is driven by DeepKids topics if present, else the first chosen board that has units */
function plannedAt(subj,lvl){const c=collateAt(subj,lvl);if(c.dk.length)return c.dk;for(const b of boardsOn()){const u=c.board.filter(i=>i.board===b);if(u.length)return u}return []}
/* the plan runs from the current level upward, so a child who finishes a level carries straight on */
function plannedUnits(subj){const out=[];for(let l=S.levels[subj];l<=5;l++)out.push(...plannedAt(subj,l));return out}
const everyUnit=()=>S.subjects.flatMap(s=>[1,2,3,4,5].flatMap(l=>{const c=collateAt(s,l);return [...c.dk,...c.board]}));
const unitBy=k=>everyUnit().find(u=>u.k===k);
const st=k=>S.progress[k]?.status||"none";
const done=k=>S.progress[k]?.sessions||0;
const rank={none:0,learning:1,completed:2,mastered:3};
function coverage(u){
  if(u.board!=="dk"&&S.plus&&u.dk.length){const s=u.dk.map(id=>st("dk|"+id));const own=st(u.k);
    if(s.every(x=>rank[x]>=2))return rank[own]>2?own:"completed";if(s.some(x=>x!=="none")||own!=="none")return rank[own]>1?own:"learning";return own}
  return st(u.k);
}
const daysOf=subj=>(S.days[subj]||DEF_DAYS[subj]);
/* hours: Class 3 science chapters carry section-by-section estimates; everything else uses a starting estimate per unit type */
const DEF_UNIT_H={ncert:{math:8,eng:5,hin:4,sci:8},cambridge:{math:30,eng:30,hin:30,sci:20},nios:{math:5,eng:5,hin:5,sci:5}};
const hpdOf=s=>(S.hpd&&S.hpd[s])||DEF_HPD[s];
const estHours=u=>u.c?.x?.hours?u.c.x.hours.reduce((a,h)=>a+h[1],0):u.board==="dk"?u.topic.weeks*2.25:DEF_UNIT_H[u.board][u.subj];
const hoursFor=u=>S.hrs[u.k]??estHours(u);
const spanDays=u=>u.c?.x?.hours?Math.max(...u.c.x.hours.map(h=>h[2])):null;
const sessionsFor=u=>Math.max(1,Math.ceil(hoursFor(u)/hpdOf(u.subj)-1e-9));
function schedule(subj,limitDays=420){
  const q=[];plannedUnits(subj).forEach(u=>{if(rank[coverage(u)]>=2)return;const tot=sessionsFor(u);for(let i=Math.min(done(u.k),tot-1);i<tot;i++)q.push({u,n:i+1,tot})});
  const cur=q.filter(x=>coverage(x.u)==="learning"),rest=q.filter(x=>coverage(x.u)!=="learning");const queue=[...cur,...rest];
  const out=[];const days=daysOf(subj);let d=parse(S.start>today?S.start:today);
  const doneToday=S.log.some(l=>l.date===today&&l.subj===subj);
  for(let k=0;k<limitDays&&queue.length;k++){const s=iso(d);
    if(days.includes(d.getDay())&&!S.skips[s+"|"+subj]&&!(s===today&&doneToday))out.push({date:s,subj,...queue.shift()});
    d.setDate(d.getDate()+1)}
  return out;
}
function logSession(u,kind){
  const p=S.progress[u.k]||{status:"none",sessions:0};p.sessions=(p.sessions||0)+1;if(p.status==="none")p.status="learning";p.updated=today;S.progress[u.k]=p;
  S.log.unshift({date:today,key:u.k,subj:u.subj,title:u.title,kind});S.log=S.log.slice(0,400);
  const exps=u.board==="dk"?(PRESET_EXP[u.n]||[]):(u.c?.x?.sheet&&/\(.*(week|2 weeks)/i.test(u.c.x.sheet[0])?[u.c.x.sheet[0]]:[]);
  exps.forEach(title=>{if(!S.exps.some(e=>e.title===title&&!e.closed))S.exps.push({id:Math.random().toString(36).slice(2,9),title,topic:u.title,start:today,checks:[],closed:false})});
}

const chip=s=>`<span class="chip"><span class="dot st-${s}"></span>${STATUS[s]}</span>`;
const lvlLabel=l=>{const x=DATA.levels[l];return `Level ${l} · Class ${x.cls} · age ${x.age}`};
const chNo=u=>/^\d+$/.test(u.n)?"Ch "+u.n:"";
const fh=h=>(Math.round(h*4)/4).toString().replace(/\.0+$/,"");
const sessCtl=u=>`<div class="row small"><span class="muted">About ${fh(hoursFor(u))} h of work${S.hrs[u.k]!==undefined?"":" (our estimate)"} → ${sessionsFor(u)} days at ${fh(hpdOf(u.subj))} h/day${spanDays(u)?`, with experiments and projects running over about ${spanDays(u)} days`:""}</span><button class="btn quiet mini" data-act="hrs" data-k="${u.k}" data-d="-0.5" aria-label="Less time">−</button><button class="btn quiet mini" data-act="hrs" data-k="${u.k}" data-d="0.5" aria-label="More time">+</button></div>`;
const hoursTable=u=>{const hs=u.c.x.hours,tot=hs.reduce((a,h)=>a+h[1],0);return `<div><b>Time needed</b><div class="tablebox"><table><tr><th>Part</th><th>Hours</th><th>Spread over</th></tr>${hs.map(h=>`<tr><td>${esc(h[0])}</td><td>${fh(h[1])} h</td><td class="small">${h[2]} day${h[2]>1?"s":""}</td></tr>`).join("")}<tr><td><b>Total active time</b></td><td><b>${fh(tot)} h</b></td><td class="small">waiting time (sprouting, drying, logging) runs alongside other work</td></tr></table></div></div>`};

function obNext(){

function dailyUnit(){
  if(!S.subjects.includes("sci"))return null;
  const sc=schedule("sci",60);const t=sc.find(x=>x.date===today&&x.u.c?.x)||sc.find(x=>x.u.c?.x);if(t)return {u:t.u,when:t.date};
  const any=S.log.find(l=>unitBy(l.key)?.c?.x);return any?{u:unitBy(any.key),when:null}:null;
}
const G=()=>(S.games[today]=S.games[today]||{g:[],tf:{},odd:null});
function wordGame(u){
  const x=u.c.x,word=x.words[dayNo%x.words.length],g=G(),rows=[];
  const won=g.g.includes(word),over=won||g.g.length>=6;
  for(let r=0;r<6;r++){const w=g.g[r]||(r===g.g.length&&!over?(g.cur||""):"");
    rows.push(`<div class="wrow">${[0,1,2,3,4].map(i=>{const ch=w[i]||"";let cls="";if(g.g[r]){cls=ch===word[i]?"hit":word.includes(ch)?"near":"miss"}return `<span class="tile ${cls}">${esc(ch)}</span>`}).join("")}</div>`)}
  const keys=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
  return `<div class="panel stack"><div class="row" style="justify-content:space-between"><b>Word of the Day</b><span class="small muted">5 letters · from "${esc(u.title)}"</span></div>
   <div class="wgrid">${rows.join("")}</div>
   ${over?`<p style="margin:0">${won?"Got it!":"Today's word was"} <b>${word}</b>. ${won?`In ${g.g.length} ${g.g.length===1?"try":"tries"}.`:""}</p>`:`<div class="kb">${keys.map((r,i)=>`<div>${i===2?`<button data-act="wk" data-key="ENTER" class="wide">Enter</button>`:""}${[...r].map(c=>`<button data-act="wk" data-key="${c}">${c}</button>`).join("")}${i===2?`<button data-act="wk" data-key="DEL" class="wide" aria-label="Delete">⌫</button>`:""}</div>`).join("")}</div><p class="small muted" style="margin:0">Green: right letter, right place. Yellow: in the word, wrong place.</p>`}</div>`;
}

/* ---------- what to do on day n of a unit ---------- */
const HINT={math:"Use real things for every problem (coins, beans, rotis, a ruler) before writing anything down.",
  eng:"Read aloud together, collect new words in a notebook, and ask your child to retell the story in their own words.",

function detailFor(u,name){const c=u.c,x=c.x,L=s=>`<ul>${s.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;
  if(/^Read/.test(name))return `<p>Read NCERT ${esc(u.book)}, ${chNo(u)} "${esc(u.title)}" together. Let your child read parts aloud. Stop and talk about:</p>${L([x.think[0]])}`;

  if(/^Worksheet/.test(name))return `<ol>${x.ws.map(([h,b])=>`<li><b>${esc(h)}.</b> ${esc(b)}</li>`).join("")}</ol><p class="small muted">Printable version: the Class 3 worksheet pack.</p>`;
  if(/^Experiment/.test(name))return L(c.exp)+`<p class="small muted">Record it on the activity sheet "${esc(x.sheet[0])}".</p>`;
  if(/^Activities/.test(name))return L(c.act);
  if(/^Game/.test(name))return `<p>${esc(c.game[1])}</p>`;
  if(/^Project/.test(name))return `<p>${esc(c.proj[1])}</p><p class="small muted">You end up with: ${esc(c.proj[2])}. It keeps going in Ongoing experiments until you finish it.</p>`;
  return "";}
function dayPlan(u,n,tot){
  const cap=hpdOf(u.subj);
  if(u.c?.x?.hours){ // split the chapter's sections into days of about `cap` hours
    const days=[];let cur=[],left=cap;
    u.c.x.hours.forEach(([name,h])=>{let rem=h,part=1,parts=Math.ceil(h/cap-1e-9);
      while(rem>1e-9){const take=Math.min(rem,left);cur.push({name,take,part,parts:Math.max(parts,rem<h?part:1)});rem-=take;left-=take;part++;
        if(left<1e-9){days.push(cur);cur=[];left=cap}}});
    if(cur.length)days.push(cur);
    const parts={};days.flat().forEach(s=>parts[s.name]=Math.max(parts[s.name]||0,s.part));
    const today=days[Math.min(n,days.length)-1]||[];
    return `<div class="stack">${today.map(s=>`<div class="step"><div class="row" style="justify-content:space-between"><b>${esc(s.name)}${parts[s.name]>1?` (part ${s.part} of ${parts[s.name]})`:""}</b><span class="chip">${fh(s.take*60)} min</span></div>${detailFor(u,s.name)}</div>`).join("")}</div>`}
  if(u.board==="dk"){const t=u.topic,k=t.sub.length;
    if(t.full)return `<p>Follow the full lesson <b>The King's Doubt</b> (cards and parent guide). Today: ${n===1?"the Proclamation, setting your rules, and the first guests":n===tot?"the Nakkeeran challenge, the Sabha verdicts and the treats":"the next investigation cards; check the lotus seeds and crystals"}.</p>`;
    if(n===1)return `<div class="step"><b>Start with the story</b><p>${esc(t.summary)}</p></div><div class="oneness">${esc(t.oneness)}</div>`;
    const i=Math.min(k-1,Math.floor((n-2)*k/Math.max(1,tot-1)));
    return n===tot?`<div class="step"><b>Wrap up</b><p>Ask your child to teach the topic back to you in five minutes. Then talk about:</p><div class="oneness">${esc(t.oneness)}</div></div>`
      :`<div class="step"><b>Explore</b><p>${esc(t.sub[i])}</p><p class="small muted">${esc(HINT.sci)}</p></div>`}
  const where=`${esc(u.book)}${chNo(u)?", "+chNo(u):""}: "${esc(u.title)}"`;
  const steps=n===1?[["Open the chapter",`Read the first part of ${where} together. Ask: what do you think this chapter is about? What do you already know?`],["Try it",HINT[u.subj]]]
    :n===tot?[["Finish and review",`Do the last activities in ${where}.`],["Teach it back","Your child explains the chapter to you in five minutes, as if you were the student."],["Mark it","If it feels solid, mark the chapter Completed in Topics."]]
    :[["Continue the chapter",`Carry on in ${where} from where you stopped. Do its activities and exercises together.`],["Hands-on",HINT[u.subj]],["Note what's hard","Write down anything that needs another go tomorrow."]];
  return `<div class="stack">${steps.map(([h,b])=>`<div class="step"><b>${esc(h)}</b><p>${esc(b)}</p></div>`).join("")}<p class="small muted">A detailed day-by-day lesson for this chapter is being written; for now this is a general plan.</p></div>`;
}

/* ---------- main views ---------- */
function viewToday(){
  let h=`<h2>${new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})}</h2>`;
  const du=dailyUnit();
  if(du){const x=du.u.c.x;h+=`<div class="joke"><span class="small muted">Joke of the day</span><p>${esc(x.jokes[dayNo%x.jokes.length])}</p><span class="small muted">More: <a href="${esc(DATA.jokebook[1])}" target="_blank" rel="noopener">${esc(DATA.jokebook[0])}</a></span></div>`}
  h+=`<div class="stack">`;
  S.subjects.forEach(s=>{
    const did=S.log.filter(l=>l.date===today&&l.subj===s);const next=schedule(s,30)[0];
    if(did.length){h+=`<div class="panel"><div class="small muted">${SUBJ[s]} · done today</div>${did.map(l=>`<div><b>${esc(l.title)}</b> <span class="chip">${l.kind==="free"?"Explored freely":"Planned"}</span></div>`).join("")}</div>`;return}
    if(!next){h+=`<div class="panel"><div class="small muted">${SUBJ[s]}</div><p style="margin:4px 0 0">Nothing to schedule for this syllabus and level yet.</p></div>`;return}
    if(next.date!==today){h+=`<div class="panel"><div class="small muted">${SUBJ[s]} · next on ${fmt(next.date)}</div><b>${esc(next.u.title)}</b></div>`;return}
    const u=next.u,t=u.topic;
    h+=`<div class="panel today stack"><div class="small muted">${SUBJ[s]} · ${esc(u.book)}${chNo(u)?" · "+chNo(u):""} · day ${next.n} of ${next.tot}</div><h3>${esc(u.title)}</h3>
      <details class="dayplan" data-id="plan-${u.k}" open><summary><b>Today's plan</b> <span class="small muted">· about ${fh(hpdOf(s))} h</span></summary>${dayPlan(u,next.n,next.tot)}</details>
      ${t?`<p style="margin:0">${esc(t.summary.split(". ").slice(0,2).join(". "))}.</p><div class="oneness">${esc(t.oneness)}</div>${t.full?`<div><span class="badge">Full lesson and game ready</span> <span class="small muted">The King's Doubt</span></div>`:""}`:""}
      ${u.c?.x?`<p class="small muted" style="margin:0">The whole chapter (what to learn, worksheet, games, project) is below.</p>`:""}
      <div class="row"><button class="btn primary" data-act="did" data-k="${u.k}">We did it</button><button class="btn quiet" data-act="skip" data-s="${s}">Not today</button></div></div>`});
  h+=`<div class="row"><button class="btn" data-act="free">We explored something else</button></div></div>`;
  if(du){h+=`<h2>${du.when===today?"Today's science":"Science up next"}</h2>${learnBlock(du.u)}${sheetsBlock(du.u)}<h2>Daily games</h2><div class="stack">${wordGame(du.u)}${tfGame(du.u)}${oddGame(du.u)}</div>`}
  else if(S.subjects.includes("sci"))h+=`<p class="note" style="margin-top:16px">Daily games, jokes and worksheets are ready for NCERT Science Class 3 so far. Other subjects and levels are next.</p>`;
  const open=S.exps.filter(e=>!e.closed);
  h+=`<h2>Ongoing experiments</h2><div class="panel">${open.length?open.map(e=>{const day=Math.round((parse(today)-parse(e.start))/864e5)+1;const c=e.checks.includes(today);return `<div class="exp"><div><b>${esc(e.title)}</b><div class="small muted">Day ${day} · ${esc(e.topic)}</div></div><div class="row"><button class="btn ${c?"quiet":"primary"}" data-act="check" data-e="${e.id}">${c?"Checked today":"Check now"}</button><button class="btn quiet" data-act="close" data-e="${e.id}">Finish</button></div></div>`}).join(""):`<p class="muted" style="margin:0">Multi-day experiments (sprouting seeds, moon diaries, bury tests) appear here when you start their topic, with a daily reminder until you finish them.</p>`}
    <div class="row" style="margin-top:10px"><input id="newExp" class="btn quiet" style="flex:1;min-width:0;text-align:left;cursor:text" placeholder="Add your own (e.g. plant in a dark box)" maxlength="80"><button class="btn" data-act="addexp">Add</button></div></div>`;
  return h;
}
function levelCtl(s,act){const l=S.levels[s];return `<span class="row"><button class="btn quiet mini" data-act="${act}" data-s="${s}" data-d="-1" ${l<=1?"disabled":""} aria-label="Level down">◀</button><span class="small">${lvlLabel(l)}</span><button class="btn quiet mini" data-act="${act}" data-s="${s}" data-d="1" ${l>=5?"disabled":""} aria-label="Level up">▶</button></span>`}
function viewPlan(){
  const all=S.subjects.flatMap(s=>schedule(s));const byDay={};all.forEach(x=>(byDay[x.date]=byDay[x.date]||[]).push(x));
  const dates=Object.keys(byDay).sort().slice(0,14);
  let h=`<h2>Levels and time</h2><p class="muted" style="margin-top:-4px">Move any subject up when your child is ready; when a level is finished the plan carries on to the next. Set how many hours a day and which days each subject gets, and the whole year re-plans.</p><div class="stack">${S.subjects.map(s=>{const hp=hpdOf(s);return `<div class="panel stack" style="padding:12px"><div class="row" style="justify-content:space-between"><b>${SUBJ[s]}</b>${levelCtl(s,"lvl")}</div><div class="row"><select data-hpd="${s}" aria-label="${SUBJ[s]} hours per day">${[0.25,0.5,0.75,1,1.5,2,3].map(v=>`<option value="${v}" ${hp===v?"selected":""}>${v} h a day</option>`).join("")}</select><div class="seg">${[1,2,3,4,5,6,0].map(d=>`<button aria-pressed="${daysOf(s).includes(d)}" data-act="day" data-s="${s}" data-d="${d}">${DAYN[d]}</button>`).join("")}</div></div></div>`}).join("")}</div>`;
  h+=`<h2>The next two weeks</h2><p class="muted" style="margin-top:-4px">Each chapter's hours are estimated from its content (Class 3 Science section by section; other chapters use a starting estimate). Tap a day to adjust a chapter's hours.</p>`;
  dates.forEach(d=>{h+=`<div class="dayh">${d===today?"Today · ":""}${fmt(d)}</div><div class="week">${byDay[d].map(x=>`<details class="sess-d"><summary class="sess ${d===today?"is-today":""}"><span class="d">${SUBJ[x.subj]}</span><span><b>${esc(x.u.title)}</b> <span class="small muted">· L${x.u.level} ${chNo(x.u)} · ${x.n}/${x.tot}</span></span></summary><div style="padding:6px 12px">${sessCtl(x.u)}</div></details>`).join("")}</div>`});
  h+=`<h2>The year, subject by subject</h2><div class="tablebox"><table><tr><th>Subject</th><th>Now on</th><th>Days</th><th>Hours this level</th><th>Days this level</th><th>Current level done around</th></tr>${S.subjects.map(s=>{const sc=schedule(s);const cur=sc.filter(x=>x.u.level===S.levels[s]);const u=plannedAt(s,S.levels[s])[0];const hrs=plannedAt(s,S.levels[s]).filter(x=>rank[coverage(x)]<2).reduce((a,x)=>a+hoursFor(x),0);return `<tr><td>${SUBJ[s]}</td><td class="small">${u?esc(u.book):"—"}</td><td class="small">${daysOf(s).map(x=>DAYN[x]).join(" ")} · ${fh(hpdOf(s))} h</td><td>${fh(hrs)} h</td><td>${cur.length}</td><td class="small">${cur.length?fmt(cur[cur.length-1].date):"—"}</td></tr>`}).join("")}</table></div>`;
  return h;
}
function dkCard(u){const t=u.topic,s=st(u.k);
  return `<details class="topic" data-id="${u.k}"><summary><span class="tid">${t.id}</span><span class="tname">${esc(t.name)} ${t.full?'<span class="badge">Full lesson</span>':""}</span>${chip(s)}</summary><div class="tbody">
  <div class="seg">${Object.entries(STATUS).map(([k,v])=>`<button aria-pressed="${s===k}" data-act="status" data-k="${u.k}" data-s="${k}">${v}</button>`).join("")}</div>${sessCtl(u)}
  <div><b>Subtopics</b><ul>${t.sub.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  <div><b>The story we tell</b><p style="margin:4px 0 0">${esc(t.summary)}</p></div><div class="oneness">${esc(t.oneness)}</div>
  ${(()=>{const refs=DATA.items.filter(i=>i.dk.includes(t.id)&&boardsOn().includes(i.board));return refs.length?`<div><b>Board chapters this covers</b><ul>${refs.map(r=>`<li>${esc(r.book)}${chNo(r)?", "+chNo(r):""}: ${esc(r.title)}</li>`).join("")}</ul></div>`:""})()}
  ${t.res.length?`<div class="res"><b>Curated resources</b><ul>${t.res.map(r=>`<li><span class="chip">${esc(r.type)}</span> ${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}</li>`).join("")}</ul></div>`:""}
  <div class="row"><button class="btn" data-act="logk" data-k="${u.k}">Log a session today</button></div></div></details>`}
function unitCard(u,cs){const c=u.c;
  return `<details class="topic" data-id="${u.k}" style="border:0;border-bottom:1px solid var(--line);border-radius:0"><summary><span class="tid">${chNo(u)}</span><span class="tname">${esc(u.title)} <span class="badge">${c.x?"Daily games &amp; sheets":"Games &amp; projects"}</span></span>${chip(cs)}</summary><div class="tbody">
  <div class="seg">${Object.entries(STATUS).map(([k,v])=>`<button aria-pressed="${cs===k}" data-act="status" data-k="${u.k}" data-s="${k}">${v}</button>`).join("")}</div>${sessCtl(u)}
  ${c.x?learnBlock(u)+sheetsBlock(u):`<p style="margin:0">${esc(c.covers)}</p>
  <div><b>Game: ${esc(c.game[0])}</b><p style="margin:4px 0 0">${esc(c.game[1])}</p></div>
  <div><b>Experiments</b><ul>${c.exp.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  <div><b>Activities</b><ul>${c.act.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  <div><b>Project: ${esc(c.proj[0])}</b><p style="margin:4px 0 0">${esc(c.proj[1])} <span class="muted">You end up with: ${esc(c.proj[2])}.</span></p></div>
  <div><b>Extra reading</b><ul>${c.read.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
  ${c.links.length?`<div><b>Same topic in other NCERT books</b><ul>${c.links.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}`}
  ${u.dk.length&&S.plus?`<div class="links">Goes deeper in DeepKids Plus: ${u.dk.map(id=>esc(TOP[id].name)).join(" · ")}</div>`:""}
  <div class="row"><button class="btn" data-act="logk" data-k="${u.k}">Log a session today</button></div></div></details>`}
function viewTopics(){
  let h="";
  S.subjects.forEach(s=>{const lv=view[s]||S.levels[s];const c=collateAt(s,lv);
    h+=`<div class="subj-h"><h2>${SUBJ[s]}</h2><div class="seg" role="group" aria-label="Level">${[1,2,3,4,5].map(l=>`<button aria-pressed="${l===lv}" data-act="view" data-s="${s}" data-l="${l}">L${l}${l===S.levels[s]?" ★":""}</button>`).join("")}</div></div>
      <p class="small muted" style="margin:-4px 0 8px">${lvlLabel(lv)}${lv===S.levels[s]?" · current level":` · <button class="btn quiet mini" data-act="setlvl" data-s="${s}" data-l="${lv}">Make this the current level</button>`}</p>`;
    notesFor(s,lv).forEach(n=>h+=`<p class="note">${esc(n)}</p>`);
    if(c.dk.length){const qs=[...new Set(c.dk.map(u=>u.topic.q))];h+=qs.map(q=>`<h3 style="margin:16px 0 8px">${esc(q)}</h3><div class="stack">${c.dk.filter(u=>u.topic.q===q).map(dkCard).join("")}</div>`).join("")}
    const books=[...new Set(c.board.map(u=>u.book))];
    books.forEach(b=>{const us=c.board.filter(u=>u.book===b);const cov=us.filter(u=>rank[coverage(u)]>=2).length;
      h+=`<div class="book" style="margin-top:12px"><h3>${esc(b)} <span class="small muted" style="font-family:var(--body)">${cov}/${us.length} covered</span></h3>${us.map(u=>{const cs=coverage(u);if(u.c)return unitCard(u,cs);return `<details class="topic" data-id="${u.k}" style="border:0;border-bottom:1px solid var(--line);border-radius:0"><summary><span class="tid">${chNo(u)}</span><span class="tname">${esc(u.title)}${u.dk.length&&S.plus?`<div class="links">Plus: ${u.dk.map(id=>esc(TOP[id].name)).join(" · ")}</div>`:""}</span>${chip(cs)}</summary><div class="tbody"><div class="seg">${Object.entries(STATUS).map(([k,v])=>`<button aria-pressed="${cs===k}" data-act="status" data-k="${u.k}" data-s="${k}">${v}</button>`).join("")}</div>${sessCtl(u)}<div class="row"><button class="btn" data-act="logk" data-k="${u.k}">Log a session today</button></div></div></details>`}).join("")}</div>`});
    if(!c.dk.length&&!c.board.length)h+=`<p class="muted">Nothing collected for this combination yet.</p>`;
  });
  return h;
}
function viewProgress(){
  let h=`<h2>${esc(S.child||"Your child")}'s progress</h2><div class="stack">`;
  S.subjects.forEach(s=>{const us=[...collate(s).dk,...collate(s).board];if(!us.length)return;const cnt=k=>us.filter(u=>coverage(u)===k).length;const pct=k=>cnt(k)/us.length*100;
    h+=`<div class="panel"><div class="row" style="justify-content:space-between"><b>${SUBJ[s]} <span class="small muted" style="font-weight:400">L${S.levels[s]}</span></b><span class="small muted">${cnt("completed")+cnt("mastered")} of ${us.length} done · ${cnt("learning")} learning</span></div><div class="bar" style="margin-top:8px"><span class="st-mastered" style="width:${pct("mastered")}%"></span><span class="st-completed" style="width:${pct("completed")}%"></span><span class="st-learning" style="width:${pct("learning")}%"></span></div></div>`});
  h+=`</div>`;
  const bs=boardsOn();if(bs.length){h+=`<h2>Against the boards</h2><div class="stack">${bs.map(b=>{const us=S.subjects.flatMap(s=>collate(s).board.filter(u=>u.board===b));if(!us.length)return"";const c=us.filter(u=>rank[coverage(u)]>=2).length;return `<div class="panel"><div class="row" style="justify-content:space-between"><span>${BOARDS[b]}: ${c} of ${us.length} chapters, strands or themes</span><b>${Math.round(c/us.length*100)}%</b></div><div class="bar" style="margin-top:8px"><span class="st-completed" style="width:${c/us.length*100}%"></span></div></div>`}).join("")}</div>`}
  h+=`<h2>Learning log</h2>${S.log.length?`<div class="tablebox"><table><tr><th>Date</th><th>Subject</th><th>What</th><th>How</th></tr>${S.log.slice(0,25).map(l=>`<tr><td class="small" style="white-space:nowrap">${fmt(l.date)}</td><td class="small">${SUBJ[l.subj]||""}</td><td>${esc(l.title)}</td><td class="small">${l.kind==="free"?"Explored freely":"Planned"}</td></tr>`).join("")}</table></div>`:`<p class="muted">Sessions you log on the Today tab show up here.</p>`}`;
  return h;
}
function render(){
  const m=document.getElementById("main"),tabs=document.getElementById("tabs");
  if(!S.setup&&!ob)ob={step:0,d:JSON.parse(JSON.stringify({child:S.child,age:S.age,board:S.board,plus:S.plus,subjects:S.subjects,levels:S.levels,hpd:S.hpd||DEF_HPD}))};
  tabs.hidden=!!ob;document.getElementById("openSettings").hidden=!!ob;
  document.getElementById("who").textContent=ob?"Let's set up your year":(S.child?S.child+" · ":"")+(S.board==="none"?"DeepKids Plus":S.board==="combined"?"Combined boards":BOARDS[S.board])+(S.plus&&S.board!=="none"?" + Plus":"");
  const open=[...document.querySelectorAll("details[open]")].map(d=>d.dataset.id).filter(Boolean);
  m.replaceChildren(el(ob?viewOnboarding():{today:viewToday,plan:viewPlan,topics:viewTopics,progress:viewProgress}[tab]()));
  open.forEach(id=>{const d=m.querySelector(`details[data-id="${CSS.escape(id)}"]`);if(d)d.open=true});
  tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
}

/* ---------- events ---------- */
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;render();scrollTo(0,0)});
const main=document.getElementById("main");
main.addEventListener("click",e=>{
  if(ob){const d=ob.d;const t=e.target.closest("[data-ob],button[data-age],button[data-b],button[data-s]");if(!t)return;
    if(t.dataset.ob==="next")return obNext();if(t.dataset.ob==="back"){ob.step--;return render()}
    if(t.dataset.age){d.child=document.getElementById("obName").value;d.age=+t.dataset.age}
    if(t.dataset.b){d.board=t.dataset.b;if(d.board==="none")d.plus=true}
    if(t.dataset.s&&t.classList.contains("choice")){const s=t.dataset.s;d.subjects=d.subjects.includes(s)?d.subjects.filter(x=>x!==s):[...d.subjects,s].sort((a,b)=>SUBJ_KEYS.indexOf(a)-SUBJ_KEYS.indexOf(b))}
    return render()}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="did"||a==="logk"){const u=unitBy(b.dataset.k);if(u){logSession(u,a==="did"?"plan":"free");commit()}}
  else if(a==="skip"){S.skips[today+"|"+b.dataset.s]=true;commit()}
  else if(a==="free")openPicker();
  else if(a==="status"){const p=S.progress[b.dataset.k]||{sessions:0};p.status=b.dataset.s;p.updated=today;S.progress[b.dataset.k]=p;commit()}
  else if(a==="hrs"){const u=unitBy(b.dataset.k);if(u){S.hrs[u.k]=Math.max(0.5,hoursFor(u)+(+b.dataset.d));commit()}}
  else if(a==="day"){const s=b.dataset.s,d=+b.dataset.d;const cur=new Set(daysOf(s));cur.has(d)?cur.delete(d):cur.add(d);if(cur.size){S.days={...S.days,[s]:[...cur].sort()};commit()}}
  else if(a==="lvl"){const s=b.dataset.s;S.levels[s]=Math.min(5,Math.max(1,S.levels[s]+(+b.dataset.d)));view[s]=S.levels[s];commit()}
  else if(a==="view"){view[b.dataset.s]=+b.dataset.l;render()}
  else if(a==="setlvl"){S.levels[b.dataset.s]=+b.dataset.l;commit()}
  else if(a==="check"){const x=S.exps.find(x=>x.id===b.dataset.e);if(x&&!x.checks.includes(today)){x.checks.push(today);commit()}}
  else if(a==="close"){const x=S.exps.find(x=>x.id===b.dataset.e);if(x){x.closed=true;x.end=today;commit()}}
  else if(a==="addexp"){const v=document.getElementById("newExp").value.trim();if(v){S.exps.push({id:Math.random().toString(36).slice(2,9),title:v,topic:"Own experiment",start:today,checks:[],closed:false});commit()}}
  else if(a==="wk"){const du=dailyUnit();if(!du)return;const x=du.u.c.x,word=x.words[dayNo%x.words.length],g=G();g.cur=g.cur||"";const k=b.dataset.key;
    if(g.g.includes(word)||g.g.length>=6)return;
    if(k==="DEL")g.cur=g.cur.slice(0,-1);else if(k==="ENTER"){if(g.cur.length===5){g.g.push(g.cur);g.cur="";save()}}else if(g.cur.length<5)g.cur+=k;render()}
  else if(a==="tf"){G().tf[b.dataset.i]=+b.dataset.v;commit()}
  else if(a==="odd"){const g=G();if(!g.odd){g.odd=b.dataset.w;commit()}}
});
main.addEventListener("change",e=>{
  if(e.target.matches("select[data-hpd]")){const s=e.target.dataset.hpd,v=+e.target.value;if(ob){ob.d.hpd={...(ob.d.hpd||DEF_HPD),[s]:v}}else{S.hpd={...(S.hpd||DEF_HPD),[s]:v};commit()}return}
  if(ob&&e.target.matches("#obPlus")){ob.d.plus=e.target.checked;return}
  if(ob&&e.target.matches("select[data-s]")){ob.d.levels[e.target.dataset.s]=+e.target.value;return}
});
const pick=document.getElementById("pick");
function openPicker(){const us=everyUnit();document.getElementById("pickList").replaceChildren(el(us.map(u=>`<button data-k="${u.k}"><span class="tid">${SUBJ[u.subj]} L${u.level}</span> ${esc(u.title)}</button>`).join("")));pick.showModal()}
document.getElementById("pickList").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const u=unitBy(b.dataset.k);if(u){logSession(u,"free");pick.close();commit()}});
document.getElementById("pickClose").onclick=()=>pick.close();
const dlg=document.getElementById("settings");
document.getElementById("openSettings").onclick=()=>{sName.value=S.child;sStart.value=S.start;
  syncNote.textContent=syncMode==="account"?"Progress is saved privately to your claude.ai account.":"Progress is saved in this browser only.";dlg.showModal()};
setForm.addEventListener("submit",e=>{S.child=sName.value.trim();if(sStart.value)S.start=sStart.value;
  if(e.submitter&&e.submitter.value==="redo"){save();startOnboarding(1)}else commit()});
boot();
</script>
