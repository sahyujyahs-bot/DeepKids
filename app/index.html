ly tree and a recorded elder interview.","A shoebox museum the child presents to the family"],"read":["Grandma's Bag of Stories, Sudha Murty","The Family Book, Todd Parr"],"links":["Santoor Ch 3: Best Friends","Veena Ch 7: मित्र को पत्र","Maths Mela Ch 4: Vacation with My Nani Maa"],"x":{"learn":["Families come in many shapes: joint, nuclear, single-parent, adoptive, grandparents raising children. None is the 'real' one.","Indian languages name relatives precisely (mama, chacha, fufa, mausa) where English says only 'uncle'. Language shows what a culture pays attention to.","Families share work. Who does which job at home is a choice, not a law of nature.","Friends are the family we choose. Scientists have recorded long friendships in chimpanzees, dolphins and horses too.","Elephant herds are led by the oldest female; her memory of water holes helps the whole herd survive dry years."],"think":["Is a family made by blood, by living together, or by love? Can it be all three, or none?","Why might Hindi need four words where English needs one? What does English have many words for?","Contrary view: some people say only humans truly have friends. What would you need to see to believe an animal has a friend?"],"oneness":"Vasudhaiva Kutumbakam: the world is one family. If you trace any family tree back far enough, who is not your relative?","jokes":["Why are families like fudge? Mostly sweet, with a few nuts!","Why did the baby strawberry cry? Its mom and dad were in a jam!","Why did Nani bring a ladder to the party? She heard the drinks were on the house!"],"words":["UNCLE","NIECE","TWINS","CHILD","ELDER"],"quiz":[["Every family has a mother, a father and children.",false,"Families come in many forms; all of them are real families."],["In elephant herds, the oldest female usually leads.",true,"The matriarch remembers routes and water holes."],["In Hindi, your mother's brother is your mama.",true,"Your father's brother is chacha."],["English has as many words for relatives as Hindi.",false,"English uses 'uncle' and 'aunt' for many different relatives."]],"odd":[[["Mama","Chacha","Mausi","Fufa"],"Mausi","Mausi is a woman's relation; the others are men."],[["Nani","Dadi","Bhaiya","Nana"],"Bhaiya","Bhaiya is your own generation; the others are grandparents."]],"ws":[["My family tree","Draw three generations. Write each name and what you call them in two languages."],["Relation riddles","My father's sister is my ____. My mother's sister is my ____. My father's brother's son is my ____. My mother's mother is my ____."],["Then and now","Ask a grandparent: their favourite game, food, toy and school subject at your age. Fill in yours beside theirs."],["Think","Draw an animal family that lives together. Who leads it? Who looks after the babies?"]],"sheet":["Chore Wheel Week",["Job","Who did it","Mon","Tue","Wed","Thu","Fri","Sat","Sun"],6],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiment: hand-span survey",0.5,1],["Activities: elder interview, chore wheel",1.5,7],["Game: Relation Railway",0.5,1],["Project: Family Museum Box",3,14]],"cur":[["Great Questions to Ask Grandparents","StoryCorps","https://archive.storycorps.org/question-lists/great-questions-to-ask-grandparents/","Use for the elder interview; record it on a phone for the Family Museum Box."],["'A Sick Day for Amos McGee' discussion guide: can an animal be a friend?","Prindle Institute, Teaching Children Philosophy","https://www.prindleinstitute.org/?p=2581","A philosophy circle after reading: friendship across species and what makes someone family."]]}}},{"k":"ncert|sci|3|2","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"2","title":"Going to the Mela","dk":["B2"],"c":{"covers":"Village fairs: stalls, crafts, toys and rides, buying and selling, crowds and staying safe.","game":["Mela Market","You each run a stall (bangles, chaat, toys) with ₹100 in play coins. Draw customer cards with wishes and budgets; sell, give exact change, restock. Surprise cards: 'Lost at the mela: what do you do?' (answer well to earn a coin). First to ₹150 wins."],"exp":["Firki lab: make paper pinwheels with 4, 6 and 8 blades. Which spins fastest in front of a fan? Does blade size matter?","Lattu test: spin a top on floor, steel plate and carpet. Time each spin. What slows it down?"],"act":["Draw a map of a mela (real or remembered) with stalls, entry, rides and a 'meeting point if lost'.","Make a traditional toy: a dugdugi (pellet drum) from a paper cup or a chakri."],"proj":["Our Mini Mela","Plan and run a small mela for family or neighbours: 3 stalls, handmade toys, price list, a money log, and a lost-and-found rule.","A real event, plus a chart of what sold and what was earned"],"read":["StoryWeaver (Pratham Books): search 'mela' for free picture books"],"links":["Maths Mela Ch 14: The Surajkund Fair","Maths Mela Ch 12: Give and Take"],"x":{"learn":["Melas are where people trade, make music, sell crafts and meet. Many happen after harvests, when people have time and money.","Famous melas: Pushkar (camels), Sonepur (cattle), Surajkund (crafts from across India), the Kumbh (one of the largest gatherings of people on Earth).","Buying and selling: prices, change, bargaining, and why a fair price must be fair to both sides.","Rides and toys work by science: a spinning ride presses you outward, a firki needs moving air, a dugdugi makes sound by beads striking a skin.","Crowd safety: agree a meeting point, know your family's phone number, go to the help desk if lost."],"think":["Is bargaining fair? Fair to whom: the buyer, the seller, the artisan who made it?","Why do so many melas happen just after harvest?","Contrary view: some say malls have replaced melas. What does a mela give people that a mall can't, and what does a mall give that a mela can't?"],"oneness":"Thousands of people at a mela move like one great being, then scatter and come back next year. Is a mela a kind of living thing?","jokes":["What did the giant wheel say to the child? Don't worry, I'll come around again!","Why did the balloon go to the mela? To get blown away!","Why was the maths book sad at the ticket counter? Too many problems!"],"words":["STALL","RIDES","CROWD","MONEY","FLUTE"],"quiz":[["The Surajkund mela in Haryana is famous for crafts.",true,"Artisans come from all over India and other countries."],["A pinwheel spins only when air moves.",true,"Moving air pushes on its blades."],["The Pushkar fair is famous for its camels.",true,"It is one of the world's largest camel fairs."],["If you get lost at a mela, you should walk away alone to search.",false,"Stay where you are or go to the help desk."]],"odd":[[["Firki","Dugdugi","Kite","Television"],"Television","The others are traditional mela toys you can make by hand."]],"ws":[["₹100 at the mela","Choose 4 things to buy from the price list (balloon ₹15, chaat ₹30, bangles ₹40, firki ₹10, ride ₹25). Add them up. How much change do you get?"],["Mela map","Draw a mela with 6 stalls, a ride, the entrance and a 'meet here if lost' spot."],["How does it work?","Draw a firki and arrows to show where the air pushes it."],["Think","Write one thing that makes a price fair to the buyer and one that makes it fair to the maker."]],"sheet":["Firki Lab",["Firki","Number of blades","Blade size","Spins in 10 seconds (fan)","My guess why"],4],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: pinwheel lab, top test",1,1],["Activities: mela map, make a toy",1.5,2],["Game: Mela Market",0.75,1],["Project: Our Mini Mela",4,10]],"cur":[["Toys from Trash: hundreds of free, copyright-free toy designs (pencil fan, paper toys, sound toys)","Arvind Gupta","https://www.arvindguptatoys.com","Pick 3 toys to make and sell at the Mini Mela stall."]]}}},{"k":"ncert|sci|3|3","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"3","title":"Celebrating Festivals","dk":["B2","B5"],"c":{"covers":"Festivals across India, why they happen when they do (harvests, seasons, the Moon), foods, lights, sharing and celebrating together.","game":["Festival Calendar Race","A circle of 12 months on the floor. Draw festival cards (Pongal, Bihu, Onam, Eid, Diwali, Christmas, Baisakhi, Holi, Durga Puja, Gurpurab, Phooldei…). Place each in its month and say why it falls then: harvest, season or Moon. Correct month 1 point, correct reason 2 points, naming the Moon's phase that night 3 points."],"exp":["Haldi magic: paint with haldi paste, then dab soap water on it. Why does yellow turn red? (Haldi is a natural indicator.)","Diya and jar: which burns longer, a diya under a small glass or under a big jar? (Adult lights it.)"],"act":["Festival food map of India: one dish per festival, pinned on a map.","Mark the next 3 months' full and new moons and find which festivals land on them."],"proj":["A Festival of Our Own","Design a new family festival for this season: what it celebrates, food, decorations, a song, an invitation. Host it.","A celebration, an invitation card and photos"],"read":["Binny's Diwali, Thrity Umrigar","Lights for Gita, Rachna Gilmore","Amma, Tell Me About Diwali!, Bhakti Mathur"],"links":["Veena Ch 9: प्रकृति पर्व – फूलदेई","Maths Mela Ch 7: Raksha Bandhan","Santoor Ch 11: Chanda Mama Counts the Stars"],"x":{"learn":["Many festivals mark seasons and harvests: Pongal, Bihu, Lohri and Makar Sankranti fall around mid-January as winter ends; Baisakhi and Onam celebrate harvests.","Many festivals follow the Moon: Holi and Guru Purnima are on full moons, Diwali on the new moon of Kartik, and Eid begins when the new crescent moon is seen.","Lunar calendars make festival dates move each year; Christmas follows the solar calendar and stays on 25 December.","The same idea travels under different names across India; Phooldei in Uttarakhand welcomes spring with flowers on doorsteps.","Festivals are about sharing: food, light, music, gifts, and remembering the people and nature that keep us alive."],"think":["Why does Diwali's date change every year but Christmas doesn't?","Birds sing more in spring and frogs call in the monsoon. Are those animals' festivals?","Two sides: firecrackers bring joy, but they also pollute the air and frighten animals. What would a festival that keeps the joy look like?"],"oneness":"So many festivals thank the Sun, the Moon, the rain and the harvest. Is a festival people saying thank you to the rest of the universe?","jokes":["Why did the diya go to school? To become a little brighter!","What did one firecracker say to the other? My pop is bigger than yours!","Why are kites never lonely at Sankranti? The whole sky is full of friends!"],"words":["LIGHT","SWEET","FEAST","DRUMS","LUNAR"],"quiz":[["Holi is celebrated on a full-moon day.",true,"It falls on the full moon of Phalguna."],["Eid begins when the new crescent moon is seen.",true,"That is why the date can differ by a day between places."],["Diwali falls on the same date every year.",false,"It follows the Moon, so its date moves."],["Pongal, Bihu and Lohri are linked to harvests and winter's end.",true,"They fall around mid-January."]],"odd":[[["Holi","Guru Purnima","Buddha Purnima","Diwali"],"Diwali","Diwali is on a new moon; the others are on full moons."]],"ws":[["Festival circle","Draw a circle of 12 months. Write 6 festivals in their months and why each happens then."],["Moon match","Draw a full moon and a new moon. Write one festival under each."],["Design a festival","Invent a festival for this season: what it celebrates, food, decoration and a song."],["Two sides","Firecrackers: write one reason people love them and one reason to rethink them."]],"sheet":["Moon Diary (2 weeks)",["Date","Time","Draw the Moon","Any festival near?"],14],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: haldi indicator, diya jar",0.75,1],["Activities: festival food map, moon calendar",1.5,14],["Game: Festival Calendar Race",0.5,1],["Project: A Festival of Our Own",3,7]],"cur":[["Moon Phases lesson (ball and lamp in a dark room)","NASA JPL Education","https://www.jpl.nasa.gov/edu/teach/activity/moon-phases/","Model why Holi falls on a full moon and Diwali on a new moon."],["Cookie moon phases","NASA Space Place (via library and museum adaptations)","https://spaceplace.nasa.gov","Scrape biscuit cream to make each phase; eat the new moon."]]}}},{"k":"ncert|sci|3|4","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"4","title":"Getting to Know Plants","dk":["A5"],"c":{"covers":"Kinds of plants (trees, shrubs, herbs, climbers), parts and their jobs, leaf shapes, seeds, what plants need, how we use plants.","game":["Leaf Detective Bingo","Bingo cards show leaf shapes, edges and vein patterns (heart, needle, toothed, compound, parallel veins). On a 20-minute walk, mark a square only when you hold a matching leaf. First line shouts 'Leaf!'. Final round: 'Which part do we eat?' speed quiz with carrot, potato, spinach, cauliflower, rice."],"exp":["Coloured-water flower: put a white flower or celery stalk in water with food colour. Check after 6 and 24 hours. How did the colour climb?","Seeds' needs: sow moong in four cups (water + light, no water, dark, cold fridge). Compare after 5 days."],"act":["Leaf-rubbing book: 10 leaves, crayon rubbings, names in two languages.","Adopt a tree: measure its trunk with string, sketch it, visit monthly."],"proj":["Kitchen-Garden Pot","Sow methi or dhaniya, water and measure daily, harvest at about 4 weeks, and cook something with it.","A harvest, a growth chart and a dish"],"read":["From Seed to Plant, Gail Gibbons","The Tiny Seed, Eric Carle","A Seed Is Sleepy, Dianna Hutts Aston"],"links":["Veena Ch 5: आम का पेड़","Veena Ch 13: पेड़ों की अम्मा 'तिमक्का'","Santoor Ch 4: Out in the Garden"],"x":{"learn":["Plants come as trees, shrubs, herbs, climbers and creepers.","Each part has a job: roots hold and drink, the stem carries water up and food down, leaves make food from sunlight, flowers make seeds, seeds start new plants.","Leaves differ: net veins (mango) vs parallel veins (grass, banana); simple vs compound leaves.","Roots differ: one main taproot (carrot, mustard) vs a bunch of thin fibrous roots (grass, rice). A potato is a stem, not a root.","Saalumarada Thimmakka of Karnataka planted and cared for hundreds of banyan trees along a road, treating them as her children."],"think":["Do plants move? Think of a sunflower, a climbing vine, roots finding water, the touch-me-not.","Is a tree one living thing or a whole city of living things?","Scientists disagree: some say trees 'talk' and share food through fungus networks under the soil (the 'wood wide web'); others say the evidence is weaker than the stories. How could you find out?"],"oneness":"You breathe out what the tree breathes in, and the tree breathes out what you breathe in. Are you and the tree breathing each other?","jokes":["Why was the tree so good at school? It was rooted in its studies!","What did the big flower say to the little flower? Hey, bud!","Why do trees hate tests? They get stumped!"],"words":["ROOTS","STEMS","SEEDS","PETAL","SHOOT"],"quiz":[["A potato is a stem.",true,"It has 'eyes' (buds) that sprout, like a stem."],["A carrot is a root.",true,"It's a taproot that stores food."],["Leaves make food using sunlight.",true,"This is photosynthesis."],["All plants have flowers.",false,"Ferns and mosses never flower."]],"odd":[[["Carrot","Radish","Beetroot","Potato"],"Potato","A potato is a stem; the others are roots."],[["Mango","Neem","Tulsi","Peepal"],"Tulsi","Tulsi is a small herb; the others are trees."]],"ws":[["Label me","Draw a plant and label root, stem, leaf, flower, fruit, seed. Write each part's job."],["Which part do we eat?","Sort: carrot, potato, spinach, cauliflower, rice, mango, ginger, sugarcane."],["Leaf hunt","Find 5 leaves. For each: shape, edge (smooth or toothed), veins (net or parallel)."],["Think","Write one way a plant moves. How could you film it to prove it?"]],"sheet":["Coloured-Water Flower",["Time","What colour is the flower?","How far has the colour climbed?","My drawing"],4],"hours":[["Read & discuss the NCERT chapter",2,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: coloured-water flower, seeds' needs",1,5],["Activities: leaf-rubbing book, adopt a tree",1.5,30],["Game: Leaf Detective Bingo",0.75,1],["Project: Kitchen-Garden Pot",2.5,28]],"cur":[["Journey to the Center of a Seed (bean dissection)","KidsGardening","https://kidsgardening.org/lesson-plans-journey-to-the-center-of-a-seed/","Soak rajma overnight, split it, find the baby plant and its food store with a magnifier."]]}}},{"k":"ncert|sci|3|5","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"5","title":"Plants and Animals Live Together","dk":["A5","B4","B9"],"c":{"covers":"Homes and habitats, how plants and animals depend on each other: food, shelter, pollination and seed spreading.","game":["Web of Life","Lay 12 living-thing cards on a table (neem tree, bee, myna, earthworm, cow, grass, frog, snake, child…). Take turns joining two with a string and saying how one depends on the other. Then draw a 'Gone!' card: remove that being and every string tied to it. Who is left standing? Rebuild with a rescue plan."],"exp":["Seed hitchhikers: wear old socks over shoes and walk through grass, then 'plant' the sock in a tray of soil and water it. What grows?","Be a bee: dab a cotton bud in one flower and touch another. Look with a magnifier at the pollen."],"act":["Minibeast hunt under a flowerpot or stone (put everything back).","Bird-feeder log: who visits, when, what do they eat?"],"proj":["Wildlife-Friendly Corner","Set up a water bowl, a feeder, a flowering plant and a bamboo 'insect hotel' on a balcony or garden; keep a 3-week visitor log.","A working mini habitat and a visitor chart"],"read":["Over and Under the Pond, Kate Messner","Up in the Garden and Down in the Dirt, Kate Messner","What Do You Do With a Tail Like This?, Steve Jenkins & Robin Page"],"links":["Veena Ch 4: बया हमारी चिड़िया रानी!","Veena Ch 2: चींटी","Veena Ch 3: कितने पैर?","Santoor Ch 2: Badal and Moti"],"x":{"learn":["A habitat gives food, water and shelter. Trees, ponds and even cracks in walls are habitats.","Plants and animals depend on each other: bees and bats carry pollen, birds and animals spread seeds, earthworms enrich soil, plants feed and shelter animals.","Food chains: grass is eaten by a deer, a deer by a tiger. Decomposers (fungi, worms, bacteria) return everything to the soil.","The baya weaver: the male weaves a hanging nest of grass; the female inspects it and chooses.","Remove one living thing and others feel it; that's why forests with many kinds of life recover better."],"think":["Who needs whom more: the bee or the flower?","If all mosquitoes vanished, would that be good? Some scientists think little would change; others say fish, birds and bats would lose food. What do you think?","Is a weed bad? Who decides which plant is a weed?"],"oneness":"A tree feeds the bird, the bird spreads the tree's seeds, the worm feeds the tree. If each needs the others, is a forest one big living being?","jokes":["Why don't ants get sick? They have tiny anty-bodies!","Why did the bee get married? It found its honey!","What did the tree say to the woodpecker? Leaf me alone!"],"words":["BIRDS","NESTS","HONEY","SNAKE","PLANT"],"quiz":[["The male baya weaver builds the nest.",true,"The female chooses which nest she likes."],["Bats can pollinate flowers.",true,"Some flowers, like those of the banana family and baobab, are pollinated by bats."],["Earthworms make soil better for plants.",true,"Their tunnels let in air and their waste is rich food for plants."],["Animals never help plants.",false,"They pollinate, spread seeds and enrich soil."]],"odd":[[["Bee","Butterfly","Bat","Stone"],"Stone","Bees, butterflies and bats can all carry pollen."]],"ws":[["Who needs whom?","Draw 6 living things and connect them with arrows. Write on each arrow what is given."],["Food chain","Fill in: ____ → caterpillar → ____ → snake → ____."],["Habitat match","Match: frog, baya, earthworm, monkey, fish → pond, tree, soil, river, palm tree."],["Think","Write the story of a weed, told by the weed."]],"sheet":["Minibeast Hunt",["Where I looked","What I found","How many","What it was doing","Drawing"],6],"hours":[["Read & discuss the NCERT chapter",2,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: seed hitchhikers, be a bee",1,10],["Activities: minibeast hunt, bird-feeder log",1.5,14],["Game: Web of Life",0.5,1],["Project: Wildlife-Friendly Corner",3,21]],"cur":[["Web of Life (yarn food-web game)","Project Learning Tree","https://www.plt.org/family-activity/web-of-life/","Play with Indian species cards; cut one strand and see who is affected."],["Oh Deer! (habitat and limiting-factors running game)","Project WILD","https://outdoornebraska.gov/wp-content/uploads/2023/03/Oh-Deer.pdf","Best with siblings or a homeschool group: players become deer and food, water or shelter."],["'Hey, Little Ant' discussion guide","Prindle Institute","https://scholarship.depauw.edu/prindle_teaching/83","Should the boy squish the ant? A philosophy circle on how we treat small lives."]]}}},{"k":"ncert|sci|3|6","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"6","title":"Living in Harmony","dk":["B9","C4"],"c":{"covers":"Living peacefully with people and nature: sharing, solving quarrels, caring for animals and surroundings.","game":["Harmony Village","A cooperative game: you both win or lose together. Each round flip a Trouble card (the pond is dirty, friends are quarrelling, a stray dog is hungry, a tree will be cut). Spend your action tokens on fixes and explain your fix to earn a bonus. Keep the Harmony meter above zero for 10 rounds to win."],"exp":["Noise map: rate the noise in 6 places (kitchen, road, park, temple, bedroom at night) from 1 to 5, or use a phone sound meter. Where do birds sing most?"],"act":["Quarrel-fix role play: act out three common fights and try three ways to solve each.","Ask neighbours how they share water, parking or a park. Draw what you learn."],"proj":["Harmony Pact","Family and child pick one action for 2 weeks (water bowls for street animals, a peace corner, a sharing shelf) and keep a log.","A pact poster and a 2-week log"],"read":["The Curious Garden, Peter Brown","Wangari's Trees of Peace, Jeanette Winter","Have You Filled a Bucket Today?, Carol McCloud"],"links":["Veena Ch 18: हम अनेक किंतु एक","Veena Ch 12: अपना-अपना काम","Santoor Ch 8: Thank God"],"x":{"learn":["Living in harmony means sharing space and resources fairly with people and with nature.","Disagreeing is normal. Listening, taking turns and finding a fix both sides accept is a skill you can practise.","When forests shrink, animals come into towns and farms (monkeys, elephants, leopards). It isn't only the animals' fault.","People have found clever ways to share: beehive fences keep elephants out of farms because elephants avoid bees.","The Bishnoi community and the Chipko movement protected trees with their own bodies."],"think":["When a monkey snatches food in a town, who is the real problem: the monkey, or the people who took its forest?","Is it always good to agree? Can disagreeing kindly lead to better ideas?","Contrary view: people often say nature is 'in balance'. Many ecologists say nature is always changing, never perfectly balanced. Which seems true where you live?"],"oneness":"If you dirty the river, the river comes back to you as water. Can you hurt nature without hurting yourself?","jokes":["Why did the two trees stop arguing? They agreed to leaf it!","What do you call a peaceful dinosaur? A calm-asaurus!","Why do bees hum? They forgot the words!"],"words":["PEACE","SHARE","TRUST","SMILE","UNITY"],"quiz":[["Beehive fences can keep elephants away from farms.",true,"Elephants avoid bees."],["The Chipko movement was about hugging trees to stop them being cut.",true,"It began in the hills of Uttarakhand in the 1970s."],["Living in harmony means never disagreeing.",false,"It means disagreeing kindly and finding fair fixes."],["Animals come into towns only because they are naughty.",false,"Often their homes and food have been taken."]],"odd":[[["Share","Listen","Shout","Help"],"Shout","The other three help people get along."]],"ws":[["Fix-it comic","Draw a 4-box comic: a quarrel, two feelings, a fix, a happy end."],["Swap the story","Tell the story of a monkey stealing a banana, from the monkey's side."],["Our home rule","Write one rule for your home that is good for people AND animals."],["Think","Is nature in balance, or always changing? Give one example you have seen."]],"sheet":["Harmony Pact Log (2 weeks)",["Day","What we did","Who it helped","How it felt"],14],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1.5,2],["Worksheet",0.5,1],["Experiment: noise map",0.75,1],["Activities: quarrel-fix role play, neighbour interviews",1.5,3],["Game: Harmony Village",0.75,1],["Project: Harmony Pact",2,14]],"cur":[["'This Moose Belongs to Me' discussion guide: can anyone own an animal or a piece of nature?","Prindle Institute","https://scholarship.depauw.edu/prindle_teaching/246","A philosophy circle on ownership and fairness with nature."],["'The Lion and the Little Red Bird' discussion guide","Prindle Institute","https://www.prindleinstitute.org/books/the-lion-and-the-little-red-bird/","What makes a friendship: sharing, or getting something back?"]]}}},{"k":"ncert|sci|3|7","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"7","title":"Water – A Precious Gift","dk":["B8","A4"],"c":{"covers":"Where water comes from, how we use it, clean and dirty water, saving water, traditional ways of storing rainwater.","game":["Drop Detective","Each player starts the day with 50 water-drop tokens. Draw activity cards (brushing with the tap running −6, mug bath −15, shower −40, washing a car with a pipe −60) and choose the wiser way where you can. Leak cards hit everyone. The player with the most drops at bedtime wins."],"exp":["Bottle filter: layer gravel, sand, charcoal and cotton in a cut bottle and pour muddy water through. Clearer, but is it safe to drink? (No, it still needs boiling.)","Sun vs shade: equal water in two plates. Which dries first, and where did the water go?"],"act":["Home water audit: count mugs and buckets used in one day.","Find out how a stepwell, lake or tank near you stored water."],"proj":["Rain Catcher","Make a rain gauge and a rain-collecting container; record rainfall and use the water for plants.","A working gauge, a collector and a rainfall chart"],"read":["The Water Princess, Susan Verde","Water Is Water, Miranda Paul","A Drop Around the World, Barbara McKinney"],"links":["Santoor Ch 6: Paper Boats","Maths Mela Ch 11: Filling and Lifting"],"x":{"learn":["Water comes from rain, rivers, lakes, glaciers and under the ground (groundwater, reached by wells and borewells).","Most of Earth's water is salty sea water. Only about 3 in every 100 drops is fresh, and most of that is frozen; very little is easy for us to use.","The water cycle: the sun heats water, vapour rises, cools into clouds, falls as rain, flows back to rivers and seas.","Dirty water spreads diseases; boiling, filtering and clean storage make water safer.","India's traditional water-keepers: stepwells (baolis), johads, kunds and temple tanks stored rain for dry months."],"think":["Who owns the rain that falls on your roof? Who owns a river?","If Earth is covered in water, why do cities run short?","Contrary view: is bottled water always safer than tap water? (Not always, and the bottles make plastic waste.) How could a family decide?"],"oneness":"The water in your body was once a cloud, a river, maybe a dinosaur's drink. Are you a small walking river?","jokes":["What did the ocean say to the beach? Nothing, it just waved!","How do you save water? In a piggy bucket!","Why did the cloud go to school? To learn how to rain on parade!"],"words":["WATER","RIVER","CLOUD","OCEAN","RAINY"],"quiz":[["Most of Earth's water is salty.",true,"About 97 of every 100 drops are in the seas."],["Groundwater is water stored under the ground.",true,"Wells and borewells reach it."],["Muddy water that looks clear after filtering is always safe to drink.",false,"Germs can still be there; boil it."],["Stepwells were built to store water for dry months.",true,"Many are hundreds of years old."]],"odd":[[["River","Lake","Well","Desert"],"Desert","The others hold water."]],"ws":[["Water cycle","Draw the sun, sea, cloud, rain, river and arrows. Label evaporation and rain."],["Water in my day","Count how many mugs you use for brushing, bathing and drinking."],["Save-water ideas","Write 3 ways your family could use less water."],["Think","Who owns the rain? Write what you think and why."]],"sheet":["Home Water Audit",["Activity","Mugs or buckets used","Could we use less? How?"],8],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: bottle filter, sun vs shade",1,2],["Activities: home water audit, local water history",1.5,3],["Game: Drop Detective",0.5,1],["Project: Rain Catcher",2.5,21]],"cur":[["The Incredible Journey (water-cycle dice game with stations)","Project WET","https://serc.carleton.edu/sp/mnstep/activities/27279.html","Set up 9 stations around the house (cloud, river, groundwater, plant, animal…); roll to travel as a water drop and thread a bead at each stop."],["The Diminishing Apple (how little of Earth's water we can use)","NSTA, Science and Children","https://www.nsta.org/science-and-children/science-and-children-february-2002/diminishing-apple","Cut an apple to show salty seas, ice and the tiny sliver of usable fresh water."]]}}},{"k":"ncert|sci|3|8","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"8","title":"Food We Eat","dk":["C11"],"c":{"covers":"Where food comes from, foods of different regions, cooking, sharing meals, eating well.","game":["Thali Builder","Food cards carry energy, body-building and protective icons. Race to build a balanced thali from your hand; then a twist card asks for a Kerala, Punjabi or Bengali thali using only local foods. Opponent can challenge a card's region."],"exp":["Starch test: a drop of iodine (Betadine) on potato, rice, bread and cucumber. Which turn blue-black? (Adult; don't eat after.)","Sprouting chana: weigh 50 g, soak and sprout for 2 days, weigh again. Why heavier?"],"act":["Food-origin trail: pick 5 foods at dinner and trace each back to a farm, a tree or an animal.","Cook a grandparent's recipe together and write it down."],"proj":["Our Family Cookbook","Collect 5 recipes from relatives with where each comes from, photos, and one dish the child cooks.","A handmade or printed recipe booklet"],"read":["Gregory, the Terrible Eater, Mitchell Sharmat","Eating the Alphabet, Lois Ehlert"],"links":["Santoor Ch 7: The Big Laddoo","Veena Ch 6: बीरबल की खिचड़ी","Veena Ch 14: किसान की होशियारी","Maths Mela Ch 10: Fun at Class Party!"],"x":{"learn":["Food comes from plants (grains, pulses, vegetables, fruits, spices) and animals (milk, eggs, fish, meat).","Each region eats what grows nearby: coconut and rice in Kerala, wheat in Punjab, fish in Bengal, millets in dry lands.","Millets (ragi, bajra, jowar) grow with little water and are very nutritious; 2023 was the International Year of Millets.","Cooking changes food: taste, softness, colour, and sometimes how easily the body can use it.","A balanced plate has energy foods, body-building foods and protective foods."],"think":["Is rice better than millet? Better for whom: your body, the farmer, the river?","Why do people in different places eat such different foods?","Two sides: some say vegetarian food is healthiest; others say eggs or fish help growth. Many nutrition scientists say both can be healthy when balanced. What would you need to know to decide?"],"oneness":"Sunlight grew the mango, and now the mango becomes you. Where does the food stop and you begin?","jokes":["Why did the tomato blush? It saw the salad dressing!","What does a nervous laddoo say? I'm falling to pieces!","Why did the roti go to school? To be well-rounded!"],"words":["GRAIN","MANGO","BREAD","CURRY","SPICE"],"quiz":[["Ragi and bajra are millets.",true,"So are jowar and foxtail millet."],["All food comes from plants.",false,"Milk and eggs come from animals."],["Potatoes contain starch.",true,"Iodine turns them blue-black."],["People everywhere eat the same food.",false,"Food depends on what grows nearby and on culture."]],"odd":[[["Ragi","Bajra","Jowar","Moong"],"Moong","Moong is a pulse; the others are millets."]],"ws":[["Plant or animal?","Sort 12 foods from your kitchen into plant and animal."],["My thali","Draw your lunch. Colour energy foods yellow, body-building red, protective green."],["Food trail","Pick 3 foods at dinner and draw where each came from."],["Two sides","Write one reason someone eats vegetarian and one reason someone eats eggs or fish."]],"sheet":["Starch Test",["Food","My guess","Colour after iodine","Starch? (yes/no)"],6],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: starch test, sprouting chana",1,3],["Activities: food-origin trail, grandparent's recipe",2,3],["Game: Thali Builder",0.5,1],["Project: Our Family Cookbook",4,14]],"cur":[["Eat a Rainbow lesson and chart","Kids' Food Basket Learning Lab","https://kidsfoodbasket.org/learning-lab/eat-a-rainbow","Fill a week's colour chart with Indian foods (ragi, palak, gajar, baingan, banana); invent a rainbow thali."]]}}},{"k":"ncert|sci|3|9","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"9","title":"Staying Healthy and Happy","dk":["C10","C7"],"c":{"covers":"Keeping clean, eating, sleeping and playing well, feelings, staying happy.","game":["Germ Busters","A race track of daily-life squares. Habit squares (washed hands, played outside, slept on time) push you ahead; Germ squares send you back unless you hold a Shield card, which you earn by acting out a healthy habit. First to Bedtime wins."],"exp":["Glitter germs: glitter on hands, shake hands, then wash with water only vs soap. What's left?","Heartbeat: count your pulse for 15 seconds, do 30 jumps, count again."],"act":["Feelings charades: act out happy, worried, angry, proud; others guess and share when they felt it.","A one-week sleep and play diary."],"proj":["7-Day Healthy Me Challenge","Track water, sleep, outdoor play, fruit and one kind act each day.","A completed challenge chart and a reflection drawing"],"read":["Germs Are Not for Sharing, Elizabeth Verdick","The Busy Body Book, Lizzy Rockwell","The Color Monster, Anna Llenas"],"links":["Veena Ch 10: रस्साकशी"],"x":{"learn":["Clean hands stop germs spreading: soap and 20 seconds of scrubbing remove far more than water alone.","Children aged 6–12 need about 9–12 hours of sleep. Growing and remembering happen while you sleep.","Playing and moving make the heart and lungs stronger and help feelings settle.","Feelings are signals. Naming them and talking about them helps.","Most microbes are harmless or helpful; only some make us sick."],"think":["Is happiness something you feel, or something you do?","Are all germs bad?","Scientists disagree: some think playing in mud and around animals helps the body learn to fight illness (the 'hygiene hypothesis'); others say the idea is too simple. What would be a good balance?"],"oneness":"When you feel scared, your heart races. When you are tired, you feel grumpy. Are mind and body two things, or one?","jokes":["Why did the germ cross the road? Someone sneezed it!","What do you call a sleeping bull? A bulldozer!","Why was the soap so calm? It never lost its lather!"],"words":["SLEEP","SMILE","HEART","HAPPY","SOAPY"],"quiz":[["Washing with soap removes more germs than water alone.",true,"Soap breaks up oil and dirt that hold germs."],["Children your age need about 9–12 hours of sleep.",true,"Sleep helps growth and memory."],["All germs make us sick.",false,"Most microbes are harmless or helpful."],["Exercise makes your heart beat faster.",true,"It pumps more blood to your muscles."]],"odd":[[["Soap","Toothbrush","Towel","Candy"],"Candy","The others keep us clean."]],"ws":[["My habit week","Tick each day: brushed twice, washed hands, slept on time, played outside, ate a fruit."],["Feelings wheel","Colour a wheel of 6 feelings. Write when you last felt each."],["Heartbeat","Pulse in 15 seconds before and after 30 jumps."],["Think","Are mind and body one or two? Draw how you see it."]],"sheet":["Glitter Germ Test",["How I washed","Glitter left (a lot / some / none)","What I learned"],3],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: glitter germs, heartbeat",0.75,1],["Activities: feelings charades, sleep and play diary",1,7],["Game: Germ Busters",0.5,1],["Project: 7-Day Healthy Me Challenge",1.5,7]],"cur":[["Pepper and soap demonstration","Widely used classroom demo (see Osmo's write-up)","https://www.playosmo.com/kids-learning/pepper-and-soap-experiment/","Pepper on water flees a soapy finger. Be honest: this shows soap changing the water's surface tension; it is a picture of handwashing, not proof of killing germs."]]}}},{"k":"ncert|sci|3|10","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"10","title":"This World of Things","dk":["A4"],"c":{"covers":"Objects around us and what they are made of, natural vs human-made materials, properties like hard, soft, waterproof, magnetic.","game":["Material Top Trumps","Make 20 cards of household objects and score each for hardness, bendiness, waterproofness and floating. Each turn, pick a property from your top card; the higher score wins both cards. Test any disputed score for real before deciding."],"exp":["Raincoat test: drip water on paper, plastic, cotton, wool and foil. Which keep a tissue underneath dry?","Magnet hunt: which things in the house does a magnet pick up? Are all metals magnetic?"],"act":["'Made of what?' house hunt: find 5 things each of wood, metal, plastic, glass, cloth and clay.","Old vs new: compare a clay pot and a plastic bottle for keeping water cool."],"proj":["Material Museum","Collect, test and label 20 materials with their properties and uses.","A museum display the child guides visitors through"],"read":["The Way Things Work Now, David Macaulay (for parent and child together)"],"links":["Santoor Ch 5: Talking Toys","Veena Ch 11: एक जादुई पिटारा","Maths Mela Ch 2: Toy Joy"],"x":{"learn":["Every object is made of one or more materials: wood, metal, glass, clay, plastic, cloth, paper, rubber.","Materials have properties: hard or soft, rough or smooth, see-through or not, waterproof or not, magnetic or not.","We choose materials for the job: glass for windows, rubber for tyres, steel for utensils.","Natural materials (wood, cotton, clay) come straight from nature; human-made ones (plastic, glass, steel) are made by changing natural ones.","Not all metals are magnetic: iron and steel stick to a magnet, aluminium, copper and gold don't."],"think":["A wooden chair: natural or human-made? Where is the line?","Why isn't a raincoat made of paper? What would you make it from if plastic didn't exist?","Two sides: plastic is often called bad, yet it also keeps medicines and hospital tools clean. When is plastic the right choice, and when not?"],"oneness":"Your steel tumbler was once rock in the earth; your cotton shirt was a plant. Is anything really 'just a thing'?","jokes":["What did the glass say to the plate? I can see right through you!","Why don't scientists trust atoms? They make up everything!","Why was the broom late? It over-swept!"],"words":["GLASS","STEEL","METAL","PAPER","CLOTH"],"quiz":[["All metals stick to a magnet.",false,"Aluminium, copper and gold don't."],["Glass is transparent.",true,"You can see through it."],["A clay pot can keep water cool.",true,"Water seeps out and evaporates, taking heat with it."],["Wood comes from trees.",true,"It's the hard inside of trunks and branches."]],"odd":[[["Spoon","Key","Coin","Eraser"],"Eraser","The others are made of metal."]],"ws":[["Material table","List 8 objects at home: material, one property, why that material."],["Natural, human-made, or both?","Sort: cotton shirt, steel plate, wooden table, plastic bucket, clay pot, paper."],["Design for a job","Design an umbrella for a hailstorm. Which materials and why?"],["Two sides","Write one good use of plastic and one place we should stop using it."]],"sheet":["Raincoat Test",["Material","My guess (dry/wet)","Tissue underneath after 1 minute","Good for a raincoat?"],6],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: raincoat test, magnet hunt",1,1],["Activities: material house hunt, clay vs plastic",1,2],["Game: Material Top Trumps",0.75,1],["Project: Material Museum",3,10]],"cur":[["ExpeRimental home science films (e.g. hidden colours in felt pens)","The Royal Institution","https://www.rigb.org","Separate the colours in one black pen with a strip of paper and water: one 'thing' made of many."]]}}},{"k":"ncert|sci|3|11","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"11","title":"Making Things","dk":["A4"],"c":{"covers":"How things are made by hand and by machine, artisans and their tools, turning old things into new.","game":["Inventor's Workshop","Draw a challenge card ('A bridge that holds 10 coins using only 2 sheets of paper', 'A boat that carries 5 marbles from foil') and a 10-minute timer. Build, test, and score: did it work, how many coins or marbles, how few materials. Swap roles as judge."],"exp":["Paper strength: flat paper vs folded zig-zag vs rolled tube. How many coins can each hold as a bridge?","Clay drying: make two small pots, dry one in sun and one in shade. Which cracks?"],"act":["Meet an artisan (potter, carpenter, tailor) or watch one at work; list their tools.","Make a toy from trash using an Arvind Gupta design."],"proj":["Design, Build, Improve","Build a working toy (a balloon car or a spinning top), test it, improve it 3 times and record what changed.","A working toy and an improvement log"],"read":["Rosie Revere, Engineer, Andrea Beaty","The Most Magnificent Thing, Ashley Spires","Iggy Peck, Architect, Andrea Beaty"],"links":["Santoor Ch 6: Paper Boats","Maths Mela Ch 5: Fun with Shapes"],"x":{"learn":["Artisans make things with skill: potters, weavers, carpenters, bamboo workers, blacksmiths.","Making follows steps: choose material, shape it, join or fire it, finish it.","Handmade vs factory-made: handmade items carry skill and variety; factories make many identical items cheaply.","Designers test and improve: first tries usually fail, and that's how good things are made.","Old things can be remade: cloth into quilts, bottles into planters, scraps into toys."],"think":["Who really makes a clay pot: the potter, the clay, the wheel or the fire?","Is handmade always better than factory-made?","Two sides: some say machines take artisans' jobs; others say machines make things cheaper for everyone. Can both be true?"],"oneness":"A pot is earth shaped by hands, mixed with water, dried by air, hardened by fire, holding empty space. Earth, water, air, fire and space all made it together.","jokes":["Why did the potter go to the party? For a wheel-y good time!","What did the hammer say to the nail? Get to the point!","Why did the paper go to the doctor? It felt torn!"],"words":["CRAFT","TOOLS","BUILD","WEAVE","MODEL"],"quiz":[["A potter shapes clay on a wheel.",true,"The wheel spins so the clay can be shaped evenly."],["Bamboo can be used to build houses.",true,"It is strong, light and grows fast."],["Everything in shops is made by machines.",false,"Many things are still handmade."],["First designs usually work perfectly.",false,"Designers test and improve again and again."]],"odd":[[["Potter","Weaver","Carpenter","Driver"],"Driver","The others make things with their hands."]],"ws":[["Steps in order","Number the steps of making a clay pot: fire it, dig clay, shape on wheel, dry in sun, knead with water."],["Meet a maker","Interview an artisan: what they make, tools, how long it takes, hardest part."],["Design, build, test","Sketch your toy. What happened at test 1, 2 and 3? What did you change?"],["Think","Who made the pot? List everything that helped."]],"sheet":["Paper Bridge Test",["Shape of paper","My guess (coins)","Coins it held","Why?"],4],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: paper strength, clay drying",1,3],["Activities: meet an artisan, toy from trash",2,3],["Game: Inventor's Workshop",0.75,1],["Project: Design, Build, Improve",4,10]],"cur":[["Cardboard Automata and Scribbling Machines","Exploratorium Tinkering Studio","https://tinkering.exploratorium.edu","Build a moving cardboard toy using cams and levers, or a wobbly drawing robot; improve it three times."],["Toys from Trash","Arvind Gupta","https://www.arvindguptatoys.com","Pick a toy, build it, then redesign it."]]}}},{"k":"ncert|sci|3|12","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"12","title":"Taking Charge of Waste","dk":["B10"],"c":{"covers":"Kinds of waste, sorting at home, composting, reducing, reusing and recycling, where waste goes.","game":["Bin Blitz","60 seconds on the clock. Flip picture cards and slap each onto the right bin: wet, dry, hazardous, e-waste. Trick cards (a tetra pack, a battery, a used tea bag) are worth double. Beat your last score."],"exp":["Bury test: bury a banana peel, a paper, a cotton rag and a plastic bag in a pot of soil. Dig up after 3 weeks.","Start a compost pot with kitchen peels and dry leaves; check its warmth and smell weekly."],"act":["Weigh one day's home waste and sort it.","Visit or talk to a kabadiwala: what can they sell, what can't they?"],"proj":["Zero-Waste Week","Weigh waste for a normal week, then a week of family changes; compare.","Compost, a before-and-after chart and a family pledge"],"read":["One Plastic Bag, Miranda Paul","Why Should I Recycle?, Jen Green","The Adventures of a Plastic Bottle, Alison Inches"],"links":[],"x":{"learn":["Waste can be wet (peels, leftover food), dry (paper, plastic, metal), hazardous (batteries, medicines) or e-waste (old phones).","Sorting at home makes recycling and composting possible.","Biodegradable things rot back into soil; plastic can last hundreds of years.","Reduce first, then reuse, then recycle. Composting turns wet waste into food for plants.","Kabadiwalas and waste-pickers recycle a large share of what India throws away."],"think":["When we 'throw away' something, where is 'away'?","Is a banana peel waste for a worm?","Two sides: some say recycling solves the problem; many experts say reducing what we use matters much more. Which is easier at your home?"],"oneness":"In a forest every 'waste' becomes someone's food. What would your home look like if it worked like a forest?","jokes":["What did the recycling bin say to the dustbin? You're such a waste!","Why was the bottle so happy? It got a second life!","Why did the banana peel go to the compost party? To break down on the dance floor!"],"words":["WASTE","TRASH","REUSE","CLEAN","EARTH"],"quiz":[["Banana peels are biodegradable.",true,"Microbes and worms turn them into soil."],["Plastic bags break down in a few days.",false,"They can last for hundreds of years."],["Sorting waste at home helps recycling.",true,"Clean dry waste can be recycled; wet waste can be composted."],["Old batteries go in the wet-waste bin.",false,"They are hazardous waste."]],"odd":[[["Peel","Tea leaves","Eggshell","Battery"],"Battery","The others can go into compost."]],"ws":[["Which bin?","Sort 12 things into wet, dry, hazardous and e-waste."],["One day of waste","List everything your family threw away today. Which could have been avoided?"],["Second life","Draw 3 new uses for an old bottle."],["Think","Where is 'away'? Draw where your rubbish really goes."]],"sheet":["Bury Test (3 weeks)",["Item","Day 0","Week 1","Week 2","Week 3"],5],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: bury test, compost pot",1,21],["Activities: weigh a day's waste, talk to a kabadiwala",1.5,2],["Game: Bin Blitz",0.5,1],["Project: Zero-Waste Week",2,14]],"cur":[["Soda-bottle compost bioreactor","Cornell Waste Management Institute","https://www.compost.css.cornell.edu/bioreactors.html","Build two bottle composters; test which kitchen scraps rot fastest and measure the warmth."]]}}},{"k":"ncert|sci|4|1","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"1","title":"Living Together","dk":["B2"],"c":{"covers":"Families and communities, people who help us, animals that live in groups (ants, bees, elephants), why living together helps.","game":["Herd or Alone?","You are animals on a grassland. Each round flip a Danger card (a leopard, a drought, a flood). Choose secretly: stay with the herd (safe from predators, but food is shared) or go alone (all the food, but danger hits hard). Score food and lives. After 8 rounds, talk about why elephants, ants and humans live in groups."],"exp":["Ant teamwork: put a sugar grain and a biscuit crumb near ants. Time how long until the first ant arrives and how many join to carry the crumb."],"act":["Map the helpers in your community and what each does for you.","Watch a flock of pigeons or crows for 10 minutes: who leads, who keeps watch?"],"proj":["Community Helpers Story","Interview 3 helpers (vegetable seller, guard, postman) and make a photo-story.","A booklet or short video"],"read":["Gajapati Kulapati, Ashok Rajagopalan","Swimmy, Leo Lionni"],"links":["Santoor Ch 1: Together We Can","Maths Mela Ch 9: Equal Groups"]}},{"k":"ncert|sci|4|2","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"2","title":"Exploring Our Neighbourhood","dk":["B2"],"c":{"covers":"Maps, directions and landmarks, places and services in the neighbourhood.","game":["Treasure Map Hunt","The parent hides a treasure and draws a map with a key, a north arrow and steps ('10 steps north, turn east at the tulsi pot'). The child finds it, then draws a map for the parent. Next level: maps drawn to scale."],"exp":["Make a compass: rub a needle on a magnet 30 times one way, float it on a leaf in a bowl of water. Which way does it point? Check against the sunrise."],"act":["Neighbourhood walk: mark shops, parks, water taps, a clinic. Draw symbols for each.","Traffic survey: count vehicles vs trees on your street for 10 minutes."],"proj":["My Neighbourhood Atlas","A hand-drawn map with key, scale and north arrow, plus photos and notes on 10 places.","A folded atlas"],"read":["Me on the Map, Joan Sweeney","Mapping Penny's World, Loreen Leedy"],"links":["Maths Mela Ch 2: Hide and Seek","Maths Mela Ch 13: The Transport Museum"]}},{"k":"ncert|sci|4|3","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"3","title":"Nature Trail","dk":["A5","B4"],"c":{"covers":"The variety of plants and animals around us, food chains, how living things depend on one another.","game":["Food Chain Dominoes","Each domino has an eater on one half and something eaten on the other, from Indian ecosystems (grass–deer–tiger, plankton–fish–kingfisher, leaf–caterpillar–myna). Match ends to build the longest chain; a 'Decomposer' tile can join any dead end."],"exp":["Camouflage hunt: scatter 20 green and 20 red paper 'insects' on grass. A partner 'bird' has 30 seconds to pick as many as possible. Which colour survives? Repeat on red soil."],"act":["Nature-trail bingo walk.","Sketch 10 living things in a field journal with where you found them."],"proj":["Biodiversity Count","Mark a 1 m × 1 m square with string in a park or garden; visit weekly for 4 weeks and record every plant and animal.","A mini field guide to your square"],"read":["What Do You Do With a Tail Like This?, Steve Jenkins & Robin Page","The Book of Indian Birds, Salim Ali (reference)"],"links":["Santoor Ch 5: The Old Stag","Veena Ch 2: Bagiche ka Ghongha","Veena Ch 3: Neem","Maths Mela Ch 10: Elephants, Tigers, and Leopards"]}},{"k":"ncert|sci|4|4","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"4","title":"Growing Up with Nature","dk":["A5","B9"],"c":{"covers":"How plants and animals grow and change: life cycles, what they need to grow, caring for living things.","game":["Life Cycle Rummy","Cards show stages of life cycles (egg–caterpillar–pupa–butterfly, seed–seedling–plant–flower, egg–tadpole–froglet–frog, baby–child–adult–elder). Draw and discard like rummy; lay down a full set in the right order and explain one stage."],"exp":["Bean in a jar: wedge a soaked rajma bean between wet tissue and the glass. Draw the root and shoot every 2 days.","Measure your own height, hand and foot and compare with your baby measurements."],"act":["Family photo timeline from baby to now.","Look for eggs, caterpillars or tadpoles on a nature walk (look, don't take)."],"proj":["Grow and Track","Grow a marigold or balsam from seed to flower over about 6 weeks, measuring weekly.","A flowering plant and a growth chart"],"read":["A Butterfly Is Patient, Dianna Hutts Aston","The Cherry Tree, Ruskin Bond"],"links":["Veena Ch 1: Chidiya ka Geet","Santoor Ch 10: The Swing"]}},{"k":"ncert|sci|4|5","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"5","title":"Food for Health","dk":["C11"],"c":{"covers":"What different foods do for the body, a balanced diet, how food is kept from spoiling.","game":["Nutrient Ninjas","Food cards show nutrient icons and a price. Challenge cards ask things like 'A tiffin with protein and iron under ₹50' or 'A breakfast for a cricketer'. Build the best answer from your hand; the opponent scores it with the nutrient key."],"exp":["Spoil or keep? Lemon slices: one plain, one in salt, one in sugar, one in the fridge. Watch for a week (don't eat).","Iodine starch test on different breakfast foods (adult)."],"act":["Read 5 food labels: what's in packaged snacks?","Plan a week of tiffins together."],"proj":["Preserve Lab","Make a small batch of nimbu achar with an elder and compare it with an unsalted control over 3 weeks.","A jar of pickle and an observation log"],"read":["Good Enough to Eat, Lizzy Rockwell"],"links":["Veena Ch 4: Hamara Aahar","Veena Ch 9: Mithaiyon ka Sammelan","Maths Mela Ch 8: Weigh it, Pour it"]}},{"k":"ncert|sci|4|6","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"6","title":"Happy and Healthy Living","dk":["C10"],"c":{"covers":"Exercise, hygiene and sleep, staying safe, preventing illness, feeling well in body and mind.","game":["Body Defence Tower","Stack defence cards (skin, mucus, fever, white blood cells, vaccine) to build your tower. Each turn the opponent plays germ attack cards; a germ gets through if your tower lacks the right defence. Last tower standing wins."],"exp":["Bread and hands: touch slices with unwashed, water-washed and soap-washed hands; seal each in a bag for a week (never open).","Breathing rate before and after skipping for a minute."],"act":["Learn a 5-pose yoga sequence.","First-aid role play: a cut, a burn, a nosebleed."],"proj":["Family Fitness League","A 3-week plan with daily points for movement, sleep and water.","A league table and handmade medals"],"read":["The Busy Body Book, Lizzy Rockwell","Germs Are Not for Sharing, Elizabeth Verdick"],"links":["Santoor Ch 7: Fit Body, Fit Mind, Fit Nation","Santoor Ch 3: Be Smart, Be Safe","Santoor Ch 8: The Lagori Champions","Veena Ch 12: Shatranj mein Maat"]}},{"k":"ncert|sci|4|7","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"7","title":"How Things Work","dk":["B6"],"c":{"covers":"How everyday tools and machines work: levers, wheels, pulleys and ramps, pushes and pulls.","game":["Machine Hunt Showdown","5 minutes on the clock. Race through the house finding levers, wheels and axles, pulleys, ramps, wedges and screws (scissors, a tap, a door handle, a knife). Show each find to score; the opponent can challenge whether it really is that machine."],"exp":["Ruler lever: balance a ruler on a pencil and lift a pile of coins with fewer coins by moving the pencil. Where must the pencil go?","Ramp race: roll a toy car down a board at three heights and measure how far it travels."],"act":["Take apart an old pen or torch (adult checks it's safe) and name the parts.","Make a pulley with a cotton reel, string and a small bucket."],"proj":["Chain-Reaction Machine","Build a 5-step chain (dominoes, a ramp, a ball, a cup, a bell) that rings a bell at the end.","A working machine and a video of it"],"read":["The Way Things Work Now, David Macaulay"],"links":["Santoor Ch 2: The Tinkling Bells","Maths Mela Ch 12: Ticking Clocks and Turning Calendar"]}},{"k":"ncert|sci|4|8","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"8","title":"How Things Are Made","dk":["A4"],"c":{"covers":"How things are made from raw materials: cloth, paper, pottery, food; artisans and factories.","game":["Factory Line","Shuffled step cards for making things (cotton boll to shirt, sugarcane to jaggery, wood to paper, clay to pot). Race to put a set in order; the opponent checks with the answer card. Fastest correct line wins."],"exp":["Make paper: soak torn newspaper, blend into pulp (adult), spread on a mesh frame, press and dry.","Butter in a jar: shake cream in a closed jar for 10 minutes. What separates?"],"act":["Visit a bakery, potter or tailor and list the steps you see.","Check 10 things at home: where were they made?"],"proj":["From Raw to Ready","Make one thing from its raw material (handmade paper cards, or cream to butter to ghee) and record each step.","A finished product and a process poster"],"read":["Charlie Needs a Cloak, Tomie dePaola"],"links":["Santoor Ch 12: Maheshwar (known for its handloom weaving)","Maths Mela Ch 4: Thousands Around Us"]}},{"k":"ncert|sci|4|9","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"9","title":"Different Lands, Different Lives","dk":["B8","B2"],"c":{"covers":"Different landforms (plains, deserts, coasts, mountains) and how they shape people's homes, food, clothes and work.","game":["Landform Survivor","Draw a land card (Thar desert, Ladakh, Kerala coast, Gangetic plains). Build a home, food, clothing and transport set from your cards that fits that land. The opponent throws an event at you (sandstorm, snowfall, monsoon flood); survive it with the right card to score."],"exp":["Insulation test: put an ice cube in boxes lined with mud, paper, cloth and thermocol. Which melts last? Which wall would you want in the desert?","Sand vs water: two cups under a lamp or in the sun. Which heats faster, and which cools faster at night?"],"act":["Make clay models of a mountain, plain, desert and coast.","Taste one dish from each landform region."],"proj":["Postcards from India","Research and draw 4 postcards (one per landform) and build a model of one traditional house.","A postcard set and a house model"],"read":["A Gift for Amma: Market Day in India, Meera Sriram","The Blue Umbrella, Ruskin Bond"],"links":["Santoor Ch 11: A Journey to the Magical Mountains","Veena Ch 6: Jaipur se Patra","Veena Ch 8: Onam ke Rang"]}},{"k":"ncert|sci|4|10","board":"ncert","subj":"sci","level":4,"book":"Our Wondrous World · Class 4","n":"10","title":"Our Sky","dk":["B5","B1"],"c":{"covers":"The Sun, Moon and stars, shadows, day and night, how the sky changes.","game":["Constellation Connect","Dot cards of constellations (Saptarishi, Kalpurush/Orion, Vrishchik/Scorpius). Race to join the dots and name it, then read its story card (the seven rishis, Dhruv). Bonus point if you find it in tonight's sky."],"exp":["Shadow stick: mark a stick's shadow every hour from 9 to 4. When is it shortest?","Torch and ball: show day and night, then the Moon's phases with a lamp and a ball on a pencil."],"act":["Night-sky watch with a printed star map.","A one-month moon diary."],"proj":["Sky Journal and Sundial","Build a sundial and keep a 30-day moon and sky journal.","A working sundial and a sky journal"],"read":["Moon! Earth's Best Friend, Stacy McAnulty","Sun! One in a Billion, Stacy McAnulty","There's No Place Like Space, Tish Rabe"],"links":["Veena Ch 5: Aasman Gira","Veena Ch 13: Hamara Aditya (India's solar mission)"]}},{"k":"ncert|sci|5|1","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"1","title":"Water – The Essence of Life","dk":["B8","C12"],"c":{"covers":"Water in living things and daily life, what water dissolves, its forms, the water cycle, scarcity and conservation.","game":["Lake of Two Villages","You share one lake of 30 water tokens. Each round, both secretly choose to take 2 (careful) or 5 (greedy) tokens for your fields; then a rain card refills 0–6. If the lake ever empties, both villages lose. Most harvest when the season ends, without emptying the lake, wins. Talk about why sharing rules matter."],"exp":["What dissolves? Salt, sugar, sand, oil, haldi, chalk in water. Stir, wait, observe.","Hidden water: weigh a cucumber slice, dry it in the sun for 2 days, weigh again."],"act":["Trace your home's water from its source to your tap.","Compare how much water different crops need (rice vs millets)."],"proj":["Water Heroes Model","Research a traditional system (stepwell, johad, kund, eri) and build a working rain-harvesting model.","A model and a 3-minute talk"],"read":["The Water Princess, Susan Verde","A River, Marc Martin"],"links":["Santoor Ch 3: The Rainbow","Veena Ch 12: Ganga ki Kahani","Maths Mela Ch 8: Weight and Capacity"]}},{"k":"ncert|sci|5|2","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"2","title":"Journey of a River","dk":["B8"],"c":{"covers":"A river's journey from its source to the sea: source, tributary, delta, mouth; fast narrow upper course and slow wide lower course; life along rivers.","game":["River Run","A board from glacier to sea. Roll to move; tributary squares speed you up, dam squares make you wait, pollution squares push you back, the delta is the finish. Each square carries a real fact about the Ganga, Brahmaputra, Narmada or Kaveri."],"exp":["Stream table: a tray of damp sand on a slope; trickle water from a bottle at the top. Watch channels, bends and a delta form. Try steep vs gentle slopes."],"act":["Trace a river on a map from source to mouth and mark the cities on it.","Collect river stories, such as the legend of the Kaveri."],"proj":["River Model","Build a sand or clay river with labelled source, tributaries and delta, and a one-page profile of a river near you.","A 3D river model"],"read":["Angry River, Ruskin Bond","A River, Marc Martin"],"links":["Veena Ch 12: Ganga ki Kahani","Maths Mela Ch 14: Maps and Locations"]}},{"k":"ncert|sci|5|3","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"3","title":"The Mystery of Food","dk":["C11"],"c":{"covers":"How food changes: cooking, spoiling, fermenting and digesting (align with the book's focus).","game":["Food Detective","Mystery cards give clues (smells sour, bubbles appeared, fuzzy spots, turned sweet when chewed). Use the fewest clues to name what happened: fermentation, spoilage, cooking or digestion. Fewer clues used, more points."],"exp":["Chew plain roti for 2 minutes: when does it turn sweet?","Idli batter: keep one bowl warm and one in the fridge overnight. Which rises?","Milk to curd at room temperature vs in the fridge."],"act":["Ask grandparents how food was preserved without a fridge (sun-drying, pickling).","Watch a fruit go brown after cutting; does lemon juice stop it?"],"proj":["Fermentation Lab","Over one week make curd, idli batter and kanji; photograph and log changes daily.","Foods to eat and a lab notebook"],"read":["Bread, Bread, Bread, Ann Morris"],"links":["Maths Mela Ch 6: The Dairy Farm","Maths Mela Ch 9: Coconut Farm"]}},{"k":"ncert|sci|5|4","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"4","title":"Our School – A Happy Place","dk":["B2"],"c":{"covers":"What makes a learning place happy: people, rules, cleanliness, inclusion. For homeschoolers: your own learning community.","game":["Dream School Draft","Draft feature cards (library, garden, ramps and lifts, sign-language teacher, sports ground, kitchen) within a budget. Each pick must be justified: who does it help? The opponent can veto once."],"exp":["Light and sound check: measure how bright and how noisy your learning corner is at different times (use a phone light/sound meter or rate 1–5)."],"act":["Interview a friend who goes to school: what makes it happy or hard?","Agree a set of rules for your homeschool group or siblings."],"proj":["Learning-Space Makeover","Redesign the home learning corner and write a charter for your learning group.","A rearranged corner and a signed charter"],"read":["Chuskit Goes to School, Sujatha Padmanabhan","The Day You Begin, Jacqueline Woodson"],"links":["Veena Ch 7: Mera Bachpan"]}},{"k":"ncert|sci|5|5","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"5","title":"Our Vibrant Country","dk":["B2"],"c":{"covers":"India's diversity of languages, foods, dances, festivals and crafts, and what unites us.","game":["India Quartets","Each state has 4 cards: language, dance, food, monument. Ask your opponent for a card ('Do you have Assam's dance?'). Collect all four of a state to lay down a quartet. Most quartets wins."],"exp":["Language sounds: record 'hello' and 'thank you' in 10 Indian languages. Which share words?"],"act":["Fill a blank India map with states and one fact each.","Cook one dish from a state you've never visited."],"proj":["State Exchange","Video-call or write to a child in another state; make a fact book about each other's state.","A two-state fact book"],"read":["A Gift for Amma: Market Day in India, Meera Sriram","Amma, Take Me to… series, Bhakti Mathur"],"links":["Veena Ch 11: Hamare ye Kalamandir","Veena Ch 8: Kaziranga Rashtriya Udyan ki Yatra"]}},{"k":"ncert|sci|5|6","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"6","title":"Some Unique Places","dk":["B8"],"c":{"covers":"Unusual landscapes, rare wildlife and traditions in India (e.g. deserts, mangroves, floating lakes, cold deserts).","game":["Where in India?","A travel guessing game: the opponent reads clues one at a time (floating islands of grass; a white salt desert; mangroves with tigers; bridges grown from tree roots). Guess with fewer clues to score more. Then swap."],"exp":["Salt from the sea: dissolve salt in water in a shallow plate and leave it in the sun. What's left after 3 days? (This is how salt pans work.)","Floating island: does a grass mat on a sponge float? What keeps Loktak's phumdis afloat?"],"act":["Plan a trip to one unique place: route, budget, packing list.","Find the animals found only in that place."],"proj":["Unique-Place Diorama","A shoebox diorama of one place plus a one-minute guide video.","A diorama and a video"],"read":["StoryWeaver (Pratham Books): search 'Sundarbans' or 'Ladakh'"],"links":["Veena Ch 8: Kaziranga Rashtriya Udyan ki Yatra","Maths Mela Ch 5: Far and Near","Maths Mela Ch 14: Maps and Locations"]}},{"k":"ncert|sci|5|7","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"7","title":"Energy – How Things Work","dk":["C12","B6"],"c":{"covers":"Forms of energy, where it comes from (food, fuel, sun, electricity), how devices use it, saving energy.","game":["Energy Chains","Cards show energy steps (Sun, grass, cow, milk, my muscles, bicycle, dynamo, bulb). Build valid chains where each card's energy turns into the next. Longest chain wins; the opponent can challenge any link."],"exp":["Pizza-box solar oven: foil, black paper and cling film. Can it melt chocolate? Measure with a thermometer if you have one.","Rubber-band car: wind more turns, travel further?"],"act":["Home energy audit: lights and fans left on, the meter reading each day for a week.","Find 5 ways energy changes form in the kitchen."],"proj":["Solar Cooker Challenge","Build a solar cooker, test it over 3 days, and cook something simple.","A working cooker and a temperature log"],"read":["The Boy Who Harnessed the Wind (picture-book edition), William Kamkwamba & Bryan Mealer","Energy Island, Allan Drummond"],"links":["Maths Mela Ch 12: Racing Seconds"]}},{"k":"ncert|sci|5|8","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"8","title":"Clothes – How Things are Made","dk":["A4"],"c":{"covers":"Fibres (cotton, silk, wool, jute, synthetic), spinning, weaving and dyeing, khadi, how clothes are made.","game":["Fibre Detective","Mystery fabric scraps in envelopes with clue cards (soaks water fast, comes from a caterpillar, shines, keeps sheep warm). Feel, test with a drop of water, and name the fibre."],"exp":["Water test: drop water on cotton, polyester, wool and silk. Which soaks it up?","Natural dyes: boil haldi, onion skins or beetroot (adult) and dye white cloth strips."],"act":["Learn the story of the charkha and khadi.","Check clothing labels at home: what are your clothes made of?"],"proj":["Dye and Weave","Dye cloth or yarn with natural dyes and weave a small mat or bookmark on a cardboard loom.","A woven piece"],"read":["Charlie Needs a Cloak, Tomie dePaola"],"links":["Maths Mela Ch 11: Grandmother's Quilt","Santoor Ch 10: Glass Bangles"]}},{"k":"ncert|sci|5|9","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"9","title":"Rhythms of Nature","dk":["B5"],"c":{"covers":"Cycles in nature: day and night, seasons, flowering and fruiting times, migration, body clocks.","game":["Nature's Clock","Event cards (the koel calls, mango trees flower, monsoon arrives, Amur falcons pass through Nagaland, owls hunt) go onto a day wheel or a year wheel. Place each correctly and explain why then; most points wins."],"exp":["Four o'clock flower (gulbas): note when its flowers open each day for a week.","Your body clock: rate your energy every 2 hours for 3 days. When are you sharpest?"],"act":["Visit one tree every week and record leaves, flowers, fruit and visitors.","Mark shadow length at noon each week."],"proj":["Year Wheel","A big circular calendar of local nature events, plus 4 weeks of tree and bird observations.","A year-wheel poster"],"read":["The Reasons for Seasons, Gail Gibbons","A Butterfly Is Patient, Dianna Hutts Aston"],"links":["Veena Ch 3: Chaand ka Kurta","Veena Ch 1: Kiran","Maths Mela Ch 12: Racing Seconds"]}},{"k":"ncert|sci|5|10","board":"ncert","subj":"sci","level":5,"book":"Our Wondrous World · Class 5","n":"10","title":"Earth – Our Shared Home","dk":["B9","B1"],"c":{"covers":"Earth as a shared home for all living things, resources, climate, pollution and caring for the planet.","game":["Planet Keepers","A cooperative game. Shared Earth-health tokens start at 20. Each round flip a world event (forest fire, new factory, tree-planting drive) and each player picks one action card. Explain your choice to play it. Finish 10 rounds with Earth-health above 10 to win together."],"exp":
