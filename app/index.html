<title>DeepKids Home Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Garden of the day: a little illustrated garden blooms as things get done; blob friends stand for subjects and people;
   bright crayon colours on warm paper, chunky pressable buttons, coloured timetable cards, a winding path for the syllabus. */
:root{
  --bg:#FFF6EC; --surface:#FFFFFF; --sunk:#F7ECDF; --ink:#2B2340; --muted:#7C7088; --line:#F0E2D2;
  --sun:#FFD65C; --tang:#FD8326; --gum:#FF8BB4; --peri:#8C93C7; --pist:#B6D693; --forest:#53A373; --aqua:#4CC9C0; --sky:#6DB4F2;
  --tangD:#D9661A; --forestD:#3F8559; --skyA:#CFEFE0; --skyB:#EAF7D9; --hill1:#B6D693; --hill2:#8CC57A; --soil:#E9C9A0;
  --onbright:#2B2340; --good:#3FAE6A; --bad:#F2575A;
  --display:"Fredoka","Baloo 2",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-xl:30px; --r-lg:24px; --r:18px;
  --lift:0 2px 0 rgba(43,35,64,.05),0 10px 24px -14px rgba(43,35,64,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1730; --surface:#28213F; --sunk:#332A4F; --ink:#F6F0FF; --muted:#B8ADCB; --line:#3B3258;
  --sun:#FFD65C; --tang:#FF9445; --gum:#FF95BC; --peri:#9EA5DB; --pist:#A9CF84; --forest:#62B884; --aqua:#56D4CB; --sky:#7DBDF6;
  --tangD:#C65A12; --forestD:#3D7F57; --skyA:#2C3D55; --skyB:#2E3A3A; --hill1:#4E6E46; --hill2:#3F5F3C; --soil:#5A4636;
  --lift:0 2px 0 rgba(0,0,0,.25),0 12px 28px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1730; --surface:#28213F; --sunk:#332A4F; --ink:#F6F0FF; --muted:#B8ADCB; --line:#3B3258;
  --sun:#FFD65C; --tang:#FF9445; --gum:#FF95BC; --peri:#9EA5DB; --pist:#A9CF84; --forest:#62B884; --aqua:#56D4CB; --sky:#7DBDF6;
  --tangD:#C65A12; --forestD:#3D7F57; --skyA:#2C3D55; --skyB:#2E3A3A; --hill1:#4E6E46; --hill2:#3F5F3C; --soil:#5A4636;
  --lift:0 2px 0 rgba(0,0,0,.25),0 12px 28px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:600 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:10px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.12;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}.sm{font-size:14px}.xs{font-size:12.5px}
.eyebrow{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:grid;gap:12px}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.s-math{--c:var(--aqua)}.s-eng{--c:var(--gum)}.s-hin{--c:var(--tang)}.s-sci{--c:var(--forest)}
.r-you{--c:var(--peri)}.r-both{--c:var(--sun)}.r-kid{--c:var(--sky)}.r-out{--c:var(--gum)}.r-free{--c:var(--line)}
.tint{background:color-mix(in srgb,var(--c) 22%,var(--surface))}
/* chunky pressable buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:18px;border:0;background:var(--tang);color:#fff;font:600 17px var(--display);box-shadow:0 4px 0 var(--tangD);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tangD)}
.btn.green{background:var(--forest);box-shadow:0 4px 0 var(--forestD)}.btn.green:active{box-shadow:0 1px 0 var(--forestD)}
.btn.soft{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line),inset 0 0 0 2px var(--line)}.btn.soft:active{box-shadow:0 1px 0 var(--line),inset 0 0 0 2px var(--line)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 18%,transparent)}
.btn.sm{height:40px;padding:0 16px;font-size:15px;border-radius:14px}
.btn.xs{height:34px;padding:0 12px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--tangD)}.btn.xs.soft{box-shadow:0 3px 0 var(--line),inset 0 0 0 2px var(--line)}
.btn.wide{flex:1}
.btn:disabled{opacity:.4;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:15px;border:0;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink);box-shadow:var(--lift)}
.link{background:none;border:0;padding:0;color:var(--tang);font:600 15px var(--display)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:700;white-space:nowrap}
.dotc{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));flex:none}
/* Finch-style check */
.ck,.ckb{width:46px;height:46px;flex:none;border-radius:15px;border:0;background:var(--surface);box-shadow:0 3px 0 var(--line),inset 0 0 0 2px var(--line);display:grid;place-items:center;color:color-mix(in srgb,var(--ink) 18%,transparent)}
.ck .ico,.ckb .ico{width:24px;height:24px;stroke-width:3}
.done .ck,.done .ckb,.ck.on{background:var(--good);color:#fff;box-shadow:0 3px 0 #2D8752;animation:pop .3s}
@keyframes pop{50%{transform:scale(1.15)}}
/* header & nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.hello{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.hello .bl{width:46px;height:46px;flex:none}
.hello b{font:600 19px var(--display);display:block;line-height:1.1}
.hello span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.nav{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:7px;border-radius:26px;background:var(--surface);box-shadow:0 14px 34px -12px rgba(43,35,64,.45);width:min(440px,calc(100% - 32px))}
nav.nav button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:20px;height:54px;display:grid;justify-items:center;align-content:center;gap:1px;font:600 12.5px var(--display)}
nav.nav button .ico{width:23px;height:23px}
nav.nav button[aria-current="page"]{background:var(--sun);color:#2B2340}
main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
/* garden hero */
.garden{position:relative;margin-top:6px;border-radius:var(--r-xl);overflow:hidden;background:linear-gradient(180deg,var(--skyA),var(--skyB));min-height:250px}
.garden svg.scene{display:block;width:100%;height:250px}
.garden .over{position:absolute;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.garden .over h1{font-size:clamp(24px,6vw,30px);color:var(--ink)}
.garden .over p{font-weight:700;color:var(--muted);font-size:14px}
.plain{border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer}
.garden .prog{position:absolute;left:14px;right:14px;bottom:14px;border-radius:20px;background:color-mix(in srgb,var(--surface) 90%,transparent);padding:10px 14px;display:grid;gap:6px}
.track{position:relative;height:14px;border-radius:9px;background:var(--sunk)}
.track span{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--forest);transition:width .5s}
.track .rider{position:absolute;top:50%;width:30px;height:30px;transform:translate(-50%,-56%);transition:left .5s}
.bloom{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes grow{from{transform:scale(.2)}}
.bob{animation:bob 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(3deg)}}
/* up next */
.focus{margin-top:16px;border-radius:var(--r-xl);padding:20px;display:grid;gap:12px;position:relative;background:color-mix(in srgb,var(--c) 26%,var(--surface));box-shadow:var(--lift)}
.focus .mascot{position:absolute;right:14px;top:-22px;width:78px;height:78px}
.focus .eyebrow{color:color-mix(in srgb,var(--c) 45%,var(--ink))}
.focus h2{font-size:clamp(23px,5.6vw,29px);padding-right:70px}
.focus .who{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
.steps-mini{display:flex;flex-wrap:wrap;gap:6px}
.steps-mini span{font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--surface)}
.steps-mini span.ok{background:var(--good);color:#fff}
.donecard{margin-top:16px;border-radius:var(--r-xl);padding:20px;background:var(--surface);box-shadow:var(--lift);display:grid;gap:12px;position:relative;overflow:hidden}
.donecard h2{font-size:25px;padding-right:80px}
.donecard .mascot{position:absolute;right:12px;top:12px;width:78px;height:78px}
.offer{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.offer .bl{width:40px;height:40px}
/* sections */
.sec{margin-top:28px;display:grid;gap:12px}
.sech{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sech h3{font-size:21px}
/* timetable */
.tt{display:grid;gap:10px}
.tr{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}
.tr .t{font:600 13px var(--display);color:var(--muted);text-align:right;line-height:1.1}
.tr .t small{display:block;font-size:11px}
.tcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:20px;border:0;width:100%;text-align:left;background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.tcard .ic{width:42px;height:42px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.r-both .tcard .ic,.tcard.r-both .ic{color:#2B2340}
.tcard .m{min-width:0;display:grid}
.tcard .m b{font:600 16.5px var(--display);overflow:hidden;text-overflow:ellipsis}
.tcard .m span{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.done .tcard{background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
.tr.done .tcard .m b{color:var(--muted);text-decoration:line-through}
.tr.now .tcard{box-shadow:0 0 0 3px var(--c),var(--lift)}
.tr.brk .t{opacity:.7}.brkline{font-size:13px;color:var(--muted);font-weight:700;padding:4px 14px;border-radius:999px;border:2px dashed var(--line);justify-self:start}
/* stacked joke cards */
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 4px 14px;margin:0 -4px;scrollbar-width:none}
.hs>*{scroll-snap-align:center;flex:0 0 74%;max-width:300px}
.joke{border:0;border-radius:26px;padding:18px;text-align:left;display:grid;gap:10px;align-content:start;min-height:170px;color:#2B2340;box-shadow:var(--lift)}
.joke:nth-child(4n+1){background:var(--aqua);transform:rotate(-2.5deg)}.joke:nth-child(4n+2){background:var(--gum);transform:rotate(2deg)}.joke:nth-child(4n+3){background:var(--sun);transform:rotate(-1.5deg)}.joke:nth-child(4n){background:var(--pist);transform:rotate(2.5deg)}
.joke .q{font:600 19px/1.25 var(--display)}
.joke .a{font-size:16px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.9);animation:pop .3s}
.joke .tap{font-size:13px;font-weight:800;opacity:.75}
.joke .eyebrow{color:#2B2340;opacity:.7}
.expi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:20px;background:var(--surface);box-shadow:var(--lift)}
.daybadge{font:700 18px var(--display);width:52px;height:52px;border-radius:16px;background:var(--pist);color:#2B2340;display:grid;place-items:center;line-height:1;text-align:center}
.daybadge small{display:block;font:700 9.5px var(--body);letter-spacing:.06em}
.inp{width:100%;height:50px;padding:0 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700}
textarea.inp{height:auto;min-height:100px;padding:12px 14px;line-height:1.5;resize:vertical}
.howto{border-radius:var(--r-lg);padding:18px;display:grid;gap:10px;background:var(--surface);box-shadow:var(--lift)}
.howto ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14.5px}
/* sheet */
dialog.sheet{border:0;padding:0;margin:0;width:100%;max-width:100%;height:100%;max-height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:contain}
dialog.sheet.colored{background:color-mix(in srgb,var(--c) 40%,var(--bg))}
dialog.sheet[open]{animation:up .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
dialog.sheet::backdrop{background:rgba(30,20,50,.45)}
.shead{position:sticky;top:0;z-index:3;background:inherit}
.shead .wrap{display:flex;align-items:center;gap:12px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px}
.shead h3{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbody{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.sbody>.wrap{display:grid;gap:16px}
/* player */
.ptrack{position:relative;height:18px;border-radius:12px;background:rgba(255,255,255,.75);margin:14px 18px 6px}
.ptrack span{position:absolute;inset:0 auto 0 0;border-radius:12px;background:var(--c);transition:width .4s}
.ptrack .rider{position:absolute;top:50%;width:40px;height:40px;transform:translate(-50%,-58%);transition:left .4s}
.stage{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--lift);padding:22px;display:grid;gap:16px}
.stage .kind{display:flex;align-items:center;gap:10px;font:600 15px var(--display);color:color-mix(in srgb,var(--c) 55%,var(--ink))}
.stage .kind .k{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.stage h2{font-size:clamp(23px,5.8vw,30px)}
.stage .body{font-size:16.5px}.stage .body>*+*{margin-top:12px}
.stage ul{margin:0;padding-left:20px;display:grid;gap:8px}
.ask{border-radius:18px;padding:14px 16px;background:color-mix(in srgb,var(--peri) 22%,var(--surface))}
.ask .eyebrow{display:block;margin-bottom:4px;color:color-mix(in srgb,var(--peri) 50%,var(--ink))}
.timer{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:20px;background:var(--sunk)}
.timer svg{width:56px;height:56px}
.timer .tt2{font:600 24px var(--display)}
.tasks-inline{display:grid;gap:8px}
.tline{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--sunk);border:0;text-align:left;width:100%;font-weight:700}
.tline.done{background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.finish{text-align:center;justify-items:center;padding-block:28px}
.finish .stars{display:flex;gap:6px}
.finish h2{font-size:34px}
/* chapter */
.chero{position:relative;border-radius:var(--r-xl);padding:20px;background:var(--c);color:#2B2340;display:grid;gap:6px;overflow:hidden;min-height:170px}
.chero .mascot{position:absolute;right:-8px;bottom:-14px;width:130px;height:130px}
.chero .n{position:absolute;right:18px;top:10px;font:700 64px/1 var(--display);opacity:.25}
.chero h1{font-size:clamp(25px,6.4vw,33px);max-width:72%}
.chero p{font-size:14px;font-weight:700;max-width:68%;opacity:.85}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.seg button{flex:0 0 auto;border:0;background:var(--surface);border-radius:999px;height:40px;padding:0 16px;font:600 15px var(--display);white-space:nowrap;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--lift);padding:18px;display:grid;gap:12px}
.idea{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start}
.idea .k{font:700 17px var(--display);width:38px;height:38px;border-radius:13px;background:var(--c);color:#2B2340;display:grid;place-items:center}
.qcard{border-radius:var(--r-xl);padding:22px;background:var(--peri);color:#fff;display:grid;gap:10px;position:relative;overflow:hidden}
.qcard .eyebrow{color:rgba(255,255,255,.85)}
.qcard h2{font-size:clamp(23px,5.8vw,30px)}
.qcard p{color:rgba(255,255,255,.95);font-weight:600}
.voice{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.voice .bl{width:44px;height:44px}
.voice .say{padding:12px 14px;border-radius:6px 20px 20px 20px;background:var(--surface);box-shadow:var(--lift)}
.voice .say b{display:block;font:600 13px var(--display);letter-spacing:.04em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 55%,var(--ink));margin-bottom:2px}
.mission{border-radius:var(--r-lg);padding:16px;background:var(--pist);color:#2B2340;display:grid;gap:4px}
.mission b{font:600 15px var(--display)}
.oneness{border-radius:var(--r-lg);padding:20px;background:linear-gradient(135deg,var(--sun),var(--gum));color:#2B2340}
.oneness p{font:600 19px/1.4 var(--display);margin-top:6px}
.oneness .eyebrow{color:#2B2340;opacity:.7}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px}
.taskrow{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:14px 0;border-top:2px dashed var(--line)}
.taskrow:first-child{border-top:0}
.taskrow.done b{text-decoration:line-through;color:var(--muted)}
.taskrow .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.res{display:grid;gap:2px;text-decoration:none;color:inherit;padding:12px 0;border-top:2px dashed var(--line)}
.res:first-child{border-top:0}
/* worksheet */
.wq{display:grid;gap:10px;padding:16px 0;border-top:2px dashed var(--line)}
.wq:first-of-type{border-top:0}
.wq .p{font-weight:800}
.opt{text-align:left;border:0;border-radius:16px;background:var(--sunk);padding:12px 14px;width:100%;font-weight:700}
.opt.right{background:var(--good);color:#fff}.opt.wrong{background:var(--bad);color:#fff}
.grid{overflow-x:auto}.grid table{border-collapse:collapse;min-width:100%}
.grid th{font:600 13px var(--display);text-align:left;padding:8px;background:var(--sunk)}
.grid td{border:2px solid var(--line);padding:0;min-width:110px}
.grid td input{width:100%;border:0;background:transparent;padding:10px 8px;font-weight:700}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.token{border:0;border-radius:999px;background:var(--sunk);padding:8px 14px;font-weight:800;font-size:14px}
.token.sel{background:var(--sun);color:#2B2340;transform:rotate(-3deg)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.bucket{border:2.5px dashed var(--line);border-radius:18px;padding:10px;min-height:86px;display:flex;flex-wrap:wrap;gap:6px;align-content:start;background:transparent;text-align:left}
.bucket b{width:100%;font:600 14px var(--display)}
.pad{width:100%;height:220px;border-radius:18px;background:var(--sunk);touch-action:none;display:block}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}

anga Rashtriya Udyan ki Yatra","dk":[],"c":null},{"k":"ncert|hin|5|9","board":"ncert","subj":"hin","level":5,"book":"Veena (वीणा) · Class 5","n":"9","title":"Nyay","dk":[],"c":null},{"k":"ncert|hin|5|10","board":"ncert","subj":"hin","level":5,"book":"Veena (वीणा) · Class 5","n":"10","title":"Teen Machhliyan","dk":[],"c":null},{"k":"ncert|hin|5|11","board":"ncert","subj":"hin","level":5,"book":"Veena (वीणा) · Class 5","n":"11","title":"Hamare ye Kalamandir","dk":[],"c":null},{"k":"ncert|hin|5|12","board":"ncert","subj":"hin","level":5,"book":"Veena (वीणा) · Class 5","n":"12","title":"Ganga ki Kahani","dk":[],"c":null},{"k":"ncert|sci|3|1","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"1","title":"Family and Friends","dk":["B2","C6"],"c":{"covers":"Kinds of families, relatives and what we call them, roles and shared work at home, friends, generations then and now.","game":["Relation Railway","A train leaves 'Me Station' and only correct relations can board. Take turns reading riddle cards ('Your father's sister's son is your…'). Answer in 10 seconds to add a coach to your train; a wrong answer derails it. Longest train wins. Bonus coach for saying the word in a third language."],"exp":["Hand-span survey: measure the hand span and height of everyone in the family (and a neighbour family). Chart it: do children's hands grow toward their parents' sizes?"],"act":["Then-and-Now interview with a grandparent: games, school, food, toys at age 8.","Chore wheel: list every job at home, see who does it, rotate jobs for one week and talk about how it felt."],"proj":["Family Museum Box","Over 2 weeks collect 5 objects with family stories (an old photo, a utensil, a letter), label each, add a family tree and a recorded elder interview.","A shoebox museum the child presents to the family"],"read":["Grandma's Bag of Stories, Sudha Murty","The Family Book, Todd Parr"],"links":["Santoor Ch 3: Best Friends","Veena Ch 7: मित्र को पत्र","Maths Mela Ch 4: Vacation with My Nani Maa"],"x":{"learn":["Families come in many shapes: joint, nuclear, single-parent, adoptive, grandparents raising children. None is the 'real' one.","Indian languages name relatives precisely (mama, chacha, fufa, mausa) where English says only 'uncle'. Language shows what a culture pays attention to.","Families share work. Who does which job at home is a choice, not a law of nature.","Friends are the family we choose. Scientists have recorded long friendships in chimpanzees, dolphins and horses too.","Elephant herds are led by the oldest female; her memory of water holes helps the whole herd survive dry years."],"think":["Is a family made by blood, by living together, or by love? Can it be all three, or none?","Why might Hindi need four words where English needs one? What does English have many words for?","Contrary view: some people say only humans truly have friends. What would you need to see to believe an animal has a friend?"],"oneness":"Vasudhaiva Kutumbakam: the world is one family. If you trace any family tree back far enough, who is not your relative?","jokes":["Why are families like fudge? Mostly sweet, with a few nuts!","Why did the baby strawberry cry? Its mom and dad were in a jam!","Why did Nani bring a ladder to the party? She heard the drinks were on the house!"],"words":["UNCLE","NIECE","TWINS","CHILD","ELDER"],"quiz":[["Every family has a mother, a father and children.",false,"Families come in many forms; all of them are real families."],["In elephant herds, the oldest female usually leads.",true,"The matriarch remembers routes and water holes."],["In Hindi, your mother's brother is your mama.",true,"Your father's brother is chacha."],["English has as many words for relatives as Hindi.",false,"English uses 'uncle' and 'aunt' for many different relatives."]],"odd":[[["Mama","Chacha","Mausi","Fufa"],"Mausi","Mausi is a woman's relation; the others are men."],[["Nani","Dadi","Bhaiya","Nana"],"Bhaiya","Bhaiya is your own generation; the others are grandparents."]],"ws":[["My family tree","Draw three generations. Write each name and what you call them in two languages."],["Relation riddles","My father's sister is my ____. My mother's sister is my ____. My father's brother's son is my ____. My mother's mother is my ____."],["Then and now","Ask a grandparent: their favourite game, food, toy and school subject at your age. Fill in yours beside theirs."],["Think","Draw an animal family that lives together. Who leads it? Who looks after the babies?"]],"sheet":["Chore Wheel Week",["Job","Who did it","Mon","Tue","Wed","Thu","Fri","Sat","Sun"],6],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiment: hand-span survey",0.5,1],["Activities: elder interview, chore wheel",1.5,7],["Game: Relation Railway",0.5,1],["Project: Family Museum Box",3,14]],"cur":[["Great Questions to Ask Grandparents","StoryCorps","https://archive.storycorps.org/question-lists/great-questions-to-ask-grandparents/","Use for the elder interview; record it on a phone for the Family Museum Box."],["'A Sick Day for Amos McGee' discussion guide: can an animal be a friend?","Prindle Institute, Teaching Children Philosophy","https://www.prindleinstitute.org/?p=2581","A philosophy circle after reading: friendship across species and what makes someone family."]],"deep":[{"q":"What makes a group of people a family?","why":"Every society has families, but they are built very differently. Some count relatives through the mother's line, some through the father's, some through both. Some children are raised by a whole village. Asking what makes a family is asking what holds people together at all.","views":[["Biology","Family is shared genes: parents, children and their blood relatives. This explains inherited looks and traits, but not adopted children, step-parents or chosen family."],["Kerala's matrilineal Nair and Meghalaya's Khasi traditions","Family and property pass through the mother's line. Among the Khasi, the youngest daughter traditionally inherits the house. So 'who is family' depends on which line a society follows."],["Care-based view","Family is whoever cares for you day after day. A grandmother raising a child, or two friends who share a home for life, can be family."]],"tryit":"Make two lists: people related to you by birth, and people who look after you. Where do the lists overlap? Who is on only one list, and are they less your family?"},{"q":"Why does Hindi have chacha, mama, fufa and mausa where English has only 'uncle'?","why":"Languages grow words for what a culture needs to tell apart. In joint families it mattered whether an uncle was from your father's side (who might live with you) or your mother's side (who usually didn't).","views":[["Linguists","Kinship words show how a society organises duties: who you live with, who inherits, who you may marry."],["English speakers","One word is simpler, and the difference can be explained when needed ('my mother's brother')."],["Tamil","Tamil goes further: an older brother (annan) and younger brother (thambi) have different words, because age order carries different roles."]],"tryit":"Ask an elder for every relative's name in your home language. Count them. Then count the English words for the same people."},{"q":"Do animals have families and friends, or are we just imagining it?","why":"It is easy to see human feelings in animals. Scientists try hard not to, so the evidence matters.","views":[["Elephant researchers","Herds are led by the oldest female, who remembers water holes from decades before. Herds with older matriarchs survive droughts better."],["Primatologists","Chimpanzees and baboons form long friendships, groom friends more, and are calmer near them."],["Careful sceptics","We should not call it 'friendship' unless it is more than just staying near someone. What we can measure is choosing, helping and returning to the same individual."]],"tryit":"Watch a group of pigeons, crows or street dogs for 10 minutes. Do some always stay together? What would count as proof that two are friends?"}],"wsd":[["A. My family map",[{"t":"draw","p":"Draw your family tree for three generations: grandparents, parents and their brothers and sisters, you and your cousins. Write each person's name and what you call them."},{"t":"table","p":"Who lives in your home? Fill in the table.","cols":["Name","What I call them","One job they do at home"],"rows":5}]],["B. Relations puzzle",[{"t":"fill","p":"My father's sister is my ____. My mother's sister is my ____. My father's brother is my ____. My mother's brother is my ____.","a":["bua","mausi","chacha","mama"]},{"t":"mcq","p":"Your mother's mother's daughter could be:","opts":["Your mother or your mausi","Your bua","Your chachi","Your cousin"],"a":0}]],["C. Then and now",[{"t":"table","p":"Interview a grandparent or an elder.","cols":["Question","Them at age 8","Me now"],"rows":5,"prefill":["Favourite game","Favourite food","How they got to school","A toy","A chore they did"]}]],["D. Think it through",[{"t":"sort","p":"Sort these into 'related by birth', 'related by marriage' and 'chosen family'.","items":["Nani","Chachi","Best friend","Brother","Fufa","A neighbour who looks after you"],"cats":["By birth","By marriage","Chosen"]},{"t":"write","p":"A friend says: 'A family must have a mother and a father.' Do you agree? Give one example that supports them and one that doesn't.","lines":4}]],["E. Animal families",[{"t":"write","p":"Elephant herds are led by the oldest female. Why might the oldest one be the best leader in a drought?","lines":3}]]],"guide":"This chapter looks simple (names for relatives), but underneath it is about how humans build belonging. Your child will meet the idea that families are made in different ways: by birth, by marriage, by choice. Run it like a conversation, not a quiz. Bring your own family stories; children remember stories, not lists. Pitfall: don't correct family words from your own language into Hindi or English. Mama, mamu, ammavan are all right.","prep":[["read",1,"Read Chapter 1 yourself first and mark 2–3 places to stop and ask a question (15 min)","Your NCERT book, or the free PDF: ncert.nic.in/textbook.php → Class 3 → Our Wondrous World (also on the ePathshala app)"],["learn",1,"Read the three big questions and their views. Decide which one you'll open with and what you think (10 min)","In this app: open the chapter → Think"],["ws",0,"Print the worksheet or keep the app open on a tablet; set out pencils and crayons","In this app (Worksheet), or print it from the worksheet PDF"],["exp",0,"Gather a measuring tape or ruler, a notebook, and ask a neighbour family if they'll join the hand-span survey","Home; a neighbour"],["act",2,"Call a grandparent or elder and book a 20-minute interview (phone or video is fine)","Family"],["act",0,"Cut a paper circle and list the home jobs for the chore wheel","Paper, a pin, a pencil"],["game",1,"Write 15 relation riddle cards for Relation Railway (e.g. 'Your father's sister's son is your…')","Index cards or paper slips"],["proj",3,"Find a shoebox and ask relatives for old photos, a utensil or a letter with a story","Home; relatives"]]}}},{"k":"ncert|sci|3|2","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"2","title":"Going to the Mela","dk":["B2"],"c":{"covers":"Village fairs: stalls, crafts, toys and rides, buying and selling, crowds and staying safe.","game":["Mela Market","You each run a stall (bangles, chaat, toys) with ₹100 in play coins. Draw customer cards with wishes and budgets; sell, give exact change, restock. Surprise cards: 'Lost at the mela: what do you do?' (answer well to earn a coin). First to ₹150 wins."],"exp":["Firki lab: make paper pinwheels with 4, 6 and 8 blades. Which spins fastest in front of a fan? Does blade size matter?","Lattu test: spin a top on floor, steel plate and carpet. Time each spin. What slows it down?"],"act":["Draw a map of a mela (real or remembered) with stalls, entry, rides and a 'meeting point if lost'.","Make a traditional toy: a dugdugi (pellet drum) from a paper cup or a chakri."],"proj":["Our Mini Mela","Plan and run a small mela for family or neighbours: 3 stalls, handmade toys, price list, a money log, and a lost-and-found rule.","A real event, plus a chart of what sold and what was earned"],"read":["StoryWeaver (Pratham Books): search 'mela' for free picture books"],"links":["Maths Mela Ch 14: The Surajkund Fair","Maths Mela Ch 12: Give and Take"],"x":{"learn":["Melas are where people trade, make music, sell crafts and meet. Many happen after harvests, when people have time and money.","Famous melas: Pushkar (camels), Sonepur (cattle), Surajkund (crafts from across India), the Kumbh (one of the largest gatherings of people on Earth).","Buying and selling: prices, change, bargaining, and why a fair price must be fair to both sides.","Rides and toys work by science: a spinning ride presses you outward, a firki needs moving air, a dugdugi makes sound by beads striking a skin.","Crowd safety: agree a meeting point, know your family's phone number, go to the help desk if lost."],"think":["Is bargaining fair? Fair to whom: the buyer, the seller, the artisan who made it?","Why do so many melas happen just after harvest?","Contrary view: some say malls have replaced melas. What does a mela give people that a mall can't, and what does a mall give that a mela can't?"],"oneness":"Thousands of people at a mela move like one great being, then scatter and come back next year. Is a mela a kind of living thing?","jokes":["What did the giant wheel say to the child? Don't worry, I'll come around again!","Why did the balloon go to the mela? To get blown away!","Why was the maths book sad at the ticket counter? Too many problems!"],"words":["STALL","RIDES","CROWD","MONEY","FLUTE"],"quiz":[["The Surajkund mela in Haryana is famous for crafts.",true,"Artisans come from all over India and other countries."],["A pinwheel spins only when air moves.",true,"Moving air pushes on its blades."],["The Pushkar fair is famous for its camels.",true,"It is one of the world's largest camel fairs."],["If you get lost at a mela, you should walk away alone to search.",false,"Stay where you are or go to the help desk."]],"odd":[[["Firki","Dugdugi","Kite","Television"],"Television","The others are traditional mela toys you can make by hand."]],"ws":[["₹100 at the mela","Choose 4 things to buy from the price list (balloon ₹15, chaat ₹30, bangles ₹40, firki ₹10, ride ₹25). Add them up. How much change do you get?"],["Mela map","Draw a mela with 6 stalls, a ride, the entrance and a 'meet here if lost' spot."],["How does it work?","Draw a firki and arrows to show where the air pushes it."],["Think","Write one thing that makes a price fair to the buyer and one that makes it fair to the maker."]],"sheet":["Firki Lab",["Firki","Number of blades","Blade size","Spins in 10 seconds (fan)","My guess why"],4],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: pinwheel lab, top test",1,1],["Activities: mela map, make a toy",1.5,2],["Game: Mela Market",0.75,1],["Project: Our Mini Mela",4,10]],"cur":[["Toys from Trash: hundreds of free, copyright-free toy designs (pencil fan, paper toys, sound toys)","Arvind Gupta","https://www.arvindguptatoys.com","Pick 3 toys to make and sell at the Mini Mela stall."]],"deep":[{"q":"Is bargaining fair?","why":"At a mela, prices are often not fixed. The buyer wants it cheap; the seller wants enough to live on. Bargaining is an old way of finding a price both accept, but it can also be unequal.","views":[["The haggler","Bargaining is a game of respect: both sides talk and meet in the middle."],["The artisan","If customers always push the price down, the person who made the thing by hand for days may not earn enough. Fair-trade shops fix prices to protect makers."],["Economists","A fair price is one both sides accept freely, knowing the facts. Bargaining is fair when both know what the thing is really worth."]],"tryit":"Play shop: one person makes a paper toy and must earn at least ₹20 worth of tokens for it. The other has ₹30. Bargain. Then swap roles. How did each side feel?"},{"q":"Why do so many melas happen just after harvest?","why":"Melas are tied to the farming calendar. After harvest, farmers have money, food and free time, and the weather is often pleasant.","views":[["Historians","Fairs like Sonepur and Pushkar grew from cattle and camel trading at set times each year, when animals and crops could be sold."],["Religious traditions","Many melas mark a festival or a holy bath (like the Kumbh), so the date comes from the stars and the Moon."],["Today","Some melas are now planned for tourists. Does that change what a mela is?"]],"tryit":"Pick three melas (Pushkar, Surajkund, a local one). Find the month each happens and what farmers are doing at that time."},{"q":"Is a mela a kind of living thing?","why":"A mela appears, grows, draws in energy (people, money, food), changes, ends, and comes back next year. Thinking about this tests what we mean by 'alive'.","views":[["Biologists","No: a mela has no cells and does not reproduce or evolve by itself."],["Systems thinkers","Cities, markets and ant colonies behave like living systems: many parts following simple rules make something bigger that seems to have a life of its own."],["Oneness traditions","Thousands of people moving as one, then scattering and gathering again, is a picture of how separate selves are part of one larger life."]],"tryit":"Watch a crowd (or a video of one) from above. Does it move like one creature? Draw the arrows."}],"wsd":[["A. Spend wisely",[{"t":"table","p":"You have ₹100. Prices: balloon ₹15, chaat ₹30, bangles ₹40, pinwheel ₹10, ride ₹25, kulfi ₹20. Choose four things.","cols":["Item","Price (₹)"],"rows":5,"prefill":["","","","","Total"]},{"t":"write","p":"₹100 minus your total = how much change? Show your working.","lines":2},{"t":"mcq","p":"Which set costs exactly ₹100?","opts":["Bangles, chaat, kulfi, pinwheel","Ride, kulfi, chaat, balloon","Bangles, ride, chaat","Kulfi, pinwheel, balloon, ride"],"a":0}]],["B. How mela toys work",[{"t":"draw","p":"Draw a pinwheel. Use arrows to show where the air comes from and which way it turns."},{"t":"mcq","p":"A pinwheel spins fastest when:","opts":["The air is still","Air pushes on its blades","It is painted brightly","It is heavy"],"a":1},{"t":"write","p":"A dugdugi (pellet drum) makes sound when you twist it. What is hitting what? Why does it stop when you stop twisting?","lines":3}]],["C. Staying safe",[{"t":"write","p":"Write your family's plan if you get separated at a mela: where you meet, who you ask, what number you say.","lines":3}]],["D. Think it through",[{"t":"write","p":"A potter spent two days making a pot and asks ₹200. A buyer offers ₹80. Write what each might say. What would be a fair price, and why?","lines":4},{"t":"sort","p":"Sort what a mela gives people.","items":["Buying things","Meeting friends","Music and shows","Selling crafts","Rides","Festival prayers"],"cats":["Trade","Fun","Culture"]}]]],"guide":"A mela is a lesson in money, crowds, motion and craft all at once. The science hides in the toys: a firki is a turbine, a lattu is a gyroscope. Let your child run the money in the Mela Market game; counting real change is the point. Pitfall: don't explain why the pinwheel spins before they've tried changing it. Let them guess, test, then talk.","prep":[["read",1,"Read Chapter 2 yourself first and mark 2–3 places to stop and ask a question (15 min)","Your NCERT book, or the free PDF: ncert.nic.in/textbook.php → Class 3 → Our Wondrous World (also on the ePathshala app)"],["learn",1,"Read the three big questions and their views. Decide which one you'll open with and what you think (10 min)","In this app: open the chapter → Think"],["ws",0,"Print the worksheet or keep the app open on a tablet; set out pencils and crayons","In this app (Worksheet), or print it from the worksheet PDF"],["exp",0,"Get A4 paper, scissors, pins, pencils with erasers and a table fan for the pinwheel lab; a lattu (top), a steel plate and a stopwatch","Home; a toy shop for the lattu"],["act",0,"Paper cups, thread, two beads or buttons, and a stick for the dugdugi","Home"],["game",1,"Make play coins (₹1, 2, 5, 10, 20) and 12 customer cards with wishes and budgets for Mela Market","Paper, or toy money"],["proj",3,"Invite 3–4 family members or neighbours to the Mini Mela and fix a date","Family; neighbours"]]}}},{"k":"ncert|sci|3|3","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"3","title":"Celebrating Festivals","dk":["B2","B5"],"c":{"covers":"Festivals across India, why they happen when they do (harvests, seasons, the Moon), foods, lights, sharing and celebrating together.","game":["Festival Calendar Race","A circle of 12 months on the floor. Draw festival cards (Pongal, Bihu, Onam, Eid, Diwali, Christmas, Baisakhi, Holi, Durga Puja, Gurpurab, Phooldei…). Place each in its month and say why it falls then: harvest, season or Moon. Correct month 1 point, correct reason 2 points, naming the Moon's phase that night 3 points."],"exp":["Haldi magic: paint with haldi paste, then dab soap water on it. Why does yellow turn red? (Haldi is a natural indicator.)","Diya and jar: which burns longer, a diya under a small glass or under a big jar? (Adult lights it.)"],"act":["Festival food map of India: one dish per festival, pinned on a map.","Mark the next 3 months' full and new moons and find which festivals land on them."],"proj":["A Festival of Our Own","Design a new family festival for this season: what it celebrates, food, decorations, a song, an invitation. Host it.","A celebration, an invitation card and photos"],"read":["Binny's Diwali, Thrity Umrigar","Lights for Gita, Rachna Gilmore","Amma, Tell Me About Diwali!, Bhakti Mathur"],"links":["Veena Ch 9: प्रकृति पर्व – फूलदेई","Maths Mela Ch 7: Raksha Bandhan","Santoor Ch 11: Chanda Mama Counts the Stars"],"x":{"learn":["Many festivals mark seasons and harvests: Pongal, Bihu, Lohri and Makar Sankranti fall around mid-January as winter ends; Baisakhi and Onam celebrate harvests.","Many festivals follow the Moon: Holi and Guru Purnima are on full moons, Diwali on the new moon of Kartik, and Eid begins when the new crescent moon is seen.","Lunar calendars make festival dates move each year; Christmas follows the solar calendar and stays on 25 December.","The same idea travels under different names across India; Phooldei in Uttarakhand welcomes spring with flowers on doorsteps.","Festivals are about sharing: food, light, music, gifts, and remembering the people and nature that keep us alive."],"think":["Why does Diwali's date change every year but Christmas doesn't?","Birds sing more in spring and frogs call in the monsoon. Are those animals' festivals?","Two sides: firecrackers bring joy, but they also pollute the air and frighten animals. What would a festival that keeps the joy look like?"],"oneness":"So many festivals thank the Sun, the Moon, the rain and the harvest. Is a festival people saying thank you to the rest of the universe?","jokes":["Why did the diya go to school? To become a little brighter!","What did one firecracker say to the other? My pop is bigger than yours!","Why are kites never lonely at Sankranti? The whole sky is full of friends!"],"words":["LIGHT","SWEET","FEAST","DRUMS","LUNAR"],"quiz":[["Holi is celebrated on a full-moon day.",true,"It falls on the full moon of Phalguna."],["Eid begins when the new crescent moon is seen.",true,"That is why the date can differ by a day between places."],["Diwali falls on the same date every year.",false,"It follows the Moon, so its date moves."],["Pongal, Bihu and Lohri are linked to harvests and winter's end.",true,"They fall around mid-January."]],"odd":[[["Holi","Guru Purnima","Buddha Purnima","Diwali"],"Diwali","Diwali is on a new moon; the others are on full moons."]],"ws":[["Festival circle","Draw a circle of 12 months. Write 6 festivals in their months and why each happens then."],["Moon match","Draw a full moon and a new moon. Write one festival under each."],["Design a festival","Invent a festival for this season: what it celebrates, food, decoration and a song."],["Two sides","Firecrackers: write one reason people love them and one reason to rethink them."]],"sheet":["Moon Diary (2 weeks)",["Date","Time","Draw the Moon","Any festival near?"],14],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: haldi indicator, diya jar",0.75,1],["Activities: festival food map, moon calendar",1.5,14],["Game: Festival Calendar Race",0.5,1],["Project: A Festival of Our Own",3,7]],"cur":[["Moon Phases lesson (ball and lamp in a dark room)","NASA JPL Education","https://www.jpl.nasa.gov/edu/teach/activity/moon-phases/","Model why Holi falls on a full moon and Diwali on a new moon."],["Cookie moon phases","NASA Space Place (via library and museum adaptations)","https://spaceplace.nasa.gov","Scrape biscuit cream to make each phase; eat the new moon."]],"deep":[{"q":"Why does Diwali move around the calendar but Christmas doesn't?","why":"People have always used the sky to keep time. The Sun gives the year and the seasons; the Moon gives months of about 29½ days. The two don't fit neatly: 12 lunar months are about 11 days shorter than a solar year.","views":[["The solar calendar (used for Christmas and the school year)","Follows the Sun, so dates stay with the seasons."],["The Hindu lunisolar calendar (Panchang)","Months follow the Moon, but an extra month (adhik maas) is added about every three years so festivals stay in the right season. That's why Diwali always comes in autumn but on different dates."],["The Islamic calendar","Purely lunar with no extra month, so Eid moves through all the seasons over about 33 years."]],"tryit":"Find the dates of Diwali and Eid for the last 5 years. Which moves more? Can you explain why from the rules above?"},{"q":"Should festivals change when they harm others?","why":"Festivals carry meaning across generations. But some customs (loud firecrackers, plastic decorations, idols in rivers) affect air, water, animals and people with breathing problems.","views":[["Tradition keepers","Customs connect us to our grandparents and give the festival its meaning; changing them loses something."],["Environmental scientists","Firecrackers add fine dust that can make city air much worse for days; animals and birds are frightened by the noise."],["Many communities","Festivals have always changed. Clay idols, green crackers, community diyas and quiet hours are new traditions keeping the old meaning."]],"tryit":"Ask three elders how their festivals were celebrated as children. What changed, and why? Was the change for better or worse?"},{"q":"Do animals and plants have festivals?","why":"In spring, birds sing and nest; in the monsoon, frogs gather and call all night; some flowers bloom together on one night. These are timed by the season, like many human festivals.","views":[["Ecologists","These are 'phenology': life events timed by day length, temperature and rain. Many human festivals are also tied to these same cycles, such as harvest festivals."],["Poets and many traditions","The koel's call announcing spring has been celebrated for centuries as nature's own festival."],["Careful thinkers","A festival needs meaning and choice. Do frogs choose, or only respond? What is the difference?"]],"tryit":"For two weeks, note which birds call at dawn and which flowers are blooming. Is anything 'celebrating' this season?"}],"wsd":[["A. Festivals around the year",[{"t":"table","p":"Fill in six festivals.","cols":["Festival","Month","Season","Why then? (harvest / Moon / new year / other)"],"rows":6},{"t":"sort","p":"Sort these festivals.","items":["Holi","Guru Purnima","Diwali","Pongal","Baisakhi","Eid"],"cats":["Moon-based","Harvest-based","Both"]}]],["B. The Moon's clock",[{"t":"draw","p":"Draw the Moon on a full-moon night and on a new-moon night. Under each, write one festival that falls on it."},{"t":"mcq","p":"Diwali falls on:","opts":["A full moon","A new moon (amavasya)","The longest day","Any day the family chooses"],"a":1},{"t":"fill","p":"12 Moon months are about ____ days shorter than one Sun year.","a":["11"]}]],["C. Look closer",[{"t":"write","p":"Paint a strip of paper with haldi paste. Dab soap water on it. What happened to the colour? What might be inside soap that haldi 'notices'?","lines":3}]],["D. Think it through",[{"t":"write","p":"Firecrackers: write two reasons people love them and two problems they cause. Then design a celebration that keeps the joy.","lines":5}]],["E. Create",[{"t":"draw","p":"Invent a festival for this season. Draw its symbol and write what it celebrates, one food, and one way everyone joins in."}]]],"guide":"Festivals are how communities keep time with the sky, the harvest and each other. This chapter connects calendars, the Moon and food. Include festivals your family doesn't celebrate, and ask why different people celebrate different things. Pitfall: the diya experiment uses a flame. You light it and stay at the table the whole time.","prep":[["read",1,"Read Chapter 3 yourself first and mark 2–3 places to stop and ask a question (15 min)","Your NCERT book, or the free PDF: ncert.nic.in/textbook.php → Class 3 → Our Wondrous World (also on the ePathshala app)"],["learn",1,"Read the three big questions and their views. Decide which one you'll open with and what you think (10 min)","In this app: open the chapter → Think"],["ws",0,"Print the worksheet or keep the app open on a tablet; set out pencils and crayons","In this app (Worksheet), or print it from the worksheet PDF"],["exp",0,"Haldi, water, a little soap or baking soda, white paper; a diya, a small glass and a big jar, matches (adult only)","Kitchen"],["act",0,"Print or draw a map of India for the festival food map; find this month's full and new moon dates","A panchang or any moon calendar website"],["game",1,"Make 12 month cards in a circle and 15 festival cards from different regions and religions","Paper"],["proj",2,"Pick a day this week or next to host the family festival","Family"]]}}},{"k":"ncert|sci|3|4","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"4","title":"Getting to Know Plants","dk":["A5"],"c":{"covers":"Kinds of plants (trees, shrubs, herbs, climbers), parts and their jobs, leaf shapes, seeds, what plants need, how we use plants.","game":["Leaf Detective Bingo","Bingo cards show leaf shapes, edges and vein patterns (heart, needle, toothed, compound, parallel veins). On a 20-minute walk, mark a square only when you hold a matching leaf. First line shouts 'Leaf!'. Final round: 'Which part do we eat?' speed quiz with carrot, potato, spinach, cauliflower, rice."],"exp":["Coloured-water flower: put a white flower or celery stalk in water with food colour. Check after 6 and 24 hours. How did the colour climb?","Seeds' needs: sow moong in four cups (water + light, no water, dark, cold fridge). Compare after 5 days."],"act":["Leaf-rubbing book: 10 leaves, crayon rubbings, names in two languages.","Adopt a tree: measure its trunk with string, sketch it, visit monthly."],"proj":["Kitchen-Garden Pot","Sow methi or dhaniya, water and measure daily, harvest at about 4 weeks, and cook something with it.","A harvest, a growth chart and a dish"],"read":["From Seed to Plant, Gail Gibbons","The Tiny Seed, Eric Carle","A Seed Is Sleepy, Dianna Hutts Aston"],"links":["Veena Ch 5: आम का पेड़","Veena Ch 13: पेड़ों की अम्मा 'तिमक्का'","Santoor Ch 4: Out in the Garden"],"x":{"learn":["Plants come as trees, shrubs, herbs, climbers and creepers.","Each part has a job: roots hold and drink, the stem carries water up and food down, leaves make food from sunlight, flowers make seeds, seeds start new plants.","Leaves differ: net veins (mango) vs parallel veins (grass, banana); simple vs compound leaves.","Roots differ: one main taproot (carrot, mustard) vs a bunch of thin fibrous roots (grass, rice). A potato is a stem, not a root.","Saalumarada Thimmakka of Karnataka planted and cared for hundreds of banyan trees along a road, treating them as her children."],"think":["Do plants move? Think of a sunflower, a climbing vine, roots finding water, the touch-me-not.","Is a tree one living thing or a whole city of living things?","Scientists disagree: some say trees 'talk' and share food through fungus networks under the soil (the 'wood wide web'); others say the evidence is weaker than the stories. How could you find out?"],"oneness":"You breathe out what the tree breathes in, and the tree breathes out what you breathe in. Are you and the tree breathing each other?","jokes":["Why was the tree so good at school? It was rooted in its studies!","What did the big flower say to the little flower? Hey, bud!","Why do trees hate tests? They get stumped!"],"words":["ROOTS","STEMS","SEEDS","PETAL","SHOOT"],"quiz":[["A potato is a stem.",true,"It has 'eyes' (buds) that sprout, like a stem."],["A carrot is a root.",true,"It's a taproot that stores food."],["Leaves make food using sunlight.",true,"This is photosynthesis."],["All plants have flowers.",false,"Ferns and mosses never flower."]],"odd":[[["Carrot","Radish","Beetroot","Potato"],"Potato","A potato is a stem; the others are roots."],[["Mango","Neem","Tulsi","Peepal"],"Tulsi","Tulsi is a small herb; the others are trees."]],"ws":[["Label me","Draw a plant and label root, stem, leaf, flower, fruit, seed. Write each part's job."],["Which part do we eat?","Sort: carrot, potato, spinach, cauliflower, rice, mango, ginger, sugarcane."],["Leaf hunt","Find 5 leaves. For each: shape, edge (smooth or toothed), veins (net or parallel)."],["Think","Write one way a plant moves. How could you film it to prove it?"]],"sheet":["Coloured-Water Flower",["Time","What colour is the flower?","How far has the colour climbed?","My drawing"],4],"hours":[["Read & discuss the NCERT chapter",2,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: coloured-water flower, seeds' needs",1,5],["Activities: leaf-rubbing book, adopt a tree",1.5,30],["Game: Leaf Detective Bingo",0.75,1],["Project: Kitchen-Garden Pot",2.5,28]],"cur":[["Journey to the Center of a Seed (bean dissection)","KidsGardening","https://kidsgardening.org/lesson-plans-journey-to-the-center-of-a-seed/","Soak rajma overnight, split it, find the baby plant and its food store with a magnifier."]],"deep":[{"q":"Do plants move, sense and decide?","why":"Plants seem still only because they are slow. Time-lapse films show shoots circling, roots bending towards water, leaves following the Sun. J.C. Bose built instruments to record plant responses over a century ago.","views":[["Plant scientists","Plants sense light, gravity, touch, chemicals and damage, and respond, all without a brain or nerves. Roots grow downward because special cells sense gravity."],["'Plant intelligence' researchers","Some argue plants learn and remember (the touch-me-not stops folding when repeatedly dropped harmlessly)."],["Critics","Words like 'decide' and 'learn' may be too human. Responding is not the same as thinking."]],"tryit":"Put a potted plant by a window, mark which way its leaves face, then turn it around. Photograph it every day for a week."},{"q":"Is a tree one living thing or a whole city?","why":"A big tree is home to insects, birds, lichens, fungi and microbes. Its roots partner with fungi that bring water and minerals in exchange for sugar.","views":[["Ecologists","A tree is a keystone: remove it and many species lose their homes."],["The 'wood wide web' idea","Some scientists say trees share sugar and warnings through fungal networks under the soil."],["Recent critics (2023)","Other scientists reviewed the evidence and said those claims are often exaggerated; the fungi certainly connect roots, but whether trees 'help each other' is unproven."]],"tryit":"Choose one tree. In 15 minutes, count every other living thing you can find on or under it."},{"q":"Why did Saalumarada Thimmakka call trees her children?","why":"Thimmakka of Karnataka, who had no children of her own, planted and watered hundreds of banyan saplings along a highway, carrying water for kilometres. She was awarded the Padma Shri.","views":[["Science","A banyan can live for centuries and support whole communities of creatures; planting one is one of the longest-lasting gifts a person can give."],["Many Indian traditions","Trees like the peepal, banyan and tulsi are treated as sacred and cared for like family."],["Your view","Can you love a tree? Can a tree be family? What would you need to do for it?"]],"tryit":"Adopt one tree for a month: name it, measure its trunk with string, give it water in summer, and record its visitors."}],"wsd":[["A. Parts and jobs",[{"t":"draw","p":"Draw a whole plant (pull up a small weed and wash its roots). Label: root, stem, leaf, flower, fruit or seed."},{"t":"match","p":"Match each part to its job.","pairs":[["Root","Holds the plant and drinks water"],["Stem","Carries water up and food down"],["Leaf","Makes food using sunlight"],["Flower","Makes seeds"],["Seed","Starts a new plant"]]}]],["B. Which part do we eat?",[{"t":"sort","p":"Sort these foods.","items":["Carrot","Potato","Spinach","Cauliflower","Rice","Ginger","Mango","Sugarcane"],"cats":["Root","Stem","Leaf","Flower","Fruit or seed"]},{"t":"mcq","p":"A potato is really a:","opts":["Root","Stem","Fruit","Seed"],"a":1}]],["C. Leaf detective",[{"t":"table","p":"Collect five different leaves.","cols":["Plant","Shape","Edge (smooth / toothed)","Veins (net / parallel)"],"rows":5}]],["D. Experiment",[{"t":"write","p":"You put a white flower in coloured water. After a day the petals are coloured. Explain how the colour got there. Which part carried it?","lines":3}]],["E. Think it through",[{"t":"write","p":"Write one way plants move, and how you could prove it with a phone camera.","lines":3}]]],"guide":"The big idea is that plants are not still: they drink, climb toward light, and sense the world. Start the seed and coloured-water experiments early so there is something to see on the day. Pitfall: don't name plant parts first. Let your child notice and describe, then give the words.","prep":[["read",1,"Read Chapter 4 yourself first and mark 2–3 places to stop and ask a question (15 min)","Your NCERT book, or the free PDF: ncert.nic.in/textbook.php → Class 3 → Our Wondrous World (also on the ePathshala app)"],["learn",1,"Read the three big questions and their views. Decide which one you'll open with and what you think (10 min)","In this app: open the chapter → Think"],["ws",0,"Print the worksheet or keep the app open on a tablet; set out pencils and crayons","In this app (Worksheet), or print it from the worksheet PDF"],["exp",5,"Sow moong in 4 cups (light, dark, no water, fridge) so there are results to compare on the day","Kitchen; any kirana shop for moong"],["exp",1,"Put a white flower or celery stalk in food-coloured water tonight","Kitchen; a vegetable vendor for celery"],["act",0,"Collect crayons and thin paper for leaf rubbings; string and a ruler to measure a tree trunk","Home; a park"],["game",1,"Draw Leaf Detective Bingo cards: leaf shapes, edges and vein patterns","Paper; or search 'leaf shape chart'"],["proj",0,"Buy methi or dhaniya seeds and a pot with soil","Nursery or kirana shop"]]}}},{"k":"ncert|sci|3|5","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"5","title":"Plants and Animals Live Together","dk":["A5","B4","B9"],"c":{"covers":"Homes and habitats, how plants and animals depend on each other: food, shelter, pollination and seed spreading.","game":["Web of Life","Lay 12 living-thing cards on a table (neem tree, bee, myna, earthworm, cow, grass, frog, snake, child…). Take turns joining two with a string and saying how one depends on the other. Then draw a 'Gone!' card: remove that being and every string tied to it. Who is left standing? Rebuild with a rescue plan."],"exp":["Seed hitchhikers: wear old socks over shoes and walk through grass, then 'plant' the sock in a tray of soil and water it. What grows?","Be a bee: dab a cotton bud in one flower and touch another. Look with a magnifier at the pollen."],"act":["Minibeast hunt under a flowerpot or stone (put everything back).","Bird-feeder log: who visits, when, what do they eat?"],"proj":["Wildlife-Friendly Corner","Set up a water bowl, a feeder, a flowering plant and a bamboo 'insect hotel' on a balcony or garden; keep a 3-week visitor log.","A working mini habitat and a visitor chart"],"read":["Over and Under the Pond, Kate Messner","Up in the Garden and Down in the Dirt, Kate Messner","What Do You Do With a Tail Like This?, Steve Jenkins & Robin Page"],"links":["Veena Ch 4: बया हमारी चिड़िया रानी!","Veena Ch 2: चींटी","Veena Ch 3: कितने पैर?","Santoor Ch 2: Badal and Moti"],"x":{"learn":["A habitat gives food, water and shelter. Trees, ponds and even cracks in walls are habitats.","Plants and animals depend on each other: bees and bats carry pollen, birds and animals spread seeds, earthworms enrich soil, plants feed and shelter animals.","Food chains: grass is eaten by a deer, a deer by a tiger. Decomposers (fungi, worms, bacteria) return everything to the soil.","The baya weaver: the male weaves a hanging nest of grass; the female inspects it and chooses.","Remove one living thing and others feel it; that's why forests with many kinds of life recover better."],"think":["Who needs whom more: the bee or the flower?","If all mosquitoes vanished, would that be good? Some scientists think little would change; others say fish, birds and bats would lose food. What do you think?","Is a weed bad? Who decides which plant is a weed?"],"oneness":"A tree feeds the bird, the bird spreads the tree's seeds, the worm feeds the tree. If each needs the others, is a forest one big living being?","jokes":["Why don't ants get sick? They have tiny anty-bodies!","Why did the bee get married? It found its honey!","What did the tree say to the woodpecker? Leaf me alone!"],"words":["BIRDS","NESTS","HONEY","SNAKE","PLANT"],"quiz":[["The male baya weaver builds the nest.",true,"The female chooses which nest she likes."],["Bats can pollinate flowers.",true,"Some flowers, like those of the banana family and baobab, are pollinated by bats."],["Earthworms make soil better for plants.",true,"Their tunnels let in air and their waste is rich food for plants."],["Animals never help plants.",false,"They pollinate, spread seeds and enrich soil."]],"odd":[[["Bee","Butterfly","Bat","Stone"],"Stone","Bees, butterflies and bats can all carry pollen."]],"ws":[["Who needs whom?","Draw 6 living things and connect them with arrows. Write on each arrow what is given."],["Food chain","Fill in: ____ → caterpillar → ____ → snake → ____."],["Habitat match","Match: frog, baya, earthworm, monkey, fish → pond, tree, soil, river, palm tree."],["Think","Write the story of a weed, told by the weed."]],"sheet":["Minibeast Hunt",["Where I looked","What I found","How many","What it was doing","Drawing"],6],"hours":[["Read & discuss the NCERT chapter",2,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: seed hitchhikers, be a bee",1,10],["Activities: minibeast hunt, bird-feeder log",1.5,14],["Game: Web of Life",0.5,1],["Project: Wildlife-Friendly Corner",3,21]],"cur":[["Web of Life (yarn food-web game)","Project Learning Tree","https://www.plt.org/family-activity/web-of-life/","Play with Indian species cards; cut one strand and see who is affected."],["Oh Deer! (habitat and limiting-factors running game)","Project WILD","https://outdoornebraska.gov/wp-content/uploads/2023/03/Oh-Deer.pdf","Best with siblings or a homeschool group: players become deer and food, water or shelter."],["'Hey, Little Ant' discussion guide","Prindle Institute","https://scholarship.depauw.edu/prindle_teaching/83","Should the boy squish the ant? A philosophy circle on how we treat small lives."]],"deep":[{"q":"Who needs whom more: the bee or the flower?","why":"Bees get nectar and pollen as food; flowers get their pollen carried to other flowers so they can make seeds. Neither gives on purpose, yet both depend on the other. This is called mutualism.","views":[["Ecologists","Many crops (mangoes, apples, almonds, many vegetables) depend heavily on pollinators; without them, harvests fall sharply."],["Evolution biologists","Flowers and pollinators shaped each other over millions of years: long tubes and long tongues, bright colours and colour vision."],["A deeper question","If neither could exist without the other for long, are they two things or one partnership?"]],"tryit":"Sit by a flowering plant for 10 minutes. Count the visitors. Do different insects visit different flowers?"},{"q":"If all mosquitoes disappeared, would that be good?","why":"Mosquitoes spread malaria and dengue, which kill many people each year. But they are also food for fish, frogs, birds and bats, and some pollinate plants.","views":[["Some scientists","Most mosquito species are not harmful to people, and other insects could fill their role; removing the few disease-carrying species could save many lives."],["Other ecologists","Mosquito larvae are a big food source in ponds and the Arctic; removing them could have effects we can't predict."],["Ethicists","Do humans have the right to wipe out a species, even a harmful one?"]],"tryit":"Draw a food web around a pond with a mosquito in it. Cross it out. Which arrows break?"},{"q":"Who decides what a 'weed' is?","why":"A weed is just a plant growing where a person doesn't want it. Many 'weeds' are medicines, food for insects or the first plants to heal damaged soil.","views":[["Farmers","Weeds compete with crops for water and light and lower the harvest."],["Ecologists","Wild plants feed bees and butterflies and hold soil together."],["Ayurveda and folk medicine","Plants like 'doob' grass and 'punarnava' are used as medicines."]],"tryit":"Find three 'weeds' near your home. Learn their names. Is any of them useful to an insect, a bird or a person?"}],"wsd":[["A. Who lives where?",[{"t":"match","p":"Match each living thing to its home.","pairs":[["Frog","Pond"],["Baya weaver","Hanging nest on a palm"],["Earthworm","Soil"],["Honeybee","Hive"],["Squirrel","Tree hole"]]}]],["B. Food chains",[{"t":"fill","p":"Grass → ____ → tiger. Leaf → caterpillar → ____ → snake.","a":["deer","bird (e.g. myna)"]},{"t":"draw","p":"Draw a food web with at least 6 living things from your area. Draw arrows from the food to the eater."}]],["C. Helpers",[{"t":"table","p":"How do animals help plants?","cols":["Animal","What it does for plants"],"rows":4,"prefill":["Bee","Bird","Earthworm","Bat"]},{"t":"mcq","p":"A plant with sticky, hooked seeds most likely spreads them by:","opts":["Wind","Water","Sticking to animals' fur","Exploding pods"],"a":2}]],["D. Investigate",[{"t":"table","p":"Minibeast hunt: look under 4 places (a pot, a stone, leaves, bark).","cols":["Where","What I found","How many"],"rows":4}]],["E. Think it through",[{"t":"write","p":"If all the bees in your area disappeared, what would happen to the mango trees? And then to the people and animals who eat mangoes?","lines":4}]]],"guide":"Nothing lives alone. This chapter is about webs: who eats whom, who carries whose seeds, who needs whom. Spend real time outdoors; ten minutes looking under one stone teaches more than the whole page. Pitfall: teach care for small creatures. Everything you lift goes back exactly as it was.","prep":[["read",1,"Read Chapter 5 yourself first and mark 2–3 places to stop and ask a question (15 min)","Your NCERT book, or the free PDF: ncert.nic.in/textbook.php → Class 3 → Our Wondrous World (also on the ePathshala app)"],["learn",1,"Read the three big questions and their views. Decide which one you'll open with and what you think (10 min)","In this app: open the chapter → Think"],["ws",0,"Print the worksheet or keep the app open on a tablet; set out pencils and crayons","In this app (Worksheet), or print it from the worksheet PDF"],["exp",0,"Old socks to wear over shoes, a tray of soil; cotton buds and a magnifying glass","Home; a stationery shop for the magnifier"],["act",0,"Pick a flowerpot or stone to look under; set up a simple bird feeder (grains in a lid)","Home; balcony or garden"],["game",1,"Make 12 living-thing cards and get a ball of string for Web of Life","Paper, string"],["proj",2,"Find a shallow bowl, a flowering plant, and bamboo pieces or hollow sticks for the insect hotel","Nursery; hardware shop"]]}}},{"k":"ncert|sci|3|6","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"6","title":"Living in Harmony","dk":["B9","C4"],"c":{"covers":"Living peacefully with people and nature: sharing, solving quarrels, caring for animals and surroundings.","game":["Harmony Village","A cooperative game: you both win or lose together. Each round flip a Trouble card (the pond is dirty, friends are quarrelling, a stray dog is hungry, a tree will be cut). Spend your action tokens on fixes and explain your fix to earn a bonus. Keep the Harmony meter above zero for 10 rounds to win."],"exp":["Noise map: rate the noise in 6 places (kitchen, road, park, temple, bedroom at night) from 1 to 5, or use a phone sound meter. Where do birds sing most?"],"act":["Quarrel-fix role play: act out three common fights and try three ways to solve each.","Ask neighbours how they share water, parking or a park. Draw what you learn."],"proj":["Harmony Pact","Family and child pick one action for 2 weeks (water bowls for street animals, a peace corner, a sharing shelf) and keep a log.","A pact poster and a 2-week log"],"read":["The Curious Garden, Peter Brown","Wangari's Trees of Peace, Jeanette Winter","Have You Filled a Bucket Today?, Carol McCloud"],"links":["Veena Ch 18: हम अनेक किंतु एक","Veena Ch 12: अपना-अपना काम","Santoor Ch 8: Thank God"],"x":{"learn":["Living in harmony means sharing space and resources fairly with people and with nature.","Disagreeing is normal. Listening, taking turns and finding a fix both sides accept is a skill you can practise.","When forests shrink, animals come into towns and farms (monkeys, elephants, leopards). It isn't only the animals' fault.","People have found clever ways to share: beehive fences keep elephants out of farms because elephants avoid bees.","The Bishnoi community and the Chipko movement protected trees with their own bodies."],"think":["When a monkey snatches food in a town, who is the real problem: the monkey, or the people who took its forest?","Is it always good to agree? Can disagreeing kindly lead to better ideas?","Contrary view: people often say nature is 'in balance'. Many ecologists say nature is always changing, never perfectly balanced. Which seems true where you live?"],"oneness":"If you dirty the river, the river comes back to you as water. Can you hurt nature without hurting yourself?","jokes":["Why did the two trees stop arguing? They agreed to leaf it!","What do you call a peaceful dinosaur? A calm-asaurus!","Why do bees hum? They forgot the words!"],"words":["PEACE","SHARE","TRUST","SMILE","UNITY"],"quiz":[["Beehive fences can keep elephants away from farms.",true,"Elephants avoid bees."],["The Chipko movement was about hugging trees to stop them being cut.",true,"It began in the hills of Uttarakhand in the 1970s."],["Living in harmony means never disagreeing.",false,"It means disagreeing kindly and finding fair fixes."],["Animals come into towns only because they are naughty.",false,"Often their homes and food have been taken."]],"odd":[[["Share","Listen","Shout","Help"],"Shout","The other three help people get along."]],"ws":[["Fix-it comic","Draw a 4-box comic: a quarrel, two feelings, a fix, a happy end."],["Swap the story","Tell the story of a monkey stealing a banana, from the monkey's side."],["Our home rule","Write one rule for your home that is good for people AND animals."],["Think","Is nature in balance, or always changing? Give one example you have seen."]],"sheet":["Harmony Pact Log (2 weeks)",["Day","What we did","Who it helped","How it felt"],14],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1.5,2],["Worksheet",0.5,1],["Experiment: noise map",0.75,1],["Activities: quarrel-fix role play, neighbour interviews",1.5,3],["Game: Harmony Village",0.75,1],["Project: Harmony Pact",2,14]],"cur":[["'This Moose Belongs to Me' discussion guide: can anyone own an animal or a piece of nature?","Prindle Institute","https://scholarship.depauw.edu/prindle_teaching/246","A philosophy circle on ownership and fairness with nature."],["'The Lion and the Little Red Bird' discussion guide","Prindle Institute","https://www.prindleinstitute.org/books/the-lion-and-the-little-red-bird/","What makes a friendship: sharing, or getting something back?"]],"deep":[{"q":"When a monkey steals food in town, whose fault is it?","why":"As forests shrink and food is left in the open, monkeys, elephants and leopards come into towns. People feel the animals are the problem; the animals are following food and space.","views":[["Wildlife biologists","Feeding monkeys teaches them to depend on people and become bolder; most conflict starts with food we leave or give."],["Farmers near forests","Losing a harvest to elephants can ruin a family; they need protection and compensation."],["Solutions that worked","Beehive fences keep elephants away because elephants avoid bees; covered dustbins and not feeding monkeys reduce raids."]],"tryit":"Write the same event (a monkey grabbing a banana) twice: once as the person, once as the monkey. What does each one need?"},{"q":"Is nature 'in balance'?","why":"People often say nature is in perfect balance until humans upset it. It is a comforting idea, but is it true?","views":[["Older ecology","Nature tends towards a stable balance where each species has its place."],["Modern ecology","Nature is always changing: fires, floods, droughts and new species keep shifting things. 'Balance' is more like a dance than a still scale."],["A middle view","Even if nature changes, human changes are now so fast and so big that many species can't keep up."]],"tryit":"Look at old photos of your area from 30 years ago (ask elders). What changed? Which changes were natural, which human?"},{"q":"Can people who disagree live in harmony?","why":"Harmony in music is different notes sounding good together, not everyone singing the same note. India has hundreds of languages, foods and faiths living side by side.","views":[["Peacemakers","Harmony comes from listening and finding fair rules, not from everyone agreeing."],["Philosophers","Disagreement, done kindly, helps everyone think better."],["Vasudhaiva Kutumbakam","If the world is one family, quarrels are family quarrels; you still belong together after them."]],"tryit":"Next time you disagree with someone at home, each of you repeats the other's view in your own words before replying. Did it change anything?"}],"wsd":[["A. Fix it",[{"t":"draw","p":"Draw a four-box comic: a quarrel about sharing, how each person feels, a fair fix, how it ends."},{"t":"mcq","p":"Two children want the same swing. The fairest fix is:","opts":["The stronger one takes it","Take turns with a timer","Nobody uses it","The older one decides"],"a":1}]],["B. People and animals",[{"t":"write","p":"Elephants keep raiding a village's fields. Suggest two ideas that protect the farmers AND the elephants.","lines":4},{"t":"sort","p":"Sort these actions.","items":["Feeding monkeys chips","Covering dustbins","Planting fruit trees in the forest","Throwing stones at dogs","Keeping water bowls in summer"],"cats":["Helps harmony","Causes conflict"]}]],["C. Stories of courage",[{"t":"write","p":"The Chipko movement and the Bishnois protected trees with their bodies. Would you do that? What would you protect?","lines":3}]],["D. Think it through",[{"t":"write","p":"Is nature 'in balance', or always changing? Give one example from what you've seen.","lines":3},{"t":"write","p":"Write one rule for your home that is good for people and for animals.","lines":2}]]],"guide":"Harmony is a skill, not a mood. The chapter asks how people, animals and plants share space and sound. The role plays work best if you play the difficult person. Let your child solve it. Pitfall: avoid making it a lecture on being good. Ask what each side wants.","prep":[["read",1,"Read Chapter 6 yourself first and mark 2–3 places to stop and ask a question (15 min)","Your NCERT book, or the free PDF: ncert.nic.in/textbook.php → Class 3 → Our Wondrous World (also on the ePathshala app)"],["learn",1,"Read the three big questions and their views. Decide which one you'll open with and what you think (10 min)","In this app: open the chapter → Think"],["ws",0,"Print the worksheet or keep the app open on a tablet; set out pencils and crayons","In this app (Worksheet), or print it from the worksheet PDF"],["exp",0,"Install a free sound-meter app on a phone, or plan to rate noise 1–5 by ear; list 6 places to visit","Phone app store"],["act",0,"Write 3 common family quarrels for the role play (sharing the TV, a broken toy, who goes first)","Your own family life"],["act",1,"Ask 2 neighbours if your child can interview them about sharing water, parking or a park","Neighbours"],["game",1,"Make Trouble cards and Help cards for Harmony Village","Paper"],["proj",0,"Decide together what the Harmony Pact action will be; keep a bowl ready if it's water for animals","Home"]]}}},{"k":"ncert|sci|3|7","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"7","title":"Water – A Precious Gift","dk":["B8","A4"],"c":{"covers":"Where water comes from, how we use it, clean and dirty water, saving water, traditional ways of storing rainwater.","game":["Drop Detective","Each player starts the day with 50 water-drop tokens. Draw activity cards (brushing with the tap running −6, mug bath −15, shower −40, washing a car with a pipe −60) and choose the wiser way where you can. Leak cards hit everyone. The player with the most drops at bedtime wins."],"exp":["Bottle filter: layer gravel, sand, charcoal and cotton in a cut bottle and pour muddy water through. Clearer, but is it safe to drink? (No, it still needs boiling.)","Sun vs shade: equal water in two plates. Which dries first, and where did the water go?"],"act":["Home water audit: count mugs and buckets used in one day.","Find out how a stepwell, lake or tank near you stored water."],"proj":["Rain Catcher","Make a rain gauge and a rain-collecting container; record rainfall and use the water for plants.","A working gauge, a collector and a rainfall chart"],"read":["The Water Princess, Susan Verde","Water Is Water, Miranda Paul","A Drop Around the World, Barbara McKinney"],"links":["Santoor Ch 6: Paper Boats","Maths Mela Ch 11: Filling and Lifting"],"x":{"learn":["Water comes from rain, rivers, lakes, glaciers and under the ground (groundwater, reached by wells and borewells).","Most of Earth's water is salty sea water. Only about 3 in every 100 drops is fresh, and most of that is frozen; very little is easy for us to use.","The water cycle: the sun heats water, vapour rises, cools into clouds, falls as rain, flows back to rivers and seas.","Dirty water spreads diseases; boiling, filtering and clean storage make water safer.","India's traditional water-keepers: stepwells (baolis), johads, kunds and temple tanks stored rain for dry months."],"think":["Who owns the rain that falls on your roof? Who owns a river?","If Earth is covered in water, why do cities run short?","Contrary view: is bottled water always safer t
