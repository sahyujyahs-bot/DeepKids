e","title":"Basic needs and diet","dk":[]},{"k":"nios|sci|4|9","board":"nios","subj":"sci","level":4,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Transport","dk":[]},{"k":"nios|sci|4|10","board":"nios","subj":"sci","level":4,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Communication","dk":[]},{"k":"nios|sci|4|11","board":"nios","subj":"sci","level":4,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Rights: education, information, consumer rights","dk":[]},{"k":"nios|sci|5|1","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Human existence and the body","dk":[]},{"k":"nios|sci|5|2","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Hygiene and health","dk":[]},{"k":"nios|sci|5|3","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Family and kinship","dk":[]},{"k":"nios|sci|5|4","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Respect for women and elders","dk":[]},{"k":"nios|sci|5|5","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Festivals","dk":[]},{"k":"nios|sci|5|6","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Planets and the sky","dk":[]},{"k":"nios|sci|5|7","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Weather","dk":[]},{"k":"nios|sci|5|8","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Basic needs and diet","dk":[]},{"k":"nios|sci|5|9","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Transport","dk":[]},{"k":"nios|sci|5|10","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Communication","dk":[]},{"k":"nios|sci|5|11","board":"nios","subj":"sci","level":5,"book":"Level B · Environmental Study (A-102)","n":"Theme","title":"Rights: education, information, consumer rights","dk":[]}],"topics":[{"id":"A1","q":"A. What is life?","name":"Living & non-living: is the distinction real?","sub":["The usual 'signs of life': moves, breathes, eats, grows, responds, makes babies, gets rid of waste","Tricky cases that break the list: fire (eats, breathes oxygen, grows, spreads), a 100-year-old dormant seed, growing crystals, a plucked flower, a dead leaf, a virus","J.C. Bose: plants respond to touch, injury and poison; he claimed metals also 'tire' and 'recover'","Everything is made of elements forged in stars","Is a handful of soil living or non-living?"],"summary":"We start by sorting things at home into 'alive' and 'not alive' and writing down why. Then we test those reasons on tricky cases. Fire eats, breathes and grows; is it alive? A seed can sit still for 100 years and then sprout; was it alive all that time? Crystals grow. Then we meet J.C. Bose, who built machines sensitive enough to show plants reacting, and who argued that even metals show tiredness and recovery. We end with the honest truth: scientists still do not have one agreed definition of life. NASA's working definition is 'a self-sustaining chemical system capable of evolution', and even that is argued over.","oneness":"If the same atoms move from stars to rocks to plants to me, at what moment does something become 'alive'? Is aliveness a line, or a gradient?","weeks":2,"full":true,"res":[{"type":"Book","title":"A Seed Is Sleepy, Dianna Hutts Aston","url":""},{"type":"Visit","title":"Acharya J.C. Bose Indian Botanic Garden, Howrah","url":""},{"type":"Watch","title":"The Private Life of Plants (BBC, David Attenborough)","url":""},{"type":"Lesson","title":"The King's Doubt: full game (cards + parent guide)","url":""}]},{"id":"A2","q":"A. What is life?","name":"How did life begin?","sub":["Earth began hot, with no life","The oldest evidence of life is about 3.5 billion years old (stromatolites: layered rocks built by microbes)","First life was tiny single cells in water","Ideas: Darwin's 'warm little pond', deep-sea hot vents, life arriving from space (panspermia), the 'RNA world'","Miller–Urey experiment (1952): gases + electric sparks made amino acids","Nobody has made life from scratch yet"],"summary":"We tell Earth's story on a long rope or saree: Earth forms, it is too hot for life, then early on the first tiny cells appear in water, and humans arrive only in the last few millimetres. We look at photos of stromatolites, rocks built layer by layer by microbes over billions of years, some still growing in Australia today. Then we lay out the main ideas scientists have about how life started, and the one honest answer: nobody knows yet. Scientists have made some building blocks of life in a lab, but never life itself.","oneness":"If life came from non-living chemicals, was it ever really separate from them?","weeks":1,"full":false,"res":[{"type":"Book","title":"The Story of Life: Evolution, Catherine Barr & Steve Williams","url":""},{"type":"Website","title":"NASA Space Place: life in the universe","url":"https://spaceplace.nasa.gov"}]},{"id":"A3","q":"A. What is life?","name":"What's common between living and non-living?","sub":["Everything is made of atoms; about 90 kinds occur naturally (elements)","The body is mostly oxygen, carbon, hydrogen, nitrogen","The same carbon is in pencil lead, diamond, bread and you","Atoms are recycled: the water you drink has passed through clouds, rivers, plants and animals","Stars made most elements: 'we are star stuff'"],"summary":"We ask what a rock, a tree and a child have in common, and find that underneath they are built from the same tiny pieces: atoms. Your body is mostly oxygen, carbon, hydrogen and nitrogen, the same elements found in air, water and coal. Carbon in a pencil and carbon in a diamond are the same atom arranged differently. Atoms never wear out; they keep moving between rocks, air, plants and people. Most of them were made inside stars long before Earth existed. So the difference between living and non-living is not in what they are made of, but in how those pieces are arranged and behave.","oneness":"If my atoms were once a star and will one day be soil, which part of the journey is 'me'?","weeks":1,"full":false,"res":[{"type":"Book","title":"Older Than the Stars, Karen C. Fox","url":""},{"type":"Website","title":"PhET: Build an Atom (simulation)","url":"https://phet.colorado.edu"}]},{"id":"A4","q":"A. What is life?","name":"Materials around me & their properties","sub":["Properties: hard/soft, rough/smooth, heavy/light, bendy/stiff, strong/brittle, see-through/opaque, magnetic/not","Float or sink: not about heavy vs light but about how tightly packed (Archimedes)","Microscope views: salt crystals, sugar, cloth threads, hair, soil","Soil & rocks: sand, clay, loam; soil layers; soil is full of life (a teaspoon holds billions of microbes)","Surprising 'materials': is water a material? Tears? Shadow? Sound? Fire?"],"summary":"Children become material detectives: touching, bending, dropping and floating everyday things and describing them with exact words. Float-or-sink predictions surprise them: a heavy steel plate floats when shaped like a bowl, while a tiny pebble sinks. We look closer with a magnifier or phone microscope: salt is little cubes, cloth is woven threads. We dig into soil, see its layers settle in a jar, and learn that one spoonful of good soil contains more living microbes than there are people on Earth, so is soil living? Finally the big puzzle: water and tears are matter, but a shadow is only missing light, sound is a shaking that travels through matter, and fire is hot glowing gas. What counts as 'stuff'?","oneness":"Is soil a thing, or a crowd of living beings? Where does the material end and the living begin?","weeks":2,"full":false,"res":[{"type":"Make","title":"Arvind Gupta Toys: science from everyday junk","url":"https://www.arvindguptatoys.com"},{"type":"Website","title":"PhET: Density (float or sink)","url":"https://phet.colorado.edu"}]},{"id":"A5","q":"A. What is life?","name":"Kinds of living things","sub":["Plants: root, stem, leaf, flower, fruit, seed; what plants need (water, light, air, soil nutrients); grow-a-seed","Fungi: mushrooms, mould, yeast; neither plant nor animal, closer to animals than to plants","Animals: mammals, birds, reptiles, amphibians, fish, insects and other invertebrates","Microbes (links to B3)","Humans are animals: mammals and primates","Groups are made by humans, and they keep changing"],"summary":"We meet the big families of life. Plants: we find the parts on a real plant and discover which parts we eat (carrot is a root, potato is a stem, spinach a leaf, cauliflower a flower, rice a seed), then start growing seeds in light and dark to see what plants need. Fungi surprise everyone: mushrooms are not plants, and DNA shows fungi are closer relatives of animals. We sort animals by features (fur, feathers, scales, backbone or not) and place humans honestly among them: we are mammals, we are animals. Finally we see that these groups are human-made boxes: scientists used to call fungi plants, and today most scientists say birds are living dinosaurs.","oneness":"Who drew these boxes, and does nature know about them? If a mushroom is more like me than a plant, what does 'like me' mean?","weeks":3,"full":false,"res":[{"type":"Book","title":"A Seed Is Sleepy, Dianna Hutts Aston","url":""},{"type":"Read","title":"StoryWeaver (Pratham Books): free picture books on plants and animals","url":"https://storyweaver.org.in"},{"type":"Visit","title":"Any botanical garden, e.g. Lalbagh, Bengaluru","url":""}]},{"id":"B1","q":"B. What is this world?","name":"Big Bang & the universe","sub":["About 13.8 billion years ago the universe was tiny, hot and dense, and began expanding","First atoms: hydrogen and helium","Mass and gravity: gravity pulls matter into clumps → stars, planets, galaxies, clusters","Stars make heavier elements and scatter them when they explode","Black holes; dark matter and dark energy (about 95% of the universe is something we cannot see)","Our planet: about 71% water, 29% land"],"summary":"We tell the biggest story there is. Long ago everything was squeezed into an unimaginably small, hot speck, which grew and is still growing, like dots on a balloon moving apart as it inflates. As it cooled, the first atoms appeared. Mass pulls on mass; that pull is gravity, and gravity gathered gas into stars and stars into galaxies. Stars cook new elements and scatter them when they explode; our Earth, and we, are made from that dust. Then the mysteries: black holes so strong that light cannot escape, and the shocking fact that most of the universe is 'dark' stuff no one has ever seen. We also learn how ideas about gravity changed: Newton said it is a pulling force, and it worked for 200 years; Einstein showed mass bends space and time itself; and today some scientists think even Einstein's idea needs fixing.","oneness":"If everything came from one tiny point, is the universe one thing that became many?","weeks":2,"full":false,"res":[{"type":"Website","title":"NASA Space Place","url":"https://spaceplace.nasa.gov"},{"type":"Book","title":"Me and My Place in Space, Joan Sweeney","url":""},{"type":"Visit","title":"Nehru Planetarium (Delhi / Mumbai)","url":""}]},{"id":"B2","q":"B. What is this world?","name":"My world: how humans live, and why","sub":["My world: home, food, transport, money, work, school, festivals","The chain of people behind my breakfast","Humans are social animals: families, groups, rules, sharing, trade","Why we live like this: biology (we bond, cooperate, compete), environment, history, culture","Different people live in different worlds: village, city, forest, another country","Money: from barter to coins to digital"],"summary":"We begin with the child's own world: list everything used in one day and trace where it came from. A single breakfast needs farmers, drivers, shopkeepers and cooks; no human lives alone. We ask why humans live in families and groups: like elephants, wolves and ants, we survive by cooperating, and our bodies are wired to bond (a hug really changes brain chemicals). We see that a child in a forest village, a fishing town or a city in another country lives in a different 'world' with different food, work and rules. We play a barter market to see why money was invented. And we ask the old question honestly: are humans naturally selfish or naturally kind? Thinkers disagree.","oneness":"If my breakfast needs a hundred people, where do 'I' end and 'we' begin?","weeks":1,"full":false,"res":[{"type":"Read","title":"StoryWeaver: stories of children across India","url":"https://storyweaver.org.in"}]},{"id":"B3","q":"B. What is this world?","name":"The world of microorganisms","sub":["Too small to see: bacteria, yeast and other fungi, amoebas, algae; viruses (alive or not?)","Everywhere: soil, air, water, skin, gut","Helpers: curd, idli/dosa batter, bread, compost; ocean plankton make about half of Earth's oxygen","Some make us sick (links to C10)","Leeuwenhoek first saw them in the 1670s with a home-made lens"],"summary":"There is a whole hidden world all around and inside us. We hear how a Dutch cloth-seller, Leeuwenhoek, ground tiny lenses and was the first person to see 'little animals' swimming in a drop of water. Microbes turn milk into curd, make idli batter rise, rot leaves into soil and, through tiny ocean plankton, make about half the oxygen we breathe. Only a few make us sick. We make curd at home and watch yeast blow up a balloon. And we ask whether viruses are alive: they cannot do anything outside a living cell, so scientists still disagree.","oneness":"If tiny beings make my curd, my soil and my oxygen, how separate is my life from theirs?","weeks":1,"full":false,"res":[{"type":"Watch","title":"Microcosmos (1996 film)","url":""},{"type":"Make","title":"Arvind Gupta Toys: simple magnifiers","url":"https://www.arvindguptatoys.com"}]},{"id":"B4","q":"B. What is this world?","name":"Other beings' worlds: how a bird sees the world","sub":["Every creature lives in its own world of senses (umwelt, Jakob von Uexküll, 1909)","Birds see ultraviolet and have 4 kinds of colour cones (we have 3)","Many birds sense Earth's magnetic field to migrate; Amur falcons fly from East Asia through Nagaland to Africa","Bird societies: flocks, nests, parents, songs with local 'dialects', crows remember faces and use tools","Seeing time: many birds and insects see fast movements we miss","(Series can continue: an ant's world, a dog's world, a fish's world…)"],"summary":"Our world of cars, money and roads is only one world. A crow on the same street lives in a different one. Birds see colours we cannot even imagine, including ultraviolet patterns on flowers and feathers. Many feel the Earth's magnetism and use it like a compass to fly thousands of kilometres; the Amur falcon crosses the Arabian Sea on its way from Asia to Africa. Birds have families, neighbours, quarrels and songs, and crows can remember a human face for years. We try to imagine life in a bird's world, and meet a famous question: can we ever truly know what it is like to be another creature?","oneness":"If each being lives in its own world, is there one 'real' world, or many?","weeks":1,"full":false,"res":[{"type":"Watch","title":"Planet Earth: Birds of Paradise episode (BBC)","url":""},{"type":"Visit","title":"Salim Ali Bird Sanctuary, Thattekad (Kerala) or a local lake","url":""}]},{"id":"B5","q":"B. What is this world?","name":"Cycles in the sky & weather","sub":["Day and night: Earth spins","A year: Earth goes around the Sun; seasons come from Earth's tilt, not its distance from the Sun","Moon phases: we see different amounts of the Moon's sunlit half; the Moon makes no light of its own","India's six ritus and the monsoon","Clouds and rain: water evaporates, cools and condenses","Planets you can see (Venus, Jupiter, Mars, Saturn) and stars as distant suns"],"summary":"With a torch and a ball we discover why day and night happen: the Earth spins, so our side faces the Sun and then turns away. Seasons come from Earth's tilt; most people wrongly think it is about being closer to the Sun. The Moon makes no light of its own; its shape changes because we see different amounts of its sunlit half, and the child keeps a moon diary for a month. We learn India's six ritus, why the monsoon comes, and make a cloud in a jar. We hear how ideas changed: people once believed the Sun went around the Earth; Aryabhata proposed in 499 CE that the Earth spins; Copernicus and Galileo argued the Earth goes around the Sun, and Galileo was put on trial for it.","oneness":"Sun, Moon, seasons and my sleep all move in cycles. Am I part of the sky's rhythm?","weeks":2,"full":false,"res":[{"type":"Website","title":"NASA Space Place: Moon phases","url":"https://spaceplace.nasa.gov"},{"type":"Make","title":"Shadow-stick sundial","url":""}]},{"id":"B6","q":"B. What is this world?","name":"Forces, vibrations & sound","sub":["Push and pull; gravity pulls everything down","The floor pushes back up (normal force); friction; air resistance; water pushes up (buoyancy); magnets","Contact forces are, at heart, electric pushes between electrons; your hand never truly 'touches' the table","Gravity is the exception, a different force","Sound is vibration travelling through air, water and solids; no sound in space","Loud/soft and high/low (pitch); echoes"],"summary":"Children push, pull, drop and float things to feel forces. The surprise: when you sit on a chair, the chair pushes back up, and when you 'touch' anything, its electrons and yours push each other away; atoms never really touch. Air pushes against a falling sheet of paper; water pushes up on a boat. We retell the history of falling: Aristotle said heavy things fall faster, and people believed him for nearly 2000 years until Galileo tested it; Newton explained gravity as a pull; Einstein explained it as bent space. Sound is also a push travelling along: we feel our throat buzz when humming Om, watch rice jump on a drum, and build a cup telephone.","oneness":"If nothing ever truly touches, how are we all still connected?","weeks":2,"full":false,"res":[{"type":"Book","title":"The Way Things Work Now, David Macaulay","url":""},{"type":"Website","title":"PhET: Forces and Motion Basics","url":"https://phet.colorado.edu"},{"type":"Make","title":"Arvind Gupta Toys: sound and force toys","url":"https://www.arvindguptatoys.com"}]},{"id":"B7","q":"B. What is this world?","name":"Light, colour & shadows","sub":["Light sources: Sun, fire, bulbs, fireflies (living light)","We see when light bounces off things into our eyes","Light travels in straight lines → shadows; shadow size changes with distance","Reflection: mirrors, still water","White light holds all colours (rainbow, prism); objects show the colours they bounce back","Mixing paint vs mixing light: paints get darker; red, green and blue light make white","Darkness is the absence of light; light and shade in painting"],"summary":"Darkness is not a thing; it is what is left when light is missing. We make shadow puppets and discover shadows grow as hands move closer to the torch. We bounce torchlight off mirrors to hit a target, make rainbows with a glass of water, and learn that white light is all colours mixed, as Newton showed with a prism. A red apple looks red because it bounces red light and swallows the rest. Then the painting surprise: mixing paints makes colours darker, while mixing coloured light makes white. We paint a ball with one light source to see light, shade and shadow. And the deep puzzle: is light a wave or a particle? Scientists argued for centuries and now say it behaves as both, which still puzzles them.","oneness":"Is colour in the apple, in the light, or in my mind?","weeks":2,"full":false,"res":[{"type":"Website","title":"PhET: Color Vision","url":"https://phet.colorado.edu"},{"type":"Visit","title":"Shadow puppet show (Tholu Bommalata / Togalu Gombeyaata)","url":""}]},{"id":"B8","q":"B. What is this world?","name":"Nature's events","sub":["Rain and the water cycle","Floods, droughts and dry spells","Wind, storms and cyclones (countries around the Indian Ocean take turns naming them)","Thunder and lightning (light arrives before sound)","Earthquakes and tsunamis (2004 Indian Ocean tsunami)","Snow in the Himalayas","Why the monsoon happens: land heats faster than sea"],"summary":"Nature is always moving water, air and land around. We follow a raindrop through the water cycle, then see what happens when there is too much (flood) or too little (drought). The monsoon happens because land heats faster than the sea, so moist sea air rushes in. We count the seconds between lightning and thunder to tell how far away a storm is. We learn how earthquakes shake the ground and how in 2004 some Andaman island communities reportedly escaped the tsunami using traditional knowledge of the sea. And we ask whether 'natural disasters' are fully natural: building on riverbeds or cutting forests can make floods far worse.","oneness":"Rain, rivers and my body's water are the same water. Is a flood something happening to us or with us?","weeks":1,"full":false,"res":[{"type":"Website","title":"India Meteorological Department: today's weather","url":"https://mausam.imd.gov.in"},{"type":"Visit","title":"A stepwell (e.g. Chand Baori, Rajasthan) or a local lake","url":""}]},{"id":"B9","q":"B. What is this world?","name":"Human impact on the environment","sub":["Humans change land (forests → farms and cities), air (smoke), water (plastic, sewage) and climate (burning coal and petrol adds carbon dioxide)","Other animals change environments too (elephants, termites, earthworms, beavers), but humans at a huge scale","Good changes: Jadav Payeng planted a whole forest on a river island; the Chipko movement","Are humans part of nature or outside it?"],"summary":"Every living thing changes its surroundings: earthworms make soil, elephants clear paths, termites build towers. Humans do the same, but at a scale that now changes the whole planet's air, water and weather. We walk the neighbourhood spotting human-made changes, catch dust from the air on a sticky card, and feel how a road is hotter than a tree's shade. We meet people who changed things for the better: Jadav Payeng, the 'Forest Man of India', planted a forest bigger than many towns, and the women of the Chipko movement hugged trees to save them. We discuss honestly that people disagree about how fast to change things and which solutions are best.","oneness":"If I am part of nature, is damaging nature damaging myself?","weeks":1,"full":false,"res":[{"type":"Read","title":"StoryWeaver: Jadav and the Tree-Place","url":"https://storyweaver.org.in"},{"type":"Watch","title":"The Elephant Whisperers (2022)","url":""},{"type":"Watch","title":"Our Planet (2019)","url":""}]},{"id":"B10","q":"B. What is this world?","name":"Waste: reduce & manage","sub":["Nature has no waste: a fallen leaf becomes soil","Kinds of waste: wet, dry, hazardous, e-waste","Where waste goes: landfills, burning, recycling, oceans","Plastic can last hundreds of years","Refuse, reduce, reuse, repair, recycle; composting","India's kabadiwala recycling system"],"summary":"In a forest nothing is wasted: leaves, dead animals and dung all become food for something else. Only humans make things nature cannot easily take back, like plastic that lasts for centuries. We find out what our own family throws away in a week, sort it into wet, dry and hazardous, and bury a banana peel, a paper and a plastic bag to dig up after 3 weeks. We meet India's kabadiwalas, who quietly recycle huge amounts, and old habits like turning sarees into quilts. We also learn an uncomfortable fact: only a small part of all plastic ever made has been recycled, and experts argue about whether recycling is the real answer.","oneness":"If nature has no waste, is waste a human idea? Can we live like a forest?","weeks":1,"full":false,"res":[{"type":"Make","title":"Arvind Gupta Toys: toys from trash","url":"https://www.arvindguptatoys.com"}]},{"id":"C1","q":"C. Who am I?","name":"Other life inside me","sub":["Trillions of microbes live in and on us: roughly as many bacterial cells as human cells","Gut, skin and mouth each have their own communities","They help digest food, make some vitamins and train our defences","Mitochondria, the energy-makers in our cells, were once free-living bacteria","About 8% of our DNA is left over from ancient viruses"],"summary":"You are not just you: you are a walking city. About as many bacterial cells live in and on your body as your own cells (scientists used to say 10 times more, until a 2016 study corrected it). Your gut microbes help digest food and make vitamins; skin microbes guard against germs. Deeper still, the tiny power stations inside every cell, mitochondria, were once separate bacteria that moved in and never left. Lynn Margulis proposed this and was ridiculed for years before scientists accepted it. Even our DNA carries leftover pieces of ancient viruses. So which part is 'me'?","oneness":"If half the cells in my body are not 'mine', and my energy comes from ancient bacteria, what is 'I'?","weeks":1,"full":false,"res":[{"type":"Website","title":"Khan Academy: cells and microbes (older kids, parent prep)","url":"https://www.khanacademy.org"}]},{"id":"C2","q":"C. Who am I?","name":"My genes","sub":["Every cell carries instructions (DNA), like a recipe book","Half from each biological parent; why siblings differ","All life uses the same DNA 'letters'; we share many genes with bananas, flies and mice","Genes are not destiny: food, care and surroundings switch genes on and off","History: Mendel's peas; Rosalind Franklin's photo; Har Gobind Khorana and the genetic code"],"summary":"Inside almost every cell is a long coded message called DNA, a recipe book for building and running a body. We extract real DNA from strawberries and see the white strands. Half our recipes come from each biological parent, mixed in a new way, which is why siblings look alike but different. All living things use the same four DNA letters, so we share many genes even with bananas. We meet Mendel, a monk whose pea experiments were ignored for 34 years; Rosalind Franklin, whose photo revealed DNA's shape but who got little credit; and Har Gobind Khorana, born in Punjab, who won a Nobel Prize for cracking how DNA's code works. And we learn that genes are not destiny: what we eat, how we live and how we are cared for changes which genes are used.","oneness":"If a banana and I share the same code, are we written in the same language by the same author?","weeks":1,"full":false,"res":[{"type":"Make","title":"Strawberry DNA extraction (lesson card)","url":""}]},{"id":"C3","q":"C. Who am I?","name":"Where humans came from","sub":["Life changed over billions of years (evolution): fish → amphibians → reptiles → mammals → primates → humans, a branching tree, not a ladder","Darwin and Wallace: natural selection","Other humans: Homo erectus, Neanderthals, Denisovans; Homo sapiens appear about 300,000 years ago in Africa","Many of us carry a little Neanderthal DNA","People reached India tens of thousands of years ago; Bhimbetka rock shelters"],"summary":"We follow our family line back through time: fish that crawled onto land, early mammals scurrying under dinosaurs, tree-climbing primates, and many kinds of humans, several of them alive at the same time. Darwin and Wallace explained how living things slowly change: those best suited to their surroundings survive and pass on their traits. We see that evolution is a branching bush, not a ladder, and that new fossils keep pushing dates back. We visit (in pictures or in person) Bhimbetka's rock paintings, among the oldest human art in India. Then we compare this with the Dashavatara: Matsya (fish), Kurma (tortoise), Varaha (boar), Narasimha (half-lion, half-human), Vamana (small human), then full humans. Many people see in this order a story that parallels evolution.","oneness":"If all life is one family tree, is there anyone who is not my relative?","weeks":1,"full":false,"res":[{"type":"Book","title":"The Story of Life: Evolution, Catherine Barr & Steve Williams","url":""},{"type":"Visit","title":"Bhimbetka rock shelters (Madhya Pradesh)","url":""}]},{"id":"C4","q":"C. Who am I?","name":"What's common between me and other life?","sub":["Me & a dog: mammals, backbone, the same organs, hair, milk, feelings","Me & a bird: backbone, lungs, a 4-chambered heart","Me & a fish: backbone; early embryos look alike","Me & a tree: cells, DNA, using energy, water","Me & a mushroom: closer relatives than plants","Me & bacteria: the same DNA code and energy molecule","Differences too"],"summary":"We play detective comparing ourselves with other beings, one at a time. A dog shares our skeleton plan, organs, fur-like hair, milk-feeding and clearly feels joy and fear. A bird has a 4-chambered heart like ours. A tree breathes at the level of its cells, carries DNA and is made of cells like us. Even bacteria run on the same genetic code and energy molecule. The deeper we look, the longer the 'same' list grows. We also hear the 2012 Cambridge Declaration on Consciousness, in which scientists stated that many animals, including birds and octopuses, are conscious, and the 2024 New York Declaration, which says even insects might be.","oneness":"'Tat tvam asi': you are that. When does 'same' become 'one'?","weeks":1,"full":false,"res":[{"type":"Watch","title":"My Octopus Teacher (2020)","url":""}]},{"id":"C5","q":"C. Who am I?","name":"Our closest cousins","sub":["Great apes: chimpanzees and bonobos (closest; about 98–99% similar DNA), gorillas, orangutans","Monkeys and other primates","India's only ape: the hoolock gibbon (Northeast)","Shared: tools, emotions, play, laughter, culture","Jane Goodall: chimps use tools"],"summary":"Chimpanzees and bonobos are our closest living relatives; we shared an ancestor several million years ago. When Jane Goodall saw a chimp stripping a twig to fish for termites, scientists had believed tool-making was what made humans unique. Her mentor Louis Leakey said we must now 'redefine tool, redefine man, or accept chimpanzees as humans.' Chimps laugh, mourn, make up after fights and have local traditions. India has its own ape, the hoolock gibbon, singing in northeastern forests. We tape our thumbs to see why our hands matter, and ask: what, if anything, makes humans special?","oneness":"Every 'only humans can…' claim has been challenged. Is the line between us and them real?","weeks":1,"full":false,"res":[{"type":"Watch","title":"Jane Goodall documentaries (e.g. Jane, 2017)","url":""}]},{"id":"C6","q":"C. Who am I?","name":"My family history","sub":["Family tree (3 generations); 'family' = the people who raise and love me (inclusive of adopted, single-parent and other families)","Traits that run in families: face, height, hair, handedness","Fingerprints: unique, even for identical twins","Stories, languages, places, recipes","How long people lived then vs now","Blood groups and family illnesses: parent-led and kept light"],"summary":"Every child is the newest page in a very long story. We build a family tree, interview a grandparent or elder, collect photos and stories, and look at what is shared: a nose, a laugh, a love of cooking. We take fingerprints and discover that no two people, not even identical twins, have the same ones. We learn that in 1947 people in India lived on average only about 32 years and now about 70, and ask why. For families that wish to, parents can add blood groups and health stories. Families made by adoption or in other ways trace both their 'raised-by' and 'born-from' stories in whatever way feels right.","oneness":"My family tree joins every other family tree if I go back far enough. Where does my family end?","weeks":2,"full":false,"res":[]},{"id":"C7","q":"C. Who am I?","name":"My body parts","sub":["Skin (the largest organ), bones (about 300 at birth, 206 in adults), muscles, heart, lungs, stomach and intestines, brain","How they work together","Why they evolved: forward eyes, gripping thumbs, sweating for long-distance running, goosebumps from furry ancestors, tailbone","The appendix: once called useless, now possibly a store of helpful microbes"],"summary":"We trace the child's body on a big sheet of paper and place cut-out organs inside. We listen to the heart with a home-made stethoscope before and after jumping, blow up a balloon to feel lung power, and build a moving finger from straws and string. Then we ask 'why do I have this?' Goosebumps are left over from furry ancestors whose hair stood up; sweating lets humans run for hours; babies are born with about 300 bones that fuse to 206. We learn that science changes its mind: the appendix was called useless for a century and now may be a safe house for helpful gut microbes. Finally we meet another way of seeing the body: Sushruta, an early surgeon who described nose reconstruction, and the yoga and Ayurveda traditions that describe the body differently.","oneness":"My heart beats without my asking. Is it 'my' heart, or is it doing its own thing?","weeks":2,"full":false,"res":[{"type":"Visit","title":"Science centres: Nehru Science Centre Mumbai, Visvesvaraya Museum Bengaluru, National Science Centre Delhi","url":""}]},{"id":"C8","q":"C. Who am I?","name":"My body's sensors","sub":["Beyond the 'five senses': touch, pressure, vibration, temperature, pain, itch, balance, body position (eyes closed), hunger, thirst, full tummy, heartbeat, the urge to breathe","Conscious vs automatic sensing","Senses mix: flavour = taste + smell","Other beings: birds (UV, magnetic field), bees (UV), snakes (heat), sharks (electric fields), bats (echoes), dogs (smell)","Plants sense light, gravity and touch"],"summary":"Aristotle listed five senses over 2000 years ago, and people repeated the list ever since. But your body is covered in sensors: you know where your hand is with your eyes closed, you feel hot and cold, you stay balanced on one foot, you feel hungry, thirsty or that you need the toilet, and a hidden sensor makes you breathe faster when you run. Scientists today count anywhere from about 20 to over 30 senses and still disagree on how to count. We pinch our noses and find apple and potato taste almost the same, because most flavour is smell. Then we meet the superpowers of others: snakes 'see' heat, sharks feel electricity, bats hear their way in the dark, birds feel Earth's magnetism. Even plants sense: roots know which way is down and the touch-me-not folds when touched.","oneness":"If a plant senses touch and I sense touch, is sensing the beginning of awareness everywhere?","weeks":1,"full":false,"res":[{"type":"Book","title":"What If You Had Animal Eyes?, Sandra Markle","url":""}]},{"id":"C9","q":"C. Who am I?","name":"How do I think?","sub":["The brain: about 86 billion neurons sending signals","Thinking = patterns of signals; learning changes connections","Memory: short-term and long-term; sleep helps memory; memories change each time we recall them","Emotions affect thinking","Other thinkers: crows, octopuses; even brainless slime moulds solve mazes","The hard question: how does the brain make experience?"],"summary":"Your brain has about 86 billion nerve cells passing tiny electric and chemical signals; every time you learn something new, the connections change. We play memory games and discover tricks that help (stories, pictures, a 'memory palace' walk through the house) and learn that sleep is when the brain files memories. Surprisingly, a memory changes a little each time you remember it. Thinking isn't only human: crows plan, octopuses solve puzzles, and a slime mould with no brain at all can find the shortest path through a maze. Then the biggest mystery: nobody knows how signals in the brain become the feeling of being you. Some scientists say the mind is what the brain does; Vedanta says consciousness comes first and the brain is something that appears within it.","oneness":"Who is watching my thoughts? Is the watcher a thought too?","weeks":1,"full":false,"res":[]},{"id":"C10","q":"C. Who am I?","name":"Getting sick, getting hurt & getting well","sub":["Why we get sick: germs (bacteria, viruses), not enough food or sleep, allergies","The body's defences: skin, mucus, fever, white blood cells, antibodies, immune memory (how vaccines work)","Hygiene habits: handwashing (20 seconds), teeth, bathing, clean water and food, covering coughs","Getting hurt: cuts, burns, falls, electric shock; electricity safety at home","Healing: scabs, rest","Are 'I' and 'my body' different?"],"summary":"We learn that the body is a fortress: skin is the wall, mucus is a sticky trap, fever is the body turning up the heat on germs, and white blood cells are guards who remember invaders so they can fight faster next time (which is how vaccines work). Glitter 'germs' show why handwashing matters, and bread touched by washed vs unwashed hands grows very different mould. We tell the story of Dr Semmelweis, who told doctors to wash their hands in the 1840s and was mocked; years later germ theory proved him right. We learn home safety, especially electricity: water and electricity never mix, never touch sockets or bare wires, and never touch someone being shocked; switch off first. Finally the question: we say 'help my body heal'. Who is helping whom? Am I my body, or something more?","oneness":"When I say 'my body', who is the 'I' that owns it?","weeks":2,"full":false,"res":[{"type":"Book","title":"Germs Make Me Sick!, Melvin Berger","url":""}]},{"id":"C11","q":"C. Who am I?","name":"What is food?","sub":["Food = building material + energy + helpers (vitamins, minerals) + water","Digestion breaks food down: proteins → amino acids, carbohydrates → sugars, fats → fatty acids","All life uses the same ~20 amino acids, DNA code and energy molecule (ATP)","So why so many foods? Different bodies have different tools (teeth, enzymes, gut microbes)","Plants make their own food from light; food chains","Food for different beings: cows (helped by microbes), spiders, plants, fungi"],"summary":"We chew a piece of plain roti for two minutes and it starts tasting sweet: saliva is already breaking starch into sugar. Digestion is a giant breaking-down factory: proteins become amino acids, carbohydrates become sugars, fats become fatty acids, and the body rebuilds them into itself. Amazingly, every living thing builds itself from the same 20 or so amino acids. So why does a cow eat grass, a spider eat flies and a plant eat sunlight? Because each has different tools: a cow's stomach is full of microbes that break down grass, which we cannot do. We also learn that nutrition science keeps changing its mind: fat was the villain, then sugar, and eggs went from bad to fine.","oneness":"'Annam Brahma': food is the Absolute. When I eat a mango, does the mango become me, or do I become a little more mango?","weeks":1,"full":false,"res":[{"type":"Read","title":"StoryWeaver: food stories","url":"https://storyweaver.org.in"}]},{"id":"C12","q":"C. Who am I?","name":"Energy beyond food","sub":["Sunlight: plants make sugar from light (photosynthesis); we make vitamin D in sunlight; warmth","Air: oxygen helps cells release energy from food; we breathe out carbon dioxide","Water: most of the body is water; every cell works in it","Life without sunlight: deep-sea vents where bacteria make food from chemicals (chemosynthesis); tubeworms","Microbes that 'breathe' nitrate or sulphate instead of oxygen; life in boiling springs, ice and de const SFX={tap:()=>tone(660,0,.07,"triangle",.08),tick:()=>{tone(784,0,.08);tone(1046,.07,.12)},ok:()=>{tone(523,0,.1);tone(659,.09,.1);tone(784,.18,.18)},no:()=>{tone(220,0,.18,"square",.05);tone(180,.12,.2,"square",.05)},

function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=document.createElement("canvas");c.className="confetti";c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext("2d");
  const cols=["#F2603F","#FFB21E","#38A862","#3E86F5","#8C5CF0","#F06BA8"];const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*12,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.random()*6|0],a:Math.random()*6}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++n<80)requestAnimationFrame(f);else c.remove()})()}

const st=k=>S.progress[k]?.status||"none";const done=k=>S.progress[k]?.sessions||0;

function coverage(u){if(u.board!=="dk"&&S.plus&&u.dk.length){const s=u.dk.map(id=>st("dk|"+id)),own=st(u.k);if(s.every(x=>rank[x]>=2))return rank[own]>2?own:"completed";if(s.some(x=>x!=="none")||own!=="none")return rank[own]>1?own:"learning";return own}return st(u.k)}

function schedule(subj,limitDays=420,fromTomorrow=false){
  const q=[];plannedUnits(subj).forEach(u=>{if(rank[coverage(u)]>=2)return;const tot=sessionsFor(u);for(let i=Math.min(done(u.k),tot-1);i<tot;i++)q.push({u,n:i+1,tot})});
  const queue=[...q.filter(x=>coverage(x.u)==="learning"),...q.filter(x=>coverage(x.u)!=="learning")];
  const out=[];const days=daysOf(subj);let d=parse(S.start>today?S.start:today);const doneToday=S.log.some(l=>l.date===today&&l.subj===subj);
  for(let k=0;k<limitDays&&queue.length;k++){const s=iso(d);if(days.includes(d.getDay())&&!S.skips[s+"|"+subj]&&!(s===today&&(doneToday||fromTomorrow)))out.push({date:s,subj,...queue.shift()});d.setDate(d.getDate()+1)}
  return out}
const nextUp=s=>{const q=[];plannedUnits(s).forEach(u=>{if(rank[coverage(u)]>=2)return;const tot=sessionsFor(u);for(let i=Math.min(done(u.k),tot-1);i<tot;i++)q.push({u,n:i+1,tot})});return [...q.filter(x=>coverage(x.u)==="learning"),...q.filter(x=>coverage(x.u)!=="learning")][0]};
function logSession(u,kind){const p=S.progress[u.k]||{status:"none",sessions:0};p.sessions=(p.sessions||0)+1;if(p.status==="none")p.status="learning";if(p.sessions>=sessionsFor(u)&&p.status==="learning")p.status="completed";p.updated=today;S.progress[u.k]=p;

function stepBody(u,name){const c=u.c,x=c.x,k=KIND(name)[0],L=a=>`<ul class="t">${a.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;

function daySteps(u,n,tot){const cap=hpdOf(u.subj);
  if(u.c?.x?.hours){const days=[];let cur=[],left=cap;u.c.x.hours.forEach(([name,h])=>{let rem=h,part=1;while(rem>1e-9){const take=Math.min(rem,left);cur.push({name,take,part});rem-=take;left-=take;part++;if(left<1e-9){days.push(cur);cur=[];left=cap}}});if(cur.length)days.push(cur);
    const parts={};days.flat().forEach(s=>parts[s.name]=Math.max(parts[s.name]||0,s.part));
    return (days[Math.min(n,days.length)-1]||[]).map(s=>{const [kind,label,icon]=KIND(s.name);return {kind,label,icon,title:s.name.replace(/^(Experiments?|Activities|Game|Project): /,"")+(parts[s.name]>1?` · part ${s.part} of ${parts[s.name]}`:""),mins:s.take,html:stepBody(u,s.name)}})}
  if(u.board==="dk"){const t=u.topic,k=t.sub.length;

    const i=Math.min(k-1,Math.floor((n-2)*k/Math.max(1,tot-1)));
    return n===tot?[{kind:"learn",label:"Wrap up",icon:"🎤",title:"Teach it back",mins:cap,html:`<p>Your child teaches you the topic in five minutes.</p><div class="ask">${esc(t.oneness)}</div>`}]:[{kind:"exp",label:"Explore",icon:"🧭",title:t.sub[i].slice(0,60)+(t.sub[i].length>60?"…":""),mins:cap,html:`<p>${esc(t.sub[i])}</p><p class="small muted">${esc(HINT.sci)}</p>`}]}
  const w=`${esc(u.book)}${chNo(u)?", "+chNo(u):""}`;

  return A.map(([kind,label,icon,title,f,html])=>({kind,label,icon,title,mins:cap*f,html,generic:true}))}

function dailyUnit(){if(!S.subjects.includes("sci"))return null;const sc=schedule("sci",60);const t=sc.find(x=>x.u.c?.x);if(t)return t.u;const any=S.log.find(l=>unitBy(l.key)?.c?.x);if(any)return unitBy(any.key);return DATA.items.find(i=>i.c?.x)||null}

function jokes(u){return `<div class="hs">${u.c.x.jokes.map((j,i)=>{const [q,a]=splitJoke(j),k=today+i;return `<button class="joke" data-act="joke" data-j="${k}"><span class="tag">Joke ${i+1} of ${u.c.x.jokes.length}</span><span class="q">${esc(q)}</span>${ui.jokes[k]?`<span class="a">${esc(a)}</span>`:`<span class="tap">Tap for the answer ✨</span>`}</button>`}).join("")}</div>`}
function wordGame(u){const x=u.c.x,word=x.words[dayNo%x.words.length],g=G(),won=g.g.includes(word),over=won||g.g.length>=6,rows=[],keys={};
  g.g.forEach(w=>[...w].forEach((ch,i)=>{const c=ch===word[i]?"hit":word.includes(ch)?"near":"miss";if(keys[ch]!=="hit"&&!(keys[ch]==="near"&&c==="miss"))keys[ch]=c}));
  for(let r=0;r<6;r++){const w=g.g[r]||(r===g.g.length&&!over?(g.cur||""):"");rows.push(`<div class="wrow">${[0,1,2,3,4].map(i=>{const ch=w[i]||"";let c="";if(g.g[r])c=ch===word[i]?"hit":word.includes(ch)?"near":"miss";return `<span class="tile ${c} ${!g.g[r]&&ch?"pop":""}" style="animation-delay:${g.g[r]?i*.08:0}s">${esc(ch)}</span>`}).join("")}</div>`)}
  return `<p class="small center"><b>Word of the Day.</b> A 5-letter word from "${esc(u.title)}". Green: right place. Yellow: in the word. Six tries.</p><div class="wgrid">${rows.join("")}</div>${over?`<p class="verdict">${won?"You got it! 🎉 ":"The word was "}<b>${word}</b></p>`:`<div class="kb">${["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"].map((r,i)=>`<div>${i===2?`<button data-act="wk" data-key="ENTER" class="wide">Enter</button>`:""}${[...r].map(c=>`<button data-act="wk" data-key="${c}" class="${keys[c]||""}">${c}</button>`).join("")}${i===2?`<button data-act="wk" data-key="DEL" class="wide" aria-label="Delete">⌫</button>`:""}</div>`).join("")}</div>`}`}
function tfGame(u){const g=G(),q=u.c.x.quiz,i=q.findIndex((_,k)=>g.tf[k]===undefined),sc=q.filter((x,k)=>g.tf[k]!==undefined&&(g.tf[k]===1)===x[1]).length;
  const dots=`<div class="dots">${q.map((_,k)=>`<i class="${g.tf[k]===undefined?(k===i?"on":""):((g.tf[k]===1)===q[k][1]?"ok":"no")}"></i>`).join("")}</div>`;
  if(i<0)return `${dots}<div class="score">${sc}/${q.length}</div><p class="verdict">${sc===q.length?"Perfect! 🌟":sc>=q.length/2?"Nice thinking!":"Tricky ones today!"}</p><div class="stack" style="gap:8px">${q.map((x,k)=>`<div class="card alt" style="padding:10px 12px;box-shadow:none"><b>${x[1]?"True":"False"}:</b> ${esc(x[0])}<div class="small muted">${esc(x[2])}</div></div>`).join("")}</div>`;
  const p=i>0?q[i-1]:null;return `${dots}${p?`<p class="center small" style="font-weight:800;color:${(g.tf[i-1]===1)===p[1]?"var(--leaf)":"var(--tomato)"}">${(g.tf[i-1]===1)===p[1]?"Right!":"Not quite."} ${esc(p[2])}</p>`:`<p class="small center"><b>True or False?</b> Some of these sound true and aren't.</p>`}<div class="qcard">${esc(q[i][0])}</div><div class="tfrow"><button class="btn ok" data-act="tf" data-i="${i}" data-v="1">True</button><button class="btn go" data-act="tf" data-i="${i}" data-v="0">False</button></div>`}
function oddGame(u){const g=G(),o=u.c.x.odd[dayNo%u.c.x.odd.length];return `<p class="small center"><b>Odd One Out.</b> Which one doesn't belong? There may be more than one good answer; can you defend yours?</p><div class="oddgrid">${o[0].map(w=>`<button class="btn ${g.odd?(w===o[1]?"right":w===g.odd?"wrong":""):""}" data-act="odd" data-w="${esc(w)}" ${g.odd?"disabled":""}>${esc(w)}</button>`).join("")}</div>${g.odd?`<p class="verdict">${g.odd===o[1]?"Yes! ":"We picked "+esc(o[1])+". "}${esc(o[2])}</p>`:""}`}

       <div class="row">${kind==="ws"?`<button class="btn mini sun" data-act="ws" data-k="${u.k}">Open worksheet</button>`:""}${kind==="proj"?`<button class="btn mini sun" data-act="startexp" data-title="${esc(ttl)}" data-topic="${esc(u.title)}">Track it</button>`:""}<button class="btn mini ${d?"ghost":"ok"}" data-act="task" data-k="${u.k}" data-id="${id}">${d?"Undo":"Mark done ✓"}</button></div></div>`}).join("")}</div>`}

    return `<div class="q"><div class="p">${qn}. ${esc(it.p)}</div>${body}</div>`}).join("")}</section>`).join("")+`<button class="btn ${taskDone(k,"ws")?"":"ok"}" data-act="task" data-k="${k}" data-id="ws">${taskDone(k,"ws")?"Worksheet done ✓ (tap to undo)":"We've finished the worksheet ✓"}</button>`}
function initPads(){document.querySelectorAll("canvas.pad").forEach(c=>{if(c._ok)return;c._ok=1;const r=c.getBoundingClientRect();if(!r.width)return;c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;const x=c.getContext("2d");x.scale(devicePixelRatio,devicePixelRatio);x.lineWidth=3;x.lineCap="round";x.lineJoin="round";x.strokeStyle=getComputedStyle(document.body).color;let d=false;
  const pt=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e))};c.onpointermove=e=>{if(!d)return;x.lineTo(...pt(e));x.stroke()};c.onpointerup=()=>d=false})}

/* ---------- events ---------- */
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;sfx("tap");render();scrollTo(0,0)});
document.getElementById("snd").onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("dk-sound",soundOn?"on":"off")}catch(e){}sfx("tick");render()};
function onAct(e){
  if(ob){const d=ob.d,t=e.target.closest("[data-ob],button[data-age],button[data-b],button[data-s]");if(!t)return;sfx("tap");
    if(t.dataset.ob==="next")return obNext();if(t.dataset.ob==="back"){ob.step--;return render()}
    if(t.dataset.age){d.child=document.getElementById("obName").value;d.age=+t.dataset.age}
    if(t.dataset.b){d.board=t.dataset.b;if(d.board==="none")d.plus=true}
    if(t.dataset.s&&t.classList.contains("choice")){const s=t.dataset.s;d.subjects=d.subjects.includes(s)?d.subjects.filter(x=>x!==s):[...d.subjects,s].sort((a,b)=>SUBJ_KEYS.indexOf(a)-SUBJ_KEYS.indexOf(b))}
    return render()}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,k=b.dataset.k;
  switch(a){
   case "did":{const u=unitBy(k);if(!u)return;const s=b.dataset.s,extra=!!ui.more[s];logSession(u,extra?"more":"plan");ui.more[s]=false;sfx("win");confetti();toast(extra?"Bonus lesson done! 🚀":"Lesson done! Well done 🌟");commit();break}
   case "logk":{const u=unitBy(k);if(u){logSession(u,"free");sfx("ok");toast("Logged for today");commit()}break}
   case "undo":{const s=b.dataset.s,i=S.log.findIndex(l=>l.date===today&&l.subj===s&&l.kind!=="free");if(i>=0){const l=S.log[i];S.log.splice(i,1);const p=S.progress[l.key];if(p&&p.sessions){p.sessions--;const uu=unitBy(l.key);if(p.status==="completed"&&uu&&p.sessions<sessionsFor(uu))p.status="learning";if(!p.sessions&&p.status==="learning")p.status="none"}ui.more[s]=false;sfx("flip");commit()}break}
   case "more":{ui.more[b.dataset.s]=true;sfx("tick");render();break}
   case "less":{ui.more[b.dataset.s]=false;sfx("flip");render();break}
   case "skip":{S.skips[today+"|"+b.dataset.s]=true;sfx("flip");toast("Moved to the next lesson day");commit();break}
   case "free":{openPicker();break}
   case "step":{const key=b.dataset.key,i=+b.dataset.i,set=new Set(S.steps[key]||[]);if(set.has(i))set.delete(i);else{set.add(i);sfx("tick")}S.steps[key]=[...set];commit();break}
   case "open":{sfx("flip");openSheet(k,"chapter",b.dataset.t);break}
   case "ws":{sfx("flip");openSheet(k,"ws");break}
   case "etab":{ui.etab[k]=b.dataset.t;sfx("tap");renderSheet(true);break}
   case "task":{const id=b.dataset.id;S.tasks[k]=S.tasks[k]||{};if(S.tasks[k][id])delete S.tasks[k][id];else{S.tasks[k][id]=today;sfx("ok");toast("Marked done ✓")}commit();break}
   case "startexp":{addExp(b.dataset.title,b.dataset.topic);sfx("ok");toast("Added to ongoing projects");commit();break}
   case "status":{const p=S.progress[k]||{sessions:0};p.status=b.dataset.s;p.updated=today;S.progress[k]=p;sfx(b.dataset.s==="mastered"?"win":"tick");commit();break}
   case "hrs":{const u=unitBy(k);if(u){S.hrs[u.k]=Math.max(.5,hoursFor(u)+(+b.dataset.d));sfx("tap");commit()}break}
   case "lvl":{const s=b.dataset.s;S.levels[s]=Math.min(5,Math.max(1,S.levels[s]+(+b.dataset.d)));ui.view[s]=S.levels[s];sfx("tick");commit();break}
   case "day":{const s=b.dataset.s,d=+b.dataset.d,cur=new Set(daysOf(s));cur.has(d)?cur.delete(d):cur.add(d);if(cur.size){S.days={...S.days,[s]:[...cur].sort()};sfx("tap");commit()}break}
   case "pday":{ui.planDay=b.dataset.d;sfx("tap");render();break}
   case "tsub":{ui.topicSubj=b.dataset.s;sfx("tap");render();break}
   case "view":{ui.view[b.dataset.s]=+b.dataset.l;sfx("tap");render();break}
   case "setlvl":{S.levels[b.dataset.s]=+b.dataset.l;sfx("tick");commit();break}
   case "check":{const x=S.exps.find(x=>x.id===b.dataset.e);if(x&&!x.checks.includes(today)){x.checks.push(today);sfx("ok");commit()}break}
   case "close":{const x=S.exps.find(x=>x.id===b.dataset.e);if(x){x.closed=true;x.end=today;sfx("win");confetti();toast("Experiment finished! 🧪");commit()}break}
   case "addexp":{const v=document.getElementById("newExp").value.trim();if(v){addExp(v,"Own experiment");sfx("ok");commit()}break}
   case "joke":{ui.jokes[b.dataset.j]=!ui.jokes[b.dataset.j];sfx(ui.jokes[b.dataset.j]?"ok":"flip");render();break}
   case "gtab":{ui.game=b.dataset.g;sfx("tap");render();break}
   case "wk":{const u=dailyUnit();if(!u)return;const x=u.c.x,word=x.words[dayNo%x.words.length],g=G();g.cur=g.cur||"";const key=b.dataset.key;if(g.g.includes(word)||g.g.length>=6)return;
     if(key==="DEL"){g.cur=g.cur.slice(0,-1);sfx("key")}else if(key==="ENTER"){if(g.cur.length===5){g.g.push(g.cur);const w=g.cur===word;g.cur="";sfx(w?"win":g.g.length>=6?"no":"flip");if(w)confetti();S.updatedAt=Date.now();save()}else{sfx("no");toast("Five letters, please")}}else if(g.cur.length<5){g.cur+=key;sfx("key")}render();break}
   case "tf":{const u=dailyUnit(),q=u.c.x.quiz[+b.dataset.i];G().tf[b.dataset.i]=+b.dataset.v;const r=(+b.dataset.v===1)===q[1];sfx(r?"ok":"no");if(Object.keys(G().tf).length===u.c.x.quiz.length){setTimeout(()=>sfx("win"),300)}commit();break}
   case "odd":{const u=dailyUnit(),o=u.c.x.odd[dayNo%u.c.x.odd.length],g=G();if(!g.odd){g.odd=b.dataset.w;sfx(g.odd===o[1]?"win":"no");if(g.odd===o[1])confetti();commit()}break}
   case "mcq":{setA(k,b.dataset.id,+b.dataset.o);sfx(+b.dataset.o===+b.dataset.a?"ok":"no");commit();break}
   case "mcqreset":{delete S.ans[k][b.dataset.id];sfx("flip");commit();break}
   case "checkfill":{const ans=JSON.parse(b.dataset.a),v=A(k,b.dataset.id)||[];const norm=s=>String(s||"").trim().toLowerCase();const good=ans.every((x,i)=>{const w=norm(v[i]);return w&&(norm(x).includes(w)||w.includes(norm(x).split(/[ (]/)[0]))});sfx(good?"ok":"no");toast(good?"Looks right! ✓":"Have another look");break}
   case "showfill":{sfx("flip");toast(b.dataset.a);break}
   case "drew":{setA(k,b.dataset.id,A(k,b.dataset.id)?undefined:today);if(A(k,b.dataset.id)===undefined)delete S.ans[k][b.dataset.id];else sfx("ok");commit();break}
   case "tok":{const key=k+b.dataset.id;ui.sel[key]=ui.sel[key]===b.dataset.x?undefined:b.dataset.x;sfx("tap");renderSheet();break}
   case "bucket":{const sel=ui.sel[k+b.dataset.id];if(sel===undefined)return;const v={...(A(k,b.dataset.id)||{})};v[sel]=+b.dataset.c;setA(k,b.dataset.id,v);ui.sel[k+b.dataset.id]=undefined;sfx("tick");commit();break}
   case "untok":{const v={...(A(k,b.dataset.id)||{})};delete v[b.dataset.x];setA(k,b.dataset.id,v);sfx("flip");commit();break}
   case "mleft":{ui.sel[k+b.dataset.id]=b.dataset.x;sfx("tap");renderSheet();break}
   case "mright":{const l=ui.sel[k+b.dataset.id];if(!l){sfx("no");toast("Tap a word on the left first");return}const v={...(A(k,b.dataset.id)||{})};Object.keys(v).forEach(x=>{if(v[x]===b.dataset.x)delete v[x]});v[l]=b.dataset.x;setA(k,b.dataset.id,v);ui.sel[k+b.dataset.id]=undefined;const it=unitBy(k).c.x.wsd[+b.dataset.id.split("-")[0]][1][+b.dataset.id.split("-")[1]];sfx(it.pairs.some(p=>p[0]===l&&p[1]===b.dataset.x)?"ok":"tick");commit();break}
   case "mreset":{setA(k,b.dataset.id,{});sfx("flip");commit();break}
   case "clearpad":{const c=document.querySelector(`canvas[data-pad="${CSS.escape(b.dataset.pad)}"]`);if(c)c.getContext("2d").clearRect(0,0,c.width,c.height);sfx("flip");break}
  }}
document.getElementById("main").addEventListener("click",onAct);
document.getElementById("sheetBody").addEventListener("click",onAct);
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset.ans)return;const [k,id,sub]=t.dataset.ans.split("|");if(sub===undefined)setA(k,id,t.value);else if(sub.includes(".")){const v={...(A(k,id)||{})};v[sub]=t.value;setA(k,id,v)}else{const v=[...(A(k,id)||[])];v[+sub]=t.value;setA(k,id,v)}S.updatedAt=Date.now();save()});
document.getElementById("main").addEventListener("change",e=>{const t=e.target;
  if(t.matches("select[data-hpd]")){const s=t.dataset.hpd,v=+t.value;sfx("tap");if(ob)ob.d.hpd={...(ob.d.hpd||DEF_HPD),[s]:v};else{S.hpd={...(S.hpd||DEF_HPD),[s]:v};commit()}return}
  if(ob&&t.matches("#obPlus")){ob.d.plus=t.checked;sfx("tap");return}if(ob&&t.matches("select[data-s]")){ob.d.levels[t.dataset.s]=+t.value;sfx("tap")}});
const pick=document.getElementById("pick");
function openPicker(){document.getElementById("pickList").replaceChildren(el(everyUnit().map(u=>`<button class="btn" style="text-align:left;box-shadow:none" data-k="${u.k}">${SUBJ[u.subj]} L${u.level} · ${esc(u.title)}</button>`).join("")));pick.showModal()}
document.getElementById("pickList").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const u=unitBy(b.dataset.k);if(u){logSession(u,"free");pick.close();sfx("ok");toast("Logged!");commit()}});
document.getElementById("pickClose").onclick=()=>pick.close();
const dlg=document.getElementById("settings");
document.getElementById("openSettings").onclick=()=>{sfx("tap");sName.value=S.child;sStart.value=S.start;syncNote.textContent=syncMode==="account"?"Progress is saved privately to your claude.ai account.":"Progress is saved in this browser only.";dlg.showModal()};
setForm.addEventListener("submit",e=>{S.child=sName.value.trim();if(sStart.value)S.start=sStart.value;if(e.submitter&&e.submitter.value==="redo"){save();startOnboarding(1)}else commit()});
boot();
</script>
