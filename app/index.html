{"k":"ncert|hin|5|7","board":"ncert","subj":"hin","level":5,"book":"Veena (वीणा) · Class 5","n":"7","title":"Mera Bachpan","dk":[],"c":null},{"k":"ncert|hin|5|8","board":"ncert","subj":"hin","level":5,"book":"Veena (वीणा) · Class 5","n":"8","title":"Kaziranga Rashtriya Udyan ki Yatra","dk":[],"c":null},{"k":"ncert|hin|5|9","board":"ncert","subj":"hin","level":5,"book":"Veena (वीणा) · Class 5","n":"9","title":"Nyay","dk":[],"c":null},{"k":"ncert|hin|5|10","board":"ncert","subj":"hin","level":5,"book":"Veena (वीणा) · Class 5","n":"10","title":"Teen Machhliyan","dk":[],"c":null},{"k":"ncert|hin|5|11","board":"ncert","subj":"hin","level":5,"book":"Veena (वीणा) · Class 5","n":"11","title":"Hamare ye Kalamandir","dk":[],"c":null},{"k":"ncert|hin|5|12","board":"ncert","subj":"hin","level":5,"book":"Veena (वीणा) · Class 5","n":"12","title":"Ganga ki Kahani","dk":[],"c":null},{"k":"ncert|sci|3|1","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"1","title":"Family and Friends","dk":["B2","C6"],"c":{"covers":"Kinds of families, relatives and what we call them, roles and shared work at home, friends, generations then and now.","game":["Relation Railway","A train leaves 'Me Station' and only correct relations can board. Take turns reading riddle cards ('Your father's sister's son is your…'). Answer in 10 seconds to add a coach to your train; a wrong answer derails it. Longest train wins. Bonus coach for saying the word in a third language."],"exp":["Hand-span survey: measure the hand span and height of everyone in the family (and a neighbour family). Chart it: do children's hands grow toward their parents' sizes?"],"act":["Then-and-Now interview with a grandparent: games, school, food, toys at age 8.","Chore wheel: list every job at home, see who does it, rotate jobs for one week and talk about how it felt."],"proj":["Family Museum Box","Over 2 weeks collect 5 objects with family stories (an old photo, a utensil, a letter), label each, add a family tree and a recorded elder interview.","A shoebox museum the child presents to the family"],"read":["Grandma's Bag of Stories, Sudha Murty","The Family Book, Todd Parr"],"links":["Santoor Ch 3: Best Friends","Veena Ch 7: मित्र को पत्र","Maths Mela Ch 4: Vacation with My Nani Maa"],"x":{"learn":["Families come in many shapes: joint, nuclear, single-parent, adoptive, grandparents raising children. None is the 'real' one.","Indian languages name relatives precisely (mama, chacha, fufa, mausa) where English says only 'uncle'. Language shows what a culture pays attention to.","Families share work. Who does which job at home is a choice, not a law of nature.","Friends are the family we choose. Scientists have recorded long friendships in chimpanzees, dolphins and horses too.","Elephant herds are led by the oldest female; her memory of water holes helps the whole herd survive dry years."],"think":["Is a family made by blood, by living together, or by love? Can it be all three, or none?","Why might Hindi need four words where English needs one? What does English have many words for?","Contrary view: some people say only humans truly have friends. What would you need to see to believe an animal has a friend?"],"oneness":"Vasudhaiva Kutumbakam: the world is one family. If you trace any family tree back far enough, who is not your relative?","jokes":["Why are families like fudge? Mostly sweet, with a few nuts!","Why did the baby strawberry cry? Its mom and dad were in a jam!","Why did Nani bring a ladder to the party? She heard the drinks were on the house!"],"words":["UNCLE","NIECE","TWINS","CHILD","ELDER"],"quiz":[["Every family has a mother, a father and children.",false,"Families come in many forms; all of them are real families."],["In elephant herds, the oldest female usually leads.",true,"The matriarch remembers routes and water holes."],["In Hindi, your mother's brother is your mama.",true,"Your father's brother is chacha."],["English has as many words for relatives as Hindi.",false,"English uses 'uncle' and 'aunt' for many different relatives."]],"odd":[[["Mama","Chacha","Mausi","Fufa"],"Mausi","Mausi is a woman's relation; the others are men."],[["Nani","Dadi","Bhaiya","Nana"],"Bhaiya","Bhaiya is your own generation; the others are grandparents."]],"ws":[["My family tree","Draw three generations. Write each name and what you call them in two languages."],["Relation riddles","My father's sister is my ____. My mother's sister is my ____. My father's brother's son is my ____. My mother's mother is my ____."],["Then and now","Ask a grandparent: their favourite game, food, toy and school subject at your age. Fill in yours beside theirs."],["Think","Draw an animal family that lives together. Who leads it? Who looks after the babies?"]],"sheet":["Chore Wheel Week",["Job","Who did it","Mon","Tue","Wed","Thu","Fri","Sat","Sun"],6],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiment: hand-span survey",0.5,1],["Activities: elder interview, chore wheel",1.5,7],["Game: Relation Railway",0.5,1],["Project: Family Museum Box",3,14]],"cur":[["Great Questions to Ask Grandparents","StoryCorps","https://archive.storycorps.org/question-lists/great-questions-to-ask-grandparents/","Use for the elder interview; record it on a phone for the Family Museum Box."],["'A Sick Day for Amos McGee' discussion guide: can an animal be a friend?","Prindle Institute, Teaching Children Philosophy","https://www.prindleinstitute.org/?p=2581","A philosophy circle after reading: friendship across species and what makes someone family."]],"deep":[{"q":"What makes a group of people a family?","why":"Every society has families, but they are built very differently. Some count relatives through the mother's line, some through the father's, some through both. Some children are raised by a whole village. Asking what makes a family is asking what holds people together at all.","views":[["Biology","Family is shared genes: parents, children and their blood relatives. This explains inherited looks and traits, but not adopted children, step-parents or chosen family."],["Kerala's matrilineal Nair and Meghalaya's Khasi traditions","Family and property pass through the mother's line. Among the Khasi, the youngest daughter traditionally inherits the house. So 'who is family' depends on which line a society follows."],["Care-based view","Family is whoever cares for you day after day. A grandmother raising a child, or two friends who share a home for life, can be family."]],"tryit":"Make two lists: people related to you by birth, and people who look after you. Where do the lists overlap? Who is on only one list, and are they less your family?"},{"q":"Why does Hindi have chacha, mama, fufa and mausa where English has only 'uncle'?","why":"Languages grow words for what a culture needs to tell apart. In joint families it mattered whether an uncle was from your father's side (who might live with you) or your mother's side (who usually didn't).","views":[["Linguists","Kinship words show how a society organises duties: who you live with, who inherits, who you may marry."],["English speakers","One word is simpler, and the difference can be explained when needed ('my mother's brother')."],["Tamil","Tamil goes further: an older brother (annan) and younger brother (thambi) have different words, because age order carries different roles."]],"tryit":"Ask an elder for every relative's name in your home language. Count them. Then count the English words for the same people."},{"q":"Do animals have families and friends, or are we just imagining it?","why":"It is easy to see human feelings in animals. Scientists try hard not to, so the evidence matters.","views":[["Elephant researchers","Herds are led by the oldest female, who remembers water holes from decades before. Herds with older matriarchs survive droughts better."],["Primatologists","Chimpanzees and baboons form long friendships, groom friends more, and are calmer near them."],["Careful sceptics","We should not call it 'friendship' unless it is more than just staying near someone. What we can measure is choosing, helping and returning to the same individual."]],"tryit":"Watch a group of pigeons, crows or street dogs for 10 minutes. Do some always stay together? What would count as proof that two are friends?"}],"wsd":[["A. My family map",[{"t":"draw","p":"Draw your family tree for three generations: grandparents, parents and their brothers and sisters, you and your cousins. Write each person's name and what you call them."},{"t":"table","p":"Who lives in your home? Fill in the table.","cols":["Name","What I call them","One job they do at home"],"rows":5}]],["B. Relations puzzle",[{"t":"fill","p":"My father's sister is my ____. My mother's sister is my ____. My father's brother is my ____. My mother's brother is my ____.","a":["bua","mausi","chacha","mama"]},{"t":"mcq","p":"Your mother's mother's daughter could be:","opts":["Your mother or your mausi","Your bua","Your chachi","Your cousin"],"a":0}]],["C. Then and now",[{"t":"table","p":"Interview a grandparent or an elder.","cols":["Question","Them at age 8","Me now"],"rows":5,"prefill":["Favourite game","Favourite food","How they got to school","A toy","A chore they did"]}]],["D. Think it through",[{"t":"sort","p":"Sort these into 'related by birth', 'related by marriage' and 'chosen family'.","items":["Nani","Chachi","Best friend","Brother","Fufa","A neighbour who looks after you"],"cats":["By birth","By marriage","Chosen"]},{"t":"write","p":"A friend says: 'A family must have a mother and a father.' Do you agree? Give one example that supports them and one that doesn't.","lines":4}]],["E. Animal families",[{"t":"write","p":"Elephant herds are led by the oldest female. Why might the oldest one be the best leader in a drought?","lines":3}]]]}}},{"k":"ncert|sci|3|2","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"2","title":"Going to the Mela","dk":["B2"],"c":{"covers":"Village fairs: stalls, crafts, toys and rides, buying and selling, crowds and staying safe.","game":["Mela Market","You each run a stall (bangles, chaat, toys) with ₹100 in play coins. Draw customer cards with wishes and budgets; sell, give exact change, restock. Surprise cards: 'Lost at the mela: what do you do?' (answer well to earn a coin). First to ₹150 wins."],"exp":["Firki lab: make paper pinwheels with 4, 6 and 8 blades. Which spins fastest in front of a fan? Does blade size matter?","Lattu test: spin a top on floor, steel plate and carpet. Time each spin. What slows it down?"],"act":["Draw a map of a mela (real or remembered) with stalls, entry, rides and a 'meeting point if lost'.","Make a traditional toy: a dugdugi (pellet drum) from a paper cup or a chakri."],"proj":["Our Mini Mela","Plan and run a small mela for family or neighbours: 3 stalls, handmade toys, price list, a money log, and a lost-and-found rule.","A real event, plus a chart of what sold and what was earned"],"read":["StoryWeaver (Pratham Books): search 'mela' for free picture books"],"links":["Maths Mela Ch 14: The Surajkund Fair","Maths Mela Ch 12: Give and Take"],"x":{"learn":["Melas are where people trade, make music, sell crafts and meet. Many happen after harvests, when people have time and money.","Famous melas: Pushkar (camels), Sonepur (cattle), Surajkund (crafts from across India), the Kumbh (one of the largest gatherings of people on Earth).","Buying and selling: prices, change, bargaining, and why a fair price must be fair to both sides.","Rides and toys work by science: a spinning ride presses you outward, a firki needs moving air, a dugdugi makes sound by beads striking a skin.","Crowd safety: agree a meeting point, know your family's phone number, go to the help desk if lost."],"think":["Is bargaining fair? Fair to whom: the buyer, the seller, the artisan who made it?","Why do so many melas happen just after harvest?","Contrary view: some say malls have replaced melas. What does a mela give people that a mall can't, and what does a mall give that a mela can't?"],"oneness":"Thousands of people at a mela move like one great being, then scatter and come back next year. Is a mela a kind of living thing?","jokes":["What did the giant wheel say to the child? Don't worry, I'll come around again!","Why did the balloon go to the mela? To get blown away!","Why was the maths book sad at the ticket counter? Too many problems!"],"words":["STALL","RIDES","CROWD","MONEY","FLUTE"],"quiz":[["The Surajkund mela in Haryana is famous for crafts.",true,"Artisans come from all over India and other countries."],["A pinwheel spins only when air moves.",true,"Moving air pushes on its blades."],["The Pushkar fair is famous for its camels.",true,"It is one of the world's largest camel fairs."],["If you get lost at a mela, you should walk away alone to search.",false,"Stay where you are or go to the help desk."]],"odd":[[["Firki","Dugdugi","Kite","Television"],"Television","The others are traditional mela toys you can make by hand."]],"ws":[["₹100 at the mela","Choose 4 things to buy from the price list (balloon ₹15, chaat ₹30, bangles ₹40, firki ₹10, ride ₹25). Add them up. How much change do you get?"],["Mela map","Draw a mela with 6 stalls, a ride, the entrance and a 'meet here if lost' spot."],["How does it work?","Draw a firki and arrows to show where the air pushes it."],["Think","Write one thing that makes a price fair to the buyer and one that makes it fair to the maker."]],"sheet":["Firki Lab",["Firki","Number of blades","Blade size","Spins in 10 seconds (fan)","My guess why"],4],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: pinwheel lab, top test",1,1],["Activities: mela map, make a toy",1.5,2],["Game: Mela Market",0.75,1],["Project: Our Mini Mela",4,10]],"cur":[["Toys from Trash: hundreds of free, copyright-free toy designs (pencil fan, paper toys, sound toys)","Arvind Gupta","https://www.arvindguptatoys.com","Pick 3 toys to make and sell at the Mini Mela stall."]],"deep":[{"q":"Is bargaining fair?","why":"At a mela, prices are often not fixed. The buyer wants it cheap; the seller wants enough to live on. Bargaining is an old way of finding a price both accept, but it can also be unequal.","views":[["The haggler","Bargaining is a game of respect: both sides talk and meet in the middle."],["The artisan","If customers always push the price down, the person who made the thing by hand for days may not earn enough. Fair-trade shops fix prices to protect makers."],["Economists","A fair price is one both sides accept freely, knowing the facts. Bargaining is fair when both know what the thing is really worth."]],"tryit":"Play shop: one person makes a paper toy and must earn at least ₹20 worth of tokens for it. The other has ₹30. Bargain. Then swap roles. How did each side feel?"},{"q":"Why do so many melas happen just after harvest?","why":"Melas are tied to the farming calendar. After harvest, farmers have money, food and free time, and the weather is often pleasant.","views":[["Historians","Fairs like Sonepur and Pushkar grew from cattle and camel trading at set times each year, when animals and crops could be sold."],["Religious traditions","Many melas mark a festival or a holy bath (like the Kumbh), so the date comes from the stars and the Moon."],["Today","Some melas are now planned for tourists. Does that change what a mela is?"]],"tryit":"Pick three melas (Pushkar, Surajkund, a local one). Find the month each happens and what farmers are doing at that time."},{"q":"Is a mela a kind of living thing?","why":"A mela appears, grows, draws in energy (people, money, food), changes, ends, and comes back next year. Thinking about this tests what we mean by 'alive'.","views":[["Biologists","No: a mela has no cells and does not reproduce or evolve by itself."],["Systems thinkers","Cities, markets and ant colonies behave like living systems: many parts following simple rules make something bigger that seems to have a life of its own."],["Oneness traditions","Thousands of people moving as one, then scattering and gathering again, is a picture of how separate selves are part of one larger life."]],"tryit":"Watch a crowd (or a video of one) from above. Does it move like one creature? Draw the arrows."}],"wsd":[["A. Spend wisely",[{"t":"table","p":"You have ₹100. Prices: balloon ₹15, chaat ₹30, bangles ₹40, pinwheel ₹10, ride ₹25, kulfi ₹20. Choose four things.","cols":["Item","Price (₹)"],"rows":5,"prefill":["","","","","Total"]},{"t":"write","p":"₹100 minus your total = how much change? Show your working.","lines":2},{"t":"mcq","p":"Which set costs exactly ₹100?","opts":["Bangles, chaat, kulfi, pinwheel","Ride, kulfi, chaat, balloon","Bangles, ride, chaat","Kulfi, pinwheel, balloon, ride"],"a":0}]],["B. How mela toys work",[{"t":"draw","p":"Draw a pinwheel. Use arrows to show where the air comes from and which way it turns."},{"t":"mcq","p":"A pinwheel spins fastest when:","opts":["The air is still","Air pushes on its blades","It is painted brightly","It is heavy"],"a":1},{"t":"write","p":"A dugdugi (pellet drum) makes sound when you twist it. What is hitting what? Why does it stop when you stop twisting?","lines":3}]],["C. Staying safe",[{"t":"write","p":"Write your family's plan if you get separated at a mela: where you meet, who you ask, what number you say.","lines":3}]],["D. Think it through",[{"t":"write","p":"A potter spent two days making a pot and asks ₹200. A buyer offers ₹80. Write what each might say. What would be a fair price, and why?","lines":4},{"t":"sort","p":"Sort what a mela gives people.","items":["Buying things","Meeting friends","Music and shows","Selling crafts","Rides","Festival prayers"],"cats":["Trade","Fun","Culture"]}]]]}}},{"k":"ncert|sci|3|3","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"3","title":"Celebrating Festivals","dk":["B2","B5"],"c":{"covers":"Festivals across India, why they happen when they do (harvests, seasons, the Moon), foods, lights, sharing and celebrating together.","game":["Festival Calendar Race","A circle of 12 months on the floor. Draw festival cards (Pongal, Bihu, Onam, Eid, Diwali, Christmas, Baisakhi, Holi, Durga Puja, Gurpurab, Phooldei…). Place each in its month and say why it falls then: harvest, season or Moon. Correct month 1 point, correct reason 2 points, naming the Moon's phase that night 3 points."],"exp":["Haldi magic: paint with haldi paste, then dab soap water on it. Why does yellow turn red? (Haldi is a natural indicator.)","Diya and jar: which burns longer, a diya under a small glass or under a big jar? (Adult lights it.)"],"act":["Festival food map of India: one dish per festival, pinned on a map.","Mark the next 3 months' full and new moons and find which festivals land on them."],"proj":["A Festival of Our Own","Design a new family festival for this season: what it celebrates, food, decorations, a song, an invitation. Host it.","A celebration, an invitation card and photos"],"read":["Binny's Diwali, Thrity Umrigar","Lights for Gita, Rachna Gilmore","Amma, Tell Me About Diwali!, Bhakti Mathur"],"links":["Veena Ch 9: प्रकृति पर्व – फूलदेई","Maths Mela Ch 7: Raksha Bandhan","Santoor Ch 11: Chanda Mama Counts the Stars"],"x":{"learn":["Many festivals mark seasons and harvests: Pongal, Bihu, Lohri and Makar Sankranti fall around mid-January as winter ends; Baisakhi and Onam celebrate harvests.","Many festivals follow the Moon: Holi and Guru Purnima are on full moons, Diwali on the new moon of Kartik, and Eid begins when the new crescent moon is seen.","Lunar calendars make festival dates move each year; Christmas follows the solar calendar and stays on 25 December.","The same idea travels under different names across India; Phooldei in Uttarakhand welcomes spring with flowers on doorsteps.","Festivals are about sharing: food, light, music, gifts, and remembering the people and nature that keep us alive."],"think":["Why does Diwali's date change every year but Christmas doesn't?","Birds sing more in spring and frogs call in the monsoon. Are those animals' festivals?","Two sides: firecrackers bring joy, but they also pollute the air and frighten animals. What would a festival that keeps the joy look like?"],"oneness":"So many festivals thank the Sun, the Moon, the rain and the harvest. Is a festival people saying thank you to the rest of the universe?","jokes":["Why did the diya go to school? To become a little brighter!","What did one firecracker say to the other? My pop is bigger than yours!","Why are kites never lonely at Sankranti? The whole sky is full of friends!"],"words":["LIGHT","SWEET","FEAST","DRUMS","LUNAR"],"quiz":[["Holi is celebrated on a full-moon day.",true,"It falls on the full moon of Phalguna."],["Eid begins when the new crescent moon is seen.",true,"That is why the date can differ by a day between places."],["Diwali falls on the same date every year.",false,"It follows the Moon, so its date moves."],["Pongal, Bihu and Lohri are linked to harvests and winter's end.",true,"They fall around mid-January."]],"odd":[[["Holi","Guru Purnima","Buddha Purnima","Diwali"],"Diwali","Diwali is on a new moon; the others are on full moons."]],"ws":[["Festival circle","Draw a circle of 12 months. Write 6 festivals in their months and why each happens then."],["Moon match","Draw a full moon and a new moon. Write one festival under each."],["Design a festival","Invent a festival for this season: what it celebrates, food, decoration and a song."],["Two sides","Firecrackers: write one reason people love them and one reason to rethink them."]],"sheet":["Moon Diary (2 weeks)",["Date","Time","Draw the Moon","Any festival near?"],14],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: haldi indicator, diya jar",0.75,1],["Activities: festival food map, moon calendar",1.5,14],["Game: Festival Calendar Race",0.5,1],["Project: A Festival of Our Own",3,7]],"cur":[["Moon Phases lesson (ball and lamp in a dark room)","NASA JPL Education","https://www.jpl.nasa.gov/edu/teach/activity/moon-phases/","Model why Holi falls on a full moon and Diwali on a new moon."],["Cookie moon phases","NASA Space Place (via library and museum adaptations)","https://spaceplace.nasa.gov","Scrape biscuit cream to make each phase; eat the new moon."]],"deep":[{"q":"Why does Diwali move around the calendar but Christmas doesn't?","why":"People have always used the sky to keep time. The Sun gives the year and the seasons; the Moon gives months of about 29½ days. The two don't fit neatly: 12 lunar months are about 11 days shorter than a solar year.","views":[["The solar calendar (used for Christmas and the school year)","Follows the Sun, so dates stay with the seasons."],["The Hindu lunisolar calendar (Panchang)","Months follow the Moon, but an extra month (adhik maas) is added about every three years so festivals stay in the right season. That's why Diwali always comes in autumn but on different dates."],["The Islamic calendar","Purely lunar with no extra month, so Eid moves through all the seasons over about 33 years."]],"tryit":"Find the dates of Diwali and Eid for the last 5 years. Which moves more? Can you explain why from the rules above?"},{"q":"Should festivals change when they harm others?","why":"Festivals carry meaning across generations. But some customs (loud firecrackers, plastic decorations, idols in rivers) affect air, water, animals and people with breathing problems.","views":[["Tradition keepers","Customs connect us to our grandparents and give the festival its meaning; changing them loses something."],["Environmental scientists","Firecrackers add fine dust that can make city air much worse for days; animals and birds are frightened by the noise."],["Many communities","Festivals have always changed. Clay idols, green crackers, community diyas and quiet hours are new traditions keeping the old meaning."]],"tryit":"Ask three elders how their festivals were celebrated as children. What changed, and why? Was the change for better or worse?"},{"q":"Do animals and plants have festivals?","why":"In spring, birds sing and nest; in the monsoon, frogs gather and call all night; some flowers bloom together on one night. These are timed by the season, like many human festivals.","views":[["Ecologists","These are 'phenology': life events timed by day length, temperature and rain. Many human festivals are also tied to these same cycles, such as harvest festivals."],["Poets and many traditions","The koel's call announcing spring has been celebrated for centuries as nature's own festival."],["Careful thinkers","A festival needs meaning and choice. Do frogs choose, or only respond? What is the difference?"]],"tryit":"For two weeks, note which birds call at dawn and which flowers are blooming. Is anything 'celebrating' this season?"}],"wsd":[["A. Festivals around the year",[{"t":"table","p":"Fill in six festivals.","cols":["Festival","Month","Season","Why then? (harvest / Moon / new year / other)"],"rows":6},{"t":"sort","p":"Sort these festivals.","items":["Holi","Guru Purnima","Diwali","Pongal","Baisakhi","Eid"],"cats":["Moon-based","Harvest-based","Both"]}]],["B. The Moon's clock",[{"t":"draw","p":"Draw the Moon on a full-moon night and on a new-moon night. Under each, write one festival that falls on it."},{"t":"mcq","p":"Diwali falls on:","opts":["A full moon","A new moon (amavasya)","The longest day","Any day the family chooses"],"a":1},{"t":"fill","p":"12 Moon months are about ____ days shorter than one Sun year.","a":["11"]}]],["C. Look closer",[{"t":"write","p":"Paint a strip of paper with haldi paste. Dab soap water on it. What happened to the colour? What might be inside soap that haldi 'notices'?","lines":3}]],["D. Think it through",[{"t":"write","p":"Firecrackers: write two reasons people love them and two problems they cause. Then design a celebration that keeps the joy.","lines":5}]],["E. Create",[{"t":"draw","p":"Invent a festival for this season. Draw its symbol and write what it celebrates, one food, and one way everyone joins in."}]]]}}},{"k":"ncert|sci|3|4","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"4","title":"Getting to Know Plants","dk":["A5"],"c":{"covers":"Kinds of plants (trees, shrubs, herbs, climbers), parts and their jobs, leaf shapes, seeds, what plants need, how we use plants.","game":["Leaf Detective Bingo","Bingo cards show leaf shapes, edges and vein patterns (heart, needle, toothed, compound, parallel veins). On a 20-minute walk, mark a square only when you hold a matching leaf. First line shouts 'Leaf!'. Final round: 'Which part do we eat?' speed quiz with carrot, potato, spinach, cauliflower, rice."],"exp":["Coloured-water flower: put a white flower or celery stalk in water with food colour. Check after 6 and 24 hours. How did the colour climb?","Seeds' needs: sow moong in four cups (water + light, no water, dark, cold fridge). Compare after 5 days."],"act":["Leaf-rubbing book: 10 leaves, crayon rubbings, names in two languages.","Adopt a tree: measure its trunk with string, sketch it, visit monthly."],"proj":["Kitchen-Garden Pot","Sow methi or dhaniya, water and measure daily, harvest at about 4 weeks, and cook something with it.","A harvest, a growth chart and a dish"],"read":["From Seed to Plant, Gail Gibbons","The Tiny Seed, Eric Carle","A Seed Is Sleepy, Dianna Hutts Aston"],"links":["Veena Ch 5: आम का पेड़","Veena Ch 13: पेड़ों की अम्मा 'तिमक्का'","Santoor Ch 4: Out in the Garden"],"x":{"learn":["Plants come as trees, shrubs, herbs, climbers and creepers.","Each part has a job: roots hold and drink, the stem carries water up and food down, leaves make food from sunlight, flowers make seeds, seeds start new plants.","Leaves differ: net veins (mango) vs parallel veins (grass, banana); simple vs compound leaves.","Roots differ: one main taproot (carrot, mustard) vs a bunch of thin fibrous roots (grass, rice). A potato is a stem, not a root.","Saalumarada Thimmakka of Karnataka planted and cared for hundreds of banyan trees along a road, treating them as her children."],"think":["Do plants move? Think of a sunflower, a climbing vine, roots finding water, the touch-me-not.","Is a tree one living thing or a whole city of living things?","Scientists disagree: some say trees 'talk' and share food through fungus networks under the soil (the 'wood wide web'); others say the evidence is weaker than the stories. How could you find out?"],"oneness":"You breathe out what the tree breathes in, and the tree breathes out what you breathe in. Are you and the tree breathing each other?","jokes":["Why was the tree so good at school? It was rooted in its studies!","What did the big flower say to the little flower? Hey, bud!","Why do trees hate tests? They get stumped!"],"words":["ROOTS","STEMS","SEEDS","PETAL","SHOOT"],"quiz":[["A potato is a stem.",true,"It has 'eyes' (buds) that sprout, like a stem."],["A carrot is a root.",true,"It's a taproot that stores food."],["Leaves make food using sunlight.",true,"This is photosynthesis."],["All plants have flowers.",false,"Ferns and mosses never flower."]],"odd":[[["Carrot","Radish","Beetroot","Potato"],"Potato","A potato is a stem; the others are roots."],[["Mango","Neem","Tulsi","Peepal"],"Tulsi","Tulsi is a small herb; the others are trees."]],"ws":[["Label me","Draw a plant and label root, stem, leaf, flower, fruit, seed. Write each part's job."],["Which part do we eat?","Sort: carrot, potato, spinach, cauliflower, rice, mango, ginger, sugarcane."],["Leaf hunt","Find 5 leaves. For each: shape, edge (smooth or toothed), veins (net or parallel)."],["Think","Write one way a plant moves. How could you film it to prove it?"]],"sheet":["Coloured-Water Flower",["Time","What colour is the flower?","How far has the colour climbed?","My drawing"],4],"hours":[["Read & discuss the NCERT chapter",2,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: coloured-water flower, seeds' needs",1,5],["Activities: leaf-rubbing book, adopt a tree",1.5,30],["Game: Leaf Detective Bingo",0.75,1],["Project: Kitchen-Garden Pot",2.5,28]],"cur":[["Journey to the Center of a Seed (bean dissection)","KidsGardening","https://kidsgardening.org/lesson-plans-journey-to-the-center-of-a-seed/","Soak rajma overnight, split it, find the baby plant and its food store with a magnifier."]],"deep":[{"q":"Do plants move, sense and decide?","why":"Plants seem still only because they are slow. Time-lapse films show shoots circling, roots bending towards water, leaves following the Sun. J.C. Bose built instruments to record plant responses over a century ago.","views":[["Plant scientists","Plants sense light, gravity, touch, chemicals and damage, and respond, all without a brain or nerves. Roots grow downward because special cells sense gravity."],["'Plant intelligence' researchers","Some argue plants learn and remember (the touch-me-not stops folding when repeatedly dropped harmlessly)."],["Critics","Words like 'decide' and 'learn' may be too human. Responding is not the same as thinking."]],"tryit":"Put a potted plant by a window, mark which way its leaves face, then turn it around. Photograph it every day for a week."},{"q":"Is a tree one living thing or a whole city?","why":"A big tree is home to insects, birds, lichens, fungi and microbes. Its roots partner with fungi that bring water and minerals in exchange for sugar.","views":[["Ecologists","A tree is a keystone: remove it and many species lose their homes."],["The 'wood wide web' idea","Some scientists say trees share sugar and warnings through fungal networks under the soil."],["Recent critics (2023)","Other scientists reviewed the evidence and said those claims are often exaggerated; the fungi certainly connect roots, but whether trees 'help each other' is unproven."]],"tryit":"Choose one tree. In 15 minutes, count every other living thing you can find on or under it."},{"q":"Why did Saalumarada Thimmakka call trees her children?","why":"Thimmakka of Karnataka, who had no children of her own, planted and watered hundreds of banyan saplings along a highway, carrying water for kilometres. She was awarded the Padma Shri.","views":[["Science","A banyan can live for centuries and support whole communities of creatures; planting one is one of the longest-lasting gifts a person can give."],["Many Indian traditions","Trees like the peepal, banyan and tulsi are treated as sacred and cared for like family."],["Your view","Can you love a tree? Can a tree be family? What would you need to do for it?"]],"tryit":"Adopt one tree for a month: name it, measure its trunk with string, give it water in summer, and record its visitors."}],"wsd":[["A. Parts and jobs",[{"t":"draw","p":"Draw a whole plant (pull up a small weed and wash its roots). Label: root, stem, leaf, flower, fruit or seed."},{"t":"match","p":"Match each part to its job.","pairs":[["Root","Holds the plant and drinks water"],["Stem","Carries water up and food down"],["Leaf","Makes food using sunlight"],["Flower","Makes seeds"],["Seed","Starts a new plant"]]}]],["B. Which part do we eat?",[{"t":"sort","p":"Sort these foods.","items":["Carrot","Potato","Spinach","Cauliflower","Rice","Ginger","Mango","Sugarcane"],"cats":["Root","Stem","Leaf","Flower","Fruit or seed"]},{"t":"mcq","p":"A potato is really a:","opts":["Root","Stem","Fruit","Seed"],"a":1}]],["C. Leaf detective",[{"t":"table","p":"Collect five different leaves.","cols":["Plant","Shape","Edge (smooth / toothed)","Veins (net / parallel)"],"rows":5}]],["D. Experiment",[{"t":"write","p":"You put a white flower in coloured water. After a day the petals are coloured. Explain how the colour got there. Which part carried it?","lines":3}]],["E. Think it through",[{"t":"write","p":"Write one way plants move, and how you could prove it with a phone camera.","lines":3}]]]}}},{"k":"ncert|sci|3|5","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"5","title":"Plants and Animals Live Together","dk":["A5","B4","B9"],"c":{"covers":"Homes and habitats, how plants and animals depend on each other: food, shelter, pollination and seed spreading.","game":["Web of Life","Lay 12 living-thing cards on a table (neem tree, bee, myna, earthworm, cow, grass, frog, snake, child…). Take turns joining two with a string and saying how one depends on the other. Then draw a 'Gone!' card: remove that being and every string tied to it. Who is left standing? Rebuild with a rescue plan."],"exp":["Seed hitchhikers: wear old socks over shoes and walk through grass, then 'plant' the sock in a tray of soil and water it. What grows?","Be a bee: dab a cotton bud in one flower and touch another. Look with a magnifier at the pollen."],"act":["Minibeast hunt under a flowerpot or stone (put everything back).","Bird-feeder log: who visits, when, what do they eat?"],"proj":["Wildlife-Friendly Corner","Set up a water bowl, a feeder, a flowering plant and a bamboo 'insect hotel' on a balcony or garden; keep a 3-week visitor log.","A working mini habitat and a visitor chart"],"read":["Over and Under the Pond, Kate Messner","Up in the Garden and Down in the Dirt, Kate Messner","What Do You Do With a Tail Like This?, Steve Jenkins & Robin Page"],"links":["Veena Ch 4: बया हमारी चिड़िया रानी!","Veena Ch 2: चींटी","Veena Ch 3: कितने पैर?","Santoor Ch 2: Badal and Moti"],"x":{"learn":["A habitat gives food, water and shelter. Trees, ponds and even cracks in walls are habitats.","Plants and animals depend on each other: bees and bats carry pollen, birds and animals spread seeds, earthworms enrich soil, plants feed and shelter animals.","Food chains: grass is eaten by a deer, a deer by a tiger. Decomposers (fungi, worms, bacteria) return everything to the soil.","The baya weaver: the male weaves a hanging nest of grass; the female inspects it and chooses.","Remove one living thing and others feel it; that's why forests with many kinds of life recover better."],"think":["Who needs whom more: the bee or the flower?","If all mosquitoes vanished, would that be good? Some scientists think little would change; others say fish, birds and bats would lose food. What do you think?","Is a weed bad? Who decides which plant is a weed?"],"oneness":"A tree feeds the bird, the bird spreads the tree's seeds, the worm feeds the tree. If each needs the others, is a forest one big living being?","jokes":["Why don't ants get sick? They have tiny anty-bodies!","Why did the bee get married? It found its honey!","What did the tree say to the woodpecker? Leaf me alone!"],"words":["BIRDS","NESTS","HONEY","SNAKE","PLANT"],"quiz":[["The male baya weaver builds the nest.",true,"The female chooses which nest she likes."],["Bats can pollinate flowers.",true,"Some flowers, like those of the banana family and baobab, are pollinated by bats."],["Earthworms make soil better for plants.",true,"Their tunnels let in air and their waste is rich food for plants."],["Animals never help plants.",false,"They pollinate, spread seeds and enrich soil."]],"odd":[[["Bee","Butterfly","Bat","Stone"],"Stone","Bees, butterflies and bats can all carry pollen."]],"ws":[["Who needs whom?","Draw 6 living things and connect them with arrows. Write on each arrow what is given."],["Food chain","Fill in: ____ → caterpillar → ____ → snake → ____."],["Habitat match","Match: frog, baya, earthworm, monkey, fish → pond, tree, soil, river, palm tree."],["Think","Write the story of a weed, told by the weed."]],"sheet":["Minibeast Hunt",["Where I looked","What I found","How many","What it was doing","Drawing"],6],"hours":[["Read & discuss the NCERT chapter",2,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: seed hitchhikers, be a bee",1,10],["Activities: minibeast hunt, bird-feeder log",1.5,14],["Game: Web of Life",0.5,1],["Project: Wildlife-Friendly Corner",3,21]],"cur":[["Web of Life (yarn food-web game)","Project Learning Tree","https://www.plt.org/family-activity/web-of-life/","Play with Indian species cards; cut one strand and see who is affected."],["Oh Deer! (habitat and limiting-factors running game)","Project WILD","https://outdoornebraska.gov/wp-content/uploads/2023/03/Oh-Deer.pdf","Best with siblings or a homeschool group: players become deer and food, water or shelter."],["'Hey, Little Ant' discussion guide","Prindle Institute","https://scholarship.depauw.edu/prindle_teaching/83","Should the boy squish the ant? A philosophy circle on how we treat small lives."]],"deep":[{"q":"Who needs whom more: the bee or the flower?","why":"Bees get nectar and pollen as food; flowers get their pollen carried to other flowers so they can make seeds. Neither gives on purpose, yet both depend on the other. This is called mutualism.","views":[["Ecologists","Many crops (mangoes, apples, almonds, many vegetables) depend heavily on pollinators; without them, harvests fall sharply."],["Evolution biologists","Flowers and pollinators shaped each other over millions of years: long tubes and long tongues, bright colours and colour vision."],["A deeper question","If neither could exist without the other for long, are they two things or one partnership?"]],"tryit":"Sit by a flowering plant for 10 minutes. Count the visitors. Do different insects visit different flowers?"},{"q":"If all mosquitoes disappeared, would that be good?","why":"Mosquitoes spread malaria and dengue, which kill many people each year. But they are also food for fish, frogs, birds and bats, and some pollinate plants.","views":[["Some scientists","Most mosquito species are not harmful to people, and other insects could fill their role; removing the few disease-carrying species could save many lives."],["Other ecologists","Mosquito larvae are a big food source in ponds and the Arctic; removing them could have effects we can't predict."],["Ethicists","Do humans have the right to wipe out a species, even a harmful one?"]],"tryit":"Draw a food web around a pond with a mosquito in it. Cross it out. Which arrows break?"},{"q":"Who decides what a 'weed' is?","why":"A weed is just a plant growing where a person doesn't want it. Many 'weeds' are medicines, food for insects or the first plants to heal damaged soil.","views":[["Farmers","Weeds compete with crops for water and light and lower the harvest."],["Ecologists","Wild plants feed bees and butterflies and hold soil together."],["Ayurveda and folk medicine","Plants like 'doob' grass and 'punarnava' are used as medicines."]],"tryit":"Find three 'weeds' near your home. Learn their names. Is any of them useful to an insect, a bird or a person?"}],"wsd":[["A. Who lives where?",[{"t":"match","p":"Match each living thing to its home.","pairs":[["Frog","Pond"],["Baya weaver","Hanging nest on a palm"],["Earthworm","Soil"],["Honeybee","Hive"],["Squirrel","Tree hole"]]}]],["B. Food chains",[{"t":"fill","p":"Grass → ____ → tiger. Leaf → caterpillar → ____ → snake.","a":["deer","bird (e.g. myna)"]},{"t":"draw","p":"Draw a food web with at least 6 living things from your area. Draw arrows from the food to the eater."}]],["C. Helpers",[{"t":"table","p":"How do animals help plants?","cols":["Animal","What it does for plants"],"rows":4,"prefill":["Bee","Bird","Earthworm","Bat"]},{"t":"mcq","p":"A plant with sticky, hooked seeds most likely spreads them by:","opts":["Wind","Water","Sticking to animals' fur","Exploding pods"],"a":2}]],["D. Investigate",[{"t":"table","p":"Minibeast hunt: look under 4 places (a pot, a stone, leaves, bark).","cols":["Where","What I found","How many"],"rows":4}]],["E. Think it through",[{"t":"write","p":"If all the bees in your area disappeared, what would happen to the mango trees? And then to the people and animals who eat mangoes?","lines":4}]]]}}},{"k":"ncert|sci|3|6","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"6","title":"Living in Harmony","dk":["B9","C4"],"c":{"covers":"Living peacefully with people and nature: sharing, solving quarrels, caring for animals and surroundings.","game":["Harmony Village","A cooperative game: you both win or lose together. Each round flip a Trouble card (the pond is dirty, friends are quarrelling, a stray dog is hungry, a tree will be cut). Spend your action tokens on fixes and explain your fix to earn a bonus. Keep the Harmony meter above zero for 10 rounds to win."],"exp":["Noise map: rate the noise in 6 places (kitchen, road, park, temple, bedroom at night) from 1 to 5, or use a phone sound meter. Where do birds sing most?"],"act":["Quarrel-fix role play: act out three common fights and try three ways to solve each.","Ask neighbours how they share water, parking or a park. Draw what you learn."],"proj":["Harmony Pact","Family and child pick one action for 2 weeks (water bowls for street animals, a peace corner, a sharing shelf) and keep a log.","A pact poster and a 2-week log"],"read":["The Curious Garden, Peter Brown","Wangari's Trees of Peace, Jeanette Winter","Have You Filled a Bucket Today?, Carol McCloud"],"links":["Veena Ch 18: हम अनेक किंतु एक","Veena Ch 12: अपना-अपना काम","Santoor Ch 8: Thank God"],"x":{"learn":["Living in harmony means sharing space and resources fairly with people and with nature.","Disagreeing is normal. Listening, taking turns and finding a fix both sides accept is a skill you can practise.","When forests shrink, animals come into towns and farms (monkeys, elephants, leopards). It isn't only the animals' fault.","People have found clever ways to share: beehive fences keep elephants out of farms because elephants avoid bees.","The Bishnoi community and the Chipko movement protected trees with their own bodies."],"think":["When a monkey snatches food in a town, who is the real problem: the monkey, or the people who took its forest?","Is it always good to agree? Can disagreeing kindly lead to better ideas?","Contrary view: people often say nature is 'in balance'. Many ecologists say nature is always changing, never perfectly balanced. Which seems true where you live?"],"oneness":"If you dirty the river, the river comes back to you as water. Can you hurt nature without hurting yourself?","jokes":["Why did the two trees stop arguing? They agreed to leaf it!","What do you call a peaceful dinosaur? A calm-asaurus!","Why do bees hum? They forgot the words!"],"words":["PEACE","SHARE","TRUST","SMILE","UNITY"],"quiz":[["Beehive fences can keep elephants away from farms.",true,"Elephants avoid bees."],["The Chipko movement was about hugging trees to stop them being cut.",true,"It began in the hills of Uttarakhand in the 1970s."],["Living in harmony means never disagreeing.",false,"It means disagreeing kindly and finding fair fixes."],["Animals come into towns only because they are naughty.",false,"Often their homes and food have been taken."]],"odd":[[["Share","Listen","Shout","Help"],"Shout","The other three help people get along."]],"ws":[["Fix-it comic","Draw a 4-box comic: a quarrel, two feelings, a fix, a happy end."],["Swap the story","Tell the story of a monkey stealing a banana, from the monkey's side."],["Our home rule","Write one rule for your home that is good for people AND animals."],["Think","Is nature in balance, or always changing? Give one example you have seen."]],"sheet":["Harmony Pact Log (2 weeks)",["Day","What we did","Who it helped","How it felt"],14],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1.5,2],["Worksheet",0.5,1],["Experiment: noise map",0.75,1],["Activities: quarrel-fix role play, neighbour interviews",1.5,3],["Game: Harmony Village",0.75,1],["Project: Harmony Pact",2,14]],"cur":[["'This Moose Belongs to Me' discussion guide: can anyone own an animal or a piece of nature?","Prindle Institute","https://scholarship.depauw.edu/prindle_teaching/246","A philosophy circle on ownership and fairness with nature."],["'The Lion and the Little Red Bird' discussion guide","Prindle Institute","https://www.prindleinstitute.org/books/the-lion-and-the-little-red-bird/","What makes a friendship: sharing, or getting something back?"]],"deep":[{"q":"When a monkey steals food in town, whose fault is it?","why":"As forests shrink and food is left in the open, monkeys, elephants and leopards come into towns. People feel the animals are the problem; the animals are following food and space.","views":[["Wildlife biologists","Feeding monkeys teaches them to depend on people and become bolder; most conflict starts with food we leave or give."],["Farmers near forests","Losing a harvest to elephants can ruin a family; they need protection and compensation."],["Solutions that worked","Beehive fences keep elephants away because elephants avoid bees; covered dustbins and not feeding monkeys reduce raids."]],"tryit":"Write the same event (a monkey grabbing a banana) twice: once as the person, once as the monkey. What does each one need?"},{"q":"Is nature 'in balance'?","why":"People often say nature is in perfect balance until humans upset it. It is a comforting idea, but is it true?","views":[["Older ecology","Nature tends towards a stable balance where each species has its place."],["Modern ecology","Nature is always changing: fires, floods, droughts and new species keep shifting things. 'Balance' is more like a dance than a still scale."],["A middle view","Even if nature changes, human changes are now so fast and so big that many species can't keep up."]],"tryit":"Look at old photos of your area from 30 years ago (ask elders). What changed? Which changes were natural, which human?"},{"q":"Can people who disagree live in harmony?","why":"Harmony in music is different notes sounding good together, not everyone singing the same note. India has hundreds of languages, foods and faiths living side by side.","views":[["Peacemakers","Harmony comes from listening and finding fair rules, not from everyone agreeing."],["Philosophers","Disagreement, done kindly, helps everyone think better."],["Vasudhaiva Kutumbakam","If the world is one family, quarrels are family quarrels; you still belong together after them."]],"tryit":"Next time you disagree with someone at home, each of you repeats the other's view in your own words before replying. Did it change anything?"}],"wsd":[["A. Fix it",[{"t":"draw","p":"Draw a four-box comic: a quarrel about sharing, how each person feels, a fair fix, how it ends."},{"t":"mcq","p":"Two children want the same swing. The fairest fix is:","opts":["The stronger one takes it","Take turns with a timer","Nobody uses it","The older one decides"],"a":1}]],["B. People and animals",[{"t":"write","p":"Elephants keep raiding a village's fields. Suggest two ideas that protect the farmers AND the elephants.","lines":4},{"t":"sort","p":"Sort these actions.","items":["Feeding monkeys chips","Covering dustbins","Planting fruit trees in the forest","Throwing stones at dogs","Keeping water bowls in summer"],"cats":["Helps harmony","Causes conflict"]}]],["C. Stories of courage",[{"t":"write","p":"The Chipko movement and the Bishnois protected trees with their bodies. Would you do that? What would you protect?","lines":3}]],["D. Think it through",[{"t":"write","p":"Is nature 'in balance', or always changing? Give one example from what you've seen.","lines":3},{"t":"write","p":"Write one rule for your home that is good for people and for animals.","lines":2}]]]}}},{"k":"ncert|sci|3|7","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"7","title":"Water – A Precious Gift","dk":["B8","A4"],"c":{"covers":"Where water comes from, how we use it, clean and dirty water, saving water, traditional ways of storing rainwater.","game":["Drop Detective","Each player starts the day with 50 water-drop tokens. Draw activity cards (brushing with the tap running −6, mug bath −15, shower −40, washing a car with a pipe −60) and choose the wiser way where you can. Leak cards hit everyone. The player with the most drops at bedtime wins."],"exp":["Bottle filter: layer gravel, sand, charcoal and cotton in a cut bottle and pour muddy water through. Clearer, but is it safe to drink? (No, it still needs boiling.)","Sun vs shade: equal water in two plates. Which dries first, and where did the water go?"],"act":["Home water audit: count mugs and buckets used in one day.","Find out how a stepwell, lake or tank near you stored water."],"proj":["Rain Catcher","Make a rain gauge and a rain-collecting container; record rainfall and use the water for plants.","A working gauge, a collector and a rainfall chart"],"read":["The Water Princess, Susan Verde","Water Is Water, Miranda Paul","A Drop Around the World, Barbara McKinney"],"links":["Santoor Ch 6: Paper Boats","Maths Mela Ch 11: Filling and Lifting"],"x":{"learn":["Water comes from rain, rivers, lakes, glaciers and under the ground (groundwater, reached by wells and borewells).","Most of Earth's water is salty sea water. Only about 3 in every 100 drops is fresh, and most of that is frozen; very little is easy for us to use.","The water cycle: the sun heats water, vapour rises, cools into clouds, falls as rain, flows back to rivers and seas.","Dirty water spreads diseases; boiling, filtering and clean storage make water safer.","India's traditional water-keepers: stepwells (baolis), johads, kunds and temple tanks stored rain for dry months."],"think":["Who owns the rain that falls on your roof? Who owns a river?","If Earth is covered in water, why do cities run short?","Contrary view: is bottled water always safer than tap water? (Not always, and the bottles make plastic waste.) How could a family decide?"],"oneness":"The water in your body was once a cloud, a river, maybe a dinosaur's drink. Are you a small walking river?","jokes":["What did the ocean say to the beach? Nothing, it just waved!","How do you save water? In a piggy bucket!","Why did the cloud go to school? To learn how to rain on parade!"],"words":["WATER","RIVER","CLOUD","OCEAN","RAINY"],"quiz":[["Most of Earth's water is salty.",true,"About 97 of every 100 drops are in the seas."],["Groundwater is water stored under the ground.",true,"Wells and borewells reach it."],["Muddy water that looks clear after filtering is always safe to drink.",false,"Germs can still be there; boil it."],["Stepwells were built to store water for dry months.",true,"Many are hundreds of years old."]],"odd":[[["River","Lake","Well","Desert"],"Desert","The others hold water."]],"ws":[["Water cycle","Draw the sun, sea, cloud, rain, river and arrows. Label evaporation and rain."],["Water in my day","Count how many mugs you use for brushing, bathing and drinking."],["Save-water ideas","Write 3 ways your family could use less water."],["Think","Who owns the rain? Write what you think and why."]],"sheet":["Home Water Audit",["Activity","Mugs or buckets used","Could we use less? How?"],8],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: bottle filter, sun vs shade",1,2],["Activities: home water audit, local water history",1.5,3],["Game: Drop Detective",0.5,1],["Project: Rain Catcher",2.5,21]],"cur":[["The Incredible Journey (water-cycle dice game with stations)","Project WET","https://serc.carleton.edu/sp/mnstep/activities/27279.html","Set up 9 stations around the house (cloud, river, groundwater, plant, animal…); roll to travel as a water drop and thread a bead at each stop."],["The Diminishing Apple (how little of Earth's water we can use)","NSTA, Science and Children","https://www.nsta.org/science-and-children/science-and-children-february-2002/diminishing-apple","Cut an apple to show salty seas, ice and the tiny sliver of usable fresh water."]],"deep":[{"q":"Who owns the rain?","why":"Water falls freely from the sky, but rivers, wells and pipes are shared by many people, farms, factories, animals and other states. Deciding who gets how much is one of the biggest questions of our time.","views":[["The law in India","Water in rivers and under the ground is treated as a shared public resource that governments manage for everyone."],["Farmers upstream and downstream","Rivers like the Kaveri are shared by states that have argued about them for over a hundred years."],["Traditional communities","Johads, kunds and stepwells were built and cared for by whole villages; water belonged to the community that kept it."]],"tryit":"Find where your home's water comes from (tap, tanker, well, river). Who else uses that same source?"},{"q":"If Earth is covered in water, why do people run short?","why":"About 97 of every 100 drops on Earth are salty sea water. Of the fresh 3, most is frozen in ice or deep underground. Only a tiny part is in rivers, lakes and reachable groundwater.","views":[["Hydrologists","India pumps more groundwater than any other country; in many places it is being used faster than rain refills it."],["Engineers","Desalination (removing salt from sea water) can help but uses a lot of energy."],["Water harvesters","Catching rain where it falls, on roofs and in ponds, can refill the ground."]],"tryit":"Do the apple model: cut an apple into 4 (three quarters are the sea), and keep cutting the last piece to see how small the usable fresh water is."},{"q":"Is water ever really 'new'?","why":"The water on Earth has been recycling for billions of years: evaporating, raining, flowing, frozen, drunk and breathed out.","views":[["Science","The same water molecules may have passed through clouds, oceans, plants and animals, including dinosaurs, many times."],["Many Indian traditions","Rivers are honoured as mothers (Ganga Maa) because they carry life from the mountains to us."],["Oneness","If the water in you was once a cloud and will be a river again, where do you end and the water cycle begin?"]],"tryit":"Breathe on a cold mirror. Where did that water come from, and where will it go next?"}],"wsd":[["A. Where water comes from",[{"t":"draw","p":"Draw the water cycle: sun, sea, evaporation, clouds, rain, river, groundwater. Use arrows."},{"t":"sort","p":"Sort these water sources.","items":["River","Well","Rain tank","Glacier","Lake","Borewell"],"cats":["Above ground","Under ground","Frozen"]}]],["B. Numbers",[{"t":"mcq","p":"Out of every 100 drops of water on Earth, about how many are salty?","opts":["3","50","97","100"],"a":2},{"t":"fill","p":"Most of Earth's fresh water is ____ in ice and glaciers.","a":["frozen"]}]],["C. My water audit",[{"t":"table","p":"Count mugs or buckets used in one day.","cols":["Activity","Mugs or buckets","How to save"],"rows":6,"prefill":["Brushing","Bathing","Washing hands","Cooking","Cleaning","Plants"]}]],["D. Experiment",[{"t":"write","p":"Your bottle filter made muddy water look clear. Is it safe to drink now? Why or why not? What else would you do?","lines":3}]],["E. Think it through",[{"t":"write","p":"Who owns the rain that falls on your roof? Who owns a river? Write what you think and why.","lines":4}]]]}}},{"k":"ncert|sci|3|8","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"8","title":"Food We Eat","dk":["C11"],"c":{"covers":"Where food comes from, foods of different regions, cooking, sharing meals, eating well.","game":["Thali Builder","Food cards carry energy, body-building and protective icons. Race to build a balanced thali from your hand; then a twist card asks for a Kerala, Punjabi or Bengali thali using only local foods. Opponent can challenge a card's region."],"exp":["Starch test: a drop of iodine (Betadine) on potato, rice, bread and cucumber. Which turn blue-black? (Adult; don't eat after.)","Sprouting chana: weigh 50 g, soak and sprout for 2 days, weigh again. Why heavier?"],"act":["Food-origin trail: pick 5 foods at dinner and trace each back to a farm, a tree or an animal.","Cook a grandparent's recipe together and write it down."],"proj":["Our Family Cookbook","Collect 5 recipes from relatives with where each comes from, photos, and one dish the child cooks.","A handmade or printed recipe booklet"],"read":["Gregory, the Terrible Eater, Mitchell Sharmat","Eating the Alphabet, Lois Ehlert"],"links":["Santoor Ch 7: The Big Laddoo","Veena Ch 6: बीरबल की खिचड़ी","Veena Ch 14: किसान की होशियारी","Maths Mela Ch 10: Fun at Class Party!"],"x":{"learn":["Food comes from plants (grains, pulses, vegetables, fruits, spices) and animals (milk, eggs, fish, meat).","Each region eats what grows nearby: coconut and rice in Kerala, wheat in Punjab, fish in Bengal, millets in dry lands.","Millets (ragi, bajra, jowar) grow with little water and are very nutritious; 2023 was the International Year of Millets.","Cooking changes food: taste, softness, colour, and sometimes how easily the body can use it.","A balanced plate has energy foods, body-building foods and protective foods."],"think":["Is rice better than millet? Better for whom: your body, the farmer, the river?","Why do people in different places eat such different foods?","Two sides: some say vegetarian food is healthiest; others say eggs or fish help growth. Many nutrition scientists say both can be healthy when balanced. What would you need to know to decide?"],"oneness":"Sunlight grew the mango, and now the mango becomes you. Where does the food stop and you begin?","jokes":["Why did the tomato blush? It saw the salad dressing!","What does a nervous laddoo say? I'm falling to pieces!","Why did the roti go to school? To be well-rounded!"],"words":["GRAIN","MANGO","BREAD","CURRY","SPICE"],"quiz":[["Ragi and bajra are millets.",true,"So are jowar and foxtail millet."],["All food comes from plants.",false,"Milk and eggs come from animals."],["Potatoes contain starch.",true,"Iodine turns them blue-black."],["People everywhere eat the same food.",false,"Food depends on what grows nearby and on culture."]],"odd":[[["Ragi","Bajra","Jowar","Moong"],"Moong","Moong is a pulse; the others are millets."]],"ws":[["Plant or animal?","Sort 12 foods from your kitchen into plant and animal."],["My thali","Draw your lunch. Colour energy foods yellow, body-building red, protective green."],["Food trail","Pick 3 foods at dinner and draw where each came from."],["Two sides","Write one reason someone eats vegetarian and one reason someone eats eggs or fish."]],"sheet":["Starch Test",["Food","My guess","Colour after iodine","Starch? (yes/no)"],6],"hours":[["Read & discuss the NCERT chapter",1.5,2],["What to learn + think deeper",1,1],["Worksheet",0.5,1],["Experiments: starch test, sprouting chana",1,3],["Activities: food-origin trail, grandparent's recipe",2,3],["Game: Thali Builder",0.5,1],["Project: Our Family Cookbook",4,14]],"cur":[["Eat a Rainbow lesson and chart","Kids' Food Basket Learning Lab","https://kidsfoodbasket.org/learning-lab/eat-a-rainbow","Fill a week's colour chart with Indian foods (ragi, palak, gajar, baingan, banana); invent a rainbow thali."]],"deep":[{"q":"Rice or millet: which is better?","why":"Millets like ragi, bajra and jowar were India's main grains for thousands of years. Rice and wheat took over after the 1960s Green Revolution, which helped feed India but used much more water.","views":[["Nutritionists","Ragi is rich in calcium; bajra in iron. Millets also have more fibre than polished rice."],["Farmers and water experts","Rice needs a lot of water; millets grow in dry land with little rain. That's why the UN declared 2023 the International Year of Millets."],["Cooks and families","Taste, habit and what's in the shop matter too. 'Better' depends on whether you mean for your body, the farmer or the river."]],"tryit":"Taste a ragi roti or ragi porridge and a rice dish. Compare taste, how full you feel, and look up how much water each crop needs."},{"q":"Why do people in different places eat such different food?","why":"Food follows land and climate: coconuts and rice in wet Kerala, wheat in Punjab, fish in Bengal and Goa, millets in dry Rajasthan. Trade, religion and history add more layers.","views":[["Geographers","What grows nearby shapes what people cook."],["Historians","Chillies, potatoes and tomatoes came to India from the Americas only about 400–500 years ago; Indian food has always mixed and changed."],["Today","Supermarkets bring food from everywhere. Is that good for farmers near you?"]],"tryit":"Pick one dish your family cooks. List each ingredient and where it grows. How many came from far away?"},{"q":"Vegetarian, eggs, fish or meat: what's healthiest?","why":"Families eat differently for reasons of health, belief, culture, cost and care for animals.","views":[["Many nutrition scientists","Both vegetarian and non-vegetarian diets can be healthy when balanced; pulses, milk, nuts and grains together give good protein."],["Ethical vegetarians (and Jain and many Hindu traditions)","Avoiding harm to animals (ahimsa) is the main reason."],["Coastal and hill communities","Fish, eggs or meat are local, affordable and traditional."]],"tryit":"Without judging, ask three people why they eat what they eat. Sort the reasons: health, belief, taste, cost, habit."}],"wsd":[["A. Where food comes from",[{"t":"sort","p":"Sort these foods.","items":["Milk","Rice","Egg","Spinach","Honey","Dal","Fish","Banana"],"cats":["From plants","From animals"]},{"t":"mcq","p":"Which of these is a millet?","opts":["Moong","Ragi","Rajma","Wheat"],"a":1}]],["B. My plate",[{"t":"draw","p":"Draw today's lunch. Colour energy foods yellow, body-building foods red, protective foods green."},{"t":"table","p":"Is your plate balanced?","cols":["Food group","What I ate","Enough? (yes/no)"],"rows":3,"prefill":["Energy","Body-building","Protective"]}]],["C. Food trail",[{"t":"table","p":"Trace three foods back to where they grew.","cols":["Food","Plant or animal","Where it grows","How it reached me"],"rows":3}]],["D. Experiment",[{"t":"table","p":"Starch test (adult adds iodine).","cols":["Food","My guess","Colour","Starch?"],"rows":4,"prefill":["Potato","Rice","Cucumber","Bread"]}]],["E. Think it through",[{"t":"write","p":"Rice needs much more water than millets. If your area has little rain, which would you grow? Give two reasons.","lines":3}]]]}}},{"k":"ncert|sci|3|9","board":"ncert","subj":"sci","level":3,"book":"Our Wondrous World · Class 3","n":"9","title":"Staying Healthy and Happy","dk":["C10","C7"],"c":{"covers":"Keeping clean, eating, sleeping and playing well, feelings, staying happy.","game":["Germ Busters","A race track of daily-life squares. Habit squares (washed hands, played outside, slept on time) push you ahead; Germ squares send you back unless you hold a Shield card, which you earn by acting out a healthy habit. First to Bedtime wins."],"exp":["Glitter germs: glitter on hands, shake hands, then wash with water only vs soap. What's left?","Heartbeat: count your pulse for 15 seconds, do 30 jumps, count again."],"act":["Feelings charades: act out happy, worried, angry, proud; others guess and share when they felt it.","A one-week sleep and play diary."],"proj":["7-Day Healthy Me Challenge","Track water, sleep, outdoor play, fruit and one kind act each day.","A completed challenge chart and a reflection drawing"],"read":["Germs Are Not for Sharing, Elizabeth Verdick","The Busy Body Book, Lizzy Rockwell","The Color Monster, Anna Llenas"],"links":["Veena Ch 10: रस्साकशी"],"x":{"learn":["Clean hands stop germs spreading: soap and 20 seconds of scrubbing remove far more than water alone.","Children aged 6–12 need about 9–12 hours of sleep. Growing and remembering happen while you sleep.","Playing and moving make the heart and lungs stronger and help feelings settle.","Feelings are signals. Naming them and talking about them helps.","Most microbes are harmless or helpful; only some make us sick."],"think":["Is happiness something you feel, or something you do?","Are all germs bad?","Scientists disagr
