<title>DeepKids Home Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Hand-drawn notebook: paper ground, ink outlines with wobbly corners, crayon colours; one column, bottom tab bar */
:root{
  --bg:#FFF6E4; --paper:#FFFDF7; --ink:#2B2118; --muted:#7A6656; --line:#E8D9BC; --soft:#FFEFCF;
  --tomato:#F2603F; --mango:#FFB21E; --leaf:#38A862; --sky:#3E86F5; --grape:#8C5CF0; --pink:#F06BA8; --teal:#12A3A3;
  --hand:"Kalam","Comic Sans MS",cursive; --body:"Nunito",system-ui,sans-serif;
  --wob:22px 10px 26px 12px/12px 24px 10px 22px; --wob2:12px 22px 10px 26px/24px 10px 22px 12px;
  --sh:3px 4px 0 var(--ink);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1712; --paper:#2A221B; --ink:#F6EBD8; --muted:#C2AE96; --line:#4A3B2E; --soft:#3A2E23;
  --tomato:#FF7B5E; --mango:#FFC34D; --leaf:#5BCB85; --sky:#6FA6FF; --grape:#AE8CFF; --pink:#FF8DBE; --teal:#3FC9C9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1712; --paper:#2A221B; --ink:#F6EBD8; --muted:#C2AE96; --line:#4A3B2E; --soft:#3A2E23;
  --tomato:#FF7B5E; --mango:#FFC34D; --leaf:#5BCB85; --sky:#6FA6FF; --grape:#AE8CFF; --pink:#FF8DBE; --teal:#3FC9C9; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:16px/1.5 var(--body);background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:22px 22px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:120px}
h1,h2,h3,h4{font-family:var(--hand);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h2.sec{font-size:26px;margin:28px 0 12px;display:inline-block;background:linear-gradient(transparent 60%,color-mix(in srgb,var(--mango) 55%,transparent) 60%)}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13.5px} .center{text-align:center}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:grid;gap:14px}
button{font-family:var(--body);color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.card{background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--wob);box-shadow:var(--sh);padding:16px}
.card.alt{border-radius:var(--wob2)}
.btn{border:2.5px solid var(--ink);background:var(--paper);border-radius:var(--wob2);padding:9px 16px;font-weight:800;cursor:pointer;box-shadow:2px 3px 0 var(--ink);transition:transform .08s;font-size:15px}
.btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.go{background:var(--tomato);color:#fff}.btn.ok{background:var(--leaf);color:#fff}.btn.sun{background:var(--mango);color:#2b1a00}
.btn.mini{padding:4px 10px;font-size:13px;box-shadow:1px 2px 0 var(--ink)}
.btn.ghost{box-shadow:none;border-style:dashed}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.chip.time{background:var(--soft)}
.tag{font:700 13px var(--hand);text-transform:uppercase;letter-spacing:.05em}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2.5px dashed var(--line);padding-top:env(safe-area-inset-top,0px)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.logo{font:700 28px var(--hand);display:flex;align-items:center;gap:8px;line-height:1}
.logo small{display:block;font:600 12px var(--body);color:var(--muted);margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);cursor:pointer;font-size:18px;box-shadow:2px 2px 0 var(--ink);flex:none}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--paper);border-top:2.5px solid var(--ink);display:flex;justify-content:space-around;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
nav.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;font:700 14px var(--hand);padding:6px 14px;border-radius:14px;cursor:pointer;color:var(--muted)}
nav.tabbar button svg{width:26px;height:26px}
nav.tabbar button[aria-selected="true"]{color:var(--ink);background:var(--soft)}
.hero{margin-top:16px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--mango);color:#2b1a00;border:2.5px solid var(--ink);border-radius:var(--wob);box-shadow:var(--sh);position:relative;overflow:hidden}
.hero>*{position:relative}
.hero h2{font-size:32px}.hero .d{font:700 15px var(--hand)}
.hero .sunart{position:absolute;right:-22px;top:-22px;width:120px;opacity:.4}
.ring{width:74px;height:74px}
.hs{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 14px;margin:0 -4px}
.hs>*{scroll-snap-align:start;flex:0 0 80%;max-width:330px}
.joke{border:2.5px solid var(--ink);border-radius:var(--wob);box-shadow:var(--sh);padding:16px;min-height:160px;text-align:left;cursor:pointer;display:grid;gap:10px;align-content:start;font:inherit;color:#fff}
.joke:nth-child(3n+1){background:var(--grape)}.joke:nth-child(3n+2){background:var(--teal)}.joke:nth-child(3n){background:var(--pink)}
.joke .q{font:700 21px/1.2 var(--hand)}
.joke .a{background:#fff;color:#2b2118;border:2px solid #2b2118;border-radius:var(--wob2);padding:8px 12px;font:700 18px var(--hand);transform:rotate(-1.5deg);animation:pop .25s}
.joke .tap{font-size:13px;opacity:.9}
.lesson{padding:0;overflow:hidden}
.lesson .lh{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:2.5px solid var(--ink);color:#fff;background:var(--c)}
.lesson .lh b{font:700 20px var(--hand);margin-right:auto}
.lesson .lh .chip{background:rgba(255,255,255,.92);color:#2b2118;border-color:#2b2118}
.lesson.extra .lh{background:repeating-linear-gradient(45deg,var(--c),var(--c) 12px,color-mix(in srgb,var(--c) 80%,#fff) 12px,color-mix(in srgb,var(--c) 80%,#fff) 24px)}
.c-math{--c:var(--teal)}.c-eng{--c:var(--grape)}.c-hin{--c:var(--tomato)}.c-sci{--c:var(--leaf)}
.lb{padding:14px 16px;display:grid;gap:12px}
.lb h3{font-size:27px}
.bar{height:12px;border:2px solid var(--ink);border-radius:99px;background:var(--paper);overflow:hidden}
.bar span{display:block;height:100%;background:var(--c,var(--leaf));transition:width .35s}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start}
.tick{width:38px;height:38px;border:2.5px solid var(--ink);border-radius:50% 46% 52% 48%;background:var(--paper);cursor:pointer;font:800 18px var(--body);margin-top:4px}
.step.done .tick{background:var(--c,var(--leaf));color:#fff;animation:pop .25s}
.step.done .st{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.step details{background:var(--soft);border:2px solid var(--ink);border-radius:var(--wob2);min-width:0}
.step summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:10px 12px}
.step summary::-webkit-details-marker{display:none}
.st{font-weight:800;min-width:0}.st i{display:block;font:700 13px var(--hand);font-style:normal;color:var(--muted);text-transform:uppercase}
.sb{padding:0 12px 12px;display:grid;gap:8px;justify-items:start}
.ask{border:2px dashed var(--ink);border-radius:var(--wob2);padding:8px 12px;background:var(--paper);font-weight:700}
ul.t,ol.t{margin:0;padding-left:20px}ul.t li,ol.t li{margin:3px 0}
.more{background:var(--sky);color:#fff}.more h3{font-size:26px}
.morelist{display:grid;gap:8px}
.moreitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:var(--wob2);padding:10px 12px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.pill{border:2.5px solid var(--ink);background:var(--paper);border-radius:var(--wob2);padding:7px 16px;font:700 17px var(--hand);cursor:pointer;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--bg)}
.idea{border:2.5px solid var(--ink);border-radius:var(--wob);background:var(--paper);box-shadow:var(--sh);padding:16px;min-height:150px}
.idea .n{display:inline-grid;place-items:center;width:38px;height:38px;border:2.5px solid var(--ink);border-radius:50%;background:var(--mango);font:700 20px var(--hand);color:#2b1a00}
.idea p{margin-top:8px}
.think{padding:0;overflow:hidden}
.think .th{padding:14px 16px;background:var(--grape);color:#fff;border-bottom:2.5px solid var(--ink)}
.think:nth-of-type(2) .th{background:var(--sky)}.think:nth-of-type(3) .th{background:var(--tomato)}
.think .th h3{font-size:24px;margin-top:2px}
.think .tb{padding:14px 16px;display:grid;gap:12px}
.view{display:grid;grid-template-columns:minmax(0,130px) 1fr;gap:10px;align-items:start}
.view .who{font:700 14px/1.2 var(--hand);background:var(--soft);border:2px solid var(--ink);border-radius:var(--wob2);padding:6px 10px}
.view .say{background:var(--paper);border:2px solid var(--ink);border-radius:14px 14px 14px 4px;padding:8px 12px}
@media (max-width:460px){.view{grid-template-columns:1fr}.view .who{justify-self:start}}
.tryit{background:var(--leaf);color:#fff;border:2.5px solid var(--ink);border-radius:var(--wob2);padding:10px 14px;font-weight:700}
.tryit b{font:700 17px var(--hand);display:block}
.one{background:linear-gradient(120deg,var(--mango),var(--pink));color:#2b1a00}
.one p{font:700 21px/1.3 var(--hand);margin-top:6px}
.dogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.task{display:grid;gap:8px;align-content:start;position:relative}
.task>.chip{justify-self:start}
.task .ic{width:52px;height:52px;border:2.5px solid var(--ink);border-radius:50% 44% 52% 46%;display:grid;place-items:center;font-size:24px;background:var(--soft)}
.task h4{font-size:20px}
.task.done{background:color-mix(in srgb,var(--leaf) 16%,var(--paper))}
.task .stamp{position:absolute;right:12px;top:12px;font:700 16px var(--hand);color:var(--leaf);border:3px solid var(--leaf);border-radius:8px;padding:0 8px;transform:rotate(10deg)}
.k-ws .ic{background:#FFE39A}.k-exp .ic{background:#BFEBCF}.k-act .ic{background:#D4D7FF}.k-proj .ic{background:#FFC9BD}.k-game .ic{background:#FFD1E8}
.cur{display:grid;gap:4px;text-decoration:none;color:inherit}
.cur .src{font:700 13px var(--hand);color:var(--muted)}
.wsh h3{font-size:23px;margin-bottom:4px;color:var(--tomato)}
.q{display:grid;gap:8px;padding:14px 0;border-top:2px dashed var(--line)}
.q:first-of-type{border-top:0}
.q .p{font-weight:700}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--ink);border-radius:var(--wob2);background:var(--paper);padding:9px 12px;cursor:pointer;font-weight:600;font-size:15px}
.opt.right{background:var(--leaf);color:#fff}.opt.wrong{background:var(--tomato);color:#fff}
.inp{width:100%;font:16px var(--body);padding:9px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink)}
textarea.inp{min-height:84px;resize:vertical;font-family:var(--hand);font-size:18px;line-height:1.5;background-image:linear-gradient(transparent 26px,var(--line) 27px);background-size:100% 27px;background-attachment:local}
.grid{overflow-x:auto}.grid table{border-collapse:collapse;min-width:100%}
.grid th{font:700 14px var(--hand);text-align:left;padding:6px 8px;border:2px solid var(--ink);background:var(--soft)}
.grid td{border:2px solid var(--ink);padding:0;min-width:110px}
.grid td input{width:100%;border:0;background:transparent;padding:8px;font:17px var(--hand);color:var(--ink)}
.sortbox{display:grid;gap:10px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.token{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:5px 12px;font-weight:700;cursor:pointer;font-size:14px}
.token.sel{background:var(--mango);transform:rotate(-3deg)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.bucket{border:2.5px dashed var(--ink);border-radius:var(--wob2);padding:8px;min-height:74px;cursor:pointer;background:var(--soft);display:flex;flex-wrap:wrap;gap:6px;align-content:start}
.bucket b{font:700 15px var(--hand);width:100%}
.pad{width:100%;height:220px;border:2.5px dashed var(--ink);border-radius:14px;background:var(--paper);touch-action:none;display:block}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mitem{border:2px solid var(--ink);border-radius:var(--wob2);padding:8px 10px;background:var(--paper);cursor:pointer;font-weight:700;text-align:left;font-size:14px}
.mitem.sel{background:var(--mango)}.mitem.paired{background:var(--leaf);color:#fff}
.games{padding:0;overflow:hidden}
.games .gh{background:var(--pink);padding:12px 16px;border-bottom:2.5px solid var(--ink);display:flex;gap:8px;overflow-x:auto}
.games .gh .pill{background:#fff;color:#2b2118;border-color:#2b2118}.games .gh .pill.on{background:#2b2118;color:#fff}
.games .gb{padding:16px;display:grid;gap:14px}
.wgrid{display:grid;gap:6px;justify-content:center}
.wrow{display:grid;grid-template-columns:repeat(5,50px);gap:6px}
.tile{height:50px;border:2.5px solid var(--ink);border-radius:10px 13px 9px 12px;display:grid;place-items:center;font:700 27px var(--hand);background:var(--paper)}
.tile.hit{background:var(--leaf);color:#fff}.tile.near{background:var(--mango);color:#2b1a00}.tile.miss{background:var(--line)}
.tile.hit,.tile.near,.tile.miss{animation:flip .4s}
.tile.pop{animation:pop .15s}
@keyframes pop{50%{transform:scale(1.12)}}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:none}}
.kb{display:grid;gap:6px;justify-items:center}.kb div{display:flex;gap:4px}
.kb button{min-width:30px;height:46px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);font:800 15px var(--body);cursor:pointer;padding:0 6px}
.kb button.hit{background:var(--leaf);color:#fff}.kb button.near{background:var(--mango);color:#2b1a00}.kb button.miss{opacity:.35}
.kb button.wide{min-width:58px}
.qcard{font:700 23px/1.3 var(--hand);text-align:center;padding:24px 16px;background:var(--soft);border:2.5px solid var(--ink);border-radius:var(--wob);animation:pop .25s}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tfrow .btn{font:700 22px var(--hand);padding:14px}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:16px;height:16px;border:2px solid var(--ink);border-radius:50%}
.dots i.on{background:var(--mango)}.dots i.ok{background:var(--leaf)}.dots i.no{background:var(--tomato)}
.score{font:700 56px var(--hand);text-align:center;color:var(--leaf);line-height:1}
.oddgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oddgrid .btn{font:700 22px var(--hand);padding:22px 8px}
.oddgrid .btn.right{background:var(--leaf);color:#fff;opacity:1}.oddgrid .btn.wrong{background:var(--tomato);color:#fff;opacity:1}
.verdict{font:700 19px var(--hand);text-align:center}
.exp{display:grid;gap:8px}
.exp .dn{font:700 34px var(--hand);color:var(--leaf);line-height:1}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wday{border:2px solid var(--ink);border-radius:var(--wob2);background:var(--paper);padding:6px 2px;text-align:center;cursor:pointer;font-weight:800;font-size:12px}
.wday .dn{font:700 20px var(--hand);display:block}
.wday .ds{display:flex;gap:3px;justify-content:center;min-height:10px;margin-top:2px}
.wday .ds i{width:8px;height:8px;border-radius:50%;background:var(--c);border:1px solid var(--ink)}
.wday.on{background:var(--ink);color:var(--bg)}
.wday.today{outline:3px solid var(--tomato);outline-offset:1px}
.sess{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;padding:10px 12px}
.sess .stripe{align-self:stretch;border-radius:6px;background:var(--c)}
.ctl{display:grid;gap:10px}
.lvl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lname{font:700 21px var(--hand);min-width:110px}
select.sel{font:600 15px var(--body);padding:7px 10px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink)}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick button{width:42px;height:34px;border:2px solid var(--ink);border-radius:10px;background:var(--paper);font-weight:800;cursor:pointer;font-size:12px}
.daypick button[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff}
.unit{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.unit .no{font:700 20px var(--hand);width:46px;height:46px;border:2.5px solid var(--ink);border-radius:50% 45% 52% 46%;display:grid;place-items:center;background:var(--soft)}
.unit .ut{font-weight:800;min-width:0}
.sticker{font:700 13px var(--hand);padding:2px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);white-space:nowrap}
.sticker.learning{background:var(--mango);color:#2b1a00}.sticker.completed{background:var(--leaf);color:#fff}.sticker.mastered{background:var(--grape);color:#fff}
.meter{display:grid;gap:6px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.badge{display:grid;justify-items:center;gap:4px;text-align:center}
.badge .disc{width:86px;height:86px;border:2.5px solid var(--ink);border-radius:50% 46% 52% 48%;display:grid;place-items:center;font:700 26px var(--hand);background:var(--c);color:#fff;box-shadow:var(--sh)}
.badge:nth-child(even) .disc{transform:rotate(-4deg)}.badge:nth-child(odd) .disc{transform:rotate(3deg)}
.timeline{display:grid;border-left:3px dashed var(--ink);margin-left:8px;padding-left:18px}
.tl{position:relative;padding:8px 0}.tl::before{content:"";position:absolute;left:-28px;top:14px;width:14px;height:14px;border:2.5px solid var(--ink);border-radius:50%;background:var(--c,var(--mango))}
dialog.sheet{border:0;padding:0;margin:0;width:100%;max-width:100%;height:100%;max-height:100%;background:var(--bg);color:var(--ink)}
dialog.sheet::backdrop{background:rgba(20,10,0,.4)}
.sheethead{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:2.5px dashed var(--line);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sheethead h3{font-size:22px;flex:1;min-width:0}
.sheetbody{max-width:760px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px}
dialog.small{border:2.5px solid var(--ink);border-radius:var(--wob);box-shadow:var(--sh);background:var(--paper);color:var(--ink);max-width:min(520px,92vw);padding:20px}
dialog.small::backdrop{background:rgba(20,10,0,.4)}
.field{display:grid;gap:4px;margin-bottom:12px}.field label,.field>span{font:700 17px var(--hand)}
.ob{max-width:620px;margin:0 auto;padding-block:20px;display:grid;gap:16px}
.obsteps{display:flex;gap:6px}.obsteps i{flex:1;height:10px;border:2px solid var(--ink);border-radius:9px;background:var(--paper)}.obsteps i.on{background:var(--tomato)}
.ob h2{font-size:34px}
.choices{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.choice{text-align:left;display:grid;gap:4px;cursor:pointer;font:inherit;color:inherit}
.choice b{font:700 21px var(--hand)}.choice span{font-size:13px;color:var(--muted)}
.choice[aria-pressed="true"]{background:var(--mango);color:#2b1a00}
.choice[aria-pressed="true"] span{color:#3a2600}
.seg{display:flex;gap:8px;flex-wrap:wrap}

.blk.you{background:var(--grape)}.blk.both{background:var(--mango);color:#2b1a00}.blk.kid{background:var(--sky)}.blk.out{background:var(--pink)}.blk.brk{background:var(--soft);color:var(--muted);border-style:dashed}
.calhead{display:grid;grid-template-columns:52px 1fr 1fr;gap:6px;padding:0 8px 4px 0;font:700 16px var(--hand);text-align:center}
.evrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px}
.prepi{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start;padding:10px 0;border-top:2px dashed var(--line)}
.prepi:first-of-type{border-top:0}
.prepi .tick{margin-top:0}.prepi.done .tick{background:var(--leaf);color:#fff}.prepi.done b{text-decoration:line-through;opacity:.6}
.where{font-size:13px;color:var(--muted)}.where b{color:var(--ink)}
.early{font:700 12px var(--hand);background:var(--tomato);color:#fff;border-radius:99px;padding:0 8px;margin-left:4px}

@media (max-width:420px){.wrow{grid-template-columns:repeat(5,44px)}.tile{height:44px;font-size:23px}.kb button{min-width:27px;padding:0 3px}.kb button.wide{min-width:50px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const DATA = /*DATA*/;
const SUBJ = DATA.subjects, SUBJ_KEYS = Object.keys(SUBJ);
const BOARDS = {ncert:"NCERT / CBSE",cambridge:"Cambridge Primary",nios:"NIOS (Open Basic Education)"};
const STATUS = {none:"Not started",learning:"Learning",completed:"Completed",mastered:"Mastered"};
const DAYN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DEF_DAYS={math:[1,2,3,4,5],eng:[1,2,4,5],hin:[2,4],sci:[1,3,5]};
const DEF_HPD={math:1,eng:0.75,hin:0.5,sci:0.75};
const DEF_DAY={prepAt:"07:30",start:"09:30",brk:15,lunch:"13:00",lunchMin:45,eveAt:"20:30"};
const SCOL={math:"var(--teal)",eng:"var(--grape)",hin:"var(--tomato)",sci:"var(--leaf)"};
const PRESET_EXP={A1:["Lotus seeds (Kamali): change water","Alum crystal (Fitkari): check growth","World in a Jar: look for droplets","Bread mould bag: look, never open"],A5:["Moong sprouts: light vs dark"],B5:["Moon diary: draw tonight's Moon"],B10:["Bury test: dig up after 3 weeks"]};
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=iso(new Date());const dayNo=Math.floor(parse(today)/864e5);
const fmt=s=>parse(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const monday=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fh=h=>(Math.round(h*4)/4).toString();
const mins=h=>{const m=Math.round(h*60);return m>=60?`${fh(m/60)} h`:`${m} min`};
const fresh=()=>({setup:false,child:"",age:6,board:"ncert",plus:true,subjects:["math","eng","hin","sci"],levels:{math:1,eng:1,hin:1,sci:1},start:monday(),days:DEF_DAYS,hpd:DEF_HPD,progress:{},log:[],exps:[],skips:{},hrs:{},games:{},steps:{},tasks:{},ans:{},events:[],prep:{},tl:{},day:DEF_DAY,hideHow:false,updatedAt:0});
let S=fresh(),store=null,saving=Promise.resolve(),saveTimer=null,syncMode="device",tab="today",ob=null;
const ui={view:{},etab:{},game:"word",jokes:{},more:{},sheet:null,sel:{},planDay:null,topicSubj:null};

/* ---------- sound: a tiny synth; the browser only allows it after a tap ---------- */
let AC=null,soundOn=true;try{soundOn=localStorage.getItem("dk-sound")!=="off"}catch(e){}
function tone(f,t0,d,type="sine",g=.12){const o=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const SFX={tap:()=>tone(660,0,.07,"triangle",.08),tick:()=>{tone(784,0,.08);tone(1046,.07,.12)},ok:()=>{tone(523,0,.1);tone(659,.09,.1);tone(784,.18,.18)},no:()=>{tone(220,0,.18,"square",.05);tone(180,.12,.2,"square",.05)},
  flip:()=>{tone(400,0,.06,"triangle",.06);tone(600,.05,.08,"triangle",.06)},win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,i*.08,.22,"triangle",.1)),key:()=>tone(900,0,.03,"square",.03)};
function sfx(k){if(!soundOn||!SFX[k])return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();SFX[k]()}catch(e){}}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=document.createElement("canvas");c.className="confetti";c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext("2d");
  const cols=["#F2603F","#FFB21E","#38A862","#3E86F5","#8C5CF0","#F06BA8"];const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*12,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.random()*6|0],a:Math.random()*6}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++n<80)requestAnimationFrame(f);else c.remove()})()}
function toast(m){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- persistence: one private document per viewer; the newer copy wins ---------- */
async function boot(){
  try{const ls=localStorage.getItem("dk-state-v2");if(ls)S={...fresh(),...JSON.parse(ls)}}catch(e){}
  render();
  try{const [db,user]=await Promise.all([window.claude?.use?.("db"),window.claude?.use?.("user")]);const id=db&&user?await user.id():null;
    if(db&&id){store=db.doc("data/users/"+id+"/planner");const snap=await store.get();const remote=snap.exists?snap.data():null;
      if(remote&&remote.setup!==undefined&&(remote.updatedAt||0)>(S.updatedAt||0)){S={...fresh(),...remote}}else if(S.setup){await store.set(JSON.parse(JSON.stringify(S)))}
      syncMode="account";render()}}catch(e){store=null}
}
function save(){try{localStorage.setItem("dk-state-v2",JSON.stringify(S))}catch(e){}
  if(!store)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{const body=JSON.parse(JSON.stringify(S));saving=saving.then(()=>store.set(body)).catch(()=>{syncMode="device"})},700)}
const commit=()=>{S.updatedAt=Date.now();save();render()};

/* ---------- syllabus collation ---------- */
const boardsOn=()=>S.board==="combined"?["ncert","cambridge","nios"]:S.board==="none"?[]:[S.board];
function dkUnits(subj,lvl){if(!S.plus||subj!=="sci"||lvl!==1)return [];return DATA.topics.map(t=>({k:"dk|"+t.id,board:"dk",subj:"sci",level:1,book:"DeepKids Plus · Science Level 1",n:t.id,title:t.name,dk:[],topic:t}))}
function collateAt(subj,lvl){return {board:DATA.items.filter(i=>i.subj===subj&&i.level===lvl&&boardsOn().includes(i.board)),dk:dkUnits(subj,lvl)}}
const collate=s=>collateAt(s,S.levels[s]);
function notesFor(subj,lvl){const n=[];boardsOn().forEach(b=>{const x=b==="ncert"?DATA.notes.ncert[subj+"|"+lvl]:DATA.notes[b]?.[subj];if(x)n.push(BOARDS[b]+": "+x)});
  if(S.plus&&subj==="sci"&&lvl!==1)n.push("DeepKids Plus Science for Level "+lvl+" is being written. Level 1 is ready.");if(S.plus&&subj!=="sci")n.push("DeepKids Plus "+SUBJ[subj]+" is being written.");return n}
function plannedAt(s,l){const c=collateAt(s,l);if(c.dk.length)return c.dk;for(const b of boardsOn()){const u=c.board.filter(i=>i.board===b);if(u.length)return u}return []}
function plannedUnits(s){const o=[];for(let l=S.levels[s];l<=5;l++)o.push(...plannedAt(s,l));return o}
const everyUnit=()=>S.subjects.flatMap(s=>[1,2,3,4,5].flatMap(l=>{const c=collateAt(s,l);return [...c.dk,...c.board]}));
const unitBy=k=>everyUnit().find(u=>u.k===k);
const st=k=>S.progress[k]?.status||"none";const done=k=>S.progress[k]?.sessions||0;
const rank={none:0,learning:1,completed:2,mastered:3};
function coverage(u){if(u.board!=="dk"&&S.plus&&u.dk.length){const s=u.dk.map(id=>st("dk|"+id)),own=st(u.k);if(s.every(x=>rank[x]>=2))return rank[own]>2?own:"completed";if(s.some(x=>x!=="none")||own!=="none")return rank[own]>1?own:"learning";return own}return st(u.k)}
const daysOf=s=>(S.days[s]||DEF_DAYS[s]);const hpdOf=s=>(S.hpd&&S.hpd[s])||DEF_HPD[s];
const DEF_UNIT_H={ncert:{math:8,eng:5,hin:4,sci:8},cambridge:{math:30,eng:30,hin:30,sci:20},nios:{math:5,eng:5,hin:5,sci:5}};
const estHours=u=>u.c?.x?.hours?u.c.x.hours.reduce((a,h)=>a+h[1],0):u.board==="dk"?u.topic.weeks*2.25:DEF_UNIT_H[u.board][u.subj];
const hoursFor=u=>S.hrs[u.k]??estHours(u);
const sessionsFor=u=>Math.max(1,Math.ceil(hoursFor(u)/hpdOf(u.subj)-1e-9));
function schedule(subj,limitDays=420,fromTomorrow=false){
  const q=[];plannedUnits(subj).forEach(u=>{if(rank[coverage(u)]>=2)return;const tot=sessionsFor(u);for(let i=Math.min(done(u.k),tot-1);i<tot;i++)q.push({u,n:i+1,tot})});
  const queue=[...q.filter(x=>coverage(x.u)==="learning"),...q.filter(x=>coverage(x.u)!=="learning")];
  const out=[];const days=daysOf(subj);let d=parse(S.start>today?S.start:today);const doneToday=S.log.some(l=>l.date===today&&l.subj===subj);
  for(let k=0;k<limitDays&&queue.length;k++){const s=iso(d);if(days.includes(d.getDay())&&!S.skips[s+"|"+subj]&&!(s===today&&(doneToday||fromTomorrow)))out.push({date:s,subj,...queue.shift()});d.setDate(d.getDate()+1)}
  return out}
const nextUp=s=>{const q=[];plannedUnits(s).forEach(u=>{if(rank[coverage(u)]>=2)return;const tot=sessionsFor(u);for(let i=Math.min(done(u.k),tot-1);i<tot;i++)q.push({u,n:i+1,tot})});return [...q.filter(x=>coverage(x.u)==="learning"),...q.filter(x=>coverage(x.u)!=="learning")][0]};
function logSession(u,kind){const p=S.progress[u.k]||{status:"none",sessions:0};p.sessions=(p.sessions||0)+1;if(p.status==="none")p.status="learning";if(p.sessions>=sessionsFor(u)&&p.status==="learning")p.status="completed";p.updated=today;S.progress[u.k]=p;
  S.log.unshift({date:today,key:u.k,subj:u.subj,title:u.title,kind});S.log=S.log.slice(0,400);
  if(u.board==="dk")(PRESET_EXP[u.n]||[]).forEach(t=>addExp(t,u.title))}
function addExp(title,topic){if(!S.exps.some(e=>e.title===title&&!e.closed))S.exps.push({id:Math.random().toString(36).slice(2,9),title,topic,start:today,checks:[],closed:false})}
const el=h=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content};
const chNo=u=>/^\d+$/.test(u.n)?"Ch "+u.n:"";
const lvlLabel=l=>{const x=DATA.levels[l];return `Level ${l} · Class ${x.cls} · age ${x.age}`};
const sticker=s=>`<span class="sticker ${s}">${STATUS[s]}</span>`;

/* ---------- day steps ---------- */
const HINT={math:"Use real things for every problem (coins, beans, rotis, a ruler) before writing anything down.",eng:"Read aloud together, collect new words in a notebook, and ask your child to retell it in their own words.",hin:"Read aloud in Hindi, collect new words with meanings, and ask your child to retell it in Hindi.",sci:"Look for the idea in your own home or street before reading about it."};
const KIND=n=>/^Read/.test(n)?["read","Read","📖"]:/^What to learn/.test(n)?["learn","Learn & think","💡"]:/^Worksheet/.test(n)?["ws","Worksheet","✏️"]:/^Experiment/.test(n)?["exp","Experiment","🧪"]:/^Activit/.test(n)?["act","Activity","🧭"]:/^Game/.test(n)?["game","Game","🎲"]:/^Project/.test(n)?["proj","Project","🛠️"]:["step","Step","⭐"];
const TASKOF={ws:"ws",exp:"exp0",act:"act0",game:"game",proj:"proj"};
function stepBody(u,name){const c=u.c,x=c.x,k=KIND(name)[0],L=a=>`<ul class="t">${a.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;
  const mark=TASKOF[k]?`<button class="btn mini ${taskDone(u.k,TASKOF[k])?"":"ok"}" data-act="task" data-k="${u.k}" data-id="${TASKOF[k]}">${taskDone(u.k,TASKOF[k])?"Done ✓ (undo)":"Mark this task done"}</button>`:"";
  if(k==="read")return `<p>Read <b>${esc(u.book)}, ${chNo(u)}</b> together; let your child read parts aloud.</p><div class="ask">Stop and ask: ${esc(x.deep[0].q)}</div>`;
  if(k==="learn")return `${L(x.learn)}<button class="btn mini sun" data-act="open" data-k="${u.k}" data-t="think">Open the big questions 🤔</button>`;
  if(k==="ws")return `<p>${x.wsd.length} sections, ${x.wsd.reduce((a,s)=>a+s[1].length,0)} questions: drawing, tables, sorting, matching and thinking.</p><div class="row"><button class="btn mini sun" data-act="ws" data-k="${u.k}">Open the worksheet ✏️</button>${mark}</div>`;
  if(k==="exp")return L(c.exp)+`<div class="row">${c.exp.map((_,i)=>`<button class="btn mini ${taskDone(u.k,"exp"+i)?"":"ok"}" data-act="task" data-k="${u.k}" data-id="exp${i}">Experiment ${i+1} ${taskDone(u.k,"exp"+i)?"✓":"done?"}</button>`).join("")}</div>`;
  if(k==="act")return L(c.act)+`<div class="row">${c.act.map((_,i)=>`<button class="btn mini ${taskDone(u.k,"act"+i)?"":"ok"}" data-act="task" data-k="${u.k}" data-id="act${i}">Activity ${i+1} ${taskDone(u.k,"act"+i)?"✓":"done?"}</button>`).join("")}</div>`;
  if(k==="game")return `<p><b>${esc(c.game[0])}</b>: ${esc(c.game[1])}</p>${mark}`;
  if(k==="proj")return `<p><b>${esc(c.proj[0])}</b>: ${esc(c.proj[1])}</p><div class="row"><button class="btn mini sun" data-act="startexp" data-title="${esc(c.proj[0])}" data-topic="${esc(u.title)}">Track as ongoing project</button>${mark}</div>`;
  return ""}
function daySteps(u,n,tot){const cap=hpdOf(u.subj);
  if(u.c?.x?.hours){const days=[];let cur=[],left=cap;u.c.x.hours.forEach(([name,h])=>{let rem=h,part=1;while(rem>1e-9){const take=Math.min(rem,left);cur.push({name,take,part});rem-=take;left-=take;part++;if(left<1e-9){days.push(cur);cur=[];left=cap}}});if(cur.length)days.push(cur);
    const parts={};days.flat().forEach(s=>parts[s.name]=Math.max(parts[s.name]||0,s.part));
    return (days[Math.min(n,days.length)-1]||[]).map(s=>{const [kind,label,icon]=KIND(s.name);return {kind,label,icon,title:s.name.replace(/^(Experiments?|Activities|Game|Project): /,"")+(parts[s.name]>1?` · part ${s.part} of ${parts[s.name]}`:""),mins:s.take,html:stepBody(u,s.name)}})}
  if(u.board==="dk"){const t=u.topic,k=t.sub.length;
    if(t.full)return [{kind:"game",label:"Lesson",icon:"👑",title:"The King's Doubt",mins:cap,html:`<p>${n===1?"The Proclamation, setting your rules, and the first guests.":n===tot?"The Nakkeeran challenge, the verdicts and the treats.":"The next investigation cards; check the lotus seeds and crystals."}</p>`}];
    if(n===1)return [{kind:"read",label:"Story",icon:"📖",title:"Start with the story",mins:cap*.6,html:`<p>${esc(t.summary)}</p>`},{kind:"learn",label:"Wonder",icon:"💡",title:"Wonder together",mins:cap*.4,html:`<div class="ask">${esc(t.oneness)}</div>`}];
    const i=Math.min(k-1,Math.floor((n-2)*k/Math.max(1,tot-1)));
    return n===tot?[{kind:"learn",label:"Wrap up",icon:"🎤",title:"Teach it back",mins:cap,html:`<p>Your child teaches you the topic in five minutes.</p><div class="ask">${esc(t.oneness)}</div>`}]:[{kind:"exp",label:"Explore",icon:"🧭",title:t.sub[i].slice(0,60)+(t.sub[i].length>60?"…":""),mins:cap,html:`<p>${esc(t.sub[i])}</p><p class="small muted">${esc(HINT.sci)}</p>`}]}
  const w=`${esc(u.book)}${chNo(u)?", "+chNo(u):""}`;
  const A=n===1?[["read","Read","📖","Open the chapter",.6,`Read the first part of <b>${w}</b> together. Ask what your child thinks it's about.`],["act","Try it","🧭","Hands-on",.4,esc(HINT[u.subj])]]
   :n===tot?[["act","Finish","🧭","Last activities",.5,`Do the final activities in <b>${w}</b>.`],["learn","Review","🎤","Teach it back",.3,"Your child explains the chapter to you, as if you were the student."],["ws","Mark","✅","Mark it done",.2,"If it feels solid, mark the chapter Completed in Topics."]]
   :[["read","Continue","📖","Continue the chapter",.6,`Carry on in <b>${w}</b> from where you stopped.`],["act","Practice","🧭","Hands-on practice",.3,esc(HINT[u.subj])],["ws","Note","📝","Note what's hard",.1,"Write down anything that needs another go."]];
  return A.map(([kind,label,icon,title,f,html])=>({kind,label,icon,title,mins:cap*f,html,generic:true}))}

/* ---------- lesson card ---------- */
function lessonCard(s,next,extra){const u=next.u,steps=daySteps(u,next.n,next.tot),key=(extra?"x":"")+today+"|"+u.k+"|"+next.n,tk=new Set(S.steps[key]||[]),dn=steps.filter((_,i)=>tk.has(i)).length,all=steps.length&&dn===steps.length;
  return `<article class="card lesson c-${s} ${extra?"extra":""}" id="card-${s}"><div class="lh"><b>${extra?"Bonus · ":""}${SUBJ[s]}</b><span class="chip">Day ${next.n} of ${next.tot}</span><span class="chip">⏱ ${fh(hpdOf(s))} h</span></div>
   <div class="lb"><div class="small muted">${esc(u.book)}${chNo(u)?" · "+chNo(u):""}</div><h3>${esc(u.title)}</h3>
   <div class="row" style="flex-wrap:nowrap"><div class="bar" style="flex:1"><span style="width:${steps.length?dn/steps.length*100:0}%"></span></div><span class="small" style="font-weight:800">${dn}/${steps.length}</span></div>
   <ol class="steps">${steps.map((x,i)=>`<li class="step ${tk.has(i)?"done":""}"><button class="tick" data-act="step" data-key="${key}" data-i="${i}" aria-label="Mark step done">${tk.has(i)?"✓":i+1}</button><details data-id="${key}-${i}"><summary><span style="font-size:22px">${x.icon}</span><span class="st"><i>${esc(x.label)}</i>${esc(x.title)}</span><span class="chip time">${mins(x.mins)}</span></summary><div class="sb">${x.html}</div></details></li>`).join("")}</ol>
   ${steps.some(x=>x.generic)?`<p class="small muted">General plan for now. A detailed lesson for this chapter is being written.</p>`:""}
   <div class="row">${u.c?.x?`<button class="btn sun" data-act="open" data-k="${u.k}" data-t="learn">Whole chapter</button>`:""}<button class="btn go" style="flex:1 1 150px" data-act="did" data-k="${u.k}" data-s="${s}">${all?"All steps done! Finish 🎉":"We did it ✓"}</button>${extra?`<button class="btn ghost" data-act="less" data-s="${s}">Not now</button>`:`<button class="btn ghost" data-act="skip" data-s="${s}">Not today</button>`}</div></div></article>`}

/* ---------- jokes & games ---------- */
function dailyUnit(){if(!S.subjects.includes("sci"))return null;const sc=schedule("sci",60);const t=sc.find(x=>x.u.c?.x);if(t)return t.u;const any=S.log.find(l=>unitBy(l.key)?.c?.x);if(any)return unitBy(any.key);return DATA.items.find(i=>i.c?.x)||null}
const G=()=>(S.games[today]=S.games[today]||{g:[],tf:{},odd:null});
const splitJoke=j=>{const m=j.match(/^(.*?\?)\s*(.*)$/);return m?[m[1],m[2]]:[j,""]};
function jokes(u){return `<div class="hs">${u.c.x.jokes.map((j,i)=>{const [q,a]=splitJoke(j),k=today+i;return `<button class="joke" data-act="joke" data-j="${k}"><span class="tag">Joke ${i+1} of ${u.c.x.jokes.length}</span><span class="q">${esc(q)}</span>${ui.jokes[k]?`<span class="a">${esc(a)}</span>`:`<span class="tap">Tap for the answer ✨</span>`}</button>`}).join("")}</div>`}
function wordGame(u){const x=u.c.x,word=x.words[dayNo%x.words.length],g=G(),won=g.g.includes(word),over=won||g.g.length>=6,rows=[],keys={};
  g.g.forEach(w=>[...w].forEach((ch,i)=>{const c=ch===word[i]?"hit":word.includes(ch)?"near":"miss";if(keys[ch]!=="hit"&&!(keys[ch]==="near"&&c==="miss"))keys[ch]=c}));
  for(let r=0;r<6;r++){const w=g.g[r]||(r===g.g.length&&!over?(g.cur||""):"");rows.push(`<div class="wrow">${[0,1,2,3,4].map(i=>{const ch=w[i]||"";let c="";if(g.g[r])c=ch===word[i]?"hit":word.includes(ch)?"near":"miss";return `<span class="tile ${c} ${!g.g[r]&&ch?"pop":""}" style="animation-delay:${g.g[r]?i*.08:0}s">${esc(ch)}</span>`}).join("")}</div>`)}
  return `<p class="small center"><b>Word of the Day.</b> A 5-letter word from "${esc(u.title)}". Green: right place. Yellow: in the word. Six tries.</p><div class="wgrid">${rows.join("")}</div>${over?`<p class="verdict">${won?"You got it! 🎉 ":"The word was "}<b>${word}</b></p>`:`<div class="kb">${["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"].map((r,i)=>`<div>${i===2?`<button data-act="wk" data-key="ENTER" class="wide">Enter</button>`:""}${[...r].map(c=>`<button data-act="wk" data-key="${c}" class="${keys[c]||""}">${c}</button>`).join("")}${i===2?`<button data-act="wk" data-key="DEL" class="wide" aria-label="Delete">⌫</button>`:""}</div>`).join("")}</div>`}`}
function tfGame(u){const g=G(),q=u.c.x.quiz,i=q.findIndex((_,k)=>g.tf[k]===undefined),sc=q.filter((x,k)=>g.tf[k]!==undefined&&(g.tf[k]===1)===x[1]).length;
  const dots=`<div class="dots">${q.map((_,k)=>`<i class="${g.tf[k]===undefined?(k===i?"on":""):((g.tf[k]===1)===q[k][1]?"ok":"no")}"></i>`).join("")}</div>`;
  if(i<0)return `${dots}<div class="score">${sc}/${q.length}</div><p class="verdict">${sc===q.length?"Perfect! 🌟":sc>=q.length/2?"Nice thinking!":"Tricky ones today!"}</p><div class="stack" style="gap:8px">${q.map((x,k)=>`<div class="card alt" style="padding:10px 12px;box-shadow:none"><b>${x[1]?"True":"False"}:</b> ${esc(x[0])}<div class="small muted">${esc(x[2])}</div></div>`).join("")}</div>`;
  const p=i>0?q[i-1]:null;return `${dots}${p?`<p class="center small" style="font-weight:800;color:${(g.tf[i-1]===1)===p[1]?"var(--leaf)":"var(--tomato)"}">${(g.tf[i-1]===1)===p[1]?"Right!":"Not quite."} ${esc(p[2])}</p>`:`<p class="small center"><b>True or False?</b> Some of these sound true and aren't.</p>`}<div class="qcard">${esc(q[i][0])}</div><div class="tfrow"><button class="btn ok" data-act="tf" data-i="${i}" data-v="1">True</button><button class="btn go" data-act="tf" data-i="${i}" data-v="0">False</button></div>`}
function oddGame(u){const g=G(),o=u.c.x.odd[dayNo%u.c.x.odd.length];return `<p class="small center"><b>Odd One Out.</b> Which one doesn't belong? There may be more than one good answer; can you defend yours?</p><div class="oddgrid">${o[0].map(w=>`<button class="btn ${g.odd?(w===o[1]?"right":w===g.odd?"wrong":""):""}" data-act="odd" data-w="${esc(w)}" ${g.odd?"disabled":""}>${esc(w)}</button>`).join("")}</div>${g.odd?`<p class="verdict">${g.odd===o[1]?"Yes! ":"We picked "+esc(o[1])+". "}${esc(o[2])}</p>`:""}`}
function gamesBox(u){const T={word:["🔤 Word of the Day",wordGame],tf:["✅ True or False",tfGame],odd:["🔍 Odd One Out",oddGame]};
  return `<div class="card games"><div class="gh">${Object.entries(T).map(([k,[n]])=>`<button class="pill ${ui.game===k?"on":""}" data-act="gtab" data-g="${k}">${n}</button>`).join("")}</div><div class="gb">${T[ui.game][1](u)}</div></div>`}

/* ---------- chapter explorer ---------- */
const taskDone=(k,id)=>!!(S.tasks[k]&&S.tasks[k][id]);
function chapterTasks(u){const c=u.c;return [["ws","✏️","Worksheet",c.x.wsd.length+" sections: "+c.x.wsd.map(s=>s[0].replace(/^[A-Z]\. /,"")).join(", ")],...c.exp.map((e,i)=>["exp"+i,"🧪","Experiment "+(i+1),e]),...c.act.map((e,i)=>["act"+i,"🧭","Activity "+(i+1),e]),["game","🎲",c.game[0],c.game[1]],["proj","🛠️",c.proj[0],c.proj[1]+" You end up with: "+c.proj[2]+"."]]}
function explorer(u){const c=u.c,x=c.x,t=ui.etab[u.k]||"learn",H=x.hours,h=re=>{const r=H.find(a=>re.test(a[0]));return r?`<span class="chip time">⏱ ${mins(r[1])}${r[2]>1?` · over ${r[2]} days`:""}</span>`:""};
  const tabs={learn:"💡 Learn",think:"🤔 Think",do:"✋ Do",play:"🎲 Play & explore"};let b="";
  if(t==="learn")b=`<div class="row">${[`NCERT ${u.book}, ${chNo(u)}`,...c.links].map(l=>`<span class="chip">${esc(l)}</span>`).join("")}</div><div class="hs">${x.learn.map((l,i)=>`<div class="idea"><span class="n">${i+1}</span><p>${esc(l)}</p></div>`).join("")}</div><div class="card alt"><span class="tag">Read more</span><ul class="t">${c.read.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;
  if(t==="think")b=`<p class="small muted">Three big questions. Ask your child first and listen. Then read the views together: which one is strongest? Which would you argue against?</p>`+x.deep.map((d,i)=>`<article class="card think"><div class="th"><span class="tag">Big question ${i+1}</span><h3>${esc(d.q)}</h3></div><div class="tb"><p>${esc(d.why)}</p><div class="tag muted">Different views</div>${d.views.map(([w,v])=>`<div class="view"><span class="who">${esc(w)}</span><span class="say">${esc(v)}</span></div>`).join("")}<div class="tryit"><b>Try this 🔎</b>${esc(d.tryit)}</div></div></article>`).join("")+`<div class="card one"><span class="tag">Oneness</span><p>${esc(x.oneness)}</p></div>`;
  if(t==="do"){const ts=chapterTasks(u),dn=ts.filter(a=>taskDone(u.k,a[0])).length;
    b=`<div class="card meter alt"><div class="row" style="justify-content:space-between"><b style="font:700 21px var(--hand)">Chapter tasks</b><span class="chip">${dn} of ${ts.length} done</span></div><div class="bar" style="--c:var(--leaf)"><span style="width:${dn/ts.length*100}%"></span></div></div>
     <div class="dogrid">${ts.map(([id,ic,ttl,desc])=>{const d=taskDone(u.k,id),kind=id.replace(/\d+$/,"");return `<div class="card task k-${kind} ${d?"done":""}">${d?`<span class="stamp">DONE</span>`:""}<span class="ic">${ic}</span><h4>${esc(ttl)}</h4><p class="small">${esc(desc)}</p>${kind==="ws"?h(/^Worksheet/):id==="exp0"?h(/^Experiment/):id==="act0"?h(/^Activit/):kind==="proj"?h(/^Project/):kind==="game"?h(/^Game/):""}
       <div class="row">${kind==="ws"?`<button class="btn mini sun" data-act="ws" data-k="${u.k}">Open worksheet</button>`:""}${kind==="proj"?`<button class="btn mini sun" data-act="startexp" data-title="${esc(ttl)}" data-topic="${esc(u.title)}">Track it</button>`:""}<button class="btn mini ${d?"ghost":"ok"}" data-act="task" data-k="${u.k}" data-id="${id}">${d?"Undo":"Mark done ✓"}</button></div></div>`}).join("")}</div>`}
  if(t==="play")b=`<div class="card" style="background:var(--pink);color:#fff"><span class="tag">Chapter game</span><h3 style="font-size:26px;margin:4px 0">${esc(c.game[0])}</h3><p>${esc(c.game[1])}</p></div><h3 style="font-size:22px">Curated from around the world</h3>${x.cur.map(([w,src,url,how])=>`<a class="card alt cur" href="${esc(url)}" target="_blank" rel="noopener"><span class="src">${esc(src)} ↗</span><b>${esc(w)}</b><span class="small">${esc(how)}</span></a>`).join("")}`;
  return `<div class="pills">${Object.entries(tabs).map(([k,n])=>`<button class="pill ${t===k?"on":""}" data-act="etab" data-k="${u.k}" data-t="${k}">${n}</button>`).join("")}</div><div class="stack">${b}</div>`}

/* ---------- interactive worksheet ---------- */
const A=(k,id)=>(S.ans[k]||{})[id];
function setA(k,id,v){S.ans[k]=S.ans[k]||{};S.ans[k][id]=v}
function worksheet(u){const W=u.c.x.wsd,k=u.k;let qn=0;const total=W.reduce((a,s)=>a+s[1].length,0),answered=W.reduce((a,[_,its],si)=>a+its.filter((_,ii)=>{const v=A(k,si+"-"+ii);return v!==undefined&&v!==""&&!(typeof v==="object"&&!Object.keys(v).length)}).length,0);
  return `<div class="card alt meter"><div class="row" style="justify-content:space-between"><b style="font:700 20px var(--hand)">${total} questions</b><span class="chip">${answered} answered</span></div><div class="bar"><span style="width:${answered/total*100}%"></span></div><p class="small muted">Answers save as you go. Drawing boxes are for quick sketches; use paper for a finished drawing. Many questions have no single right answer: the thinking is the point.</p></div>`
  +W.map(([title,items],si)=>`<section class="card wsh"><h3>${esc(title)}</h3>${items.map((it,ii)=>{const id=si+"-"+ii;qn++;const v=A(k,id);let body="";
    if(it.t==="mcq")body=`<div class="opts">${it.opts.map((o,oi)=>`<button class="opt ${v===undefined?"":oi===it.a?"right":oi===v?"wrong":""}" data-act="mcq" data-k="${k}" data-id="${id}" data-o="${oi}" data-a="${it.a}" ${v!==undefined?"disabled":""}>${esc(o)}</button>`).join("")}</div>${v!==undefined?`<p class="small" style="font-weight:800">${v===it.a?"Right! ✓":"Look again at the green one."} <button class="btn mini ghost" data-act="mcqreset" data-k="${k}" data-id="${id}">Try again</button></p>`:""}`;
    else if(it.t==="fill")body=`<div class="stack" style="gap:6px">${it.a.map((_,bi)=>`<input class="inp" data-ans="${k}|${id}|${bi}" placeholder="Blank ${bi+1}" value="${esc((v||[])[bi]||"")}">`).join("")}</div><div class="row"><button class="btn mini" data-act="checkfill" data-k="${k}" data-id="${id}" data-a="${esc(JSON.stringify(it.a))}">Check</button><button class="btn mini ghost" data-act="showfill" data-a="${esc(it.a.join(" · "))}">Show answers</button></div>`;
    else if(it.t==="write")body=`<textarea class="inp" data-ans="${k}|${id}" rows="${it.lines||3}" placeholder="Write here…">${esc(v||"")}</textarea>`;
    else if(it.t==="table"){const vv=v||{};body=`<div class="grid"><table><tr>${it.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${Array.from({length:it.rows},(_,r)=>`<tr>${it.cols.map((_,ci)=>`<td><input data-ans="${k}|${id}|${r}.${ci}" value="${esc(vv[r+"."+ci]??(ci===0&&it.prefill?it.prefill[r]||"":""))}" aria-label="${esc(it.cols[ci])} row ${r+1}"></td>`).join("")}</tr>`).join("")}</table></div>`}
    else if(it.t==="draw")body=`<canvas class="pad" data-pad="${k}|${id}"></canvas><div class="row"><button class="btn mini ghost" data-act="clearpad" data-pad="${k}|${id}">Clear</button><button class="btn mini ${v?"":"ok"}" data-act="drew" data-k="${k}" data-id="${id}">${v?"Drawn ✓":"Drawn on paper ✓"}</button></div>`;
    else if(it.t==="sort"){const vv=v||{},sel=ui.sel[k+id];body=`<div class="sortbox"><div class="pool">${it.items.filter(x=>vv[x]===undefined).map(x=>`<button class="token ${sel===x?"sel":""}" data-act="tok" data-k="${k}" data-id="${id}" data-x="${esc(x)}">${esc(x)}</button>`).join("")||`<span class="small" style="font-weight:800">All sorted! 🎉 Talk about any that could go in two boxes.</span>`}</div><div class="buckets">${it.cats.map((c,ci)=>`<div class="bucket" data-act="bucket" data-k="${k}" data-id="${id}" data-c="${ci}"><b>${esc(c)}</b>${it.items.filter(x=>vv[x]===ci).map(x=>`<button class="token" data-act="untok" data-k="${k}" data-id="${id}" data-x="${esc(x)}">${esc(x)} ×</button>`).join("")}</div>`).join("")}</div>${sel?`<p class="small" style="font-weight:800">Now tap a box for “${esc(sel)}”.</p>`:`<p class="small muted">Tap a word, then tap its box.</p>`}</div>`}

/* ---------- onboarding ---------- */

  if(ob.step===4){const keep=S;S={...S,...d};h+=`<h2>${esc(d.child||"Your child")}'s year 🎒</h2><div class="stack">${d.subjects.map(s=>{const c=collate(s);const books=[...new Set(c.board.map(u=>u.book))];return `<div class="card" style="border-left:12px solid ${SCOL[s]}"><b style="font:700 21px var(--hand)">${SUBJ[s]}</b> <span class="small muted">${lvlLabel(d.levels[s])}</span><ul class="t">${books.map(b=>`<li>${esc(b)}: ${c.board.filter(u=>u.book===b).length}</li>`).join("")}${c.dk.length?`<li>DeepKids Plus: ${c.dk.length} topics</li>`:""}</ul>${notesFor(s,d.levels[s]).map(n=>`<p class="small muted">${esc(n)}</p>`).join("")}</div>`}).join("")}</div>`;S=keep}
  h+=`<div class="row" style="justify-content:space-between">${ob.step>0?`<button class="btn" data-ob="back">Back</button>`:"<span></span>"}<button class="btn go" data-ob="next">${ob.step===4?"Build my plan ✨":"Next →"}</button></div></div>`;return h}
function obNext(){const d=ob.d;if(ob.step===0){d.child=document.getElementById("obName").value.trim();SUBJ_KEYS.forEach(s=>d.levels[s]=Math.min(5,Math.max(1,d.age-5)))}if(ob.step===2&&!d.subjects.length){sfx("no");return}
  if(ob.step===4){Object.assign(S,d,{setup:true});ob=null;tab="today";commit();sfx("win");confetti();return}ob.step++;render();scrollTo(0,0)}

/* ---------- full-screen sheet: chapter or worksheet ---------- */

    else if(u.board==="dk"){const t=u.topic;h+=`<div class="card"><p>${esc(t.summary)}</p></div><div class="card one"><span class="tag">Oneness</span><p>${esc(t.oneness)}</p></div><div class="hs">${t.sub.map((x,i)=>`<div class="idea"><span class="n">${i+1}</span><p>${esc(x)}</p></div>`).join("")}</div>${t.res.length?`<div class="card alt"><span class="tag">Resources</span><ul class="t">${t.res.map(r=>`<li>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>`:esc(r.title)}</li>`).join("")}</ul></div>`:""}`}
    else h+=`<p class="note">A detailed lesson for this chapter is being written. Use the general day plan on Today for now.</p>`;
    h+=`<button class="btn" data-act="logk" data-k="${u.k}">Log a session today</button>`}
  b.replaceChildren(el(h));sheet.scrollTop=top?0:y;requestAnimationFrame(initPads)}
document.getElementById("sheetClose").onclick=()=>{sfx("flip");sheet.close()};
sheet.addEventListener("close",()=>{ui.sheet=null;render()});

/* ---------- render ---------- */
function render(){_sess=null;const m=document.getElementById("main"),tabs=document.getElementById("tabs");
  if(!S.setup&&!ob)return startOnboarding(0);
  tabs.hidden=!!ob;document.getElementById("openSettings").hidden=!!ob;document.getElementById("snd").textContent=soundOn?"🔊":"🔇";
  document.getElementById("who").textContent=ob?"Let's set up your year":(S.child?S.child+" · ":"")+(S.board==="none"?"DeepKids Plus":S.board==="combined"?"Combined boards":BOARDS[S.board]);
  const open=[...m.querySelectorAll("details[open]")].map(d=>d.dataset.id).filter(Boolean),sx=[...m.querySelectorAll(".hs")].map(x=>x.scrollLeft);
  m.replaceChildren(el(ob?viewOnboarding():{today:viewToday,plan:viewPlan,topics:viewTopics,progress:viewProgress}[tab]()));
  open.forEach(id=>{const d=m.querySelector(`details[data-id="${CSS.escape(id)}"]`);if(d)d.open=true});m.querySelectorAll(".hs").forEach((x,i)=>{if(sx[i])x.scrollLeft=sx[i]});

/* ---------- events ---------- */
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;sfx("tap");render();scrollTo(0,0)});
document.getElementById("snd").onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("dk-sound",soundOn?"on":"off")}catch(e){}sfx("tick");render()};
function onAct(e){
  if(ob){const d=ob.d,t=e.target.closest("[data-ob],button[data-age],button[data-b],button[data-s]");if(!t)return;sfx("tap");
    if(t.dataset.ob==="next")return obNext();if(t.dataset.ob==="back"){ob.step--;return render()}
    if(t.dataset.age){d.child=document.getElementById("obName").value;d.age=+t.dataset.age}
    if(t.dataset.b){d.board=t.dataset.b;if(d.board==="none")d.plus=true}
    if(t.dataset.s&&t.classList.contains("choice")){const s=t.dataset.s;d.subjects=d.subjects.includes(s)?d.subjects.filter(x=>x!==s):[...d.subjects,s].sort((a,b)=>SUBJ_KEYS.indexOf(a)-SUBJ_KEYS.indexOf(b))}
    return render()}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,k=b.dataset.k;
  switch(a){
   case "did":{const u=unitBy(k);if(!u)return;const s=b.dataset.s,extra=!!ui.more[s];logSession(u,extra?"more":"plan");ui.more[s]=false;sfx("win");confetti();toast(extra?"Bonus lesson done! 🚀":"Lesson done! Well done 🌟");commit();break}
   case "logk":{const u=unitBy(k);if(u){logSession(u,"free");sfx("ok");toast("Logged for today");commit()}break}
   case "undo":{const s=b.dataset.s,i=S.log.findIndex(l=>l.date===today&&l.subj===s&&l.kind!=="free");if(i>=0){const l=S.log[i];S.log.splice(i,1);const p=S.progress[l.key];if(p&&p.sessions){p.sessions--;const uu=unitBy(l.key);if(p.status==="completed"&&uu&&p.sessions<sessionsFor(uu))p.status="learning";if(!p.sessions&&p.status==="learning")p.status="none"}ui.more[s]=false;sfx("flip");commit()}break}
   case "more":{ui.more[b.dataset.s]=true;sfx("tick");render();break}
   case "less":{ui.more[b.dataset.s]=false;sfx("flip");render();break}
   case "skip":{S.skips[today+"|"+b.dataset.s]=true;sfx("flip");toast("Moved to the next lesson day");commit();break}
   case "free":{openPicker();break}
   case "step":{const key=b.dataset.key,i=+b.dataset.i,set=new Set(S.steps[key]||[]);if(set.has(i))set.delete(i);else{set.add(i);sfx("tick")}S.steps[key]=[...set];commit();break}
   case "open":{sfx("flip");openSheet(k,"chapter",b.dataset.t);break}
   case "ws":{sfx("flip");openSheet(k,"ws");break}
   case "etab":{ui.etab[k]=b.dataset.t;sfx("tap");renderSheet(true);break}
   case "task":{const id=b.dataset.id;S.tasks[k]=S.tasks[k]||{};if(S.tasks[k][id])delete S.tasks[k][id];else{S.tasks[k][id]=today;sfx("ok");toast("Marked done ✓")}commit();break}
   case "startexp":{addExp(b.dataset.title,b.dataset.topic);sfx("ok");toast("Added to ongoing projects");commit();break}
   case "status":{const p=S.progress[k]||{sessions:0};p.status=b.dataset.s;p.updated=today;S.progress[k]=p;sfx(b.dataset.s==="mastered"?"win":"tick");commit();break}
   case "hrs":{const u=unitBy(k);if(u){S.hrs[u.k]=Math.max(.5,hoursFor(u)+(+b.dataset.d));sfx("tap");commit()}break}
   case "lvl":{const s=b.dataset.s;S.levels[s]=Math.min(5,Math.max(1,S.levels[s]+(+b.dataset.d)));ui.view[s]=S.levels[s];sfx("tick");commit();break}
   case "day":{const s=b.dataset.s,d=+b.dataset.d,cur=new Set(daysOf(s));cur.has(d)?cur.delete(d):cur.add(d);if(cur.size){S.days={...S.days,[s]:[...cur].sort()};sfx("tap");commit()}break}
   case "tlcheck":{const date=b.dataset.date,it=dayPlan(date).find(i=>i.id===b.dataset.id);if(!it)return;
     if(it.kind==="prep"){const all=it.prep.every(p=>S.prep[p.id]);it.prep.forEach(p=>{if(all)delete S.prep[p.id];else S.prep[p.id]=today});sfx(all?"flip":"ok")}
     else if(it.kind==="lesson"){if(it.done){toast("Use Undo on the lesson card");return}const el2=document.getElementById("card-"+it.s);if(el2){el2.scrollIntoView({behavior:"smooth",block:"start"});sfx("tap")}return}
     else if(it.kind==="exps"){S.exps.filter(e=>!e.closed&&e.start<=date).forEach(e=>{if(!e.checks.includes(today))e.checks.push(today)});sfx("ok")}
     else{const key=date+"|"+it.id;if(S.tl[key])delete S.tl[key];else{S.tl[key]=1;sfx("ok")}}
     commit();break}
   case "tlopen":{const date=b.dataset.date,it=dayPlan(date).find(i=>i.id===b.dataset.id);if(!it)return;sfx("tap");
     if(it.kind==="prep"){openSheet(null,"prep",null,{date,when:it.id});return}
     if(date!==today){if(it.kind==="lesson"){const x=lessonsOn(date).find(l=>l.s===it.s);if(x)openSheet(x.u.k,"chapter")}return}
     const target={lesson:"card-"+it.s,warm:"jokes",exps:"exps"}[it.kind];const el2=target&&document.getElementById(target);if(el2)el2.scrollIntoView({behavior:"smooth",block:"start"});break}
   case "prep":{const id=b.dataset.id;if(S.prep[id])delete S.prep[id];else{S.prep[id]=today;sfx("tick")}commit();break}
   case "hidehow":{S.hideHow=true;sfx("tap");commit();break}
   case "pview":{ui.pview=b.dataset.v;sfx("tap");render();break}
   case "addev":{openEv();break}
   case "delev":{S.events=(S.events||[]).filter(e=>e.id!==b.dataset.e);sfx("flip");commit();break}
   case "pday":{ui.planDay=b.dataset.d;sfx("tap");render();break}
   case "tsub":{ui.topicSubj=b.dataset.s;sfx("tap");render();break}
   case "view":{ui.view[b.dataset.s]=+b.dataset.l;sfx("tap");render();break}
   case "setlvl":{S.levels[b.dataset.s]=+b.dataset.l;sfx("tick");commit();break}
   case "check":{const x=S.exps.find(x=>x.id===b.dataset.e);if(x&&!x.checks.includes(today)){x.checks.push(today);sfx("ok");commit()}break}
   case "close":{const x=S.exps.find(x=>x.id===b.dataset.e);if(x){x.closed=true;x.end=today;sfx("win");confetti();toast("Experiment finished! 🧪");commit()}break}
   case "addexp":{const v=document.getElementById("newExp").value.trim();if(v){addExp(v,"Own experiment");sfx("ok");commit()}break}
   case "joke":{ui.jokes[b.dataset.j]=!ui.jokes[b.dataset.j];sfx(ui.jokes[b.dataset.j]?"ok":"flip");render();break}
   case "gtab":{ui.game=b.dataset.g;sfx("tap");render();break}
   case "wk":{const u=dailyUnit();if(!u)return;const x=u.c.x,word=x.words[dayNo%x.words.length],g=G();g.cur=g.cur||"";const key=b.dataset.key;if(g.g.includes(word)||g.g.length>=6)return;
     if(key==="DEL"){g.cur=g.cur.slice(0,-1);sfx("key")}else if(key==="ENTER"){if(g.cur.length===5){g.g.push(g.cur);const w=g.cur===word;g.cur="";sfx(w?"win":g.g.length>=6?"no":"flip");if(w)confetti();S.updatedAt=Date.now();save()}else{sfx("no");toast("Five letters, please")}}else if(g.cur.length<5){g.cur+=key;sfx("key")}render();break}
   case "tf":{const u=dailyUnit(),q=u.c.x.quiz[+b.dataset.i];G().tf[b.dataset.i]=+b.dataset.v;const r=(+b.dataset.v===1)===q[1];sfx(r?"ok":"no");if(Object.keys(G().tf).length===u.c.x.quiz.length){setTimeout(()=>sfx("win"),300)}commit();break}
   case "odd":{const u=dailyUnit(),o=u.c.x.odd[dayNo%u.c.x.odd.length],g=G();if(!g.odd){g.odd=b.dataset.w;sfx(g.odd===o[1]?"win":"no");if(g.odd===o[1])confetti();commit()}break}
   case "mcq":{setA(k,b.dataset.id,+b.dataset.o);sfx(+b.dataset.o===+b.dataset.a?"ok":"no");commit();break}
   case "mcqreset":{delete S.ans[k][b.dataset.id];sfx("flip");commit();break}
   case "checkfill":{const ans=JSON.parse(b.dataset.a),v=A(k,b.dataset.id)||[];const norm=s=>String(s||"").trim().toLowerCase();const good=ans.every((x,i)=>{const w=norm(v[i]);return w&&(norm(x).includes(w)||w.includes(norm(x).split(/[ (]/)[0]))});sfx(good?"ok":"no");toast(good?"Looks right! ✓":"Have another look");break}
   case "showfill":{sfx("flip");toast(b.dataset.a);break}
   case "drew":{setA(k,b.dataset.id,A(k,b.dataset.id)?undefined:today);if(A(k,b.dataset.id)===undefined)delete S.ans[k][b.dataset.id];else sfx("ok");commit();break}
   case "tok":{const key=k+b.dataset.id;ui.sel[key]=ui.sel[key]===b.dataset.x?undefined:b.dataset.x;sfx("tap");renderSheet();break}
   case "bucket":{const sel=ui.sel[k+b.dataset.id];if(sel===undefined)return;const v={...(A(k,b.dataset.id)||{})};v[sel]=+b.dataset.c;setA(k,b.dataset.id,v);ui.sel[k+b.dataset.id]=undefined;sfx("tick");commit();break}
   case "untok":{const v={...(A(k,b.dataset.id)||{})};delete v[b.dataset.x];setA(k,b.dataset.id,v);sfx("flip");commit();break}
   case "mleft":{ui.sel[k+b.dataset.id]=b.dataset.x;sfx("tap");renderSheet();break}
   case "mright":{const l=ui.sel[k+b.dataset.id];if(!l){sfx("no");toast("Tap a word on the left first");return}const v={...(A(k,b.dataset.id)||{})};Object.keys(v).forEach(x=>{if(v[x]===b.dataset.x)delete v[x]});v[l]=b.dataset.x;setA(k,b.dataset.id,v);ui.sel[k+b.dataset.id]=undefined;const it=unitBy(k).c.x.wsd[+b.dataset.id.split("-")[0]][1][+b.dataset.id.split("-")[1]];sfx(it.pairs.some(p=>p[0]===l&&p[1]===b.dataset.x)?"ok":"tick");commit();break}
   case "mreset":{setA(k,b.dataset.id,{});sfx("flip");commit();break}
   case "clearpad":{const c=document.querySelector(`canvas[data-pad="${CSS.escape(b.dataset.pad)}"]`);if(c)c.getContext("2d").clearRect(0,0,c.width,c.height);sfx("flip");break}
  }}
document.getElementById("main").addEventListener("click",onAct);
document.getElementById("sheetBody").addEventListener("click",onAct);
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset.ans)return;const [k,id,sub]=t.dataset.ans.split("|");if(sub===undefined)setA(k,id,t.value);else if(sub.includes(".")){const v={...(A(k,id)||{})};v[sub]=t.value;setA(k,id,v)}else{const v=[...(A(k,id)||[])];v[+sub]=t.value;setA(k,id,v)}S.updatedAt=Date.now();save()});
document.getElementById("main").addEventListener("change",e=>{const t=e.target;
  if(t.dataset.dayset){S.day={...D(),[t.dataset.dayset]:t.type==="time"?t.value:+t.value};sfx("tap");commit();return}
  if(t.matches("select[data-hpd]")){const s=t.dataset.hpd,v=+t.value;sfx("tap");if(ob)ob.d.hpd={...(ob.d.hpd||DEF_HPD),[s]:v};else{S.hpd={...(S.hpd||DEF_HPD),[s]:v};commit()}return}
  if(ob&&t.matches("#obPlus")){ob.d.plus=t.checked;sfx("tap");return}if(ob&&t.matches("select[data-s]")){ob.d.levels[t.dataset.s]=+t.value;sfx("tap")}});
const evd=document.getElementById("evd");let evRep="once";
function openEv(){evForm.reset();eDate.value=ui.planDay||today;evRep="once";syncEv();eDays.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));sfx("tap");evd.showModal()}
function syncEv(){eRep.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.rep===evRep));eDateF.hidden=evRep!=="once";eDaysF.hidden=evRep==="once"}
eRep.addEventListener("click",e=>{const x=e.target.closest("button");if(!x)return;evRep=x.dataset.rep;syncEv();sfx("tap")});
eDays.addEventListener("click",e=>{const x=e.target.closest("button");if(!x)return;x.setAttribute("aria-pressed",x.getAttribute("aria-pressed")!=="true");sfx("tap")});
evForm.addEventListener("submit",e=>{if(!e.submitter||e.submitter.value!=="save")return;const days=[...eDays.querySelectorAll('[aria-pressed="true"]')].map(x=>+x.dataset.d);
  if(!eTitle.value.trim()||(evRep==="weekly"&&!days.length)||(evRep==="once"&&!eDate.value)||hm(eEnd.value)<=hm(eStart.value)){e.preventDefault();sfx("no");toast(hm(eEnd.value)<=hm(eStart.value)?"End time must be after start":"Fill in the name and day");return}
  S.events=[...(S.events||[]),{id:Math.random().toString(36).slice(2,9),title:eTitle.value.trim(),kind:eKind.value,who:eKind.value==="outing"&&eWho.value==="kid"?"both":eWho.value,start:eStart.value,end:eEnd.value,rep:evRep,date:evRep==="once"?eDate.value:null,days:evRep==="weekly"?days:[],from:today,note:eNote.value.trim()}];sfx("ok");toast("Added to the plan");commit()});
const pick=document.getElementById("pick");
function openPicker(){document.getElementById("pickList").replaceChildren(el(everyUnit().map(u=>`<button class="btn" style="text-align:left;box-shadow:none" data-k="${u.k}">${SUBJ[u.subj]} L${u.level} · ${esc(u.title)}</button>`).join("")));pick.showModal()}
document.getElementById("pickList").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const u=unitBy(b.dataset.k);if(u){logSession(u,"free");pick.close();sfx("ok");toast("Logged!");commit()}});
document.getElementById("pickClose").onclick=()=>pick.close();
const dlg=document.getElementById("settings");
document.getElementById("openSettings").onclick=()=>{sfx("tap");sName.value=S.child;sStart.value=S.start;syncNote.textContent=syncMode==="account"?"Progress is saved privately to your claude.ai account.":"Progress is saved in this browser only.";dlg.showModal()};
setForm.addEventListener("submit",e=>{S.child=sName.value.trim();if(sStart.value)S.start=sStart.value;if(e.submitter&&e.submitter.value==="redo"){save();startOnboarding(1)}else commit()});
boot();
</script>
