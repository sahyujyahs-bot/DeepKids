<title>DeepKids Home Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Lexend:wght@300;400;500;600&display=swap">
<style>
/* Threshold: the day opens on a kolam drawn on an indigo doorstep; one focused card says what to do now; everything else is a quiet agenda below.
   Single column up to 720px, floating pill navigation, full-screen sheets for lessons, chapters and worksheets. */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --sunk:#E9EBF4; --ink:#1A1D3F; --muted:#666A8C; --line:#DFE2EE;
  --night:#1C1F4A; --night2:#2A2E66; --chalk:#F7F3E8;
  --marigold:#F5A00F; --peacock:#0B8A8A; --coral:#F0566A; --leaf:#2E9E64; --sky:#4672F0; --plum:#8A56D8;
  --onaccent:#FFFFFF; --good:#2E9E64; --bad:#E0485C;
  --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:28px; --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(26,29,63,.06),0 8px 24px -12px rgba(26,29,63,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1022; --surface:#171A33; --sunk:#20244A; --ink:#ECEDF8; --muted:#A0A4C6; --line:#2B2F57;
  --night:#20245A; --night2:#2E3374; --chalk:#F7F3E8;
  --marigold:#FFB43A; --peacock:#2BB3B1; --coral:#FF7386; --leaf:#4CC285; --sky:#7395FF; --plum:#B08CFF; --good:#4CC285; --bad:#FF6B7E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1022; --surface:#171A33; --sunk:#20244A; --ink:#ECEDF8; --muted:#A0A4C6; --line:#2B2F57;
  --night:#20245A; --night2:#2E3374; --chalk:#F7F3E8;
  --marigold:#FFB43A; --peacock:#2BB3B1; --coral:#FF7386; --leaf:#4CC285; --sky:#7395FF; --plum:#B08CFF; --good:#4CC285; --bad:#FF6B7E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}.sm{font-size:14px}.xs{font-size:12.5px}
.eyebrow{font:600 11.5px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:grid;gap:12px}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:500;font-size:15.5px;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.accent{background:var(--marigold);color:#2A1700}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.btn.xs{height:32px;padding:0 12px;font-size:13px}
.btn.wide{flex:1}
.btn:disabled{opacity:.4;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--sunk);display:grid;place-items:center;flex:none;color:var(--ink)}
.link{background:none;border:0;padding:0;color:var(--sky);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:500;white-space:nowrap}
.dotc{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.s-math{--c:var(--peacock)}.s-eng{--c:var(--sky)}.s-hin{--c:var(--coral)}.s-sci{--c:var(--leaf)}
.r-you{--c:var(--marigold)}.r-both{--c:var(--plum)}.r-kid{--c:var(--sky)}.r-out{--c:var(--coral)}.r-free{--c:var(--line)}
/* header & nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font:600 18px var(--display)}
.brand span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:44px;height:44px;border-radius:50%;border:0;background:var(--marigold);color:#2A1700;font:600 17px var(--display);display:grid;place-items:center}
nav.nav{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:999px;background:var(--night);box-shadow:0 12px 30px -10px rgba(10,12,40,.55);width:min(440px,calc(100% - 32px))}
nav.nav button{flex:1;border:0;background:transparent;color:#B9BCE0;border-radius:999px;height:52px;display:grid;justify-items:center;align-content:center;gap:2px;font-size:11.5px;font-weight:500}
nav.nav button .ico{width:21px;height:21px}
nav.nav button[aria-current="page"]{background:var(--chalk);color:var(--night)}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
/* threshold hero */
.threshold{margin-top:6px;border-radius:var(--r-lg);background:radial-gradient(120% 140% at 100% 0%,var(--night2),var(--night) 60%);color:var(--chalk);padding:22px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;overflow:hidden}
.threshold h1{font-size:clamp(26px,6.5vw,34px)}
.threshold .eyebrow{color:#C9CBEA}
.threshold p{color:#D6D8F2;font-size:14.5px;margin-top:6px}
.kolam{width:118px;height:118px}
.kolam .d{fill:var(--chalk)}.kolam .lp{fill:none;stroke:var(--marigold);stroke-width:3;stroke-linecap:round}
.kolam .nw{fill:none;stroke:var(--chalk);stroke-width:1.6;stroke-dasharray:3 3;opacity:.8}
.kolam .lp{stroke-dasharray:80;stroke-dashoffset:0;animation:draw .9s ease-out both}
@keyframes draw{from{stroke-dashoffset:80}}
/* focus card */
.focus{margin-top:16px;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;display:grid;gap:14px;position:relative;overflow:hidden}
.focus::after{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c,var(--marigold))}
.focus .who{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--muted)}
.focus .who b{color:var(--ink);font-weight:600}
.focus h2{font-size:clamp(22px,5.4vw,28px)}
.focus .sub{color:var(--muted)}
.steps-mini{display:flex;flex-wrap:wrap;gap:6px}
.steps-mini span{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk)}
.steps-mini span.ok{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
.donecard{margin-top:16px;border-radius:var(--r-lg);padding:22px;background:linear-gradient(140deg,color-mix(in srgb,var(--marigold) 26%,var(--surface)),var(--surface) 70%);box-shadow:var(--shadow);display:grid;gap:12px}
.donecard h2{font-size:26px}
.offer{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
/* sections */
.sec{margin-top:30px;display:grid;gap:12px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sech h3{font-size:17px}
/* agenda */
.agenda{display:grid;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ag{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;padding:13px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.ag:first-child{border-top:0}
.ag .t{font-size:13px;color:var(--muted);font-weight:500}
.ag .m{min-width:0;display:grid;gap:1px}
.ag .m b{font-weight:500;overflow:hidden;text-overflow:ellipsis}
.ag .m span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag .tg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ag.done .m b{text-decoration:line-through;color:var(--muted)}
.ag.brk{padding-block:8px}.ag.brk .m b{font-size:13.5px;color:var(--muted);font-weight:400}
.ag.now{background:color-mix(in srgb,var(--marigold) 10%,var(--surface))}
.ck{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.8px var(--line);display:grid;place-items:center;color:transparent}
.done .ck{background:var(--good);box-shadow:none;color:#fff}
/* small cards */
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.hs>*{scroll-snap-align:start;flex:0 0 78%;max-width:320px}
.joke{border:0;border-radius:var(--r);padding:18px;text-align:left;display:grid;gap:10px;align-content:start;min-height:150px;background:var(--surface);box-shadow:var(--shadow)}
.joke .q{font:500 17.5px/1.35 var(--display)}
.joke .a{font-size:16px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--marigold) 22%,var(--surface));animation:rise .3s}
.joke .tap{font-size:13px;color:var(--sky);font-weight:500}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;gap:8px;border:0;text-align:left;width:100%}
.tile h4{margin:0;font:600 16px var(--display)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.expi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.expi:first-child{border-top:0}
.daybadge{font:600 13px var(--display);width:46px;height:46px;border-radius:14px;background:color-mix(in srgb,var(--leaf) 16%,var(--surface));color:var(--leaf);display:grid;place-items:center;line-height:1;text-align:center}
.daybadge small{display:block;font:500 9.5px var(--body);letter-spacing:.06em}
.inp{width:100%;height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
textarea.inp{height:auto;min-height:96px;padding:12px 14px;line-height:1.5;resize:vertical}
select.inp{appearance:auto}
.howto{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:grid;gap:10px}
.howto ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14.5px}
/* sheet */
dialog.sheet{border:0;padding:0;margin:0;width:100%;max-width:100%;height:100%;max-height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:contain}
dialog.sheet[open]{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:0}}
dialog.sheet::backdrop{background:rgba(10,12,40,.45)}
.shead{position:sticky;top:0;z-index:3;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px)}
.shead .wrap{display:flex;align-items:center;gap:12px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px}
.shead h3{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbody{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.sbody>.wrap{display:grid;gap:16px}
/* lesson player */
.segs{display:flex;gap:4px}.segs i{flex:1;height:5px;border-radius:9px;background:var(--line)}.segs i.ok{background:var(--good)}.segs i.on{background:var(--c,var(--marigold))}
.stage{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px;display:grid;gap:16px}
.stage .kind{display:flex;align-items:center;gap:10px;color:var(--c,var(--ink));font-weight:600;font-size:14px}
.stage .kind .ico{width:28px;height:28px}
.stage h2{font-size:clamp(22px,5.6vw,30px)}
.stage .body{font-size:16px}.stage .body>*+*{margin-top:12px}
.stage ul{margin:0;padding-left:20px;display:grid;gap:8px}
.ask{border-radius:16px;padding:14px 16px;background:color-mix(in srgb,var(--plum) 12%,var(--surface));font-weight:500}
.ask .eyebrow{display:block;margin-bottom:4px;color:var(--plum)}
.timer{display:flex;align-items:center;gap:14px}
.timer svg{width:64px;height:64px}
.timer .tt{font:600 22px var(--display)}
.tasks-inline{display:grid;gap:8px}
.tline{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--sunk);border:0;text-align:left;width:100%}
.tline.done{background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.tline.done .ck{background:var(--good);box-shadow:none;color:#fff}
.finish{text-align:center;justify-items:center;padding-block:36px}
.finish .big{font:700 54px var(--display);color:var(--marigold)}
/* chapter */
.chero{border-radius:var(--r-lg);padding:22px;background:var(--c);color:#fff;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;overflow:hidden}
.chero .n{font:700 76px/0.85 var(--display);opacity:.9}
.chero h1{font-size:clamp(24px,6vw,32px)}
.chero p{opacity:.88;font-size:14px;margin-top:4px}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--sunk);overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:999px;height:38px;padding:0 12px;font-size:13.5px;font-weight:500;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:grid;gap:10px}
.idea{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.idea .k{font:600 15px var(--display);width:36px;height:36px;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c);display:grid;place-items:center}
.qcard{border-radius:var(--r-lg);padding:24px;background:var(--night);color:var(--chalk);display:grid;gap:12px}
.qcard .eyebrow{color:#C9CBEA}
.qcard h2{font-size:clamp(22px,5.6vw,30px)}
.qcard p{color:#D6D8F2}
.voice{display:grid;gap:4px;padding:14px 16px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow)}
.voice b{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--c,var(--plum))}
.voice:nth-child(3n+1){--c:var(--peacock)}.voice:nth-child(3n+2){--c:var(--coral)}.voice:nth-child(3n){--c:var(--plum)}
.mission{border-radius:16px;padding:16px;background:color-mix(in srgb,var(--leaf) 14%,var(--surface));display:grid;gap:4px}
.mission b{color:var(--leaf);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.oneness{border-radius:var(--r);padding:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--marigold) 30%,var(--surface)),color-mix(in srgb,var(--coral) 18%,var(--surface)))}
.oneness p{font:500 18px/1.45 var(--display);margin-top:6px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px}
.taskrow{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.taskrow:first-child{border-top:0}
.taskrow .ckb{width:30px;height:30px;border-radius:50%;border:0;box-shadow:inset 0 0 0 1.8px var(--line);background:none;display:grid;place-items:center;color:transparent;margin-top:2px}
.taskrow.done .ckb{background:var(--good);box-shadow:none;color:#fff}
.taskrow.done b{text-decoration:line-through;color:var(--muted)}
.taskrow .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.res{display:grid;gap:2px;text-decoration:none;color:inherit;padding:14px 0;border-top:1px solid var(--line)}
.res:first-child{border-top:0}
.res b{font-weight:500}
/* worksheet */
.wq{display:grid;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.wq:first-of-type{border-top:0}
.wq .p{font-weight:500}
.opt{text-align:left;border:0;border-radius:14px;background:var(--sunk);padding:12px 14px;width:100%}
.opt.right{background:var(--good);color:#fff}.opt.wrong{background:var(--bad);color:#fff}
.grid{overflow-x:auto}.grid table{border-collapse:collapse;min-width:100%}
.grid th{font-size:12.5px;font-weight:600;text-align:left;padding:8px;background:var(--sunk)}
.grid td{border:1px solid var(--line);padding:0;min-width:110px}
.grid td input{width:100%;border:0;background:transparent;padding:10px 8px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.token{border:0;border-radius:999px;background:var(--sunk);padding:7px 14px;font-size:14px}
.token.sel{background:var(--marigold);color:#2A1700}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.bucket{border:1.5px dashed var(--line);border-radius:16px;padding:10px;min-height:84px;display:flex;flex-wrap:wrap;gap:6px;align-content:start;background:transparent;text-align:left}
.bucket b{width:100%;font-size:13px;font-weight:600}
.pad{width:100%;height:220px;border-radius:16px;background:var(--sunk);touch-action:none;display:block}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mitem{border:0;border-radius:14px;padding:10px 12px;background:var(--sunk);text-align:left;font-size:14px}
.mitem.sel{background:var(--marigold);color:#2A1700}.mitem.paired{background:color-mix(in srgb,var(--good) 20%,var(--surface))}
.bar{height:8px;border-radius:9px;background:var(--sunk);overflow:hidden}.bar span{display:block;height:100%;background:var(--c,var(--good));border-radius:9px;transition:width .4s}
/* games */
.wgrid{display:grid;gap:6px;justify-content:center}
.wrow{display:grid;grid-template-columns:repeat(5,52px);gap:6px}
.wt{height:52px;border-radius:12px;display:grid;place-items:center;font:600 24px var(--display);background:var(--sunk)}
.wt.f{box-shadow:inset 0 0 0 2px var(--muted);background:var(--surface)}
.wt.hit{background:var(--leaf);color:#fff}.wt.near{background:var(--marigold);color:#2A1700}.wt.miss{background:var(--line);color:var(--muted)}
.wt.hit,.wt.near,.wt.miss{animation:flip .45s both}
@keyframes flip{from{transform:rotateX(90deg)}}
.kb{display:grid;gap:6px;justify-items:center}.kb div{display:flex;gap:5px}
.kb button{min-width:31px;height:48px;border:0;border-radius:10px;background:var(--sunk);font-weight:600;font-size:14px;padding:0 6px}
.kb button.hit{background:var(--leaf);color:#fff}.kb button.near{background:var(--marigold);color:#2A1700}.kb button.miss{opacity:.35}
.kb button.w{min-width:60px;font-size:12.5px}
.tfq{border-radius:var(--r-lg);padding:28px 22px;background:var(--night);color:var(--chalk);font:500 21px/1.35 var(--display);text-align:center;min-height:150px;display:grid;place-items:center}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow .btn{height:56px;font-size:17px}
.btn.yes{background:var(--leaf);color:#fff}.btn.no{background:var(--coral);color:#fff}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:28px;height:6px;border-radius:9px;background:var(--line)}.dots i.on{background:var(--marigold)}.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}
.score{font:700 56px var(--display);text-align:center;color:var(--marigold);line-height:1}
.oddgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oddgrid button{height:84px;border:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);font:600 17px var(--display)}
.oddgrid button.right{background:var(--good);color:#fff}.oddgrid button.wrong{background:var(--bad);color:#fff}
/* week */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:0;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:8px 0 10px;display:grid;justify-items:center;gap:2px;font-size:11.5px;color:var(--muted)}
.day b{font:600 18px var(--display);color:var(--ink)}
.day .pips{display:flex;gap:3px;height:6px}.day .pips i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.day[aria-pressed="true"]{background:var(--night);color:#C9CBEA}.day[aria-pressed="true"] b{color:var(--chalk)}
.day.today b{color:var(--marigold)}
.cal{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.cal .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:11px;color:var(--muted);padding:2px 0 0 10px}
.cal .lanes{position:absolute;left:58px;right:10px;top:0;bottom:0}
.blk{position:absolute;border-radius:10px;padding:3px 8px;font-size:12px;font-weight:500;line-height:1.3;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;background:color-mix(in srgb,var(--c) 20%,var(--surface));border-left:3px solid var(--c);color:var(--ink)}
.blk.ok{opacity:.55}
.calhead{display:grid;grid-template-columns:58px 1fr 1fr;padding-right:10px;font-size:13px;font-weight:600;text-align:center;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:50%;border:0;background:var(--sunk);font-size:18px}
.dpick{display:flex;gap:4px;flex-wrap:wrap}
.dpick button{width:42px;height:34px;border-radius:10px;border:0;background:var(--sunk);font-size:12.5px;font-weight:500}
.dpick button[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff}
.field{display:grid;gap:6px}.field label,.field>span{font-size:13.5px;font-weight:500;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
/* library & journey */
.unit{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.unit:first-child{border-top:0}
.unit .no{font:600 15px var(--display);width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c)}
.unit b{font-weight:500}
.pill{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.learning{background:color-mix(in srgb,var(--marigold) 22%,var(--surface));color:color-mix(in srgb,var(--marigold) 60%,var(--ink))}
.pill.completed{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
.pill.mastered{background:color-mix(in srgb,var(--plum) 18%,var(--surface));color:var(--plum)}
.ring{width:84px;height:84px}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:grid;justify-items:center;gap:6px;text-align:center}
.stat{font:600 30px var(--display)}
.diary{display:grid;gap:0}
.dline{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.dline:first-child{border-top:0}
/* onboarding */
.ob{min-height:100%;display:grid;align-content:start;gap:22px;padding-block:28px 40px;max-width:560px;margin:0 auto}
.ob h1{font-size:clamp(28px,7vw,40px)}
.obbar{display:flex;gap:6px}.obbar i{flex:1;height:5px;border-radius:9px;background:var(--line)}.obbar i.on{background:var(--marigold)}
.choices{display:grid;gap:10px}
.choice{display:grid;gap:2px;text-align:left;border:0;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);padding:16px 18px}
.choice b{font:600 16px var(--display)}
.choice span{font-size:13.5px;color:var(--muted)}
.choice[aria-pressed="true"]{box-shadow:inset 0 0 0 2.5px var(--marigold),var(--shadow)}
.ages{display:flex;gap:8px}
.ages button{flex:1;height:60px;border-radius:18px;border:0;background:var(--surface);box-shadow:var(--shadow);font:600 20px var(--display)}
.ages button[aria-pressed="true"]{background:var(--marigold);color:#2A1700}
.toggle{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
.toggle input{width:24px;height:24px;accent-color:var(--marigold);flex:none}
/* misc */
dialog.mini{border:0;border-radius:var(--r-lg);background:var(--surface);color:var(--ink);padding:22px;width:min(520px,calc(100% - 24px));max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
dialog.mini::backdrop{background:rgba(10,12,40,.45)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:500;font-size:14.5px;white-space:nowrap;animation:rise .25s;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:79}
.note{font-size:13.5px;color:var(--muted);padding:12px 14px;border-radius:14px;background:var(--sunk)}
@media (max-width:400px){.wrow{grid-template-columns:repeat(5,46px)}.wt{height:46px;font-size:21px}.kb button{min-width:27px;padding:0 4px}.kb button.w{min-width:50px}.kolam{width:96px;height:96px}.ag{grid-template-columns:54px 1fr auto;padding-inline:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
const DATA = /*DATA*/;
const SUBJ = DATA.subjects, SUBJ_KEYS = Object.keys(SUBJ);
const BOARDS = {ncert:"NCERT / CBSE",cambridge:"Cambridge Primary",nios:"NIOS (Open Basic Education)"};
const STATUS = {none:"Not started",learning:"Learning",completed:"Completed",mastered:"Mastered"};
const DAYN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DEF_DAYS={math:[1,2,3,4,5],eng:[1,2,4,5],hin:[2,4],sci:[1,3,5]};
const DEF_HPD={math:1,eng:0.75,hin:0.5,sci:0.75};
const DEF_DAY={prepAt:"07:30",start:"09:30",brk:15,lunch:"13:00",lunchMin:45,eveAt:"20:30"};
const SCOL={math:"var(--teal)",eng:"var(--grape)",hin:"var(--tomato)",sci:"var(--leaf)"};
const PRESET_EXP={A1:["Lotus seeds (Kamali): change water","Alum crystal (Fitkari): check growth","World in a Jar: look for droplets","Bread mould bag: look, never open"],A5:["Moong sprouts: light vs dark"],B5:["Moon diary: draw tonight's Moon"],B10:["Bury test: dig up after 3 weeks"]};
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=iso(new Date());const dayNo=Math.floor(parse(today)/864e5);
const fmt=s=>parse(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const monday=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fh=h=>(Math.round(h*4)/4).toString();
const mins=h=>{const m=Math.round(h*60);return m>=60?`${fh(m/60)} h`:`${m} min`};
const fresh=()=>({setup:false,child:"",age:6,board:"ncert",plus:true,subjects:["math","eng","hin","sci"],levels:{math:1,eng:1,hin:1,sci:1},start:monday(),days:DEF_DAYS,hpd:DEF_HPD,progress:{},log:[],exps:[],skips:{},hrs:{},games:{},steps:{},tasks:{},ans:{},events:[],prep:{},tl:{},day:DEF_DAY,hideHow:false,updatedAt:0});
let S=fresh(),store=null,saving=Promise.resolve(),saveTimer=null,syncMode="device",tab="today",ob=null;
const ui={view:{},ctab:{},qi:{},wsec:{},game:"word",jokes:{},more:{},sheet:null,back:null,sel:{},week:0,wday:null,wview:"lanes",lsub:null,timer:null};

/* ---------- sound: a tiny synth; the browser only allows it after a tap ---------- */
let AC=null,soundOn=true;try{soundOn=localStorage.getItem("dk-sound")!=="off"}catch(e){}
function tone(f,t0,d,type="sine",g=.12){const o=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const SFX={tap:()=>tone(660,0,.07,"triangle",.08),tick:()=>{tone(784,0,.08);tone(1046,.07,.12)},ok:()=>{tone(523,0,.1);tone(659,.09,.1);tone(784,.18,.18)},no:()=>{tone(220,0,.18,"square",.05);tone(180,.12,.2,"square",.05)},
  flip:()=>{tone(400,0,.06,"triangle",.06);tone(600,.05,.08,"triangle",.06)},win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,i*.08,.22,"triangle",.1)),key:()=>tone(900,0,.03,"square",.03)};
function sfx(k){if(!soundOn||!SFX[k])return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();SFX[k]()}catch(e){}}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=document.createElement("canvas");c.className="confetti";c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext("2d");
  const cols=["#F2603F","#FFB21E","#38A862","#3E86F5","#8C5CF0","#F06BA8"];const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*12,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.random()*6|0],a:Math.random()*6}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++n<80)requestAnimationFrame(f);else c.remove()})()}
function toast(m){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- persistence: one private document per viewer; the newer copy wins ---------- */
async function boot(){
  try{const ls=localStorage.getItem("dk-state-v2");if(ls)S={...fresh(),...JSON.parse(ls)}}catch(e){}
  render();
  try{const [db,user]=await Promise.all([window.claude?.use?.("db"),window.claude?.use?.("user")]);const id=db&&user?await user.id():null;
    if(db&&id){store=db.doc("data/users/"+id+"/planner");const snap=await store.get();const remote=snap.exists?snap.data():null;
      if(remote&&remote.setup!==undefined&&(remote.updatedAt||0)>(S.updatedAt||0)){S={...fresh(),...remote}}else if(S.setup){await store.set(JSON.parse(JSON.stringify(S)))}
      syncMode="account";render()}}catch(e){store=null}
}
function save(){try{localStorage.setItem("dk-state-v2",JSON.stringify(S))}catch(e){}
  if(!store)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{const body=JSON.parse(JSON.stringify(S));saving=saving.then(()=>store.set(body)).catch(()=>{syncMode="device"})},700)}
const commit=()=>{S.updatedAt=Date.now();save();render()};

/* ---------- syllabus collation ---------- */
const boardsOn=()=>S.board==="combined"?["ncert","cambridge","nios"]:S.board==="none"?[]:[S.board];
function dkUnits(subj,lvl){if(!S.plus||subj!=="sci"||lvl!==1)return [];return DATA.topics.map(t=>({k:"dk|"+t.id,board:"dk",subj:"sci",level:1,book:"DeepKids Plus · Science Level 1",n:t.id,title:t.name,dk:[],topic:t}))}
function collateAt(subj,lvl){return {board:DATA.items.filter(i=>i.subj===subj&&i.level===lvl&&boardsOn().includes(i.board)),dk:dkUnits(subj,lvl)}}
const collate=s=>collateAt(s,S.levels[s]);
function notesFor(subj,lvl){const n=[];boardsOn().forEach(b=>{const x=b==="ncert"?DATA.notes.ncert[subj+"|"+lvl]:DATA.notes[b]?.[subj];if(x)n.push(BOARDS[b]+": "+x)});
  if(S.plus&&subj==="sci"&&lvl!==1)n.push("DeepKids Plus Science for Level "+lvl+" is being written. Level 1 is ready.");if(S.plus&&subj!=="sci")n.push("DeepKids Plus "+SUBJ[subj]+" is being written.");return n}
function plannedAt(s,l){const c=collateAt(s,l);if(c.dk.length)return c.dk;for(const b of boardsOn()){const u=c.board.filter(i=>i.board===b);if(u.length)return u}return []}
function plannedUnits(s){const o=[];for(let l=S.levels[s];l<=5;l++)o.push(...plannedAt(s,l));return o}
const everyUnit=()=>S.subjects.flatMap(s=>[1,2,3,4,5].flatMap(l=>{const c=collateAt(s,l);return [...c.dk,...c.board]}));
const unitBy=k=>everyUnit().find(u=>u.k===k);
const st=k=>S.progress[k]?.status||"none";const done=k=>S.progress[k]?.sessions||0;
const rank={none:0,learning:1,completed:2,mastered:3};
function coverage(u){if(u.board!=="dk"&&S.plus&&u.dk.length){const s=u.dk.map(id=>st("dk|"+id)),own=st(u.k);if(s.every(x=>rank[x]>=2))return rank[own]>2?own:"completed";if(s.some(x=>x!=="none")||own!=="none")return rank[own]>1?own:"learning";return own}return st(u.k)}
const daysOf=s=>(S.days[s]||DEF_DAYS[s]);const hpdOf=s=>(S.hpd&&S.hpd[s])||DEF_HPD[s];
const DEF_UNIT_H={ncert:{math:8,eng:5,hin:4,sci:8},cambridge:{math:30,eng:30,hin:30,sci:20},nios:{math:5,eng:5,hin:5,sci:5}};
const estHours=u=>u.c?.x?.hours?u.c.x.hours.reduce((a,h)=>a+h[1],0):u.board==="dk"?u.topic.weeks*2.25:DEF_UNIT_H[u.board][u.subj];
const hoursFor=u=>S.hrs[u.k]??estHours(u);
const sessionsFor=u=>Math.max(1,Math.ceil(hoursFor(u)/hpdOf(u.subj)-1e-9));
function schedule(subj,limitDays=420,fromTomorrow=false){
  const q=[];plannedUnits(subj).forEach(u=>{if(rank[coverage(u)]>=2)return;const tot=sessionsFor(u);for(let i=Math.min(done(u.k),tot-1);i<tot;i++)q.push({u,n:i+1,tot})});
  const queue=[...q.filter(x=>coverage(x.u)==="learning"),...q.filter(x=>coverage(x.u)!=="learning")];
  const out=[];const days=daysOf(subj);let d=parse(S.start>today?S.start:today);const doneToday=S.log.some(l=>l.date===today&&l.subj===subj);
  for(let k=0;k<limitDays&&queue.length;k++){const s=iso(d);if(days.includes(d.getDay())&&!S.skips[s+"|"+subj]&&!(s===today&&(doneToday||fromTomorrow)))out.push({date:s,subj,...queue.shift()});d.setDate(d.getDate()+1)}
  return out}
const nextUp=s=>{const q=[];plannedUnits(s).forEach(u=>{if(rank[coverage(u)]>=2)return;const tot=sessionsFor(u);for(let i=Math.min(done(u.k),tot-1);i<tot;i++)q.push({u,n:i+1,tot})});return [...q.filter(x=>coverage(x.u)==="learning"),...q.filter(x=>coverage(x.u)!=="learning")][0]};
function logSession(u,kind){const p=S.progress[u.k]||{status:"none",sessions:0};p.sessions=(p.sessions||0)+1;if(p.status==="none")p.status="learning";if(p.sessions>=sessionsFor(u)&&p.status==="learning")p.status="completed";p.updated=today;S.progress[u.k]=p;
  S.log.unshift({date:today,key:u.k,subj:u.subj,title:u.title,kind});S.log=S.log.slice(0,400);
  if(u.board==="dk")(PRESET_EXP[u.n]||[]).forEach(t=>addExp(t,u.title))}
function addExp(title,topic){if(!S.exps.some(e=>e.title===title&&!e.closed))S.exps.push({id:Math.random().toString(36).slice(2,9),title,topic,start:today,checks:[],closed:false})}
const el=h=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content};
const chNo=u=>/^\d+$/.test(u.n)?"Ch "+u.n:"";
const lvlLabel=l=>{const x=DATA.levels[l];return `Level ${l} · Class ${x.cls} · age ${x.age}`};
const sticker=s=>`<span class="sticker ${s}">${STATUS[s]}</span>`;
/* ---------- day steps ---------- */
const HINT={math:"Use real things for every problem (coins, beans, rotis, a ruler) before writing anything down.",eng:"Read aloud together, collect new words in a notebook, and ask your child to retell it in their own words.",hin:"Read aloud in Hindi, collect new words with meanings, and ask your child to retell it in Hindi.",sci:"Look for the idea in your own home or street before reading about it."};
const KIND=n=>/^Read/.test(n)?["read","Read","📖"]:/^What to learn/.test(n)?["learn","Learn & think","💡"]:/^Worksheet/.test(n)?["ws","Worksheet","✏️"]:/^Experiment/.test(n)?["exp","Experiment","🧪"]:/^Activit/.test(n)?["act","Activity","🧭"]:/^Game/.test(n)?["game","Game","🎲"]:/^Project/.test(n)?["proj","Project","🛠️"]:["step","Step","⭐"];
const TASKOF={ws:"ws",exp:"exp0",act:"act0",game:"game",proj:"proj"};
function daySteps(u,n,tot){const cap=hpdOf(u.subj);
  if(u.c?.x?.hours){const days=[];let cur=[],left=cap;u.c.x.hours.forEach(([name,h])=>{let rem=h,part=1;while(rem>1e-9){const take=Math.min(rem,left);cur.push({name,take,part});rem-=take;left-=take;part++;if(left<1e-9){days.push(cur);cur=[];left=cap}}});if(cur.length)days.push(cur);

  const pt=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e))};c.onpointermove=e=>{if(d){x.lineTo(...pt(e));x.stroke()}};c.onpointerup=()=>d=false})}

/* ---------- jokes & games ---------- */
function wordGame(u){const x=u.c.x,word=x.words[dayNo%x.words.length],g=G(),won=g.g.includes(word),over=won||g.g.length>=6,keys={};
  g.g.forEach(w=>[...w].forEach((ch,i)=>{const c=ch===word[i]?"hit":word.includes(ch)?"near":"miss";if(keys[ch]!=="hit"&&!(keys[ch]==="near"&&c==="miss"))keys[ch]=c}));
  const rows=[...Array(6)].map((_,r)=>{const w=g.g[r]||(r===g.g.length&&!over?(g.cur||""):"");return `<div class="wrow">${[0,1,2,3,4].map(i=>{const ch=w[i]||"";let c=ch?"f":"";if(g.g[r])c=ch===word[i]?"hit":word.includes(ch)?"near":"miss";return `<span class="wt ${c}" style="animation-delay:${i*.07}s">${esc(ch)}</span>`}).join("")}</div>`}).join("");
  return `<p class="sm muted" style="text-align:center">A five-letter word from “${esc(u.title)}”. Green is the right place, yellow is in the word.</p><div class="wgrid">${rows}</div>${over?`<p style="text-align:center;font:600 18px var(--display)">${won?"You got it: ":"The word was "}${word}</p>`:`<div class="kb">${["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"].map((r,i)=>`<div>${i===2?`<button class="w" data-act="wk" data-key="ENTER">Enter</button>`:""}${[...r].map(c=>`<button class="${keys[c]||""}" data-act="wk" data-key="${c}">${c}</button>`).join("")}${i===2?`<button class="w" data-act="wk" data-key="DEL" aria-label="Delete">Del</button>`:""}</div>`).join("")}</div>`}`}
function tfGame(u){const g=G(),q=u.c.x.quiz,i=q.findIndex((_,k)=>g.tf[k]===undefined),right=k=>(g.tf[k]===1)===q[k][1],sc=q.filter((_,k)=>g.tf[k]!==undefined&&right(k)).length;
  const dots=`<div class="dots">${q.map((_,k)=>`<i class="${g.tf[k]===undefined?(k===i?"on":""):right(k)?"ok":"no"}"></i>`).join("")}</div>`;
  if(i<0)return `${dots}<div class="score">${sc}/${q.length}</div><div class="col">${q.map(x=>`<div class="card" style="padding:14px"><span class="eyebrow">${x[1]?"True":"False"}</span><b style="font-weight:500">${esc(x[0])}</b><span class="sm muted">${esc(x[2])}</span></div>`).join("")}</div>`;
  const p=i>0?q[i-1]:null;return `${dots}${p?`<p class="sm" style="text-align:center;color:${right(i-1)?"var(--good)":"var(--bad)"}">${right(i-1)?"Right.":"Not quite."} ${esc(p[2])}</p>`:`<p class="sm muted" style="text-align:center">Some of these sound true and aren't.</p>`}<div class="tfq">${esc(q[i][0])}</div><div class="tfrow"><button class="btn yes" data-act="tf" data-i="${i}" data-v="1">True</button><button class="btn no" data-act="tf" data-i="${i}" data-v="0">False</button></div>`}
function oddGame(u){const g=G(),o=u.c.x.odd[dayNo%u.c.x.odd.length];return `<p class="sm muted" style="text-align:center">Which one doesn't belong? There may be more than one good answer. Can you defend yours?</p><div class="oddgrid">${o[0].map(w=>`<button class="${g.odd?(w===o[1]?"right":w===g.odd?"wrong":""):""}" data-act="odd" data-w="${esc(w)}" ${g.odd?"disabled":""}>${esc(w)}</button>`).join("")}</div>${g.odd?`<p style="text-align:center">${g.odd===o[1]?"Yes. ":"We picked "+esc(o[1])+". "}${esc(o[2])}</p>`:""}`}
function gamesView(){const u=dailyUnit();document.getElementById("sheetTitle").textContent="Jokes and games";if(!u)return `<p class="note">Games come from the science chapter you're on. Add EVS / Science to see them.</p>`;
  const T={word:["Word of the Day",wordGame],tf:["True or False",tfGame],odd:["Odd One Out",oddGame]};
  return `<div class="hs">${u.c.x.jokes.map((j,i)=>{const [q,a]=splitJoke(j),k=today+i;return `<button class="joke" data-act="joke" data-j="${k}"><span class="eyebrow">Joke ${i+1}</span><span class="q">${esc(q)}</span>${ui.jokes[k]?`<span class="a">${esc(a)}</span>`:`<span class="tap">Tap for the answer</span>`}</button>`}).join("")}</div>
   <div class="seg">${Object.entries(T).map(([k,[n]])=>`<button aria-pressed="${ui.game===k}" data-act="gtab" data-g="${k}">${n}</button>`).join("")}</div><section class="col">${T[ui.game][1](u)}</section>
   <button class="btn ${S.tl[today+"|warm"]?"soft":"accent"}" data-act="tlcheck" data-id="warm" data-date="${today}">${S.tl[today+"|warm"]?"Warm-up done ✓":"Warm-up done"}</button>`}

function lanes(date){const items=dayPlan(date),d=D();if(!items.length)return `<p class="note">Nothing on the clock this day.</p>`;const t0=Math.floor((Math.min(hm(d.prepAt),...items.map(i=>i.at))-20)/60)*60,t1=Math.ceil((Math.max(...items.map(i=>i.at+i.dur))+20)/60)*60,ppm=1.2;
  const hrs=[];for(let h=t0;h<t1;h+=60)hrs.push(`<div class="hr" style="top:${(h-t0)*ppm}px">${clock(h).replace(":00","")}</div>`);

  return `<div class="calhead"><span></span><span>You</span><span>${esc(S.child||"Child")}</span></div><div class="cal" style="height:${(t1-t0)*ppm}px">${hrs.join("")}<div class="lanes">${items.map(b).join("")}</div></div><p class="xs muted">Full-width blocks are things you do together.</p>`}
function viewWeek(){const days=weekDays(),all=S.subjects.flatMap(s=>schedule(s));const by={};all.forEach(x=>(by[x.date]=by[x.date]||[]).push(x));const sel=days.includes(ui.wday)?ui.wday:days.includes(today)?today:days[0];

   <div class="days">${days.map(d=>`<button class="day ${d===today?"today":""}" aria-pressed="${d===sel}" data-act="wday" data-d="${d}">${DAYN[parse(d).getDay()]}<b>${parse(d).getDate()}</b><span class="pips">${(by[d]||[]).map(x=>`<i class="${SC(x.subj)}"></i>`).join("")}${eventsOn(d).length?`<i class="r-out"></i>`:""}</span></button>`).join("")}</div></section>
   <section class="sec"><div class="sech"><h3>${fmt(sel)}</h3><div class="seg" style="width:auto"><button aria-pressed="${ui.wview!=="list"}" data-act="wview" data-v="lanes">Calendar</button><button aria-pressed="${ui.wview==="list"}" data-act="wview" data-v="list">List</button></div></div>
   ${ui.wview==="list"?(()=>{const its=dayPlan(sel);return its.length?`<div class="agenda">${its.map(i=>i.kind==="brk"?agRow(i):`<div class="ag ${i.kind==="lesson"?SC(i.s):"r-"+i.who} ${i.done?"done":""}"><span class="t num">${clock(i.at)}</span><span class="m"><b>${esc(i.kind==="lesson"?SUBJ[i.s]+" · "+i.u.title:i.title)}</b><span>${ROLE[i.who]} · ${mins(i.dur/60)}</span></span>${i.kind==="lesson"?`<button class="btn xs soft" data-act="chapter" data-k="${i.u.k}">Open</button>`:"<span></span>"}</div>`).join("")}</div>`:`<p class="note">Nothing planned this day.</p>`})():lanes(sel)}</section>`;
  const evs=S.events||[];
  h+=`<section class="sec"><div class="sech"><h3>Classes and outings</h3><button class="link sm" data-act="addev">+ Add</button></div><div class="agenda">${evs.map(e=>`<div class="ag ${e.kind==="outing"?"r-out":"r-"+e.who}"><span class="t">${clock(hm(e.start))}</span><span class="m"><b>${esc(e.title)}</b><span>${e.rep==="weekly"?"Every "+e.days.map(d=>DAYN[d]).join(", "):fmt(e.date)} · until ${clock(hm(e.end))} · ${ROLE[e.kind==="outing"?"out":e.who]}${e.note?" · "+esc(e.note):""}</span></span><button class="iconbtn" style="width:34px;height:34px" data-act="delev" data-e="${e.id}" aria-label="Remove ${esc(e.title)}">${icon("close")}</button></div>`).join("")||`<p class="sm muted" style="padding:16px">Tuitions, swimming, art class, museum trips. Lessons move around them.</p>`}</div></section>`;

  if(ob.step===0)h+=`<div><span class="eyebrow">Welcome to DeepKids</span><h1 style="margin-top:8px">Who is learning?</h1></div><div class="field"><label for="obName">Child's name</label><input class="inp" id="obName" maxlength="40" value="${esc(d.child)}" placeholder="Aarav"></div><div class="field"><span>Age</span><div class="ages">${[6,7,8,9,10].map(a=>`<button type="button" aria-pressed="${d.age===a}" data-age="${a}">${a}</button>`).join("")}</div></div>`;
  if(ob.step===1)h+=`<h1>Which syllabus?</h1><div class="choices">${[["ncert","NCERT / CBSE","India's national textbooks"],["cambridge","Cambridge Primary","Stages 1–5"],["nios","NIOS","Open Basic Education"],["combined","Combined","All three boards, mapped together"],["none","Only DeepKids Plus","Our own big-question curriculum"]].map(([k,n,s])=>`<button type="button" class="choice" aria-pressed="${d.board===k}" data-b="${k}"><b>${n}</b><span>${s}</span></button>`).join("")}</div>${d.board!=="none"?`<label class="toggle"><input type="checkbox" id="obPlus" ${d.plus?"checked":""}><span><b style="font-weight:600">Add DeepKids Plus</b><br><span class="sm muted">Big-question topics beyond the textbook, with lessons, games and projects.</span></span></label>`:""}`;
  if(ob.step===2)h+=`<h1>Which subjects?</h1><div class="choices">${SUBJ_KEYS.map(k=>`<button type="button" class="choice" aria-pressed="${d.subjects.includes(k)}" data-s="${k}"><b>${SUBJ[k]}</b><span>${k==="hin"?"Not part of Cambridge":"Tap to include or leave out"}</span></button>`).join("")}</div>`;
  if(ob.step===3)h+=`<h1>Level and time</h1><p class="muted">A starting level, and roughly how long each subject gets on the days you do it.</p>${d.subjects.map(s=>`<div class="card ${SC(s)}"><div class="row" style="gap:8px"><span class="dotc"></span><b style="font-weight:600">${SUBJ[s]}</b></div><div class="fgrid"><select class="inp" id="obl-${s}" data-s="${s}" aria-label="${SUBJ[s]} level">${[1,2,3,4,5].map(l=>`<option value="${l}" ${d.levels[s]===l?"selected":""}>${lvlLabel(l)}</option>`).join("")}</select><select class="inp" id="obh-${s}" data-hpd="${s}" aria-label="${SUBJ[s]} hours a day">${[.25,.5,.75,1,1.5,2,3].map(v=>`<option value="${v}" ${(d.hpd||DEF_HPD)[s]===v?"selected":""}>${v} h a day</option>`).join("")}</select></div></div>`).join("")}`;
  if(ob.step===4){const keep=S;S={...S,...d};h+=`<h1>${esc(d.child||"Your child")}'s year</h1><div class="col">${d.subjects.map(s=>{const c=collate(s),books=[...new Set(c.board.map(u=>u.book))];return `<div class="card ${SC(s)}"><div class="row" style="gap:8px"><span class="dotc"></span><b style="font-weight:600">${SUBJ[s]}</b><span class="xs muted">${lvlLabel(d.levels[s])}</span></div>${books.map(b=>`<span class="sm">${esc(b)}: ${c.board.filter(u=>u.book===b).length} chapters</span>`).join("")}${c.dk.length?`<span class="sm">DeepKids Plus: ${c.dk.length} topics</span>`:""}${notesFor(s,d.levels[s]).map(n=>`<span class="xs muted">${esc(n)}</span>`).join("")}</div>`}).join("")}</div>`;S=keep}
  h+=`<div class="row" style="justify-content:space-between">${ob.step>0?`<button class="btn line" data-ob="back">Back</button>`:"<span></span>"}<button class="btn accent" data-ob="next">${ob.step===4?"Build my plan":"Continue"}${icon("next")}</button></div></div>`;return h}
function obNext(){const d=ob.d;if(ob.step===0){d.child=document.getElementById("obName").value.trim();SUBJ_KEYS.forEach(s=>d.levels[s]=Math.min(5,Math.max(1,d.age-5)))}if(ob.step===2&&!d.subjects.length){sfx("no");toast("Pick at least one subject");return}
  if(ob.step===4){Object.assign(S,d,{setup:true});ob=null;tab="today";commit();sfx("win");confetti();return}ob.step++;render();scrollTo(0,0)}

/* ---------- sheet + render ---------- */
const sheet=document.getElementById("sheet");
function openSheet(o){if(ui.sheet?.mode==="player"&&o.mode!=="player")ui.back=ui.sheet;else ui.back=null;ui.sheet=o;if(!sheet.open)sheet.showModal();renderSheet(true)}
function renderSheet(top){if(!ui.sheet)return;const b=document.getElementById("sheetBody"),y=sheet.scrollTop;_sess=null;
  const m=ui.sheet.mode,h=m==="player"?playerView():m==="chapter"?chapterView():m==="ws"?wsView():m==="prep"?prepView():m==="games"?gamesView():settingsView();
  document.getElementById("sheetClose").innerHTML=ui.back?icon("back"):icon("close");document.getElementById("sheetClose").setAttribute("aria-label",ui.back?"Back to the lesson":"Close");
  b.replaceChildren(el(h));sheet.scrollTop=top?0:y;requestAnimationFrame(initPads);if(m==="player")paintTimer()}
document.getElementById("sheetClose").onclick=()=>{sfx("tap");if(ui.back){ui.sheet=ui.back;ui.back=null;renderSheet(true)}else sheet.close()};
sheet.addEventListener("close",()=>{ui.sheet=null;ui.back=null;clearInterval(tick);render()});
const NAV=[["today","Today"],["week","Week"],["library","Library"],["journey","Journey"]];
function render(){_sess=null;const m=document.getElementById("main"),nav=document.getElementById("nav");
  if(!S.setup&&!ob)return startOnboarding(0);
  nav.hidden=!!ob;document.getElementById("me").hidden=!!ob;document.getElementById("snd").innerHTML=icon(soundOn?"sound":"mute");document.getElementById("snd").setAttribute("aria-label",soundOn?"Turn sound off":"Turn sound on");
  document.getElementById("me").textContent=(S.child||"D")[0].toUpperCase();
  document.getElementById("who").textContent=ob?"Setting up your year":(S.board==="none"?"DeepKids Plus":S.board==="combined"?"Combined boards":BOARDS[S.board])+" · Home learning";
  nav.innerHTML=NAV.map(([k,n])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':""}>${icon(k)}<span>${n}</span></button>`).join("");
  const sx=[...m.querySelectorAll(".hs")].map(x=>x.scrollLeft);
  m.replaceChildren(el(`<div class="wrap">${ob?viewOnboarding():{today:viewToday,week:viewWeek,library:viewLibrary,journey:viewJourney}[tab]()}</div>`));
  m.querySelectorAll(".hs").forEach((x,i)=>{if(sx[i])x.scrollLeft=sx[i]});
  if(ui.sheet&&sheet.open&&ui.sheet.mode!=="player")renderSheet();else if(ui.sheet&&sheet.open)renderSheet()}

/* ---------- events ---------- */
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(!b)return;tab=b.dataset.tab;sfx("tap");render();scrollTo(0,0)});
document.getElementById("snd").onclick=()=>{soundOn=!soundOn;try{localStorage.setItem("dk-sound",soundOn?"on":"off")}catch(e){}sfx("tick");render()};
document.getElementById("me").onclick=()=>{sfx("tap");openSheet({mode:"settings"})};
function playItem(it){openSheet({mode:"player",s:it.s,k:it.u.k,n:it.n,tot:it.tot,bonus:it.bonus,i:Math.max(0,stepState(it).findIndex(x=>!x.ok))});if(ui.sheet.i<0)ui.sheet.i=0}
function onAct(e){
  if(ob){const d=ob.d,t=e.target.closest("[data-ob],button[data-age],button[data-b],button.choice[data-s]");if(!t)return;sfx("tap");
    if(t.dataset.ob==="next")return obNext();if(t.dataset.ob==="back"){ob.step--;return render()}
    if(t.dataset.age){d.child=document.getElementById("obName").value;d.age=+t.dataset.age}
    if(t.dataset.b){d.board=t.dataset.b;if(d.board==="none")d.plus=true}
    if(t.dataset.s){const s=t.dataset.s;d.subjects=d.subjects.includes(s)?d.subjects.filter(x=>x!==s):[...d.subjects,s].sort((a,b)=>SUBJ_KEYS.indexOf(a)-SUBJ_KEYS.indexOf(b))}
    return render()}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,k=b.dataset.k;
  switch(a){
   case "play":{const it=findItem(b.dataset.id);if(it){sfx("flip");playItem(it)}break}
   case "pstep":{ui.sheet.i=Math.max(0,ui.sheet.i+(+b.dataset.d));sfx("tap");renderSheet(true);break}
   case "pdone":{const P=ui.sheet,key=(P.bonus?"x":"")+today+"|"+P.k+"|"+P.n,set=new Set(S.steps[key]||[]);if(!set.has(P.i)){set.add(P.i);S.steps[key]=[...set];sfx("tick")}else sfx("tap");P.i++;S.updatedAt=Date.now();save();renderSheet(true);break}
   case "timer":{sfx("tap");timerToggle();break}
   case "finish":{const P=ui.sheet,u=unitBy(P.k);if(!u)return;logSession(u,P.bonus?"more":"plan");ui.more[P.s]=false;sheet.close();sfx("win");confetti();toast(P.bonus?"Extra lesson done":"Lesson done. Well done!");commit();scrollTo({top:0,behavior:"smooth"});break}
   case "more":{const s=b.dataset.s;ui.more[s]=true;sfx("tick");_sess=null;const it=dayPlan(today).find(i=>i.kind==="lesson"&&i.s===s&&!i.done);render();if(it)playItem(it);break}
   case "less":{ui.more[b.dataset.s]=false;sfx("flip");render();break}
   case "skip":{S.skips[today+"|"+b.dataset.s]=true;sfx("flip");toast("Moved to the next lesson day");commit();break}
   case "free":{openPicker();break}
   case "chapter":{sfx("flip");if(b.dataset.t)ui.ctab[k]=b.dataset.t;openSheet({mode:"chapter",k});break}
   case "ctab":{ui.ctab[k]=b.dataset.t;sfx("tap");renderSheet(true);break}
   case "qi":{ui.qi[k]=Math.max(0,(ui.qi[k]||0)+(+b.dataset.d));sfx("flip");renderSheet(true);break}
   case "ws":{sfx("flip");openSheet({mode:"ws",k});break}
   case "wsec":{ui.wsec[k]=Math.max(0,(ui.wsec[k]||0)+(+b.dataset.d));sfx("flip");renderSheet(true);break}
   case "wsdone":{S.tasks[k]=S.tasks[k]||{};S.tasks[k].ws=S.tasks[k].ws||today;sfx("win");confetti();toast("Worksheet finished");commit();break}
   case "games":{sfx("flip");openSheet({mode:"games"});break}
   case "goto":{const t=document.getElementById(b.dataset.to);if(t)t.scrollIntoView({behavior:"smooth",block:"start"});break}
   case "task":{const id=b.dataset.id;S.tasks[k]=S.tasks[k]||{};if(S.tasks[k][id]){delete S.tasks[k][id];sfx("flip")}else{S.tasks[k][id]=today;sfx("ok")}commit();break}
   case "startexp":{addExp(b.dataset.title,b.dataset.topic);sfx("ok");toast("Added to Growing and ongoing");commit();break}
   case "status":{const p=S.progress[k]||{sessions:0};p.status=b.dataset.s;p.updated=today;S.progress[k]=p;sfx(b.dataset.s==="mastered"?"win":"tick");commit();break}
   case "logk":{const u=unitBy(k);if(u){logSession(u,"free");sfx("ok");toast("Logged for today");commit()}break}
   case "tlcheck":{const date=b.dataset.date,it=dayPlan(date).find(i=>i.id===b.dataset.id);if(!it)return;
     if(it.kind==="prep"){const all=it.prep.every(p=>S.prep[p.id]);it.prep.forEach(p=>{if(all)delete S.prep[p.id];else S.prep[p.id]=today});sfx(all?"flip":"ok")}
     else if(it.kind==="exps"){S.exps.filter(x=>!x.closed&&x.start<=date).forEach(x=>{if(!x.checks.includes(today))x.checks.push(today)});sfx("ok")}
     else if(it.kind==="lesson")return playItem(it);
     else{const key=date+"|"+it.id;if(S.tl[key])delete S.tl[key];else{S.tl[key]=1;sfx("ok")}}
     commit();break}
   case "tlopen":{const date=b.dataset.date,it=dayPlan(date).find(i=>i.id===b.dataset.id);if(!it)return;sfx("tap");
     if(it.kind==="prep")return openSheet({mode:"prep",date,when:it.id});
     if(it.kind==="lesson")return it.done?openSheet({mode:"chapter",k:it.u.k}):playItem(it);
     if(it.kind==="warm")return openSheet({mode:"games"});
     if(it.kind==="exps"){document.getElementById("exps")?.scrollIntoView({behavior:"smooth"});return}
     const key=date+"|"+it.id;if(S.tl[key])delete S.tl[key];else{S.tl[key]=1;sfx("ok")}commit();break}
   case "prep":{const id=b.dataset.id;if(S.prep[id])delete S.prep[id];else{S.prep[id]=today;sfx("tick")}commit();break}
   case "hidehow":{S.hideHow=true;commit();break}
   case "addev":{openEv();break}
   case "delev":{S.events=(S.events||[]).filter(x=>x.id!==b.dataset.e);sfx("flip");commit();break}
   case "wk2":{ui.week=(ui.week||0)+(+b.dataset.d);ui.wday=null;sfx("tap");render();break}
   case "wday":{ui.wday=b.dataset.d;sfx("tap");render();break}
   case "wview":{ui.wview=b.dataset.v;sfx("tap");render();break}
   case "lvl":{const s=b.dataset.s;S.levels[s]=Math.min(5,Math.max(1,S.levels[s]+(+b.dataset.d)));ui.view[s]=S.levels[s];sfx("tick");commit();break}
   case "day":{const s=b.dataset.s,d=+b.dataset.d,cur=new Set(daysOf(s));cur.has(d)?cur.delete(d):cur.add(d);if(cur.size){S.days={...S.days,[s]:[...cur].sort()};sfx("tap");commit()}break}
   case "lsub":{ui.lsub=b.dataset.s;sfx("tap");render();break}
   case "view":{ui.view[b.dataset.s]=+b.dataset.l;sfx("tap");render();break}
   case "setlvl":{S.levels[b.dataset.s]=+b.dataset.l;sfx("tick");commit();break}
   case "check":{const x=S.exps.find(x=>x.id===b.dataset.e);if(x&&!x.checks.includes(today)){x.checks.push(today);sfx("ok");commit()}break}
   case "close":{const x=S.exps.find(x=>x.id===b.dataset.e);if(x){x.closed=true;x.end=today;sfx("win");confetti();toast("Finished: "+x.title);commit()}break}
   case "addexp":{const v=document.getElementById("newExp").value.trim();if(v){addExp(v,"Our own experiment");sfx("ok");commit()}break}
   case "joke":{ui.jokes[b.dataset.j]=!ui.jokes[b.dataset.j];sfx(ui.jokes[b.dataset.j]?"ok":"flip");render();break}
   case "gtab":{ui.game=b.dataset.g;sfx("tap");renderSheet();break}
   case "wk":{const u=dailyUnit();if(!u)return;const word=u.c.x.words[dayNo%u.c.x.words.length],g=G();g.cur=g.cur||"";const key=b.dataset.key;if(g.g.includes(word)||g.g.length>=6)return;
     if(key==="DEL"){g.cur=g.cur.slice(0,-1);sfx("key")}else if(key==="ENTER"){if(g.cur.length===5){g.g.push(g.cur);const w=g.cur===word;g.cur="";sfx(w?"win":g.g.length>=6?"no":"flip");if(w)confetti();S.updatedAt=Date.now();save()}else{sfx("no");toast("Five letters, please")}}else if(g.cur.length<5){g.cur+=key;sfx("key")}renderSheet();break}
   case "tf":{const u=dailyUnit(),q=u.c.x.quiz[+b.dataset.i];G().tf[b.dataset.i]=+b.dataset.v;sfx((+b.dataset.v===1)===q[1]?"ok":"no");if(Object.keys(G().tf).length===u.c.x.quiz.length)setTimeout(()=>sfx("win"),300);commit();break}
   case "odd":{const u=dailyUnit(),o=u.c.x.odd[dayNo%u.c.x.odd.length],g=G();if(!g.odd){g.odd=b.dataset.w;sfx(g.odd===o[1]?"win":"no");if(g.odd===o[1])confetti();commit()}break}
   case "mcq":{setA(k,b.dataset.id,+b.dataset.o);sfx(+b.dataset.o===+b.dataset.a?"ok":"no");commit();break}
   case "mcqreset":{delete S.ans[k][b.dataset.id];sfx("flip");commit();break}
   case "checkfill":{const ans=JSON.parse(b.dataset.a),v=A(k,b.dataset.id)||[],n=s=>String(s||"").trim().toLowerCase();const good=ans.every((x,i)=>{const w=n(v[i]);return w&&(n(x).includes(w)||w.includes(n(x).split(/[ (]/)[0]))});sfx(good?"ok":"no");toast(good?"Looks right":"Have another look");break}
   case "showfill":{sfx("flip");toast(b.dataset.a);break}
   case "drew":{if(A(k,b.dataset.id))delete S.ans[k][b.dataset.id];else{setA(k,b.dataset.id,today);sfx("ok")}commit();break}
   case "tok":{const key=k+b.dataset.id;ui.sel[key]=ui.sel[key]===b.dataset.x?undefined:b.dataset.x;sfx("tap");renderSheet();break}
   case "bucket":{const sel=ui.sel[k+b.dataset.id];if(sel===undefined)return;const v={...(A(k,b.dataset.id)||{})};v[sel]=+b.dataset.c;setA(k,b.dataset.id,v);ui.sel[k+b.dataset.id]=undefined;sfx("tick");commit();break}
   case "untok":{const v={...(A(k,b.dataset.id)||{})};delete v[b.dataset.x];setA(k,b.dataset.id,v);sfx("flip");commit();break}
   case "mleft":{ui.sel[k+b.dataset.id]=b.dataset.x;sfx("tap");renderSheet();break}
   case "mright":{const l=ui.sel[k+b.dataset.id];if(!l){sfx("no");toast("Tap a word on the left first");return}const v={...(A(k,b.dataset.id)||{})};Object.keys(v).forEach(x=>{if(v[x]===b.dataset.x)delete v[x]});v[l]=b.dataset.x;setA(k,b.dataset.id,v);ui.sel[k+b.dataset.id]=undefined;const [si,ii]=b.dataset.id.split("-").map(Number),it=unitBy(k).c.x.wsd[si][1][ii];sfx(it.pairs.some(p=>p[0]===l&&p[1]===b.dataset.x)?"ok":"tick");commit();break}
   case "mreset":{setA(k,b.dataset.id,{});sfx("flip");commit();break}
   case "clearpad":{const c=document.querySelector(`canvas[data-pad="${CSS.escape(b.dataset.pad)}"]`);if(c)c.getContext("2d").clearRect(0,0,c.width,c.height);sfx("flip");break}
   case "saveset":{S.child=document.getElementById("sName").value.trim();const v=document.getElementById("sStart").value;if(v)S.start=v;sfx("ok");toast("Saved");commit();break}
   case "redo":{sheet.close();startOnboarding(1);break}
  }}
document.getElementById("main").addEventListener("click",onAct);
document.getElementById("sheetBody").addEventListener("click",onAct);
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset.ans)return;const [k,id,sub]=t.dataset.ans.split("|");if(sub===undefined)setA(k,id,t.value);else if(sub.includes(".")){const v={...(A(k,id)||{})};v[sub]=t.value;setA(k,id,v)}else{const v=[...(A(k,id)||[])];v[+sub]=t.value;setA(k,id,v)}S.updatedAt=Date.now();save()});
document.getElementById("main").addEventListener("change",e=>{const t=e.target;
  if(t.dataset.dayset){S.day={...D(),[t.dataset.dayset]:t.type==="time"?t.value:+t.value};sfx("tap");commit();return}
  if(t.matches("select[data-hpd]")){const s=t.dataset.hpd,v=+t.value;sfx("tap");if(ob)ob.d.hpd={...(ob.d.hpd||DEF_HPD),[s]:v};else{S.hpd={...(S.hpd||DEF_HPD),[s]:v};commit()}return}
  if(ob&&t.matches("#obPlus")){ob.d.plus=t.checked;sfx("tap");return}if(ob&&t.matches("select[data-s]")){ob.d.levels[t.dataset.s]=+t.value;sfx("tap")}});
/* event dialog */
const evd=document.getElementById("evd");let evRep="once";
document.getElementById("eDays").innerHTML=[1,2,3,4,5,6,0].map(d=>`<button type="button" data-d="${d}" aria-pressed="false">${DAYN[d]}</button>`).join("");
function openEv(){evForm.reset();eDate.value=ui.wday||today;evRep="once";syncEv();eErr.hidden=true;eDays.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));sfx("tap");evd.showModal()}
function syncEv(){eRep.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.rep===evRep));eDateF.hidden=evRep!=="once";eDaysF.hidden=evRep==="once"}
eRep.addEventListener("click",e=>{const x=e.target.closest("button");if(!x)return;evRep=x.dataset.rep;syncEv();sfx("tap")});
eDays.addEventListener("click",e=>{const x=e.target.closest("button");if(!x)return;x.setAttribute("aria-pressed",x.getAttribute("aria-pressed")!=="true");sfx("tap")});
evForm.addEventListener("submit",e=>{if(!e.submitter||e.submitter.value!=="save")return;const days=[...eDays.querySelectorAll('[aria-pressed="true"]')].map(x=>+x.dataset.d);
  const err=!eTitle.value.trim()?"Give it a name.":evRep==="weekly"&&!days.length?"Pick at least one day.":evRep==="once"&&!eDate.value?"Pick a date.":hm(eEnd.value)<=hm(eStart.value)?"The end time must be after the start.":"";
  if(err){e.preventDefault();eErr.textContent=err;eErr.hidden=false;sfx("no");return}
  S.events=[...(S.events||[]),{id:Math.random().toString(36).slice(2,9),title:eTitle.value.trim(),kind:eKind.value,who:eKind.value==="outing"&&eWho.value==="kid"?"both":eWho.value,start:eStart.value,end:eEnd.value,rep:evRep,date:evRep==="once"?eDate.value:null,days:evRep==="weekly"?days:[],from:today,note:eNote.value.trim()}];sfx("ok");toast("Added to the day");commit()});
const pick=document.getElementById("pick");
function openPicker(){document.getElementById("pickList").replaceChildren(el(everyUnit().map(u=>`<button class="unit ${SC(u.subj)}" style="grid-template-columns:44px 1fr" data-k="${u.k}"><span class="no">${/^\d+$/.test(u.n)?u.n:esc(u.n)}</span><span><b>${esc(u.title)}</b><br><span class="xs muted">${SUBJ[u.subj]} · Level ${u.level}</span></span></button>`).join("")));sfx("tap");pick.showModal()}
document.getElementById("pickList").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const u=unitBy(b.dataset.k);if(u){logSession(u,"free");pick.close();sfx("ok");toast("Logged");commit()}});
document.getElementById("pickClose").onclick=()=>pick.close();
boot();
</script>
