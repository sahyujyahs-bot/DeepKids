<title>DeepKids Home Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Garden of the day: a little illustrated garden blooms as things get done; blob friends stand for subjects and people;
   bright crayon colours on warm paper, chunky pressable buttons, coloured timetable cards, a winding path for the syllabus. */
:root{
  --bg:#FFF6EC; --surface:#FFFFFF; --sunk:#F7ECDF; --ink:#2B2340; --muted:#7C7088; --line:#F0E2D2;
  --sun:#FFD65C; --tang:#FD8326; --gum:#FF8BB4; --peri:#8C93C7; --pist:#B6D693; --forest:#53A373; --aqua:#4CC9C0; --sky:#6DB4F2;
  --tangD:#D9661A; --forestD:#3F8559; --skyA:#CFEFE0; --skyB:#EAF7D9; --hill1:#B6D693; --hill2:#8CC57A; --soil:#E9C9A0;
  --onbright:#2B2340; --good:#3FAE6A; --bad:#F2575A;
  --display:"Fredoka","Baloo 2",system-ui,sans-serif; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-xl:30px; --r-lg:24px; --r:18px;
  --lift:0 2px 0 rgba(43,35,64,.05),0 10px 24px -14px rgba(43,35,64,.25);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1730; --surface:#28213F; --sunk:#332A4F; --ink:#F6F0FF; --muted:#B8ADCB; --line:#3B3258;
  --sun:#FFD65C; --tang:#FF9445; --gum:#FF95BC; --peri:#9EA5DB; --pist:#A9CF84; --forest:#62B884; --aqua:#56D4CB; --sky:#7DBDF6;
  --tangD:#C65A12; --forestD:#3D7F57; --skyA:#2C3D55; --skyB:#2E3A3A; --hill1:#4E6E46; --hill2:#3F5F3C; --soil:#5A4636;
  --lift:0 2px 0 rgba(0,0,0,.25),0 12px 28px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1730; --surface:#28213F; --sunk:#332A4F; --ink:#F6F0FF; --muted:#B8ADCB; --line:#3B3258;
  --sun:#FFD65C; --tang:#FF9445; --gum:#FF95BC; --peri:#9EA5DB; --pist:#A9CF84; --forest:#62B884; --aqua:#56D4CB; --sky:#7DBDF6;
  --tangD:#C65A12; --forestD:#3D7F57; --skyA:#2C3D55; --skyB:#2E3A3A; --hill1:#4E6E46; --hill2:#3F5F3C; --soil:#5A4636;
  --lift:0 2px 0 rgba(0,0,0,.25),0 12px 28px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:600 16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:10px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.12;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}.sm{font-size:14px}.xs{font-size:12.5px}
.eyebrow{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:grid;gap:12px}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.s-math{--c:var(--aqua)}.s-eng{--c:var(--gum)}.s-hin{--c:var(--tang)}.s-sci{--c:var(--forest)}
.r-you{--c:var(--peri)}.r-both{--c:var(--sun)}.r-kid{--c:var(--sky)}.r-out{--c:var(--gum)}.r-free{--c:var(--line)}
.tint{background:color-mix(in srgb,var(--c) 22%,var(--surface))}
/* chunky pressable buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 24px;border-radius:18px;border:0;background:var(--tang);color:#fff;font:600 17px var(--display);box-shadow:0 4px 0 var(--tangD);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tangD)}
.btn.green{background:var(--forest);box-shadow:0 4px 0 var(--forestD)}.btn.green:active{box-shadow:0 1px 0 var(--forestD)}
.btn.soft{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line),inset 0 0 0 2px var(--line)}.btn.soft:active{box-shadow:0 1px 0 var(--line),inset 0 0 0 2px var(--line)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 18%,transparent)}
.btn.sm{height:40px;padding:0 16px;font-size:15px;border-radius:14px}
.btn.xs{height:34px;padding:0 12px;font-size:14px;border-radius:12px;box-shadow:0 3px 0 var(--tangD)}.btn.xs.soft{box-shadow:0 3px 0 var(--line),inset 0 0 0 2px var(--line)}
.btn.wide{flex:1}
.btn:disabled{opacity:.4;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:15px;border:0;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink);box-shadow:var(--lift)}
.link{background:none;border:0;padding:0;color:var(--tang);font:600 15px var(--display)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;background:var(--sunk);font-size:13px;font-weight:700;white-space:nowrap}
.dotc{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));flex:none}
/* Finch-style check */
.ck,.ckb{width:46px;height:46px;flex:none;border-radius:15px;border:0;background:var(--surface);box-shadow:0 3px 0 var(--line),inset 0 0 0 2px var(--line);display:grid;place-items:center;color:color-mix(in srgb,var(--ink) 18%,transparent)}
.ck .ico,.ckb .ico{width:24px;height:24px;stroke-width:3}
.done .ck,.done .ckb,.ck.on{background:var(--good);color:#fff;box-shadow:0 3px 0 #2D8752;animation:pop .3s}
@keyframes pop{50%{transform:scale(1.15)}}
/* header & nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.hello{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.hello .bl{width:46px;height:46px;flex:none}
.hello b{font:600 19px var(--display);display:block;line-height:1.1}
.hello span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.nav{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:7px;border-radius:26px;background:var(--surface);box-shadow:0 14px 34px -12px rgba(43,35,64,.45);width:min(440px,calc(100% - 32px))}
nav.nav button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:20px;height:54px;display:grid;justify-items:center;align-content:center;gap:1px;font:600 12.5px var(--display)}
nav.nav button .ico{width:23px;height:23px}
nav.nav button[aria-current="page"]{background:var(--sun);color:#2B2340}
main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
/* garden hero */
.garden{position:relative;margin-top:6px;border-radius:var(--r-xl);overflow:hidden;background:linear-gradient(180deg,var(--skyA),var(--skyB));}
.garden svg.scene{display:block;width:100%;height:210px}
.garden .over{position:absolute;left:18px;right:84px;top:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.garden .over h1{font-size:clamp(24px,6vw,30px);color:var(--ink)}
.garden .over p{font-weight:700;color:var(--muted);font-size:14px}
.plain{border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer}
.garden .prog{position:relative;margin:-4px 12px 12px;border-radius:20px;background:color-mix(in srgb,var(--surface) 90%,transparent);padding:10px 14px;display:grid;gap:6px}
.track{position:relative;height:14px;border-radius:9px;background:var(--sunk)}
.track span{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--forest);transition:width .5s}
.track .rider{position:absolute;top:50%;width:30px;height:30px;transform:translate(-50%,-56%);transition:left .5s}
.bloom{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.3,1.5,.5,1) both}
@keyframes grow{from{transform:scale(.2)}}
.bob{animation:bob 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(3deg)}}
/* up next */
.focus{margin-top:16px;border-radius:var(--r-xl);padding:20px;display:grid;gap:12px;position:relative;background:color-mix(in srgb,var(--c) 26%,var(--surface));box-shadow:var(--lift)}
.focus .mascot{position:absolute;right:14px;top:-22px;width:78px;height:78px}
.focus .eyebrow{color:color-mix(in srgb,var(--c) 45%,var(--ink))}
.focus h2{font-size:clamp(23px,5.6vw,29px);padding-right:70px}
.focus .who{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
.steps-mini{display:flex;flex-wrap:wrap;gap:6px}
.steps-mini span{font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--surface)}
.steps-mini span.ok{background:var(--good);color:#fff}
.donecard{margin-top:16px;border-radius:var(--r-xl);padding:20px;background:var(--surface);box-shadow:var(--lift);display:grid;gap:12px;position:relative;overflow:hidden}
.donecard h2{font-size:25px;padding-right:80px}
.donecard .mascot{position:absolute;right:12px;top:12px;width:78px;height:78px}
.offer{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.offer .bl{width:40px;height:40px}
/* sections */
.sec{margin-top:28px;display:grid;gap:12px}
.sech{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sech h3{font-size:21px}
/* timetable */
.tt{display:grid;gap:10px}
.tr{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}
.tr .t{font:600 13px var(--display);color:var(--muted);text-align:right;line-height:1.1}
.tr .t small{display:block;font-size:11px}
.tcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:20px;border:0;width:100%;text-align:left;background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.tcard .ic{width:42px;height:42px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.r-both .tcard .ic,.tcard.r-both .ic{color:#2B2340}
.tcard .m{min-width:0;display:grid}
.tcard .m b{font:600 16.5px var(--display);overflow:hidden;text-overflow:ellipsis}
.tcard .m span{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr.done .tcard{background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
.tr.done .tcard .m b{color:var(--muted);text-decoration:line-through}
.tr.now .tcard{box-shadow:0 0 0 3px var(--c),var(--lift)}
.tr.brk .t{opacity:.7}.brkline{font-size:13px;color:var(--muted);font-weight:700;padding:4px 14px;border-radius:999px;border:2px dashed var(--line);justify-self:start}
/* stacked joke cards */
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 4px 14px;margin:0 -4px;scrollbar-width:none}
.hs>*{scroll-snap-align:center;flex:0 0 74%;max-width:300px}
.joke{border:0;border-radius:26px;padding:18px;text-align:left;display:grid;gap:10px;align-content:start;min-height:170px;color:#2B2340;box-shadow:var(--lift)}
.joke:nth-child(4n+1){background:var(--aqua);transform:rotate(-2.5deg)}.joke:nth-child(4n+2){background:var(--gum);transform:rotate(2deg)}.joke:nth-child(4n+3){background:var(--sun);transform:rotate(-1.5deg)}.joke:nth-child(4n){background:var(--pist);transform:rotate(2.5deg)}
.joke .q{font:600 19px/1.25 var(--display)}
.joke .a{font-size:16px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.9);animation:pop .3s}
.joke .tap{font-size:13px;font-weight:800;opacity:.75}
.joke .eyebrow{color:#2B2340;opacity:.7}
.expi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:20px;background:var(--surface);box-shadow:var(--lift)}
.daybadge{font:700 18px var(--display);width:52px;height:52px;border-radius:16px;background:var(--pist);color:#2B2340;display:grid;place-items:center;line-height:1;text-align:center}
.daybadge small{display:block;font:700 9.5px var(--body);letter-spacing:.06em}
.inp{width:100%;height:50px;padding:0 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700}
textarea.inp{height:auto;min-height:100px;padding:12px 14px;line-height:1.5;resize:vertical}
.howto{border-radius:var(--r-lg);padding:18px;display:grid;gap:10px;background:var(--surface);box-shadow:var(--lift)}
.howto ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14.5px}
/* sheet */
dialog.sheet{border:0;padding:0;margin:0;width:100%;max-width:100%;height:100%;max-height:100%;background:var(--bg);color:var(--ink);overscroll-behavior:contain}
dialog.sheet.colored{background:color-mix(in srgb,var(--c) 40%,var(--bg))}
dialog.sheet[open]{animation:up .3s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(30px);opacity:0}}
dialog.sheet::backdrop{background:rgba(30,20,50,.45)}
.shead{position:sticky;top:0;z-index:3;background:inherit}
.shead .wrap{display:flex;align-items:center;gap:12px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px}
.shead h3{font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbody{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.sbody>.wrap{display:grid;gap:16px}
/* player */
.ptrack{position:relative;height:18px;border-radius:12px;background:rgba(255,255,255,.75);margin:14px 18px 6px}
.ptrack span{position:absolute;inset:0 auto 0 0;border-radius:12px;background:var(--c);transition:width .4s}
.ptrack .rider{position:absolute;top:50%;width:40px;height:40px;transform:translate(-50%,-58%);transition:left .4s}
.stage{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--lift);padding:22px;display:grid;gap:16px}
.stage .kind{display:flex;align-items:center;gap:10px;font:600 15px var(--display);color:color-mix(in srgb,var(--c) 55%,var(--ink))}
.stage .kind .k{width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.stage h2{font-size:clamp(23px,5.8vw,30px)}
.stage .body{font-size:16.5px}.stage .body>*+*{margin-top:12px}
.stage ul{margin:0;padding-left:20px;display:grid;gap:8px}
.ask{border-radius:18px;padding:14px 16px;background:color-mix(in srgb,var(--peri) 22%,var(--surface))}
.ask .eyebrow{display:block;margin-bottom:4px;color:color-mix(in srgb,var(--peri) 50%,var(--ink))}
.timer{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:20px;background:var(--sunk)}
.timer svg{width:56px;height:56px}
.timer .tt2{font:600 24px var(--display)}
.tasks-inline{display:grid;gap:8px}
.tline{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px;border-radius:18px;background:var(--sunk);border:0;text-align:left;width:100%;font-weight:700}
.tline.done{background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.finish{text-align:center;justify-items:center;padding-block:28px}
.finish .stars{display:flex;gap:6px}
.finish h2{font-size:34px}
/* chapter */
.chero{position:relative;border-radius:var(--r-xl);padding:20px;background:var(--c);color:#2B2340;display:grid;gap:6px;overflow:hidden;min-height:170px}
.chero .mascot{position:absolute;right:-8px;bottom:-14px;width:130px;height:130px}
.chero .n{position:absolute;right:18px;top:10px;font:700 64px/1 var(--display);opacity:.25}
.chero h1{font-size:clamp(25px,6.4vw,33px);max-width:72%}
.chero p{font-size:14px;font-weight:700;max-width:68%;opacity:.85}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.seg button{flex:0 0 auto;border:0;background:var(--surface);border-radius:999px;height:40px;padding:0 16px;font:600 15px var(--display);white-space:nowrap;color:var(--muted);box-shadow:inset 0 0 0 2px var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--lift);padding:18px;display:grid;gap:12px}
.idea{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start}
.idea .k{font:700 17px var(--display);width:38px;height:38px;border-radius:13px;background:var(--c);color:#2B2340;display:grid;place-items:center}
.qcard{border-radius:var(--r-xl);padding:22px;background:var(--peri);color:#fff;display:grid;gap:10px;position:relative;overflow:hidden}
.qcard .eyebrow{color:rgba(255,255,255,.85)}
.qcard h2{font-size:clamp(23px,5.8vw,30px)}
.qcard p{color:rgba(255,255,255,.95);font-weight:600}
.voice{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.voice .bl{width:44px;height:44px}
.voice .say{padding:12px 14px;border-radius:6px 20px 20px 20px;background:var(--surface);box-shadow:var(--lift)}
.voice .say b{display:block;font:600 13px var(--display);letter-spacing:.04em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 55%,var(--ink));margin-bottom:2px}
.mission{border-radius:var(--r-lg);padding:16px;background:var(--pist);color:#2B2340;display:grid;gap:4px}
.mission b{font:600 15px var(--display)}
.oneness{border-radius:var(--r-lg);padding:20px;background:linear-gradient(135deg,var(--sun),var(--gum));color:#2B2340}
.oneness p{font:600 19px/1.4 var(--display);margin-top:6px}
.oneness .eyebrow{color:#2B2340;opacity:.7}
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px}
.taskrow{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;padding:14px 0;border-top:2px dashed var(--line)}
.taskrow:first-child{border-top:0}
.taskrow.done b{text-decoration:line-through;color:var(--muted)}
.taskrow .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.res{display:grid;gap:2px;text-decoration:none;color:inherit;padding:12px 0;border-top:2px dashed var(--line)}
.res:first-child{border-top:0}
/* worksheet */
.wq{display:grid;gap:10px;padding:16px 0;border-top:2px dashed var(--line)}
.wq:first-of-type{border-top:0}
.wq .p{font-weight:800}
.opt{text-align:left;border:0;border-radius:16px;background:var(--sunk);padding:12px 14px;width:100%;font-weight:700}
.opt.right{background:var(--good);color:#fff}.opt.wrong{background:var(--bad);color:#fff}
.grid{overflow-x:auto}.grid table{border-collapse:collapse;min-width:100%}
.grid th{font:600 13px var(--display);text-align:left;padding:8px;background:var(--sunk)}
.grid td{border:2px solid var(--line);padding:0;min-width:110px}
.grid td input{width:100%;border:0;background:transparent;padding:10px 8px;font-weight:700}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.token{border:0;border-radius:999px;background:var(--sunk);padding:8px 14px;font-weight:800;font-size:14px}
.token.sel{background:var(--sun);color:#2B2340;transform:rotate(-3deg)}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.bucket{border:2.5px dashed var(--line);border-radius:18px;padding:10px;min-height:86px;display:flex;flex-wrap:wrap;gap:6px;align-content:start;background:transparent;text-align:left}
.bucket b{width:100%;font:600 14px var(--display)}
.pad{width:100%;height:220px;border-radius:18px;background:var(--sunk);touch-action:none;display:block}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mitem{border:0;border-radius:16px;padding:10px 12px;background:var(--sunk);text-align:left;font-size:14px;font-weight:800}

<script>


const DATA = /*DATA*/;
const SUBJ = DATA.subjects, SUBJ_KEYS = Object.keys(SUBJ);
const BOARDS = {ncert:"NCERT / CBSE",cambridge:"Cambridge Primary",nios:"NIOS (Open Basic Education)"};
const STATUS = {none:"Not started",learning:"Learning",completed:"Completed",mastered:"Mastered"};
const DAYN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DEF_DAYS={math:[1,2,3,4,5],eng:[1,2,4,5],hin:[2,4],sci:[1,3,5]};
const DEF_HPD={math:1,eng:0.75,hin:0.5,sci:0.75};
const DEF_DAY={prepAt:"07:30",start:"09:30",brk:15,lunch:"13:00",lunchMin:45,eveAt:"20:30"};
const SCOL={math:"var(--teal)",eng:"var(--grape)",hin:"var(--tomato)",sci:"var(--leaf)"};
const PRESET_EXP={A1:["Lotus seeds (Kamali): change water","Alum crystal (Fitkari): check growth","World in a Jar: look for droplets","Bread mould bag: look, never open"],A5:["Moong sprouts: light vs dark"],B5:["Moon diary: draw tonight's Moon"],B10:["Bury test: dig up after 3 weeks"]};
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=iso(new Date());const dayNo=Math.floor(parse(today)/864e5);
const fmt=s=>parse(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const monday=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fh=h=>(Math.round(h*4)/4).toString();
const mins=h=>{const m=Math.round(h*60);return m>=60?`${fh(m/60)} h`:`${m} min`};
const fresh=()=>({setup:false,child:"",age:6,board:"ncert",plus:true,subjects:["math","eng","hin","sci"],levels:{math:1,eng:1,hin:1,sci:1},start:monday(),days:DEF_DAYS,hpd:DEF_HPD,progress:{},log:[],exps:[],skips:{},hrs:{},games:{},steps:{},tasks:{},ans:{},events:[],prep:{},tl:{},day:DEF_DAY,hideHow:false,updatedAt:0});
let S=fresh(),store=null,saving=Promise.resolve(),saveTimer=null,syncMode="device",tab="today",ob=null;
const ui={view:{},ctab:{},qi:{},wsec:{},game:"word",jokes:{},more:{},sheet:null,back:null,sel:{},week:0,wday:null,wview:"lanes",lsub:null,timer:null};

/* ---------- sound: a tiny synth; the browser only allows it after a tap ---------- */
let AC=null,soundOn=true;try{soundOn=localStorage.getItem("dk-sound")!=="off"}catch(e){}
function tone(f,t0,d,type="sine",g=.12){const o=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.01);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const SFX={tap:()=>tone(660,0,.07,"triangle",.08),tick:()=>{tone(784,0,.08);tone(1046,.07,.12)},ok:()=>{tone(523,0,.1);tone(659,.09,.1);tone(784,.18,.18)},no:()=>{tone(220,0,.18,"square",.05);tone(180,.12,.2,"square",.05)},
  flip:()=>{tone(400,0,.06,"triangle",.06);tone(600,.05,.08,"triangle",.06)},win:()=>[523,659,784,1046,1318].forEach((f,i)=>tone(f,i*.08,.22,"triangle",.1)),key:()=>tone(900,0,.03,"square",.03)};
function sfx(k){if(!soundOn||!SFX[k])return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();SFX[k]()}catch(e){}}
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const c=document.createElement("canvas");c.className="confetti";c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const x=c.getContext("2d");
  const cols=["#F2603F","#FFB21E","#38A862","#3E86F5","#8C5CF0","#F06BA8"];const P=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*12,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.random()*6|0],a:Math.random()*6}));
  let n=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++n<80)requestAnimationFrame(f);else c.remove()})()}
function toast(m){document.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- persistence: one private document per viewer; the newer copy wins ---------- */
async function boot(){
  try{const ls=localStorage.getItem("dk-state-v2");if(ls)S={...fresh(),...JSON.parse(ls)}}catch(e){}
  render();
  try{const [db,user]=await Promise.all([window.claude?.use?.("db"),window.claude?.use?.("user")]);const id=db&&user?await user.id():null;
    if(db&&id){store=db.doc("data/users/"+id+"/planner");const snap=await store.get();const remote=snap.exists?snap.data():null;
      if(remote&&remote.setup!==undefined&&(remote.updatedAt||0)>(S.updatedAt||0)){S={...fresh(),...remote}}else if(S.setup){await store.set(JSON.parse(JSON.stringify(S)))}
      syncMode="account";render()}}catch(e){store=null}
}
function save(){try{localStorage.setItem("dk-state-v2",JSON.stringify(S))}catch(e){}
  if(!store)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{const body=JSON.parse(JSON.stringify(S));saving=saving.then(()=>store.set(body)).catch(()=>{syncMode="device"})},700)}
const commit=()=>{S.updatedAt=Date.now();save();render()};

/* ---------- syllabus collation ---------- */
const boardsOn=()=>S.board==="combined"?["ncert","cambridge","nios"]:S.board==="none"?[]:[S.board];
function dkUnits(subj,lvl){if(!S.plus||subj!=="sci"||lvl!==1)return [];return DATA.topics.map(t=>({k:"dk|"+t.id,board:"dk",subj:"sci",level:1,book:"DeepKids Plus · Science Level 1",n:t.id,title:t.name,dk:[],topic:t}))}
function collateAt(subj,lvl){return {board:DATA.items.filter(i=>i.subj===subj&&i.level===lvl&&boardsOn().includes(i.board)),dk:dkUnits(subj,lvl)}}
const collate=s=>collateAt(s,S.levels[s]);
function notesFor(subj,lvl){const n=[];boardsOn().forEach(b=>{const x=b==="ncert"?DATA.notes.ncert[subj+"|"+lvl]:DATA.notes[b]?.[subj];if(x)n.push(BOARDS[b]+": "+x)});
  if(S.plus&&subj==="sci"&&lvl!==1)n.push("DeepKids Plus Science for Level "+lvl+" is being written. Level 1 is ready.");if(S.plus&&subj!=="sci")n.push("DeepKids Plus "+SUBJ[subj]+" is being written.");return n}
function plannedAt(s,l){const c=collateAt(s,l);if(c.dk.length)return c.dk;for(const b of boardsOn()){const u=c.board.filter(i=>i.board===b);if(u.length)return u}return []}
function plannedUnits(s){const o=[];for(let l=S.levels[s];l<=5;l++)o.push(...plannedAt(s,l));return o}
const everyUnit=()=>S.subjects.flatMap(s=>[1,2,3,4,5].flatMap(l=>{const c=collateAt(s,l);return [...c.dk,...c.board]}));
const unitBy=k=>everyUnit().find(u=>u.k===k);
const st=k=>S.progress[k]?.status||"none";const done=k=>S.progress[k]?.sessions||0;
const rank={none:0,learning:1,completed:2,mastered:3};
function coverage(u){if(u.board!=="dk"&&S.plus&&u.dk.length){const s=u.dk.map(id=>st("dk|"+id)),own=st(u.k);if(s.every(x=>rank[x]>=2))return rank[own]>2?own:"completed";if(s.some(x=>x!=="none")||own!=="none")return rank[own]>1?own:"learning";return own}return st(u.k)}
const daysOf=s=>(S.days[s]||DEF_DAYS[s]);const hpdOf=s=>(S.hpd&&S.hpd[s])||DEF_HPD[s];
const DEF_UNIT_H={ncert:{math:8,eng:5,hin:4,sci:8},cambridge:{math:30,eng:30,hin:30,sci:20},nios:{math:5,eng:5,hin:5,sci:5}};
const estHours=u=>u.c?.x?.hours?u.c.x.hours.reduce((a,h)=>a+h[1],0):u.board==="dk"?u.topic.weeks*2.25:DEF_UNIT_H[u.board][u.subj];
const hoursFor=u=>S.hrs[u.k]??estHours(u);
const sessionsFor=u=>Math.max(1,Math.ceil(hoursFor(u)/hpdOf(u.subj)-1e-9));
function schedule(subj,limitDays=420,fromTomorrow=false){
  const q=[];plannedUnits(subj).forEach(u=>{if(rank[coverage(u)]>=2)return;const tot=sessionsFor(u);for(let i=Math.min(done(u.k),tot-1);i<tot;i++)q.push({u,n:i+1,tot})});

function flower(x,y,col,i,bloomed,isNow){

function garden(items,now){const its=items.filter(i=>i.kind!=="brk"),n=its.length;let fl="",kidX=40;

   <path d="M0 150Q90 108 190 142T360 130V250H0Z" fill="var(--hill1)"/><path d="M-10 182Q100 152 210 176T370 168V250H-10Z" fill="var(--hill2)"/>

   ${units.map((u,i)=>{const cs=covOf(u),ts=u.c?.x?chapterTasks(u):null,td=ts?ts.filter(a=>taskDone(u.k,a[0])).length:0;return `<button class="node ${SC(u.subj)} ${cs} ${i===nextI?"next":""}" style="left:${P[i][0]}%;top:${P[i][1]+12}px" data-act="chapter" data-k="${u.k}">${i===nextI?kidBlob("bob","happy",'width="40" height="40" style="position:absolute;left:6px;top:-22px"'):""}<span class="dot">${rank[cs]>=2?`<svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#fff"/></svg>`:/^\d+$/.test(u.n)?u.n:esc(u.n)}</span><span class="lbl">${esc(u.title)}</span><span class="sub">${ts?`${td}/${ts.length} tasks · `:""}${STATUS[cs]}</span></button>`}).join("")}</div>`}
function crowd(){const B=[["var(--sun)",4,"sleepy",-10,70,130],["var(--gum)",7,"happy",80,40,150],["var(--aqua)",3,"wow",190,60,140],["var(--forest)",5,"happy",270,30,130],["var(--peri)",17,"calm",30,110,120],["var(--tang)",11,"happy",140,105,130],["var(--sky)",13,"happy",240,110,125]];

/* ---------- Today ---------- */
function stepState(it){const st=daySteps(it.u,it.n,it.tot),tk=new Set(S.steps[stepKey(it)]||[]);return st.map((x,i)=>({...x,ok:tk.has(i)}))}
function focusCard(it){const col=it.kind==="lesson"?SC(it.s):"r-"+it.who;let body="",acts="",title=it.title,mascot;

  if(it.kind==="lesson"){const st=stepState(it);title=it.u.title;mascot=sblob(it.s,"happy","mascot bob");body=`<div class="sm muted" style="font-weight:700">${esc(it.u.book)}${chNo(it.u)?" · "+chNo(it.u):""} · day ${it.n} of ${it.tot}</div><div class="steps-mini">${st.map(x=>`<span class="${x.ok?"ok":""}">${esc(x.label)} · ${mins(x.mins)}</span>`).join("")}</div>`;
    acts=`<button class="btn wide" data-act="play" data-id="${it.id}">${icon("play")}${st.some(x=>x.ok)?"Keep going":"Let's start"}</button>${it.bonus?`<button class="btn soft" data-act="less" data-s="${it.s}">Not now</button>`:`<button class="btn soft" data-act="skip" data-s="${it.s}">Not today</button>`}`}
  else if(it.kind==="prep"){mascot=youBlob("mascot bob","calm");body=`<ul class="sm" style="margin:0;padding-left:18px;display:grid;gap:4px;font-weight:700">${it.prep.slice(0,3).map(p=>`<li${S.prep[p.id]?' style="text-decoration:line-through;opacity:.6"':""}>${esc(p.task)}</li>`).join("")}${it.prep.length>3?`<li class="muted">and ${it.prep.length-3} more</li>`:""}</ul>`;acts=`<button class="btn wide" data-act="tlopen" data-id="${it.id}" data-date="${today}">Open my checklist</button><button class="btn soft" data-act="tlcheck" data-id="${it.id}" data-date="${today}">All ready</button>`}
  else if(it.kind==="warm"){mascot=blob("var(--gum)",21,"wow","mascot bob");body=`<p class="sm" style="font-weight:700">Three jokes, then today's word game. Ten minutes that wake everyone up.</p>`;acts=`<button class="btn wide" data-act="games">Jokes and games</button><button class="btn soft" data-act="tlcheck" data-id="warm" data-date="${today}">Done</button>`}
  else if(it.kind==="exps"){mascot=blob("var(--pist)",9,"happy","mascot bob");body=`<p class="sm" style="font-weight:700">${esc(it.sub)}</p>`;acts=`<button class="btn green wide" data-act="tlcheck" data-id="exps" data-date="${today}">Checked them all</button><button class="btn soft" data-act="goto" data-to="exps">See them</button>`}
  else{mascot=it.who==="you"?youBlob("mascot bob"):kidBlob("mascot bob","wow");body=it.sub?`<p class="sm" style="font-weight:700">${esc(it.sub)}</p>`:"";acts=`<button class="btn green wide" data-act="tlcheck" data-id="${it.id}" data-date="${today}">Done</button>`}
  return `<section class="focus ${col}">${mascot}<span class="eyebrow">Up next</span>${who}<h2>${esc(title)}</h2>${body}<div class="row">${acts}</div></section>`}
function offers(){return S.subjects.filter(s=>!ui.more[s]).map(s=>({s,nx:nextUp(s)})).filter(x=>x.nx)}
function offerList(){const L=offers();return L.length?`<div class="col" style="gap:8px">${L.map(({s,nx})=>`<div class="offer ${SC(s)}">${sblob(s)}<span style="min-width:0"><b style="font:600 16px var(--display)">${esc(nx.u.title)}</b><br><span class="xs muted">${SUBJ[s]} · day ${nx.n} of ${nx.tot}</span></span><button class="btn sm" data-act="more" data-s="${s}">Start</button></div>`).join("")}</div>`:`<p class="sm muted">Everything planned is done. Explore anything you like.</p>`}

function viewToday(){const items=dayPlan(today),real=items.filter(i=>i.kind!=="brk"),dn=real.filter(i=>i.done).length,now=real.find(i=>!i.done),du=dailyUnit(),pct=real.length?dn/real.length*100:0;

  if(!now||lessonsDone)h+=`<section class="donecard">${blob("var(--sun)",4,"happy","mascot bob")}<span class="eyebrow">${now?"Lessons done":"Day complete"}</span><h2>${now?"All of today's lessons are done!":real.length?"That's the whole day. Brilliant!":"Free day"}</h2><p class="sm" style="font-weight:700">Want to keep going? Start the next lesson now and the plan moves everything else along.</p>${offerList()}</section>`;
  if(!S.hideHow)h+=`<section class="sec"><div class="howto"><div class="sech"><h3>How your day works</h3><button class="link" data-act="hidehow">Got it</button></div><ol><li><b>You</b> start with a short prep checklist: what to gather, and where to find it.</li><li>The <b>Up next</b> card always shows the one thing to do now.</li><li>Lessons open step by step, with a timer for each step.</li><li>Classes and outings you add sit on the same clock. Lessons move around them.</li><li>Every finished thing makes a flower bloom in the garden.</li></ol></div></section>`;
  h+=`<section class="sec"><div class="sech"><h3>Today's timetable</h3><button class="link" data-act="addev">+ Class or outing</button></div>${items.length?`<div class="tt">${items.map(i=>agRow(i,now)).join("")}</div>`:`<p class="note">No lessons today. Add a class or outing, or start a lesson from above.</p>`}<button class="btn soft sm" data-act="free" style="justify-self:start">+ We explored something else</button></section>`;
  if(du)h+=`<section class="sec"><div class="sech"><h3>Jokes of the day</h3><button class="link" data-act="games">Games →</button></div><div class="hs">${du.c.x.jokes.map((j,i)=>{const [q,a]=splitJoke(j),k=today+i;return `<button class="joke" data-act="joke" data-j="${k}"><span class="eyebrow">Joke ${i+1}</span><span class="q">${esc(q)}</span>${ui.jokes[k]?`<span class="a">${esc(a)}</span>`:`<span class="tap">Tap for the answer</span>`}</button>`}).join("")}</div></section>`;
  const open=S.exps.filter(e=>!e.closed);
  h+=`<section class="sec" id="exps"><div class="sech"><h3>Growing and ongoing</h3></div>${open.map(e=>{const day=Math.round((parse(today)-parse(e.start))/864e5)+1,c=e.checks.includes(today);return `<div class="expi ${c?"done":""}"><span class="daybadge"><span><small>DAY</small>${day}</span></span><span style="min-width:0"><b style="font:600 16px var(--display)">${esc(e.title)}</b><br><span class="xs muted">${esc(e.topic)} · checked ${e.checks.length} times · <button class="link xs" data-act="close" data-e="${e.id}">finish</button></span></span><button class="ck" data-act="check" data-e="${e.id}" aria-label="Checked today: ${esc(e.title)}">${icon("check")}</button></div>`}).join("")||`<p class="note">Seeds, crystals, moon diaries and projects appear here with a daily check until you finish them.</p>`}<div class="row" style="flex-wrap:nowrap"><input class="inp" id="newExp" placeholder="Add your own experiment" maxlength="80"><button class="btn sm" data-act="addexp">Add</button></div></section>`;
  return h}

function playerView(){const P=ui.sheet,it={u:unitBy(P.k),n:P.n,tot:P.tot,bonus:P.bonus};if(!it.u)return "";const st=stepState(it),pct=Math.min(100,(st.filter(x=>x.ok).length)/st.length*100);

   <div class="timer"><svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--surface)" stroke-width="6"/><circle id="tring" cx="22" cy="22" r="18" fill="none" stroke="var(--c)" stroke-width="6" stroke-linecap="round" stroke-dasharray="113 113" transform="rotate(-90 22 22)"/></svg><div><div class="tt2 num" id="tt">${mmss(timerLeft(x))}</div><button class="link" data-act="timer" id="tbtn">${ui.timer&&ui.timer.run?"Pause":"Start timer"}</button></div></div>

const mmss=s=>`${Math.floor(s/60)}:${String(Math.max(0,Math.round(s%60))).padStart(2,"0")}`;
function timerLeft(x){const T=ui.timer;if(!T||T.key!==timerKey())return Math.round(x.mins*60);return T.run?Math.max(0,(T.end-Date.now())/1000):T.left}
const timerKey=()=>ui.sheet?ui.sheet.k+"|"+ui.sheet.n+"|"+ui.sheet.i:"";
let tick=null;
function timerToggle(){const P=ui.sheet,it={u:unitBy(P.k),n:P.n,tot:P.tot,bonus:P.bonus},x=stepState(it)[P.i];let T=ui.timer;
  if(!T||T.key!==timerKey())T=ui.timer={key:timerKey(),total:x.mins*60,left:x.mins*60,run:false};
  if(T.run){T.left=Math.max(0,(T.end-Date.now())/1000);T.run=false;clearInterval(tick)}else{T.end=Date.now()+T.left*1000;T.run=true;clearInterval(tick);tick=setInterval(paintTimer,500)}paintTimer()}
function paintTimer(){const T=ui.timer,tt=document.getElementById("tt"),r=document.getElementById("tring"),b=document.getElementById("tbtn");if(!T||!tt||T.key!==timerKey()){clearInterval(tick);return}
  const left=T.run?Math.max(0,(T.end-Date.now())/1000):T.left;tt.textContent=mmss(left);r.setAttribute("stroke-dasharray",`${113*left/T.total} 113`);b.textContent=T.run?"Pause":"Start timer";
  if(T.run&&left<=0){T.run=false;T.left=0;clearInterval(tick);sfx("win");toast("Time's up for this step");b.textContent="Done"}}

/* ---------- worksheet (one section per page) ---------- */
function wsItem(k,id,it,qn){const v=A(k,id);let b="";

  else if(it.t==="fill")b=`<div class="col" style="gap:8px">${it.a.map((_,bi)=>`<input class="inp" id="f-${k}-${id}-${bi}" data-ans="${k}|${id}|${bi}" placeholder="Blank ${bi+1}" value="${esc((v||[])[bi]||"")}">`).join("")}</div><div class="row"><button class="btn xs" data-act="checkfill" data-k="${k}" data-id="${id}" data-a="${esc(JSON.stringify(it.a))}">Check</button><button class="link sm" data-act="showfill" data-a="${esc(it.a.join(" · "))}">Show answers</button></div>`;

  else if(it.t==="sort"){const vv=v||{},sel=ui.sel[k+id];b=`<div class="pool">${it.items.filter(z=>vv[z]===undefined).map(z=>`<button class="token ${sel===z?"sel":""}" data-act="tok" data-k="${k}" data-id="${id}" data-x="${esc(z)}">${esc(z)}</button>`).join("")||`<span class="sm">All sorted. Could any go in two boxes?</span>`}</div><div class="buckets">${it.cats.map((c,ci)=>`<div class="bucket" data-act="bucket" data-k="${k}" data-id="${id}" data-c="${ci}"><b>${esc(c)}</b>${it.items.filter(z=>vv[z]===ci).map(z=>`<button class="token" data-act="untok" data-k="${k}" data-id="${id}" data-x="${esc(z)}">${esc(z)} ×</button>`).join("")}</div>`).join("")}</div><p class="xs muted">${sel?`Now tap a box for “${esc(sel)}”.`:"Tap a word, then tap its box."}</p>`}
  else if(it.t==="match"){const vv=v||{},sel=ui.sel[k+id],rights=it.pairs.map(p=>p[1]).slice().sort();b=`<div class="match"><div class="col" style="gap:6px">${it.pairs.map(([l])=>`<button class="mitem ${vv[l]!==undefined?"paired":sel===l?"sel":""}" data-act="mleft" data-k="${k}" data-id="${id}" data-x="${esc(l)}">${esc(l)}${vv[l]!==undefined?" → "+esc(vv[l]):""}</button>`).join("")}</div><div class="col" style="gap:6px">${rights.map(r=>`<button class="mitem ${Object.values(vv).includes(r)?"paired":""}" data-act="mright" data-k="${k}" data-id="${id}" data-x="${esc(r)}">${esc(r)}</button>`).join("")}</div></div>${Object.keys(vv).length===it.pairs.length?`<div class="row sm"><span>${it.pairs.filter(([l,r])=>vv[l]===r).length} of ${it.pairs.length} match ours.</span><button class="link sm" data-act="mreset" data-k="${k}" data-id="${id}">Try again</button></div>`:`<p class="xs muted">Tap a word on the left, then its match.</p>`}`}
  return `<div class="wq"><div class="p">${qn}. ${esc(it.p)}</div>${b}</div>`}
function wsView(){const u=unitBy(ui.sheet.k);if(!u)return "";const W=u.c.x.wsd,k=u.k,si=Math.min(ui.wsec[k]||0,W.length-1);document.getElementById("sheetTitle").textContent="Worksheet · "+u.title;

function initPads(){document.querySelectorAll("canvas.pad").forEach(c=>{if(c._ok)return;const r=c.getBoundingClientRect();if(!r.width)return;c._ok=1;c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;const x=c.getContext("2d");x.scale(devicePixelRatio,devicePixelRatio);x.lineWidth=3;x.lineCap="round";x.lineJoin="round";x.strokeStyle=getComputedStyle(document.body).color;let d=false;
  const pt=e=>{const b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e))};c.onpointermove=e=>{if(d){x.lineTo(...pt(e));x.stroke()}};c.onpointerup=()=>d=false})}

/* ---------- jokes & games ---------- */
function wordGame(u){const x=u.c.x,word=x.words[dayNo%x.words.length],g=G(),won=g.g.includes(word),over=won||g.g.length>=6,keys={};
  g.g.forEach(w=>[...w].forEach((ch,i)=>{const c=ch===word[i]?"hit":word.includes(ch)?"near":"miss";if(keys[ch]!=="hit"&&!(keys[ch]==="near"&&c==="miss"))keys[ch]=c}));
  const rows=[...Array(6)].map((_,r)=>{const w=g.g[r]||(r===g.g.length&&!over?(g.cur||""):"");return `<div class="wrow">${[0,1,2,3,4].map(i=>{const ch=w[i]||"";let c=ch?"f":"";if(g.g[r])c=ch===word[i]?"hit":word.includes(ch)?"near":"miss";return `<span class="wt ${c}" style="animation-delay:${i*.07}s">${esc(ch)}</span>`}).join("")}</div>`}).join("");
  return `<p class="sm muted" style="text-align:center">A five-letter word from “${esc(u.title)}”. Green is the right place, yellow is in the word.</p><div class="wgrid">${rows}</div>${over?`<p style="text-align:center;font:600 18px var(--display)">${won?"You got it: ":"The word was "}${word}</p>`:`<div class="kb">${["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"].map((r,i)=>`<div>${i===2?`<button class="w" data-act="wk" data-key="ENTER">Enter</button>`:""}${[...r].map(c=>`<button class="${keys[c]||""}" data-act="wk" data-key="${c}">${c}</button>`).join("")}${i===2?`<button class="w" data-act="wk" data-key="DEL" aria-label="Delete">Del</button>`:""}</div>`).join("")}</div>`}`}
function tfGame(u){const g=G(),q=u.c.x.quiz,i=q.findIndex((_,k)=>g.tf[k]===undefined),right=k=>(g.tf[k]===1)===q[k][1],sc=q.filter((_,k)=>g.tf[k]!==undefined&&right(k)).length;
  const dots=`<div class="dots">${q.map((_,k)=>`<i class="${g.tf[k]===undefined?(k===i?"on":""):right(k)?"ok":"no"}"></i>`).join("")}</div>`;
  if(i<0)return `${dots}<div class="score">${sc}/${q.length}</div><div class="col">${q.map(x=>`<div class="card" style="padding:14px"><span class="eyebrow">${x[1]?"True":"False"}</span><b style="font-weight:500">${esc(x[0])}</b><span class="sm muted">${esc(x[2])}</span></div>`).join("")}</div>`;
  const p=i>0?q[i-1]:null;return `${dots}${p?`<p class="sm" style="text-align:center;color:${right(i-1)?"var(--good)":"var(--bad)"}">${right(i-1)?"Right.":"Not quite."} ${esc(p[2])}</p>`:`<p class="sm muted" style="text-align:center">Some of these sound true and aren't.</p>`}<div class="tfq">${esc(q[i][0])}</div><div class="tfrow"><button class="btn yes" data-act="tf" data-i="${i}" data-v="1">True</button><button class="btn no" data-act="tf" data-i="${i}" data-v="0">False</button></div>`}
function oddGame(u){const g=G(),o=u.c.x.odd[dayNo%u.c.x.odd.length];return `<p class="sm muted" style="text-align:center">Which one doesn't belong? There may be more than one good answer. Can you defend yours?</p><div class="oddgrid">${o[0].map(w=>`<button class="${g.odd?(w===o[1]?"right":w===g.odd?"wrong":""):""}" data-act="odd" data-w="${esc(w)}" ${g.odd?"disabled":""}>${esc(w)}</button>`).join("")}</div>${g.odd?`<p style="text-align:center">${g.odd===o[1]?"Yes. ":"We picked "+esc(o[1])+". "}${esc(o[2])}</p>`:""}`}

function playItem(it){openSheet({mode:"player",s:it.s,k:it.u.k,n:it.n,tot:it.tot,bonus:it.bonus,i:Math.max(0,stepState(it).findIndex(x=>!x.ok))});if(ui.sheet.i<0)ui.sheet.i=0}
function onAct(e){
  if(ob){const d=ob.d,t=e.target.closest("[data-ob],button[data-age],button[data-b],button.choice[data-s]");if(!t)return;sfx("tap");
    if(t.dataset.ob==="next")return obNext();if(t.dataset.ob==="back"){ob.step--;return render()}

    if(t.dataset.s){const s=t.dataset.s;d.subjects=d.subjects.includes(s)?d.subjects.filter(x=>x!==s):[...d.subjects,s].sort((a,b)=>SUBJ_KEYS.indexOf(a)-SUBJ_KEYS.indexOf(b))}
    return render()}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,k=b.dataset.k;
  switch(a){
   case "play":{const it=findItem(b.dataset.id);if(it){sfx("flip");playItem(it)}break}
   case "pstep":{ui.sheet.i=Math.max(0,ui.sheet.i+(+b.dataset.d));sfx("tap");renderSheet(true);break}
   case "pdone":{const P=ui.sheet,key=(P.bonus?"x":"")+today+"|"+P.k+"|"+P.n,set=new Set(S.steps[key]||[]);if(!set.has(P.i)){set.add(P.i);S.steps[key]=[...set];sfx("tick")}else sfx("tap");P.i++;S.updatedAt=Date.now();save();renderSheet(true);break}
   case "timer":{sfx("tap");timerToggle();break}
   case "finish":{const P=ui.sheet,u=unitBy(P.k);if(!u)return;logSession(u,P.bonus?"more":"plan");ui.more[P.s]=false;sheet.close();sfx("win");confetti();toast(P.bonus?"Extra lesson done":"Lesson done. Well done!");commit();scrollTo({top:0,behavior:"smooth"});break}
   case "more":{const s=b.dataset.s;ui.more[s]=true;sfx("tick");_sess=null;const it=dayPlan(today).find(i=>i.kind==="lesson"&&i.s===s&&!i.done);render();if(it)playItem(it);break}
   case "less":{ui.more[b.dataset.s]=false;sfx("flip");render();break}
   case "skip":{S.skips[today+"|"+b.dataset.s]=true;sfx("flip");toast("Moved to the next lesson day");commit();break}
   case "free":{openPicker();break}
   case "chapter":{sfx("flip");if(b.dataset.t)ui.ctab[k]=b.dataset.t;openSheet({mode:"chapter",k});break}
   case "ctab":{ui.ctab[k]=b.dataset.t;sfx("tap");renderSheet(true);break}
   case "qi":{ui.qi[k]=Math.max(0,(ui.qi[k]||0)+(+b.dataset.d));sfx("flip");renderSheet(true);break}
   case "ws":{sfx("flip");openSheet({mode:"ws",k});break}
   case "wsec":{ui.wsec[k]=Math.max(0,(ui.wsec[k]||0)+(+b.dataset.d));sfx("flip");renderSheet(true);break}
   case "wsdone":{S.tasks[k]=S.tasks[k]||{};S.tasks[k].ws=S.tasks[k].ws||today;sfx("win");confetti();toast("Worksheet finished");commit();break}
   case "games":{sfx("flip");openSheet({mode:"games"});break}
   case "goto":{const t=document.getElementById(b.dataset.to);if(t)t.scrollIntoView({behavior:"smooth",block:"start"});break}
   case "task":{const id=b.dataset.id;S.tasks[k]=S.tasks[k]||{};if(S.tasks[k][id]){delete S.tasks[k][id];sfx("flip")}else{S.tasks[k][id]=today;sfx("ok")}commit();break}
   case "startexp":{addExp(b.dataset.title,b.dataset.topic);sfx("ok");toast("Added to Growing and ongoing");commit();break}
   case "status":{const p=S.progress[k]||{sessions:0};p.status=b.dataset.s;p.updated=today;S.progress[k]=p;sfx(b.dataset.s==="mastered"?"win":"tick");commit();break}
   case "logk":{const u=unitBy(k);if(u){logSession(u,"free");sfx("ok");toast("Logged for today");commit()}break}
   case "tlcheck":{const date=b.dataset.date,it=dayPlan(date).find(i=>i.id===b.dataset.id);if(!it)return;
     if(it.kind==="prep"){const all=it.prep.every(p=>S.prep[p.id]);it.prep.forEach(p=>{if(all)delete S.prep[p.id];else S.prep[p.id]=today});sfx(all?"flip":"ok")}
     else if(it.kind==="exps"){S.exps.filter(x=>!x.closed&&x.start<=date).forEach(x=>{if(!x.checks.includes(today))x.checks.push(today)});sfx("ok")}
     else if(it.kind==="lesson")return playItem(it);
     else{const key=date+"|"+it.id;if(S.tl[key])delete S.tl[key];else{S.tl[key]=1;sfx("ok")}}
     commit();break}
   case "tlopen":{const date=b.dataset.date,it=dayPlan(date).find(i=>i.id===b.dataset.id);if(!it)return;sfx("tap");
     if(it.kind==="prep")return openSheet({mode:"prep",date,when:it.id});
     if(it.kind==="lesson")return it.done?openSheet({mode:"chapter",k:it.u.k}):playItem(it);
     if(it.kind==="warm")return openSheet({mode:"games"});
     if(it.kind==="exps"){document.getElementById("exps")?.scrollIntoView({behavior:"smooth"});return}
     const key=date+"|"+it.id;if(S.tl[key])delete S.tl[key];else{S.tl[key]=1;sfx("ok")}commit();break}
   case "prep":{const id=b.dataset.id;if(S.prep[id])delete S.prep[id];else{S.prep[id]=today;sfx("tick")}commit();break}
   case "hidehow":{S.hideHow=true;commit();break}
   case "addev":{openEv();break}
   case "delev":{S.events=(S.events||[]).filter(x=>x.id!==b.dataset.e);sfx("flip");commit();break}
   case "wk2":{ui.week=(ui.week||0)+(+b.dataset.d);ui.wday=null;sfx("tap");render();break}
   case "wday":{ui.wday=b.dataset.d;sfx("tap");render();break}
   case "wview":{ui.wview=b.dataset.v;sfx("tap");render();break}
   case "lvl":{const s=b.dataset.s;S.levels[s]=Math.min(5,Math.max(1,S.levels[s]+(+b.dataset.d)));ui.view[s]=S.levels[s];sfx("tick");commit();break}
   case "day":{const s=b.dataset.s,d=+b.dataset.d,cur=new Set(daysOf(s));cur.has(d)?cur.delete(d):cur.add(d);if(cur.size){S.days={...S.days,[s]:[...cur].sort()};sfx("tap");commit()}break}
   case "lsub":{ui.lsub=b.dataset.s;sfx("tap");render();break}
   case "view":{ui.view[b.dataset.s]=+b.dataset.l;sfx("tap");render();break}
   case "setlvl":{S.levels[b.dataset.s]=+b.dataset.l;sfx("tick");commit();break}
   case "check":{const x=S.exps.find(x=>x.id===b.dataset.e);if(x&&!x.checks.includes(today)){x.checks.push(today);sfx("ok");commit()}break}
   case "close":{const x=S.exps.find(x=>x.id===b.dataset.e);if(x){x.closed=true;x.end=today;sfx("win");confetti();toast("Finished: "+x.title);commit()}break}
   case "addexp":{const v=document.getElementById("newExp").value.trim();if(v){addExp(v,"Our own experiment");sfx("ok");commit()}break}
   case "joke":{ui.jokes[b.dataset.j]=!ui.jokes[b.dataset.j];sfx(ui.jokes[b.dataset.j]?"ok":"flip");render();break}
   case "gtab":{ui.game=b.dataset.g;sfx("tap");renderSheet();break}
   case "wk":{const u=dailyUnit();if(!u)return;const word=u.c.x.words[dayNo%u.c.x.words.length],g=G();g.cur=g.cur||"";const key=b.dataset.key;if(g.g.includes(word)||g.g.length>=6)return;
     if(key==="DEL"){g.cur=g.cur.slice(0,-1);sfx("key")}else if(key==="ENTER"){if(g.cur.length===5){g.g.push(g.cur);const w=g.cur===word;g.cur="";sfx(w?"win":g.g.length>=6?"no":"flip");if(w)confetti();S.updatedAt=Date.now();save()}else{sfx("no");toast("Five letters, please")}}else if(g.cur.length<5){g.cur+=key;sfx("key")}renderSheet();break}
   case "tf":{const u=dailyUnit(),q=u.c.x.quiz[+b.dataset.i];G().tf[b.dataset.i]=+b.dataset.v;sfx((+b.dataset.v===1)===q[1]?"ok":"no");if(Object.keys(G().tf).length===u.c.x.quiz.length)setTimeout(()=>sfx("win"),300);commit();break}
   case "odd":{const u=dailyUnit(),o=u.c.x.odd[dayNo%u.c.x.odd.length],g=G();if(!g.odd){g.odd=b.dataset.w;sfx(g.odd===o[1]?"win":"no");if(g.odd===o[1])confetti();commit()}break}
   case "mcq":{setA(k,b.dataset.id,+b.dataset.o);sfx(+b.dataset.o===+b.dataset.a?"ok":"no");commit();break}
   case "mcqreset":{delete S.ans[k][b.dataset.id];sfx("flip");commit();break}
   case "checkfill":{const ans=JSON.parse(b.dataset.a),v=A(k,b.dataset.id)||[],n=s=>String(s||"").trim().toLowerCase();const good=ans.every((x,i)=>{const w=n(v[i]);return w&&(n(x).includes(w)||w.includes(n(x).split(/[ (]/)[0]))});sfx(good?"ok":"no");toast(good?"Looks right":"Have another look");break}
   case "showfill":{sfx("flip");toast(b.dataset.a);break}
   case "drew":{if(A(k,b.dataset.id))delete S.ans[k][b.dataset.id];else{setA(k,b.dataset.id,today);sfx("ok")}commit();break}
   case "tok":{const key=k+b.dataset.id;ui.sel[key]=ui.sel[key]===b.dataset.x?undefined:b.dataset.x;sfx("tap");renderSheet();break}
   case "bucket":{const sel=ui.sel[k+b.dataset.id];if(sel===undefined)return;const v={...(A(k,b.dataset.id)||{})};v[sel]=+b.dataset.c;setA(k,b.dataset.id,v);ui.sel[k+b.dataset.id]=undefined;sfx("tick");commit();break}
   case "untok":{const v={...(A(k,b.dataset.id)||{})};delete v[b.dataset.x];setA(k,b.dataset.id,v);sfx("flip");commit();break}
   case "mleft":{ui.sel[k+b.dataset.id]=b.dataset.x;sfx("tap");renderSheet();break}
   case "mright":{const l=ui.sel[k+b.dataset.id];if(!l){sfx("no");toast("Tap a word on the left first");return}const v={...(A(k,b.dataset.id)||{})};Object.keys(v).forEach(x=>{if(v[x]===b.dataset.x)delete v[x]});v[l]=b.dataset.x;setA(k,b.dataset.id,v);ui.sel[k+b.dataset.id]=undefined;const [si,ii]=b.dataset.id.split("-").map(Number),it=unitBy(k).c.x.wsd[si][1][ii];sfx(it.pairs.some(p=>p[0]===l&&p[1]===b.dataset.x)?"ok":"tick");commit();break}
   case "mreset":{setA(k,b.dataset.id,{});sfx("flip");commit();break}
   case "clearpad":{const c=document.querySelector(`canvas[data-pad="${CSS.escape(b.dataset.pad)}"]`);if(c)c.getContext("2d").clearRect(0,0,c.width,c.height);sfx("flip");break}
   case "saveset":{S.child=document.getElementById("sName").value.trim();const v=document.getElementById("sStart").value;if(v)S.start=v;sfx("ok");toast("Saved");commit();break}
   case "redo":{sheet.close();startOnboarding(1);break}
  }}
document.getElementById("main").addEventListener("click",onAct);
document.getElementById("sheetBody").addEventListener("click",onAct);
document.addEventListener("input",e=>{const t=e.target;if(!t.dataset.ans)return;const [k,id,sub]=t.dataset.ans.split("|");if(sub===undefined)setA(k,id,t.value);else if(sub.includes(".")){const v={...(A(k,id)||{})};v[sub]=t.value;setA(k,id,v)}else{const v=[...(A(k,id)||[])];v[+sub]=t.value;setA(k,id,v)}S.updatedAt=Date.now();save()});
document.getElementById("main").addEventListener("change",e=>{const t=e.target;
  if(t.dataset.dayset){S.day={...D(),[t.dataset.dayset]:t.type==="time"?t.value:+t.value};sfx("tap");commit();return}
  if(t.matches("select[data-hpd]")){const s=t.dataset.hpd,v=+t.value;sfx("tap");if(ob)ob.d.hpd={...(ob.d.hpd||DEF_HPD),[s]:v};else{S.hpd={...(S.hpd||DEF_HPD),[s]:v};commit()}return}
  if(ob&&t.matches("#obPlus")){ob.d.plus=t.checked;sfx("tap");return}if(ob&&t.matches("select[data-s]")){ob.d.levels[t.dataset.s]=+t.value;sfx("tap")}});
/* event dialog */
const evd=document.getElementById("evd");let evRep="once";
document.getElementById("eDays").innerHTML=[1,2,3,4,5,6,0].map(d=>`<button type="button" data-d="${d}" aria-pressed="false">${DAYN[d]}</button>`).join("");
function openEv(){evForm.reset();eDate.value=ui.wday||today;evRep="once";syncEv();eErr.hidden=true;eDays.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));sfx("tap");evd.showModal()}
function syncEv(){eRep.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.rep===evRep));eDateF.hidden=evRep!=="once";eDaysF.hidden=evRep==="once"}
eRep.addEventListener("click",e=>{const x=e.target.closest("button");if(!x)return;evRep=x.dataset.rep;syncEv();sfx("tap")});
eDays.addEventListener("click",e=>{const x=e.target.closest("button");if(!x)return;x.setAttribute("aria-pressed",x.getAttribute("aria-pressed")!=="true");sfx("tap")});
evForm.addEventListener("submit",e=>{if(!e.submitter||e.submitter.value!=="save")return;const days=[...eDays.querySelectorAll('[aria-pressed="true"]')].map(x=>+x.dataset.d);
  const err=!eTitle.value.trim()?"Give it a name.":evRep==="weekly"&&!days.length?"Pick at least one day.":evRep==="once"&&!eDate.value?"Pick a date.":hm(eEnd.value)<=hm(eStart.value)?"The end time must be after the start.":"";
  if(err){e.preventDefault();eErr.textContent=err;eErr.hidden=false;sfx("no");return}
  S.events=[...(S.events||[]),{id:Math.random().toString(36).slice(2,9),title:eTitle.value.trim(),kind:eKind.value,who:eKind.value==="outing"&&eWho.value==="kid"?"both":eWho.value,start:eStart.value,end:eEnd.value,rep:evRep,date:evRep==="once"?eDate.value:null,days:evRep==="weekly"?days:[],from:today,note:eNote.value.trim()}];sfx("ok");toast("Added to the day");commit()});
const pick=document.getElementById("pick");
function openPicker(){document.getElementById("pickList").replaceChildren(el(everyUnit().map(u=>`<button class="unit ${SC(u.subj)}" style="grid-template-columns:44px 1fr" data-k="${u.k}"><span class="no">${/^\d+$/.test(u.n)?u.n:esc(u.n)}</span><span><b>${esc(u.title)}</b><br><span class="xs muted">${SUBJ[u.subj]} · Level ${u.level}</span></span></button>`).join("")));sfx("tap");pick.showModal()}
document.getElementById("pickList").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const u=unitBy(b.dataset.k);if(u){logSession(u,"free");pick.close();sfx("ok");toast("Logged");commit()}});
document.getElementById("pickClose").onclick=()=>pick.close();
boot();
</script>
