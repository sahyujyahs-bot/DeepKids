<title>DeepKids Home Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Outfit:wght@400;500;700&display=swap">
<style>
/* Layout: one column, sticky header with tabs; palm-leaf paper, temple vermilion, turmeric and peacock teal from the DeepKids game */
:root{
  --bg:#F6EEDA; --surface:#FFFBF1; --ink:#2A1A14; --muted:#6E5A4C; --line:#E2D3B1;
  --red:#B8322A; --turmeric:#D99312; --teal:#0E6E6E; --indigo:#24305E;
  --s-none:#D8CCB2; --s-learning:#D99312; --s-completed:#0E6E6E; --s-mastered:#24305E;
  --display:"Baloo 2","Young Serif",Georgia,serif; --body:"Outfit",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1512; --surface:#261E19; --ink:#F3E7CF; --muted:#BCA88F; --line:#3D3128;
  --red:#E0604F; --turmeric:#F0B23A; --teal:#3FB3AE; --indigo:#8EA0E6;
  --s-none:#4A3D33; --s-learning:#F0B23A; --s-completed:#3FB3AE; --s-mastered:#8EA0E6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1512; --surface:#261E19; --ink:#F3E7CF; --muted:#BCA88F; --line:#3D3128;
  --red:#E0604F; --turmeric:#F0B23A; --teal:#3FB3AE; --indigo:#8EA0E6;
  --s-none:#4A3D33; --s-learning:#F0B23A; --s-completed:#3FB3AE; --s-mastered:#8EA0E6; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header .wrap{padding-block:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.brand{font-family:var(--display);font-size:22px;line-height:1}
.brand small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.tabs button{border:0;background:none;color:var(--muted);font:500 14px var(--body);padding:8px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
button{font-family:var(--body)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h2{font-size:22px;margin:24px 0 10px} h3{font-size:18px}
.muted{color:var(--muted)} .small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.today{border-left:6px solid var(--red)}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--ink);background:none;color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:500;cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.quiet{border-color:var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.st-none{background:var(--s-none)} .st-learning{background:var(--s-learning)} .st-completed{background:var(--s-completed)} .st-mastered{background:var(--s-mastered)}
.qhead{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.qhead h2{margin:0}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.topic summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.topic summary::-webkit-details-marker{display:none}
.tid{font:700 12px var(--body);color:var(--muted);min-width:28px}
.tname{font-weight:500;min-width:0}
.tbody{padding:0 14px 14px;display:grid;gap:12px;min-width:0}
.tbody ul{margin:0;padding-left:18px} .tbody li{margin-bottom:3px}
.oneness{font-family:var(--display);font-size:16px;border-left:3px solid var(--turmeric);padding-left:10px}
.res a{color:var(--teal)}
.badge{font-size:11px;font-weight:700;color:#fff;background:var(--teal);padding:2px 8px;border-radius:999px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.week{display:grid;gap:6px}
.wk-h{font:700 12px var(--body);color:var(--muted);letter-spacing:.04em;margin-top:14px}
.sess{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.sess .d{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.sess.is-today{border-color:var(--red)}
table{border-collapse:collapse;width:100%;font-size:14px}
.tablebox{overflow-x:auto}
td,th{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
.bar{height:10px;border-radius:999px;background:var(--s-none);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{font:400 28px var(--display);display:block;font-variant-numeric:tabular-nums}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.sess{grid-template-columns:76px 1fr}}
.exp{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.exp:first-of-type{border-top:0}
.field{display:grid;gap:4px;margin-bottom:12px} .field input,.field select{font:15px var(--body);padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);max-width:min(520px,92vw);padding:20px}
dialog::backdrop{background:rgba(20,12,8,.45)}
.picker{display:grid;gap:6px;max-height:55vh;overflow:auto}
.picker button{text-align:left;border:1px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer}
.sync{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.ob{max-width:620px;margin:0 auto;padding-block:20px}
.steps{display:flex;gap:6px;margin:6px 0 18px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--red)}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.choice{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:grid;gap:4px}
.choice b{font-family:var(--display);font-weight:400;font-size:17px}
.choice[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
.choice span{font-size:13px;color:var(--muted)}
.lvl{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lvl select{font:15px var(--body);padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.toggle{display:flex;gap:10px;align-items:flex-start;padding:14px;border:1.5px dashed var(--turmeric);border-radius:14px;margin-top:14px;cursor:pointer}
.toggle input{width:20px;height:20px;margin-top:2px;accent-color:var(--red)}
.unit{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.unit:last-child{border-bottom:0}
.unit .n{font:700 12px var(--body);color:var(--muted);min-width:30px;font-variant-numeric:tabular-nums}
.unit select{font:13px var(--body);border:1px solid var(--line);border-radius:999px;padding:3px 6px;background:var(--surface);color:var(--ink)}
.book{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.book h3{font-size:16px;padding:12px 12px 6px}
.links{font-size:12px;color:var(--muted)}
.subj-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin:26px 0 10px}
.subj-h h2{margin:0}
.dayh{font:700 13px var(--body);margin:16px 0 6px}

.btn.mini{padding:2px 9px;border-radius:8px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.joke{background:var(--surface);border:1px dashed var(--turmeric);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.joke p{margin:4px 0 0;font-family:var(--display);font-size:17px}
.wgrid{display:grid;gap:5px;justify-content:center}
.wrow{display:grid;grid-template-columns:repeat(5,44px);gap:5px}
.tile{height:44px;border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 20px var(--body)}
.tile.hit{background:var(--s-completed);border-color:var(--s-completed);color:#fff}
.tile.near{background:var(--s-learning);border-color:var(--s-learning);color:#fff}
.tile.miss{background:var(--s-none);border-color:var(--s-none)}
.kb{display:grid;gap:5px;justify-items:center}
.kb div{display:flex;gap:4px;flex-wrap:nowrap}
.kb button{border:0;background:var(--line);color:var(--ink);border-radius:6px;min-width:28px;height:40px;font:600 14px var(--body);cursor:pointer;padding:0 6px}
.kb button.wide{min-width:52px}
@media (max-width:400px){.kb button{min-width:24px;padding:0 3px}.wrow{grid-template-columns:repeat(5,40px)}.tile{height:40px}}
.tf{display:grid;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.tf:first-of-type{border-top:0}
.ok{color:var(--s-completed)} .no{color:var(--red)}
.sess-d>summary{list-style:none;cursor:pointer}
.sess-d>summary::-webkit-details-marker{display:none}

.lvl{grid-template-columns:96px 1fr}
.lvl>.row{flex-wrap:nowrap;justify-content:flex-end}
.lvl>.row select{flex:1 1 0;min-width:0}
.lvl>.row select[data-hpd]{flex:0 0 auto}

.joke a,.res a{color:var(--teal)}
.dayplan{border-top:1px solid var(--line);padding-top:10px}
.dayplan>summary{cursor:pointer;margin-bottom:8px}
.step{background:var(--bg);border-radius:10px;padding:10px 12px}
.step p{margin:4px 0 0}.step ul,.step ol{margin:6px 0 0;padding-left:18px}

/* ===== vibrant layer ===== */
:root{--c-teal:#0E8C8C;--c-indigo:#4B50C8;--c-red:#E2513C;--c-leaf:#2F9E55;--c-sun:#F5B301;--c-pink:#E0569A;--card:#FFFFFF;--soft:#FFF3DC;--shadow:0 6px 18px rgba(90,50,20,.10)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-teal:#3CC4C0;--c-indigo:#8E93FF;--c-red:#FF7A63;--c-leaf:#5CCB80;--c-sun:#FFCB45;--c-pink:#FF84BE;--card:#2B221C;--soft:#33281F;--shadow:0 6px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--c-teal:#3CC4C0;--c-indigo:#8E93FF;--c-red:#FF7A63;--c-leaf:#5CCB80;--c-sun:#FFCB45;--c-pink:#FF84BE;--card:#2B221C;--soft:#33281F;--shadow:0 6px 18px rgba(0,0,0,.35)}
h1,h2,h3,h4{font-weight:700;letter-spacing:-.01em}
h2.sec{font-size:21px;margin:26px 0 10px}
.center{text-align:center}.center-row{justify-content:center}.big{font-size:18px}.grow{flex:1}.wrap{flex-wrap:wrap}
.hero{margin-top:16px;border-radius:22px;padding:18px 20px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:linear-gradient(120deg,var(--c-pink),var(--c-sun) 55%,var(--c-leaf))}
.hero h2{margin:2px 0;font-size:28px;color:#fff}.hero .hdate{font-size:13px;opacity:.95}.hero p{margin:0}
.hero .ring{width:64px;height:64px;color:#fff;flex:none}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:thin}
.hscroll>*{scroll-snap-align:start;flex:0 0 78%;max-width:320px}
.joke-card{border:0;border-radius:18px;padding:16px;text-align:left;color:#fff;cursor:pointer;display:grid;gap:8px;min-height:120px;box-shadow:var(--shadow);font:inherit}
.joke-card.c0{background:var(--c-indigo)}.joke-card.c1{background:var(--c-teal)}.joke-card.c2{background:var(--c-red)}
.jq{font:700 18px/1.25 var(--display)}.ja{font-size:16px;font-weight:500;background:rgba(255,255,255,.18);border-radius:10px;padding:8px 10px}
.ja.hide{display:none}.jtap{opacity:.85}
.lesson{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;--sc:var(--c-teal)}
.lesson.s-teal{--sc:var(--c-teal)}.lesson.s-indigo{--sc:var(--c-indigo)}.lesson.s-red{--sc:var(--c-red)}.lesson.s-leaf{--sc:var(--c-leaf)}
.lhead{background:var(--sc);color:#fff;display:flex;gap:8px;align-items:center;padding:10px 16px}
.lhead .subj{font:700 15px var(--display);margin-right:auto}
.chip.light{background:rgba(255,255,255,.22);border-color:transparent;color:#fff}
.lbody{padding:14px 16px;display:grid;gap:10px}
.lbody h3{font-size:22px;margin:0}
.lesson.quiet .lbody{padding:10px 16px}.lesson.done{opacity:.85}
.sprog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}.sprog span{display:block;height:100%;background:var(--sc);transition:width .3s}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start}
.tick{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--sc);background:none;color:#fff;font-weight:800;cursor:pointer;margin-top:6px}
.steps li.done .tick{background:var(--sc)}
.steps li.done .stitle{text-decoration:line-through;opacity:.6}
.steps details{background:var(--soft);border-radius:14px}
.steps summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:10px 12px}
.steps summary::-webkit-details-marker{display:none}
.sicon{font-size:18px}.stitle{font-weight:600;min-width:0}.slabel{display:block;font-size:11px;font-weight:700;color:var(--sc);text-transform:uppercase;letter-spacing:.05em}
.sbody{padding:0 12px 12px 48px}.sbody p{margin:4px 0}
.chip.time{background:var(--card);border-color:var(--line);color:var(--ink);font-weight:600;white-space:nowrap}
.ask{background:var(--card);border-left:4px solid var(--c-sun);border-radius:8px;padding:8px 10px;margin-top:6px;font-weight:500}
ul.tidy,ol.tidy{margin:6px 0;padding-left:18px}ul.tidy li,ol.tidy li{margin-bottom:5px}
.btn.primary{background:var(--c-red);border-color:var(--c-red);border-radius:14px;padding:11px 16px;font-weight:700}
.btn.dashed{border:2px dashed var(--line);border-radius:14px;padding:12px;color:var(--muted);width:100%}
.inp{flex:1;min-width:0;font:15px var(--body);padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.explorer{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px}
.pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.pill{border:0;background:var(--soft);color:var(--ink);font:700 14px var(--body);padding:9px 16px;border-radius:99px;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--ink);color:var(--bg)}
.exbody{display:grid;gap:12px}
.where{display:flex;flex-wrap:wrap;gap:6px}
.chip.book{background:var(--soft);border-color:transparent;color:var(--ink)}.chip.read{background:transparent}
.idea{background:linear-gradient(160deg,var(--soft),var(--card));border:1.5px solid var(--line);border-radius:18px;padding:14px;min-height:130px}
.idea .num{display:inline-flex;width:30px;height:30px;border-radius:50%;background:var(--c-sun);color:#3a2500;font:800 15px var(--display);align-items:center;justify-content:center}
.idea p{margin:8px 0 0}
.flip{border:0;border-radius:18px;padding:16px;text-align:left;cursor:pointer;background:var(--c-indigo);color:#fff;display:grid;gap:10px;min-height:160px;font:inherit;align-content:start}
.flip.two{background:var(--c-teal)}.flip.open{outline:3px solid var(--c-sun)}
.flip .fq{font:700 17px/1.3 var(--display)}.flip .fa{opacity:.92}
.tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:99px;width:max-content}
.onecard{border-radius:18px;padding:16px;background:linear-gradient(120deg,var(--c-sun),var(--c-pink));color:#2a1200}
.onecard p{margin:6px 0 0;font:700 18px/1.35 var(--display)}.onecard .tag{background:rgba(255,255,255,.45)}
.dogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.docard{border-radius:16px;background:var(--soft);border:1.5px solid transparent}
.docard[open]{border-color:var(--line);background:var(--card)}
.docard summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:12px}
.docard summary::-webkit-details-marker{display:none}
.docard .icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--card)}
.k-sheet .icon{background:#FFE7A8}.k-exp .icon{background:#CDEFD8}.k-act .icon{background:#D9DBFF}.k-proj .icon{background:#FFD3C9}.k-game .icon{background:#FFD9EC}
.dt{display:grid;gap:4px;min-width:0;justify-items:start}.docbody{padding:0 12px 12px}
.gamecard{border-radius:18px;padding:16px;background:var(--c-pink);color:#fff}.gamecard h4{font-size:20px;margin:6px 0}.gamecard p{margin:0 0 8px}
.curcard{display:grid;gap:4px;text-decoration:none;color:var(--ink);background:var(--soft);border-radius:14px;padding:12px}
.curcard .tag{background:var(--card);color:var(--muted)}
.gamesbox{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:14px}
.gamebody{display:grid;gap:10px}
.qprog{display:flex;gap:6px;justify-content:center}.qprog i{width:26px;height:6px;border-radius:9px;background:var(--line)}.qprog i.on{background:var(--c-sun)}.qprog i.ok{background:var(--c-leaf)}.qprog i.no{background:var(--c-red)}
.qcard{font:700 20px/1.3 var(--display);text-align:center;padding:18px;background:var(--soft);border-radius:16px}
.big-true,.big-false{font-size:17px;font-weight:800;padding:12px 26px;border-radius:14px;color:#fff;border:0}
.big-true{background:var(--c-leaf)}.big-false{background:var(--c-red)}
.scorebig{font:800 44px var(--display);color:var(--c-leaf)}
.tfdone{padding:8px 10px;border-radius:10px;background:var(--soft);margin-top:6px}
.oddgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.oddbtn{border:0;border-radius:16px;padding:20px 10px;font:700 18px var(--display);background:var(--soft);color:var(--ink);cursor:pointer}
.oddbtn.right{background:var(--c-leaf);color:#fff}.oddbtn.wrong{background:var(--c-red);color:#fff}
.expcard{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:grid;gap:6px;border-top:6px solid var(--c-leaf)}
.expcard.checked{border-top-color:var(--c-sun)}
.dayno{font:800 24px var(--display);color:var(--c-leaf)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:50;box-shadow:var(--shadow);animation:pop .25s ease}
@keyframes pop{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.tile.hit{background:var(--c-leaf);border-color:var(--c-leaf)}.tile.near{background:var(--c-sun);border-color:var(--c-sun)}
</style>

<header id="hdr"><div class="wrap">
  <div class="hrow">
    <div class="brand">DeepKids<small id="who">Home learning planner</small></div>
    <button class="btn quiet" id="openSettings">Settings</button>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="plan">Plan</button>
    <button role="tab" data-tab="topics">Topics</button>
    <button role="tab" data-tab="progress">Progress</button>
  </nav>
</div></header>

<main class="wrap" id="main"></main>

<dialog id="settings"><form method="dialog" id="setForm">
  <h3 style="margin-bottom:14px">Settings</h3>
  <div class="field"><label for="sName">Child's name</label><input id="sName" maxlength="40"></div>
  <div class="field"><label for="sStart">Plan starts on</label><input id="sStart" type="date"></div>
  <div class="row" style="justify-content:space-between"><button class="btn" value="redo" id="redo">Change syllabus, subjects or levels</button><button class="btn primary" value="save">Save</button></div>
  <p class="sync" id="syncNote" style="margin-top:10px"></p>
</form></dialog>

<dialog id="pick"><h3 style="margin-bottom:6px">What did you explore?</h3><p class="muted small" style="margin:0 0 10px">It counts towards progress, and the plan moves around it.</p><div class="picker" id="pickList"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn quiet" id="pickClose">Cancel</button></div></dialog>

<script>
const DATA = /*DATA*/;
const TOP = Object.fromEntries(DATA.topics.map(t=>[t.id,t]));
const SUBJ = DATA.subjects, SUBJ_KEYS = Object.keys(SUBJ);
const BOARDS = {ncert:"NCERT / CBSE",cambridge:"Cambridge Primary",nios:"NIOS (Open Basic Education)"};
const STATUS = {none:"Not started",learning:"Learning",completed:"Completed",mastered:"Mastered"};
const DAYN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DEF_DAYS={math:[1,2,3,4,5],eng:[1,2,4,5],hin:[2,4],sci:[1,3,5]};
const YEAR_WEEKS=36;
const PRESET_EXP={A1:["Lotus seeds (Kamali): change water","Alum crystal (Fitkari): check growth","World in a Jar: look for droplets","Bread mould bag: look, never open"],A5:["Moong sprouts: light vs dark"],B5:["Moon diary: draw tonight's Moon"],B10:["Bury test: dig up after 3 weeks"]};
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=iso(new Date());
const dayNo=Math.floor(parse(today)/864e5);
const fmt=s=>parse(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const monday=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DEF_HPD={math:1,eng:0.75,hin:0.5,sci:0.75};
const fresh=()=>({setup:false,child:"",age:6,board:"ncert",plus:true,subjects:["math","eng","hin","sci"],levels:{math:1,eng:1,hin:1,sci:1},start:monday(),days:DEF_DAYS,hpd:DEF_HPD,progress:{},log:[],exps:[],skips:{},hrs:{},games:{},steps:{},updatedAt:0});
let S=fresh(),store=null,saving=Promise.resolve(),saveTimer=null,syncMode="device",tab="today",ob=null,view={};

/* ---------- persistence: one private document per viewer; browser storage as fallback ---------- */
async function boot(){
  try{const ls=localStorage.getItem("dk-state-v2");if(ls)S={...fresh(),...JSON.parse(ls)}}catch(e){}
  render();
  try{
    const [db,user]=await Promise.all([window.claude?.use?.("db"),window.claude?.use?.("user")]);
    const id=db&&user?await user.id():null;
    if(db&&id){store=db.doc("data/users/"+id+"/planner");const snap=await store.get();
      const remote=snap.exists?snap.data():null;
      if(remote&&remote.setup!==undefined&&(remote.updatedAt||0)>(S.updatedAt||0)){S={...fresh(),...remote}}else if(S.setup){await store.set(JSON.parse(JSON.stringify(S)))}
      syncMode="account";render()}
  }catch(e){store=null}
}
function save(){
  try{localStorage.setItem("dk-state-v2",JSON.stringify(S))}catch(e){}
  if(!store)return;clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{const body=JSON.parse(JSON.stringify(S));saving=saving.then(()=>store.set(body)).catch(()=>{syncMode="device"})},700);
}
const commit=()=>{S.updatedAt=Date.now();save();render()};

/* ---------- collating the syllabus, at any level ---------- */
const boardsOn=()=>S.board==="combined"?["ncert","cambridge","nios"]:S.board==="none"?[]:[S.board];
function dkUnits(subj,lvl){
  if(!S.plus||subj!=="sci"||lvl!==1)return [];
  return DATA.topics.map(t=>({k:"dk|"+t.id,board:"dk",subj:"sci",level:1,book:"DeepKids Plus · Science Level 1",n:t.id,title:t.name,dk:[],topic:t}));
}
function collateAt(subj,lvl){return {board:DATA.items.filter(i=>i.subj===subj&&i.level===lvl&&boardsOn().includes(i.board)),dk:dkUnits(subj,lvl)}}
const collate=subj=>collateAt(subj,S.levels[subj]);
function notesFor(subj,lvl){
  const n=[];boardsOn().forEach(b=>{const x=b==="ncert"?DATA.notes.ncert[subj+"|"+lvl]:DATA.notes[b]?.[subj];if(x)n.push(BOARDS[b]+": "+x)});
  if(S.plus&&subj==="sci"&&lvl!==1)n.push("DeepKids Plus Science for Level "+lvl+" is being written. Level 1 is ready.");
  if(S.plus&&subj!=="sci")n.push("DeepKids Plus "+SUBJ[subj]+" is being written.");
  return n;
}
/* the calendar is driven by DeepKids topics if present, else the first chosen board that has units */
function plannedAt(subj,lvl){const c=collateAt(subj,lvl);if(c.dk.length)return c.dk;for(const b of boardsOn()){const u=c.board.filter(i=>i.board===b);if(u.length)return u}return []}
/* the plan runs from the current level upward, so a child who finishes a level carries straight on */
function plannedUnits(subj){const out=[];for(let l=S.levels[subj];l<=5;l++)out.push(...plannedAt(subj,l));return out}
const everyUnit=()=>S.subjects.flatMap(s=>[1,2,3,4,5].flatMap(l=>{const c=collateAt(s,l);return [...c.dk,...c.board]}));
const unitBy=k=>everyUnit().find(u=>u.k===k);
const st=k=>S.progress[k]?.status||"none";
const done=k=>S.progress[k]?.sessions||0;
const rank={none:0,learning:1,completed:2,mastered:3};
function coverage(u){
  if(u.board!=="dk"&&S.plus&&u.dk.length){const s=u.dk.map(id=>st("dk|"+id));const own=st(u.k);
    if(s.every(x=>rank[x]>=2))return rank[own]>2?own:"completed";if(s.some(x=>x!=="none")||own!=="none")return rank[own]>1?own:"learning";return own}
  return st(u.k);
}
const daysOf=subj=>(S.days[subj]||DEF_DAYS[subj]);
/* hours: Class 3 science chapters carry section-by-section estimates; everything else uses a starting estimate per unit type */
const DEF_UNIT_H={ncert:{math:8,eng:5,hin:4,sci:8},cambridge:{math:30,eng:30,hin:30,sci:20},nios:{math:5,eng:5,hin:5,sci:5}};
const hpdOf=s=>(S.hpd&&S.hpd[s])||DEF_HPD[s];
const estHours=u=>u.c?.x?.hours?u.c.x.hours.reduce((a,h)=>a+h[1],0):u.board==="dk"?u.topic.weeks*2.25:DEF_UNIT_H[u.board][u.subj];
const hoursFor=u=>S.hrs[u.k]??estHours(u);
const spanDays=u=>u.c?.x?.hours?Math.max(...u.c.x.hours.map(h=>h[2])):null;
const sessionsFor=u=>Math.max(1,Math.ceil(hoursFor(u)/hpdOf(u.subj)-1e-9));
function schedule(subj,limitDays=420){
  const q=[];plannedUnits(subj).forEach(u=>{if(rank[coverage(u)]>=2)return;const tot=sessionsFor(u);for(let i=Math.min(done(u.k),tot-1);i<tot;i++)q.push({u,n:i+1,tot})});
  const cur=q.filter(x=>coverage(x.u)==="learning"),rest=q.filter(x=>coverage(x.u)!=="learning");const queue=[...cur,...rest];
  const out=[];const days=daysOf(subj);let d=parse(S.start>today?S.start:today);
  const doneToday=S.log.some(l=>l.date===today&&l.subj===subj);
  for(let k=0;k<limitDays&&queue.length;k++){const s=iso(d);
    if(days.includes(d.getDay())&&!S.skips[s+"|"+subj]&&!(s===today&&doneToday))out.push({date:s,subj,...queue.shift()});
    d.setDate(d.getDate()+1)}
  return out;
}
function logSession(u,kind){
  const p=S.progress[u.k]||{status:"none",sessions:0};p.sessions=(p.sessions||0)+1;if(p.status==="none")p.status="learning";p.updated=today;S.progress[u.k]=p;
  S.log.unshift({date:today,key:u.k,subj:u.subj,title:u.title,kind});S.log=S.log.slice(0,400);
  const exps=u.board==="dk"?(PRESET_EXP[u.n]||[]):(u.c?.x?.sheet&&/\(.*(week|2 weeks)/i.test(u.c.x.sheet[0])?[u.c.x.sheet[0]]:[]);
  exps.forEach(title=>{if(!S.exps.some(e=>e.title===title&&!e.closed))S.exps.push({id:Math.random().toString(36).slice(2,9),title,topic:u.title,start:today,checks:[],closed:false})});
}
const el=h=>{const t=document.createElement("template");t.innerHTML=h.trim();return t.content};
const chip=s=>`<span class="chip"><span class="dot st-${s}"></span>${STATUS[s]}</span>`;
const lvlLabel=l=>{const x=DATA.levels[l];return `Level ${l} · Class ${x.cls} · age ${x.age}`};
const chNo=u=>/^\d+$/.test(u.n)?"Ch "+u.n:"";
const fh=h=>(Math.round(h*4)/4).toString().replace(/\.0+$/,"");
const sessCtl=u=>`<div class="row small"><span class="muted">About ${fh(hoursFor(u))} h of work${S.hrs[u.k]!==undefined?"":" (our estimate)"} → ${sessionsFor(u)} days at ${fh(hpdOf(u.subj))} h/day${spanDays(u)?`, with experiments and projects running over about ${spanDays(u)} days`:""}</span><button class="btn quiet mini" data-act="hrs" data-k="${u.k}" data-d="-0.5" aria-label="Less time">−</button><button class="btn quiet mini" data-act="hrs" data-k="${u.k}" data-d="0.5" aria-label="More time">+</button></div>`;
const hoursTable=u=>{const hs=u.c.x.hours,tot=hs.reduce((a,h)=>a+h[1],0);return `<div><b>Time needed</b><div class="tablebox"><table><tr><th>Part</th><th>Hours</th><th>Spread over</th></tr>${hs.map(h=>`<tr><td>${esc(h[0])}</td><td>${fh(h[1])} h</td><td class="small">${h[2]} day${h[2]>1?"s":""}</td></tr>`).join("")}<tr><td><b>Total active time</b></td><td><b>${fh(tot)} h</b></td><td class="small">waiting time (sprouting, drying, logging) runs alongside other work</td></tr></table></div></div>`};

/* ---------- onboarding ---------- */
function startOnboarding(step){ob={step:step??0,d:JSON.parse(JSON.stringify({child:S.child,age:S.age,board:S.board,plus:S.plus,subjects:S.subjects,levels:S.levels,hpd:S.hpd||DEF_HPD}))};render()}
function viewOnboarding(){
  const d=ob.d,stepN=5;let h=`<div class="ob"><div class="steps">${Array.from({length:stepN},(_,i)=>`<i class="${i<=ob.step?"on":""}"></i>`).join("")}</div>`;
  if(ob.step===0){h+=`<h2>Who is learning?</h2><div class="field"><label for="obName">Child's name</label><input id="obName" maxlength="40" value="${esc(d.child)}" placeholder="e.g. Aarav"></div>
    <div class="field"><span>Age</span><div class="seg" id="obAge">${[6,7,8,9,10].map(a=>`<button type="button" aria-pressed="${d.age===a}" data-age="${a}">${a}</button>`).join("")}</div></div>
    <p class="muted small">We'll suggest a level for each subject from this. You can change any of them.</p>`}
  if(ob.step===1){const opts=[["ncert","NCERT / CBSE","India's national textbooks"],["cambridge","Cambridge Primary","Cambridge International, Stages 1–5"],["nios","NIOS","Open Basic Education, Levels A and B"],["combined","Combined","Track all three boards together"],["none","Only DeepKids Plus","No board; our own curriculum"]];
    h+=`<h2>Which syllabus will you follow?</h2><div class="choices" id="obBoard">${opts.map(([k,n,s])=>`<button type="button" class="choice" aria-pressed="${d.board===k}" data-b="${k}"><b>${n}</b><span>${s}</span></button>`).join("")}</div>
    ${d.board!=="none"?`<label class="toggle"><input type="checkbox" id="obPlus" ${d.plus?"checked":""}><span><b>Add DeepKids Plus</b><br><span class="muted small">Big-question topics beyond the textbook (life, the universe, who am I), with full lessons, games and projects. Board chapters they cover get ticked off automatically.</span></span></label>`:`<p class="note" style="margin-top:14px">DeepKids Plus only: big-question topics with full lessons, games and projects, no board tracking.</p>`}`}
  if(ob.step===2){h+=`<h2>Which subjects?</h2><div class="choices" id="obSubj">${SUBJ_KEYS.map(k=>`<button type="button" class="choice" aria-pressed="${d.subjects.includes(k)}" data-s="${k}"><b>${SUBJ[k]}</b><span>${k==="sci"?"EVS in NCERT/NIOS, Science in Cambridge":k==="hin"?"Not offered by Cambridge":"&nbsp;"}</span></button>`).join("")}</div>`}
  if(ob.step===3){h+=`<h2>Level and daily time for each subject</h2><p class="muted">Children are often ahead in one subject and behind in another, and can move up any time. Tell us roughly how long you'd like to spend on each subject on a day you do it; we'll build the year from that.</p>${d.subjects.map(s=>{const hp=(d.hpd||DEF_HPD)[s];return `<div class="lvl"><b>${SUBJ[s]}</b><span class="row"><select data-s="${s}" aria-label="${SUBJ[s]} level">${[1,2,3,4,5].map(l=>`<option value="${l}" ${d.levels[s]===l?"selected":""}>${lvlLabel(l)}</option>`).join("")}</select><select data-hpd="${s}" aria-label="${SUBJ[s]} hours per day">${[0.25,0.5,0.75,1,1.5,2,3].map(v=>`<option value="${v}" ${hp===v?"selected":""}>${v} h a day</option>`).join("")}</select></span></div>`}).join("")}`}
  if(ob.step===4){const keep=S;S={...S,...d};
    h+=`<h2>${esc(d.child||"Your child")}'s year</h2><p class="muted">Here's everything we've collected. You can change any of it later in Settings.</p><div class="stack">`;
    d.subjects.forEach(s=>{const c=collate(s);const books=[...new Set(c.board.map(u=>u.book))];
      h+=`<div class="panel"><div class="row" style="justify-content:space-between"><h3>${SUBJ[s]}</h3><span class="small muted">${lvlLabel(d.levels[s])}</span></div><ul style="margin:8px 0 0;padding-left:18px">${books.map(b=>{const f=c.board.find(u=>u.book===b);return `<li>${esc(b)}: ${c.board.filter(u=>u.book===b).length} ${/^\d+$/.test(f.n)?"chapters":f.n==="Strand"?"strands":"themes"}</li>`}).join("")}${c.dk.length?`<li>DeepKids Plus · Science Level 1: ${c.dk.length} topics</li>`:""}</ul>${notesFor(s,d.levels[s]).map(n=>`<p class="links" style="margin:6px 0 0">${esc(n)}</p>`).join("")}</div>`});
    h+=`</div>`;S=keep}
  h+=`<div class="row" style="justify-content:space-between;margin-top:20px">${ob.step>0?`<button class="btn quiet" data-ob="back">Back</button>`:"<span></span>"}<button class="btn primary" data-ob="next">${ob.step===4?"Build my plan":"Next"}</button></div></div>`;
  return h;
}
function obNext(){
  const d=ob.d;
  if(ob.step===0){d.child=document.getElementById("obName").value.trim();SUBJ_KEYS.forEach(s=>d.levels[s]=Math.min(5,Math.max(1,d.age-5)))}
  if(ob.step===2&&!d.subjects.length)return;
  if(ob.step===4){Object.assign(S,d,{setup:true});ob=null;tab="today";commit();return}
  ob.step++;render();
}

/* ---------- daily layer (NCERT Science Class 3 for now) ---------- */
function dailyUnit(){
  if(!S.subjects.includes("sci"))return null;
  const sc=schedule("sci",60);const t=sc.find(x=>x.date===today&&x.u.c?.x)||sc.find(x=>x.u.c?.x);if(t)return {u:t.u,when:t.date};
  const any=S.log.find(l=>unitBy(l.key)?.c?.x);return any?{u:unitBy(any.key),when:null}:null;
}
const G=()=>(S.games[today]=S.games[today]||{g:[],tf:{},odd:null});
const ui={tabs:{},jokes:{},flip:{},game:"word",open:{}};
const SUBJ_COL={math:"teal",eng:"indigo",hin:"red",sci:"leaf"};
const minsLabel=h=>{const m=Math.round(h*60);return m>=60?`${fh(m/60)} h`:`${m} min`};

function wordGame(u){
  const x=u.c.x,word=x.words[dayNo%x.words.length],g=G(),rows=[];
  const won=g.g.includes(word),over=won||g.g.length>=6;
  for(let r=0;r<6;r++){const w=g.g[r]||(r===g.g.length&&!over?(g.cur||""):"");
    rows.push(`<div class="wrow">${[0,1,2,3,4].map(i=>{const ch=w[i]||"";let cls="";if(g.g[r]){cls=ch===word[i]?"hit":word.includes(ch)?"near":"miss"}return `<span class="tile ${cls}">${esc(ch)}</span>`}).join("")}</div>`)}
  const keys=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"];
  return `<p class="small muted center">A 5-letter word from "${esc(u.title)}". Six tries.</p><div class="wgrid">${rows.join("")}</div>
   ${over?`<p class="center big">${won?"You got it!":"Today's word was"} <b>${word}</b></p>`:`<div class="kb">${keys.map((r,i)=>`<div>${i===2?`<button data-act="wk" data-key="ENTER" class="wide">Enter</button>`:""}${[...r].map(c=>`<button data-act="wk" data-key="${c}">${c}</button>`).join("")}${i===2?`<button data-act="wk" data-key="DEL" class="wide" aria-label="Delete">⌫</button>`:""}</div>`).join("")}</div><p class="small muted center">Green: right place. Yellow: in the word, wrong place.</p>`}`;
}
function tfGame(u){const g=G();const q=u.c.x.quiz;const i=q.findIndex((_,k)=>g.tf[k]===undefined);const score=q.filter((x,k)=>g.tf[k]!==undefined&&(g.tf[k]===1)===x[1]).length;
  if(i<0)return `<div class="center"><div class="scorebig">${score}/${q.length}</div><p>${score===q.length?"Perfect!":"Nicely done."} Come back tomorrow for new questions.</p></div>${q.map((x,k)=>`<div class="tfdone ${(g.tf[k]===1)===x[1]?"ok":"no"}"><b>${x[1]?"True":"False"}.</b> ${esc(x[0])} <span class="small muted">${esc(x[2])}</span></div>`).join("")}`;
  const prev=i>0?q[i-1]:null,pa=i>0?g.tf[i-1]:null;
  return `<div class="qprog">${q.map((_,k)=>`<i class="${k<i?((g.tf[k]===1)===q[k][1]?"ok":"no"):k===i?"on":""}"></i>`).join("")}</div>
   ${prev?`<p class="small ${(pa===1)===prev[1]?"ok":"no"} center">${(pa===1)===prev[1]?"Right!":"Not quite."} ${esc(prev[2])}</p>`:""}
   <div class="qcard">${esc(q[i][0])}</div><div class="row center-row"><button class="btn big-true" data-act="tf" data-i="${i}" data-v="1">True</button><button class="btn big-false" data-act="tf" data-i="${i}" data-v="0">False</button></div>`}
function oddGame(u){const g=G(),o=u.c.x.odd[dayNo%u.c.x.odd.length];
  return `<p class="small muted center">Which one doesn't belong? Tap it.</p><div class="oddgrid">${o[0].map(w=>`<button class="oddbtn ${g.odd?(w===o[1]?"right":w===g.odd?"wrong":""):""}" data-act="odd" data-w="${esc(w)}" ${g.odd?"disabled":""}>${esc(w)}</button>`).join("")}</div>${g.odd?`<p class="center">${g.odd===o[1]?"Yes!":"It's <b>"+esc(o[1])+"</b>."} ${esc(o[2])}</p>`:""}`}
function gamesBox(u){const G2={word:["Word of the Day",wordGame],tf:["True or False",tfGame],odd:["Odd One Out",oddGame]};
  return `<div class="gamesbox"><div class="pills">${Object.entries(G2).map(([k,[n]])=>`<button class="pill ${ui.game===k?"on":""}" data-act="gtab" data-g="${k}">${n}</button>`).join("")}</div><div class="gamebody">${G2[ui.game][1](u)}</div></div>`}

/* jokes: three, side by side; tap to reveal the punchline */
function splitJoke(j){const m=j.match(/^(.*?\?)\s*(.*)$/);return m?[m[1],m[2]]:[j,""]}
function jokeStrip(du){const pool=du?du.u.c.x.jokes:[];if(!pool.length)return "";
  return `<div class="hscroll jokes">${pool.map((j,i)=>{const [q,a]=splitJoke(j),key=today+i;return `<button class="joke-card c${i%3}" data-act="joke" data-j="${key}"><span class="jq">${esc(q)}</span><span class="ja ${ui.jokes[key]?"":"hide"}">${esc(a)||"&nbsp;"}</span><span class="small jtap">${ui.jokes[key]?"":"Tap for the answer"}</span></button>`}).join("")}</div>`}

/* ---------- what to do on day n: a list of steps ---------- */
const HINT={math:"Use real things for every problem (coins, beans, rotis, a ruler) before writing anything down.",
  eng:"Read aloud together, collect new words in a notebook, and ask your child to retell the story in their own words.",
  hin:"Read aloud in Hindi, collect new words with their meanings, and ask your child to retell it in Hindi.",
  sci:"Look for the idea in your own home or street before reading about it."};
const KIND=n=>/^Read/.test(n)?["read","Read"]:/^What to learn/.test(n)?["learn","Learn"]:/^Worksheet/.test(n)?["sheet","Worksheet"]:/^Experiment/.test(n)?["exp","Experiment"]:/^Activit/.test(n)?["act","Activity"]:/^Game/.test(n)?["game","Game"]:/^Project/.test(n)?["proj","Project"]:["step","Step"];
function stepDetail(u,name){const c=u.c,x=c.x,L=s=>`<ul class="tidy">${s.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;
  const k=KIND(name)[0];
  if(k==="read")return `<p>Read <b>${esc(u.book)}, ${chNo(u)}</b> together. Let your child read parts aloud.</p><div class="ask">Stop and ask: ${esc(x.think[0])}</div>`;
  if(k==="learn")return `${L(x.learn)}<div class="ask">${esc(x.think[1])}</div>`;
  if(k==="sheet")return `<ol class="tidy">${x.ws.map(([h,b])=>`<li><b>${esc(h)}</b>: ${esc(b)}</li>`).join("")}</ol>`;
  if(k==="exp")return L(c.exp);
  if(k==="act")return L(c.act);
  if(k==="game")return `<p><b>${esc(c.game[0])}</b>: ${esc(c.game[1])}</p>`;
  if(k==="proj")return `<p><b>${esc(c.proj[0])}</b>: ${esc(c.proj[1])}</p><p class="small muted">You end up with: ${esc(c.proj[2])}.</p>`;
  return "";}
function daySteps(u,n,tot){
  const cap=hpdOf(u.subj);
  if(u.c?.x?.hours){const days=[];let cur=[],left=cap;
    u.c.x.hours.forEach(([name,h])=>{let rem=h,part=1;while(rem>1e-9){const take=Math.min(rem,left);cur.push({name,take,part});rem-=take;left-=take;part++;if(left<1e-9){days.push(cur);cur=[];left=cap}}});
    if(cur.length)days.push(cur);
    const parts={};days.flat().forEach(s=>parts[s.name]=Math.max(parts[s.name]||0,s.part));
    return (days[Math.min(n,days.length)-1]||[]).map(s=>{const [kind,label]=KIND(s.name);return {kind,label,title:s.name.replace(/^(Experiments?|Activities|Game|Project): /,"")+(parts[s.name]>1?` · part ${s.part} of ${parts[s.name]}`:""),mins:s.take,html:stepDetail(u,s.name)}})}
  if(u.board==="dk"){const t=u.topic,k=t.sub.length;
    if(t.full)return [{kind:"game",label:"Lesson",title:"The King's Doubt",mins:cap,html:`<p>${n===1?"The Proclamation, setting your rules, and the first guests.":n===tot?"The Nakkeeran challenge, the verdicts and the treats.":"The next investigation cards; check the lotus seeds and crystals."}</p>`}];
    if(n===1)return [{kind:"read",label:"Story",title:"Start with the story",mins:cap*0.6,html:`<p>${esc(t.summary)}</p>`},{kind:"learn",label:"Think",title:"Wonder together",mins:cap*0.4,html:`<div class="ask">${esc(t.oneness)}</div>`}];
    const i=Math.min(k-1,Math.floor((n-2)*k/Math.max(1,tot-1)));
    return n===tot?[{kind:"learn",label:"Wrap up",title:"Teach it back",mins:cap,html:`<p>Your child teaches you the topic in five minutes.</p><div class="ask">${esc(t.oneness)}</div>`}]
      :[{kind:"exp",label:"Explore",title:t.sub[i].slice(0,60)+(t.sub[i].length>60?"…":""),mins:cap,html:`<p>${esc(t.sub[i])}</p><p class="small muted">${esc(HINT.sci)}</p>`}]}
  const where=`${esc(u.book)}${chNo(u)?", "+chNo(u):""}`;
  const S2=n===1?[["read","Read","Open the chapter",0.6,`Read the first part of <b>${where}</b> together. Ask what your child thinks it's about.`],["act","Try it","Hands-on",0.4,esc(HINT[u.subj])]]
    :n===tot?[["act","Finish","Last activities",0.5,`Do the final activities in <b>${where}</b>.`],["learn","Review","Teach it back",0.3,"Your child explains the chapter to you, as if you were the student."],["sheet","Mark","Mark it done",0.2,"If it feels solid, mark the chapter Completed."]]
    :[["read","Continue","Continue the chapter",0.6,`Carry on in <b>${where}</b> from where you stopped.`],["act","Practice","Hands-on practice",0.3,esc(HINT[u.subj])],["sheet","Note","Note what's hard",0.1,"Write down anything that needs another go."]];
  return S2.map(([kind,label,title,f,html])=>({kind,label,title,mins:cap*f,html,generic:true}));
}

  let h=`<h2>${esc(S.child||"Your child")}'s progress</h2><div class="stack">`;
  S.subjects.forEach(s=>{const us=[...collate(s).dk,...collate(s).board];if(!us.length)return;const cnt=k=>us.filter(u=>coverage(u)===k).length;const pct=k=>cnt(k)/us.length*100;
    h+=`<div class="panel"><div class="row" style="justify-content:space-between"><b>${SUBJ[s]} <span class="small muted" style="font-weight:400">L${S.levels[s]}</span></b><span class="small muted">${cnt("completed")+cnt("mastered")} of ${us.length} done · ${cnt("learning")} learning</span></div><div class="bar" style="margin-top:8px"><span class="st-mastered" style="width:${pct("mastered")}%"></span><span class="st-completed" style="width:${pct("completed")}%"></span><span class="st-learning" style="width:${pct("learning")}%"></span></div></div>`});
  h+=`</div>`;
  const bs=boardsOn();if(bs.length){h+=`<h2>Against the boards</h2><div class="stack">${bs.map(b=>{const us=S.subjects.flatMap(s=>collate(s).board.filter(u=>u.board===b));if(!us.length)return"";const c=us.filter(u=>rank[coverage(u)]>=2).length;return `<div class="panel"><div class="row" style="justify-content:space-between"><span>${BOARDS[b]}: ${c} of ${us.length} chapters, strands or themes</span><b>${Math.round(c/us.length*100)}%</b></div><div class="bar" style="margin-top:8px"><span class="st-completed" style="width:${c/us.length*100}%"></span></div></div>`}).join("")}</div>`}
  h+=`<h2>Learning log</h2>${S.log.length?`<div class="tablebox"><table><tr><th>Date</th><th>Subject</th><th>What</th><th>How</th></tr>${S.log.slice(0,25).map(l=>`<tr><td class="small" style="white-space:nowrap">${fmt(l.date)}</td><td class="small">${SUBJ[l.subj]||""}</td><td>${esc(l.title)}</td><td class="small">${l.kind==="free"?"Explored freely":"Planned"}</td></tr>`).join("")}</table></div>`:`<p class="muted">Sessions you log on the Today tab show up here.</p>`}`;
  return h;
}
function render(){
  const m=document.getElementById("main"),tabs=document.getElementById("tabs");
  if(!S.setup&&!ob)ob={step:0,d:JSON.parse(JSON.stringify({child:S.child,age:S.age,board:S.board,plus:S.plus,subjects:S.subjects,levels:S.levels,hpd:S.hpd||DEF_HPD}))};
  tabs.hidden=!!ob;document.getElementById("openSettings").hidden=!!ob;
  document.getElementById("who").textContent=ob?"Let's set up your year":(S.child?S.child+" · ":"")+(S.board==="none"?"DeepKids Plus":S.board==="combined"?"Combined boards":BOARDS[S.board])+(S.plus&&S.board!=="none"?" + Plus":"");
  const open=[...document.querySelectorAll("details[open]")].map(d=>d.dataset.id).filter(Boolean);
  const sx=[...m.querySelectorAll(".hscroll")].map(x=>x.scrollLeft);
  m.replaceChildren(el(ob?viewOnboarding():{today:viewToday,plan:viewPlan,topics:viewTopics,progress:viewProgress}[tab]()));
  open.forEach(id=>{const d=m.querySelector(`details[data-id="${CSS.escape(id)}"]`);if(d)d.open=true});
  m.querySelectorAll(".hscroll").forEach((x,i)=>{if(sx[i])x.scrollLeft=sx[i]});
  tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
}

/* ---------- events ---------- */
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;render();scrollTo(0,0)});
const main=document.getElementById("main");
main.addEventListener("click",e=>{
  if(ob){const d=ob.d;const t=e.target.closest("[data-ob],button[data-age],button[data-b],button[data-s]");if(!t)return;
    if(t.dataset.ob==="next")return obNext();if(t.dataset.ob==="back"){ob.step--;return render()}
    if(t.dataset.age){d.child=document.getElementById("obName").value;d.age=+t.dataset.age}
    if(t.dataset.b){d.board=t.dataset.b;if(d.board==="none")d.plus=true}
    if(t.dataset.s&&t.classList.contains("choice")){const s=t.dataset.s;d.subjects=d.subjects.includes(s)?d.subjects.filter(x=>x!==s):[...d.subjects,s].sort((a,b)=>SUBJ_KEYS.indexOf(a)-SUBJ_KEYS.indexOf(b))}
    return render()}
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="did"||a==="logk"){const u=unitBy(b.dataset.k);if(u){logSession(u,a==="did"?"plan":"free");commit();toast(a==="did"?"Lesson done. Well done!":"Logged for today");scrollTo({top:0,behavior:"smooth"})}}
  else if(a==="undo"){const s=b.dataset.s;const i=S.log.findIndex(l=>l.date===today&&l.subj===s);if(i>=0){const l=S.log[i];S.log.splice(i,1);const p=S.progress[l.key];if(p&&p.sessions)p.sessions--;commit()}}
  else if(a==="step"){const k=b.dataset.key,i=+b.dataset.i;const set=new Set(S.steps[k]||[]);set.has(i)?set.delete(i):set.add(i);S.steps[k]=[...set];commit()}
  else if(a==="etab"){ui.tabs[b.dataset.id]=b.dataset.t;render()}
  else if(a==="gtab"){ui.game=b.dataset.g;render()}
  else if(a==="joke"){ui.jokes[b.dataset.j]=!ui.jokes[b.dataset.j];render()}
  else if(a==="flip"){ui.flip[b.dataset.f]=!ui.flip[b.dataset.f];render()}
  else if(a==="startexp"){const title=b.dataset.title;if(!S.exps.some(e=>e.title===title&&!e.closed)){S.exps.push({id:Math.random().toString(36).slice(2,9),title,topic:b.dataset.topic,start:today,checks:[],closed:false});commit();toast("Added to ongoing projects")}}
  else if(a==="skip"){S.skips[today+"|"+b.dataset.s]=true;commit()}
  else if(a==="free")openPicker();
  else if(a==="status"){const p=S.progress[b.dataset.k]||{sessions:0};p.status=b.dataset.s;p.updated=today;S.progress[b.dataset.k]=p;commit()}
  else if(a==="hrs"){const u=unitBy(b.dataset.k);if(u){S.hrs[u.k]=Math.max(0.5,hoursFor(u)+(+b.dataset.d));commit()}}
  else if(a==="day"){const s=b.dataset.s,d=+b.dataset.d;const cur=new Set(daysOf(s));cur.has(d)?cur.delete(d):cur.add(d);if(cur.size){S.days={...S.days,[s]:[...cur].sort()};commit()}}
  else if(a==="lvl"){const s=b.dataset.s;S.levels[s]=Math.min(5,Math.max(1,S.levels[s]+(+b.dataset.d)));view[s]=S.levels[s];commit()}
  else if(a==="view"){view[b.dataset.s]=+b.dataset.l;render()}
  else if(a==="setlvl"){S.levels[b.dataset.s]=+b.dataset.l;commit()}
  else if(a==="check"){const x=S.exps.find(x=>x.id===b.dataset.e);if(x&&!x.checks.includes(today)){x.checks.push(today);commit()}}
  else if(a==="close"){const x=S.exps.find(x=>x.id===b.dataset.e);if(x){x.closed=true;x.end=today;commit()}}
  else if(a==="addexp"){const v=document.getElementById("newExp").value.trim();if(v){S.exps.push({id:Math.random().toString(36).slice(2,9),title:v,topic:"Own experiment",start:today,checks:[],closed:false});commit()}}
  else if(a==="wk"){const du=dailyUnit();if(!du)return;const x=du.u.c.x,word=x.words[dayNo%x.words.length],g=G();g.cur=g.cur||"";const k=b.dataset.key;
    if(g.g.includes(word)||g.g.length>=6)return;
    if(k==="DEL")g.cur=g.cur.slice(0,-1);else if(k==="ENTER"){if(g.cur.length===5){g.g.push(g.cur);g.cur="";save()}}else if(g.cur.length<5)g.cur+=k;render()}
  else if(a==="tf"){G().tf[b.dataset.i]=+b.dataset.v;commit()}
  else if(a==="odd"){const g=G();if(!g.odd){g.odd=b.dataset.w;commit()}}
});
main.addEventListener("change",e=>{
  if(e.target.matches("select[data-hpd]")){const s=e.target.dataset.hpd,v=+e.target.value;if(ob){ob.d.hpd={...(ob.d.hpd||DEF_HPD),[s]:v}}else{S.hpd={...(S.hpd||DEF_HPD),[s]:v};commit()}return}
  if(ob&&e.target.matches("#obPlus")){ob.d.plus=e.target.checked;return}
  if(ob&&e.target.matches("select[data-s]")){ob.d.levels[e.target.dataset.s]=+e.target.value;return}
});
const pick=document.getElementById("pick");
function openPicker(){const us=everyUnit();document.getElementById("pickList").replaceChildren(el(us.map(u=>`<button data-k="${u.k}"><span class="tid">${SUBJ[u.subj]} L${u.level}</span> ${esc(u.title)}</button>`).join("")));pick.showModal()}
document.getElementById("pickList").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const u=unitBy(b.dataset.k);if(u){logSession(u,"free");pick.close();commit()}});
document.getElementById("pickClose").onclick=()=>pick.close();
const dlg=document.getElementById("settings");
document.getElementById("openSettings").onclick=()=>{sName.value=S.child;sStart.value=S.start;
  syncNote.textContent=syncMode==="account"?"Progress is saved privately to your claude.ai account.":"Progress is saved in this browser only.";dlg.showModal()};
setForm.addEventListener("submit",e=>{S.child=sName.value.trim();if(sStart.value)S.start=sStart.value;
  if(e.submitter&&e.submitter.value==="redo"){save();startOnboarding(1)}else commit()});
boot();
</script>
