<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Orbit Test — Minimal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0618;overflow:hidden;height:100vh}
canvas{display:block}
#controls{position:fixed;top:10px;left:10px;z-index:10;color:#fff;font:13px sans-serif;
  background:rgba(0,0,0,0.7);padding:12px;border-radius:8px;line-height:2}
button{margin:4px;padding:4px 12px;cursor:pointer;background:#333;color:#fff;border:1px solid #666;border-radius:4px}
button:hover{background:#555}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="controls">
  <b style="color:#9cbc14">Minimal Orbit Test</b><br>
  <button onclick="reset(0)">Speed 0 (crash)</button>
  <button onclick="reset(0.5)">Speed 50% (spiral?)</button>
  <button onclick="reset(1)">Speed 100% (orbit)</button>
  <button onclick="reset(1.5)">Speed 150% (escape)</button><br>
  <button onclick="drag=!drag;this.textContent='Drag: '+(drag?'On':'Off')">Drag: Off</button>
  <button onclick="showTrail=!showTrail">Toggle Trail</button><br>
  <span id="info"></span>
</div>
<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W,H;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

// Physics constants
var G = 1.0;  // gravitational constant
var drag = false;
var showTrail = false;
var trail = [];

// Two objects: Sun (fixed center) and Earth (orbiting)
var sun = {x:0,y:0,mass:500,size:30,color:'#ffdd22'};
var earth = {x:0,y:0,vx:0,vy:0,mass:1,size:8,color:'#4488ff'};
var mars = {x:0,y:0,vx:0,vy:0,mass:0.5,size:5,color:'#ff6633'};

function reset(speedFactor) {
  sun.x = W/2;
  sun.y = H/2;

  // Place Earth to the right of Sun
  var distE = 180;
  earth.x = sun.x + distE;
  earth.y = sun.y;
  var vE = Math.sqrt(G * sun.mass / distE) * speedFactor;
  earth.vx = 0;
  earth.vy = -vE;

  // Place Mars further out, above Sun
  var distM = 280;
  mars.x = sun.x;
  mars.y = sun.y - distM;
  var vM = Math.sqrt(G * sun.mass / distM) * speedFactor;
  mars.vx = vM;
  mars.vy = 0;

  trail = [];
  trailM = [];
  document.getElementById('info').textContent =
    'Earth v=' + vE.toFixed(3) + '  Mars v=' + vM.toFixed(3) + '  speed=' + (speedFactor*100).toFixed(0) + '%';
}

var trailM = [];
reset(1); // Start with perfect orbit

function gravitate(obj, sources) {
  var ax=0, ay=0;
  for (var i=0; i<sources.length; i++) {
    var s = sources[i];
    if (s === obj) continue;
    var dx=s.x-obj.x, dy=s.y-obj.y;
    var dist = Math.sqrt(dx*dx+dy*dy);
    if (dist > 1) {
      var a = G * s.mass / (dist*dist);
      ax += a*(dx/dist);
      ay += a*(dy/dist);
    }
  }
  obj.vx += ax;
  obj.vy += ay;
  if (drag) { obj.vx *= 0.9999; obj.vy *= 0.9999; }
  obj.x += obj.vx;
  obj.y += obj.vy;
}

function step() {
  var all = [sun, earth, mars];
  gravitate(earth, all);
  gravitate(mars, all);
  // Sun stays fixed (too massive to move noticeably)

  if (showTrail) {
    trail.push({x:earth.x, y:earth.y});
    if (trail.length > 3000) trail.shift();
    trailM.push({x:mars.x, y:mars.y});
    if (trailM.length > 3000) trailM.shift();
  }
}

function draw() {
  if (showTrail) {
    ctx.fillStyle = 'rgba(10,6,24,0.02)';
  } else {
    ctx.fillStyle = '#0a0618';
  }
  ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle = 'rgba(156,188,20,0.08)';
  ctx.lineWidth = 0.5;
  for (var x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for (var y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Trails
  function drawTrail(t, color) {
    if (t.length > 1) {
      ctx.strokeStyle = color + '40'; ctx.lineWidth = 1; ctx.beginPath();
      ctx.moveTo(t[0].x, t[0].y);
      for (var i=1;i<t.length;i++) ctx.lineTo(t[i].x, t[i].y);
      ctx.stroke();
    }
  }
  drawTrail(trail, earth.color);
  drawTrail(trailM, mars.color);

  // Draw a body
  function drawBody(b) {
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.size, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath();
    ctx.arc(b.x-b.size*0.3, b.y-b.size*0.3, b.size*0.25, 0, Math.PI*2); ctx.fill();
  }
  drawBody(sun);
  drawBody(earth);
  drawBody(mars);

  // Velocity vectors
  function drawVel(b) {
    var spd = Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    if (spd > 0.1) {
      ctx.strokeStyle = '#ff444488'; ctx.lineWidth = 1.5; ctx.beginPath();
      ctx.moveTo(b.x,b.y); ctx.lineTo(b.x+b.vx*15,b.y+b.vy*15); ctx.stroke();
    }
  }
  drawVel(earth);
  drawVel(mars);

  // Readout
  var spdE = Math.sqrt(earth.vx*earth.vx + earth.vy*earth.vy);
  var spdM = Math.sqrt(mars.vx*mars.vx + mars.vy*mars.vy);
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '12px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Earth v:'+spdE.toFixed(2)+'  Mars v:'+spdM.toFixed(2)+'  drag:'+(drag?'on':'off'), 10, H-10);

  step();
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
