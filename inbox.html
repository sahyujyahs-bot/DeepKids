<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WhatsApp Inbox — DeepKids</title>
<meta name="robots" content="noindex"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0d0820;color:rgba(255,255,255,.9);font-family:'Segoe UI',Arial,sans-serif;height:100vh;display:flex;}
  .sidebar{width:300px;border-right:1px solid rgba(255,255,255,.1);overflow-y:auto;flex-shrink:0;}
  .sidebar h1{font-size:16px;padding:16px;border-bottom:1px solid rgba(255,255,255,.1);color:#c0e638;}
  .conv{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06);cursor:pointer;}
  .conv:hover,.conv.active{background:rgba(255,255,255,.06);}
  .conv .phone{font-weight:600;font-size:14px;}
  .conv .preview{font-size:12px;color:rgba(255,255,255,.5);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .main{flex:1;display:flex;flex-direction:column;}
  .thread{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:60%;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.4;}
  .msg.in{align-self:flex-start;background:rgba(255,255,255,.08);}
  .msg.out{align-self:flex-end;background:#3a1f4d;}
  .msg .meta{font-size:10px;color:rgba(255,255,255,.4);margin-top:4px;}
  .composer{display:flex;padding:14px;border-top:1px solid rgba(255,255,255,.1);gap:10px;}
  .composer input{flex:1;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:#fff;}
  .composer button{padding:10px 20px;border-radius:8px;border:none;background:#c0e638;color:#0d0820;font-weight:600;cursor:pointer;}
  .composer button:disabled{opacity:.5;cursor:not-allowed;}
  .empty{display:flex;align-items:center;justify-content:center;flex:1;color:rgba(255,255,255,.4);}
  .status-note{font-size:12px;color:rgba(255,255,255,.4);padding:8px 14px;}
</style>
</head>
<body>
  <div class="sidebar">
    <h1>WhatsApp Inbox</h1>
    <div id="conv-list"></div>
  </div>
  <div class="main">
    <div id="thread" class="thread"><div class="empty">Select a conversation</div></div>
    <div id="composer-wrap"></div>
  </div>

<script>
var allMessages = [];
var activePhone = null;

function loadMessages() {
  fetch('/api/whatsapp-messages').then(function(r){ return r.json(); }).then(function(data){
    allMessages = data.messages || [];
    renderConvList();
    if (activePhone) renderThread(activePhone);
  });
}

function renderConvList() {
  var byPhone = {};
  allMessages.forEach(function(m){
    if (!byPhone[m.phone]) byPhone[m.phone] = [];
    byPhone[m.phone].push(m);
  });
  var phones = Object.keys(byPhone).sort(function(a,b){
    var lastA = byPhone[a][byPhone[a].length-1].created_at;
    var lastB = byPhone[b][byPhone[b].length-1].created_at;
    return lastB.localeCompare(lastA);
  });
  var list = document.getElementById('conv-list');
  list.innerHTML = '';
  phones.forEach(function(phone){
    var msgs = byPhone[phone];
    var last = msgs[msgs.length-1];
    var div = document.createElement('div');
    div.className = 'conv' + (phone === activePhone ? ' active' : '');
    div.innerHTML = '<div class="phone">' + phone + '</div><div class="preview">' + (last.body || '').replace(/</g,'&lt;') + '</div>';
    div.onclick = function(){ activePhone = phone; renderConvList(); renderThread(phone); };
    list.appendChild(div);
  });
}

function renderThread(phone) {
  var msgs = allMessages.filter(function(m){ return m.phone === phone; });
  var thread = document.getElementById('thread');
  thread.innerHTML = '';
  msgs.forEach(function(m){
    var div = document.createElement('div');
    div.className = 'msg ' + m.direction;
    div.innerHTML = (m.body || '').replace(/</g,'&lt;') + '<div class="meta">' + (m.template ? m.template + ' · ' : '') + new Date(m.created_at).toLocaleString() + (m.status ? ' · ' + m.status : '') + '</div>';
    thread.appendChild(div);
  });
  thread.scrollTop = thread.scrollHeight;
  renderComposer(phone);
}

function renderComposer(phone) {
  var wrap = document.getElementById('composer-wrap');
  wrap.innerHTML =
    '<div class="status-note">Free-text replies only work if this customer messaged you within the last 24 hours.</div>' +
    '<div class="composer">' +
    '<input id="reply-input" type="text" placeholder="Type a reply...">' +
    '<button id="reply-btn">Send</button>' +
    '</div>';
  document.getElementById('reply-btn').onclick = function(){ sendReply(phone); };
  document.getElementById('reply-input').addEventListener('keydown', function(e){
    if (e.key === 'Enter') sendReply(phone);
  });
}

function sendReply(phone) {
  var input = document.getElementById('reply-input');
  var text = input.value.trim();
  if (!text) return;
  var btn = document.getElementById('reply-btn');
  btn.disabled = true;
  fetch('/api/whatsapp-reply', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone: phone, text: text })
  }).then(function(r){ return r.json(); }).then(function(result){
    btn.disabled = false;
    if (result.success) {
      input.value = '';
      loadMessages();
    } else {
      alert('Failed to send: ' + (result.error || 'unknown error'));
    }
  }).catch(function(){ btn.disabled = false; alert('Network error'); });
}

loadMessages();
setInterval(loadMessages, 10000);
</script>
</body>
</html>
