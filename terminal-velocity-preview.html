<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Terminal Velocity Preview — Hero Rain</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #120826; overflow: hidden; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; }
  .info {
    position: fixed; top: 20px; left: 20px; z-index: 10;
    color: rgba(255,255,255,0.7); font-family: sans-serif; font-size: 14px;
    background: rgba(0,0,0,0.5); padding: 12px 16px; border-radius: 8px;
    line-height: 1.6; max-width: 320px;
  }
  .info strong { color: #9cbc14; }
</style>
</head>
<body>
<div class="info">
  <strong>Terminal Velocity Preview</strong><br>
  Each object falls at a different speed based on its "mass" and "air resistance".<br><br>
  <strong>Heavy/dense</strong> (dice, tokens) → fall fast<br>
  <strong>Light/airy</strong> (feather, parachute, cards) → fall slow, drift more<br>
  <strong>Medium</strong> (balloon, ISS art) → in between<br><br>
  Watch how they settle at different times.
</div>
<canvas id="cv"></canvas>
<script>
var canvas = document.getElementById('cv');
var ctx = canvas.getContext('2d');
var W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Object types with physics properties
// drag: higher = more air resistance = slower terminal velocity
// mass: higher = heavier = faster acceleration
// drift: horizontal wobble amplitude
var TYPES = [
  { label: 'Feather',    color: '#e8e4d8', w: 30, h: 12, mass: 0.2, drag: 0.08,  drift: 3.0, shape: 'ellipse' },
  { label: 'Card',       color: '#c0e638', w: 40, h: 56, mass: 0.5, drag: 0.04,  drift: 1.5, shape: 'rect' },
  { label: 'Card',       color: '#9cbc14', w: 40, h: 56, mass: 0.5, drag: 0.04,  drift: 1.2, shape: 'rect' },
  { label: 'Parachute',  color: '#e07040', w: 36, h: 44, mass: 0.3, drag: 0.07,  drift: 2.5, shape: 'triangle' },
  { label: 'Balloon',    color: '#f0c040', w: 32, h: 40, mass: 0.4, drag: 0.05,  drift: 2.0, shape: 'circle' },
  { label: 'Dice',       color: '#ffffff', w: 24, h: 24, mass: 1.5, drag: 0.015, drift: 0.3, shape: 'rect' },
  { label: 'Token',      color: '#4488cc', w: 22, h: 22, mass: 1.2, drag: 0.02,  drift: 0.4, shape: 'circle' },
  { label: 'ISS',        color: '#8888cc', w: 50, h: 35, mass: 0.8, drag: 0.03,  drift: 0.8, shape: 'rect' },
  { label: 'Logo',       color: '#9cbc14', w: 36, h: 36, mass: 0.6, drag: 0.035, drift: 1.0, shape: 'circle' },
  { label: 'Bird',       color: '#cc8844', w: 44, h: 20, mass: 0.35,drag: 0.06,  drift: 2.2, shape: 'ellipse' },
];

var GRAVITY = 0.15; // acceleration per frame
var objects = [];

function spawnAll() {
  objects = [];
  for (var i = 0; i < 18; i++) {
    var type = TYPES[i % TYPES.length];
    objects.push({
      x: Math.random() * (W - 60) + 30,
      y: -(Math.random() * H * 0.5 + 50), // start above screen, staggered
      vx: 0,
      vy: 0,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.04 / (type.mass + 0.5),
      type: type,
      phase: Math.random() * Math.PI * 2, // for drift oscillation
      settled: false,
      groundY: H - type.h / 2 - Math.random() * 30
    });
  }
}
spawnAll();

function draw() {
  ctx.clearRect(0, 0, W, H);

  // Draw ground line
  ctx.strokeStyle = 'rgba(156,188,20,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, H - 5);
  ctx.lineTo(W, H - 5);
  ctx.stroke();

  for (var i = 0; i < objects.length; i++) {
    var obj = objects[i];
    var t = obj.type;

    if (!obj.settled) {
      // Physics: F = mass * gravity - drag * velocity^2
      var gravForce = t.mass * GRAVITY;
      var dragForce = t.drag * obj.vy * obj.vy;
      var netForce = gravForce - dragForce;
      obj.vy += netForce / t.mass;

      // Terminal velocity = sqrt(mass * gravity / drag)
      var termVel = Math.sqrt(t.mass * GRAVITY / t.drag);
      if (obj.vy > termVel) obj.vy = termVel;

      // Horizontal drift (lighter objects wobble more)
      obj.phase += 0.03;
      obj.vx = Math.sin(obj.phase) * t.drift;

      obj.x += obj.vx;
      obj.y += obj.vy;
      obj.rotation += obj.rotSpeed;

      // Bounce off walls
      if (obj.x < t.w / 2) obj.x = t.w / 2;
      if (obj.x > W - t.w / 2) obj.x = W - t.w / 2;

      // Ground collision
      if (obj.y >= obj.groundY) {
        obj.y = obj.groundY;
        obj.vy = -obj.vy * 0.2; // small bounce
        if (Math.abs(obj.vy) < 0.5) {
          obj.settled = true;
          obj.vy = 0;
          obj.rotSpeed = 0;
        }
      }
    }

    // Draw
    ctx.save();
    ctx.translate(obj.x, obj.y);
    ctx.rotate(obj.rotation);
    ctx.fillStyle = t.color;
    ctx.globalAlpha = 0.85;

    if (t.shape === 'rect') {
      ctx.fillRect(-t.w / 2, -t.h / 2, t.w, t.h);
      ctx.strokeStyle = 'rgba(0,0,0,0.3)';
      ctx.lineWidth = 1;
      ctx.strokeRect(-t.w / 2, -t.h / 2, t.w, t.h);
    } else if (t.shape === 'circle') {
      ctx.beginPath();
      ctx.arc(0, 0, t.w / 2, 0, Math.PI * 2);
      ctx.fill();
    } else if (t.shape === 'ellipse') {
      ctx.beginPath();
      ctx.ellipse(0, 0, t.w / 2, t.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    } else if (t.shape === 'triangle') {
      ctx.beginPath();
      ctx.moveTo(0, -t.h / 2);
      ctx.lineTo(-t.w / 2, t.h / 2);
      ctx.lineTo(t.w / 2, t.h / 2);
      ctx.closePath();
      ctx.fill();
    }

    // Label
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = t.shape === 'rect' && t.color === '#ffffff' ? '#333' : '#fff';
    ctx.font = '8px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(t.label, 0, 3);

    ctx.restore();
  }

  // Speed labels
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'left';
  for (var j = 0; j < objects.length; j++) {
    var o = objects[j];
    if (!o.settled && o.y > 0) {
      var speed = Math.round(o.vy * 100) / 100;
      ctx.fillText(speed.toFixed(1) + ' m/s', o.x + o.type.w / 2 + 6, o.y);
    }
  }

  requestAnimationFrame(draw);
}
draw();

// Click to restart
document.addEventListener('click', function(e) {
  if (e.target.closest('.info')) return;
  spawnAll();
});
</script>
</body>
</html>
