<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Page Not Found — DeepKids</title>
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" href="/favicon-32.png" type="image/png"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <style>
    @font-face {
      font-family: 'Norwester';
      src: url('norwester.ttf') format('truetype');
      font-weight: normal;
      font-display: block;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0618;
      color: #fff;
      font-family: 'Norwester', sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: clamp(64px, 15vw, 140px);
      color: #9cbc14;
      line-height: 1;
      text-shadow: 0 0 30px rgba(156,188,20,.4);
    }
    p {
      font-size: clamp(16px, 2.5vw, 24px);
      color: rgba(255,255,255,.65);
      margin: 16px 0 32px;
      font-family: Georgia, serif;
      font-variant: normal;
    }
    a {
      display: inline-block;
      padding: 14px 36px;
      background: linear-gradient(180deg, #c0e638, #9cbc14, #6b8f08);
      color: #fff;
      font-family: 'Norwester', sans-serif;
      font-variant: small-caps;
      font-size: 18px;
      letter-spacing: 2px;
      text-decoration: none;
      border-radius: 40px;
      text-shadow: 1px 1px 3px rgba(0,0,0,.5);
      box-shadow: 0 4px 16px rgba(156,188,20,.3);
      transition: transform .2s, box-shadow .2s;
    }
    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(156,188,20,.5);
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>This page escaped gravity and floated away.</p>
  <a href="https://deepkids.in/">Back to EscapeGravity</a>
</body>
</html>
