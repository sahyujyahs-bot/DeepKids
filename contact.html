  <!-- Internal-traffic kill switch (same as the rest of the site): ?notrack / ?track -->
  <script>
    window._egNoTrack = (function(){
      try {
        var q = new URLSearchParams(location.search);
        if (q.has('notrack')) localStorage.setItem('eg-notrack', '1');
        if (q.has('track')) localStorage.removeItem('eg-notrack');
        return localStorage.getItem('eg-notrack') === '1';
      } catch(e) { return false; }
    })();
    window.egGtag = function(){ if (typeof gtag === 'function') gtag.apply(null, arguments); };
  </script>

<body>
<header>
  <a class="logo" href="/">EscapeGravity</a>
  <a class="back" href="/">← Back to site</a>
</header>
<main>
  <h1>Contact Us</h1>
  <p class="updated">We usually respond within 1 business day.</p>

  <h2>Reach us directly</h2>
  <ul>
    <li>Email: <a href="mailto:sahyujyahs@gmail.com">sahyujyahs@gmail.com</a></li>
    <li>Website: <a href="https://deepkids.in">deepkids.in</a></li>
  </ul>

  <h2>Send us a message</h2>
  <form id="contact-form">
    <label for="contact-name">Name</label>
    <input type="text" id="contact-name" name="name" required/>

    <label for="contact-email">Email</label>
    <input type="email" id="contact-email" name="email" required/>

    <label for="contact-message">Message</label>
    <textarea id="contact-message" name="message" required></textarea>

    <button type="submit" id="contact-submit">Send Message</button>
    <p id="contact-status"></p>
  </form>
</main>
<footer>&copy; 2026 DeepKids. All rights reserved.</footer>

<script>
  document.getElementById('contact-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('contact-submit');
    var status = document.getElementById('contact-status');
    var data = {
      name: document.getElementById('contact-name').value,
      email: document.getElementById('contact-email').value,
      message: document.getElementById('contact-message').value,
      _subject: 'New contact form message — EscapeGravity'
    };
    btn.disabled = true;
    btn.textContent = 'Sending...';
    status.style.display = 'none';

    fetch('https://formsubmit.co/ajax/sahyujyahs@gmail.com', {
      method: 'POST',
      headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    })
      .then(function (r) { return r.json(); })
      .then(function () {
        status.textContent = "Thanks! Your message has been sent — we'll get back to you soon.";
        status.className = 'success';
        status.style.display = 'block';
        document.getElementById('contact-form').reset();
      })
      .catch(function () {
        status.textContent = 'Something went wrong. Please email us directly at sahyujyahs@gmail.com.';
        status.className = 'error';
        status.style.display = 'block';
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = 'Send Message';
      });
  });
</script>
  <script src="/track.js" defer></script>
