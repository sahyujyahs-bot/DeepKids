<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Spacetime Grid</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0618;overflow:hidden;height:100vh}
canvas{display:block}
#hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;
  color:rgba(255,255,255,0.35);font:12px sans-serif}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hint">Click to place. Hold to grow. Click existing mass to grow it.</div>
<script>
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W,H;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

var GRID=12;
var masses=[];
var growing=null;

function makeVerts(){
  var v=[];
  for(var i=0;i<10;i++)v.push({a:Math.PI*2*i/10,r:0.7+Math.random()*0.6});
  return v;
}

function findMass(x,y){
  for(var i=masses.length-1;i>=0;i--){
    var m=masses[i],dx=x-m.x,dy=y-m.y;
    if(dx*dx+dy*dy<(m.size+15)*(m.size+15))return m;
  }
  return null;
}

cv.addEventListener('mousedown',function(e){
  var f=findMass(e.clientX,e.clientY);
  if(f){growing=f;return;}
  var o={x:e.clientX,y:e.clientY,mass:10,size:15,verts:makeVerts()};
  masses.push(o);growing=o;
});
cv.addEventListener('mouseup',function(){growing=null});
cv.addEventListener('touchstart',function(e){
  if(!e.touches[0])return;e.preventDefault();
  var tx=e.touches[0].clientX,ty=e.touches[0].clientY;
  var f=findMass(tx,ty);
  if(f){growing=f;return;}
  var o={x:tx,y:ty,mass:10,size:15,verts:makeVerts()};
  masses.push(o);growing=o;
},{passive:false});
cv.addEventListener('touchend',function(){growing=null});

function draw(){
  ctx.fillStyle='#0a0618';
  ctx.fillRect(0,0,W,H);

  if(growing){
    growing.mass+=1;
    growing.size=Math.min(6+Math.pow(growing.mass,0.45)*3,90);
  }

  var cols=Math.ceil(W/GRID)+2,rows=Math.ceil(H/GRID)+2;

  // Warp: each grid point gets pulled TOWARD each mass center
  // The pull is strong and wide — creates dramatic funnel
  function warp(gx,gy){
    var wx=0,wy=0;
    for(var i=0;i<masses.length;i++){
      var m=masses[i];
      var dx=gx-m.x,dy=gy-m.y;
      var dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<0.5)dist=0.5;

      // Gravity well radius — VERY wide
      var wellR=Math.pow(m.mass,0.5)*15+100;

      if(dist<wellR){
        // Pull strength: strong near center, fades at edge
        // Using 1/dist falloff (like real gravity) capped by well radius
        var t=1-dist/wellR;
        var pull=Math.pow(m.mass,0.6)*t*t*t*4;

        // Pull toward mass center
        wx -= (dx/dist)*pull;
        wy -= (dy/dist)*pull;
      }
    }
    return{x:gx+wx,y:gy+wy};
  }

  // Draw grid
  ctx.lineWidth=0.6;

  // Horizontal lines
  for(var r=0;r<rows;r++){
    ctx.beginPath();
    var hasWarp=false;
    for(var c=0;c<cols;c++){
      var p=warp(c*GRID,r*GRID);
      if(c===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
      if(p.x!==c*GRID||p.y!==r*GRID)hasWarp=true;
    }
    ctx.strokeStyle=hasWarp?'rgba(156,188,20,0.28)':'rgba(156,188,20,0.12)';
    ctx.stroke();
  }

  // Vertical lines
  for(var c=0;c<cols;c++){
    ctx.beginPath();
    var hasWarp=false;
    for(var r=0;r<rows;r++){
      var p=warp(c*GRID,r*GRID);
      if(r===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);
      if(p.x!==c*GRID||p.y!==r*GRID)hasWarp=true;
    }
    ctx.strokeStyle=hasWarp?'rgba(156,188,20,0.28)':'rgba(156,188,20,0.12)';
    ctx.stroke();
  }

  // Draw masses
  for(var i=0;i<masses.length;i++){
    var m=masses[i];

    // Glow
    var g1=ctx.createRadialGradient(m.x,m.y,m.size*0.5,m.x,m.y,m.size*3);
    g1.addColorStop(0,'rgba(255,200,100,0.15)');
    g1.addColorStop(1,'transparent');
    ctx.fillStyle=g1;
    ctx.beginPath();ctx.arc(m.x,m.y,m.size*3,0,Math.PI*2);ctx.fill();

    // Rock body
    ctx.beginPath();
    for(var v=0;v<m.verts.length;v++){
      var vt=m.verts[v];
      var px=m.x+Math.cos(vt.a)*m.size*vt.r;
      var py=m.y+Math.sin(vt.a)*m.size*vt.r;
      if(v===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
    }
    ctx.closePath();
    var bg=ctx.createRadialGradient(m.x-m.size*0.2,m.y-m.size*0.2,0,m.x,m.y,m.size*0.9);
    bg.addColorStop(0,'#ffffee');
    bg.addColorStop(0.3,'#ffcc66');
    bg.addColorStop(0.7,'#cc6622');
    bg.addColorStop(1,'#662200');
    ctx.fillStyle=bg;
    ctx.fill();
    ctx.strokeStyle='rgba(255,180,80,0.4)';
    ctx.lineWidth=1;
    ctx.stroke();

    // Inner lines
    for(var v2=0;v2<m.verts.length;v2+=2){
      var vt2=m.verts[v2];
      ctx.strokeStyle='rgba(255,200,100,0.15)';
      ctx.lineWidth=0.5;
      ctx.beginPath();
      ctx.moveTo(m.x,m.y);
      ctx.lineTo(m.x+Math.cos(vt2.a)*m.size*vt2.r,m.y+Math.sin(vt2.a)*m.size*vt2.r);
      ctx.stroke();
    }

    // Specular
    ctx.fillStyle='rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.arc(m.x-m.size*0.2,m.y-m.size*0.2,m.size*0.2,0,Math.PI*2);
    ctx.fill();

    // Mass label
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.font='10px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('m='+Math.round(m.mass),m.x,m.y+m.size+14);
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
