<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Spacetime Grid Test</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0618;overflow:hidden;height:100vh}
canvas{display:block}
#add-btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;
  padding:12px 30px;background:rgba(156,188,20,0.2);border:2px solid #9cbc14;
  border-radius:30px;color:#9cbc14;font-size:16px;cursor:pointer;font-weight:bold}
#add-btn:hover{background:rgba(156,188,20,0.35)}
#hint{position:fixed;top:12px;left:12px;z-index:10;color:rgba(255,255,255,0.4);font:12px sans-serif}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="add-btn">+ Add Mass</button>
<div id="hint">Click Add, then click on grid. Hold to grow. Release to place.</div>
<script>
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var W,H,GRID=14;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;}
resize();window.addEventListener('resize',resize);

var masses=[]; // {x,y,mass,size,color,verts}
var mode='idle'; // idle, placing
var growing=null; // mass being grown
var mouseX=0,mouseY=0;

// Glowing rock vertices
function makeVerts(n){
  var v=[];
  for(var i=0;i<n;i++){
    var a=Math.PI*2*i/n;
    var r=0.75+Math.random()*0.5;
    v.push({a:a,r:r});
  }
  return v;
}

document.getElementById('add-btn').onclick=function(){
  mode='placing';
  document.getElementById('hint').textContent='Click anywhere on the grid to place. Hold to grow.';
};

cv.addEventListener('mousemove',function(e){mouseX=e.clientX;mouseY=e.clientY});
cv.addEventListener('touchmove',function(e){if(e.touches[0]){mouseX=e.touches[0].clientX;mouseY=e.touches[0].clientY}},{passive:true});

cv.addEventListener('mousedown',function(e){
  if(mode==='placing'){
    var obj={x:e.clientX,y:e.clientY,mass:5,size:8,color:'#ff6633',verts:makeVerts(10)};
    masses.push(obj);
    growing=obj;
    mode='growing';
  }
});
cv.addEventListener('touchstart',function(e){
  if(mode==='placing'&&e.touches[0]){
    var obj={x:e.touches[0].clientX,y:e.touches[0].clientY,mass:5,size:8,color:'#ff6633',verts:makeVerts(10)};
    masses.push(obj);
    growing=obj;
    mode='growing';
    e.preventDefault();
  }
},{passive:false});

cv.addEventListener('mouseup',function(){
  if(mode==='growing'){growing=null;mode='idle';
    document.getElementById('hint').textContent='Click Add to place another mass.';}
});
cv.addEventListener('touchend',function(){
  if(mode==='growing'){growing=null;mode='idle';
    document.getElementById('hint').textContent='Click Add to place another mass.';}
});

// Draw
function draw(){
  ctx.fillStyle='#0a0618';
  ctx.fillRect(0,0,W,H);

  // Grow
  if(growing){
    growing.mass+=0.5;
    growing.size=Math.min(growing.size+0.3, 80);
  }

  var cols=Math.ceil(W/GRID)+1, rows=Math.ceil(H/GRID)+1;

  // Warp function
  function warp(gx,gy){
    var wx=0,wy=0;
    for(var i=0;i<masses.length;i++){
      var m=masses[i];
      var dx=gx-m.x, dy=gy-m.y;
      var d=Math.sqrt(dx*dx+dy*dy);
      // Warp radius proportional to mass — wide parabolic bend
      var radius=Math.sqrt(m.mass)*12+60;
      if(d<radius && d>0.5){
        // Quadratic falloff — creates parabolic curve
        var t=1-d/radius;
        var pull=Math.sqrt(m.mass)*3*t*t;
        wx-=(dx/d)*pull;
        wy-=(dy/d)*pull;
      }
    }
    return{x:gx+wx, y:gy+wy};
  }

  // Draw grid — horizontal lines
  for(var r=0;r<rows;r++){
    ctx.beginPath();
    for(var c=0;c<cols;c++){
      var p=warp(c*GRID, r*GRID);
      if(c===0) ctx.moveTo(p.x,p.y);
      else ctx.lineTo(p.x,p.y);
    }
    ctx.strokeStyle='rgba(156,188,20,0.2)';
    ctx.lineWidth=0.7;
    ctx.stroke();
  }
  // Vertical lines
  for(var c=0;c<cols;c++){
    ctx.beginPath();
    for(var r=0;r<rows;r++){
      var p=warp(c*GRID, r*GRID);
      if(r===0) ctx.moveTo(p.x,p.y);
      else ctx.lineTo(p.x,p.y);
    }
    ctx.strokeStyle='rgba(156,188,20,0.2)';
    ctx.lineWidth=0.7;
    ctx.stroke();
  }

  // Draw masses as glowing rocks
  for(var i=0;i<masses.length;i++){
    var m=masses[i];

    // Outer glow
    var grd=ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,m.size*3);
    grd.addColorStop(0,m.color+'30');
    grd.addColorStop(1,'transparent');
    ctx.fillStyle=grd;
    ctx.beginPath();
    ctx.arc(m.x,m.y,m.size*3,0,Math.PI*2);
    ctx.fill();

    // Rock body — irregular polygon
    ctx.beginPath();
    for(var v=0;v<m.verts.length;v++){
      var vt=m.verts[v];
      var px=m.x+Math.cos(vt.a)*m.size*vt.r;
      var py=m.y+Math.sin(vt.a)*m.size*vt.r;
      if(v===0) ctx.moveTo(px,py);
      else ctx.lineTo(px,py);
    }
    ctx.closePath();

    // Radial gradient fill
    var bg=ctx.createRadialGradient(m.x-m.size*0.2,m.y-m.size*0.2,0,m.x,m.y,m.size);
    bg.addColorStop(0,'#fff');
    bg.addColorStop(0.3,m.color);
    bg.addColorStop(1,m.color+'44');
    ctx.fillStyle=bg;
    ctx.fill();

    // Edge highlight
    ctx.strokeStyle=m.color+'66';
    ctx.lineWidth=1;
    ctx.stroke();

    // Inner gem lines
    ctx.strokeStyle=m.color+'22';
    ctx.lineWidth=0.5;
    for(var v2=0;v2<m.verts.length;v2+=2){
      var vt2=m.verts[v2];
      ctx.beginPath();
      ctx.moveTo(m.x,m.y);
      ctx.lineTo(m.x+Math.cos(vt2.a)*m.size*vt2.r,m.y+Math.sin(vt2.a)*m.size*vt2.r);
      ctx.stroke();
    }

    // Specular highlight
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.beginPath();
    ctx.arc(m.x-m.size*0.2,m.y-m.size*0.25,m.size*0.2,0,Math.PI*2);
    ctx.fill();

    // Mass label
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.font='10px sans-serif';
    ctx.textAlign='center';
    ctx.fillText('m='+Math.round(m.mass),m.x,m.y+m.size+14);
  }

  // Preview while placing
  if(mode==='placing'){
    ctx.strokeStyle='rgba(156,188,20,0.3)';
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.arc(mouseX,mouseY,8,0,Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
